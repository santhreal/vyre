[package]
name = "vyre-lower"
version = "0.7.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Substrate-neutral lowering: vyre Program → KernelDescriptor consumed by vyre-emit-* crates."
readme = "README.md"
repository = "https://github.com/santhreal/vyre"
homepage = "https://santh.dev/vyre/"
documentation = "https://docs.rs/vyre-lower"
categories = ["compilers", "hardware-support"]
keywords = ["vyre", "lowering", "gpu", "compiler"]

[lints]
workspace = true

[lib]
name = "vyre_lower"
path = "src/lib.rs"

[dependencies]
vyre-foundation = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
smallvec.workspace = true
im = { workspace = true }

[dev-dependencies]
vyre-test-support.workspace = true
serde_json = { workspace = true }
toml = { workspace = true }
# Backend differential gate for the rewrite passes. A rewrite that changes
# program semantics is only observable by running the SAME program on two
# independent executors and comparing outputs element by element, so the
# reference interpreter and the real CUDA driver are both test-only deps
# here. Both depend on vyre-lower; a dev-dependency cycle is fine because
# Cargo compiles dev-deps only for the crate under test, never for its
# dependents (vyre-driver-cuda documents the same arrangement in reverse).
vyre-driver = { path = "../vyre-driver" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
vyre-driver-cuda = { path = "../vyre-driver-cuda" }
