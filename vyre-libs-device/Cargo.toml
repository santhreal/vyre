[package]
name = "vyre-libs-device"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiler-internal device boundary contracts, memory ownership, and resident graph layout"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-device"

[package.metadata.vyre]
publication_class = "internal-engine"

[lints]
workspace = true

[features]
default = ["device"]
device = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
