[package]
name = "vyre-primitives"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The vyre operations that cannot be composed: marker types, hardware intrinsics, and the per-domain kernels a backend sees as one unit."
readme = "README.md"
keywords = ["gpu", "ir", "primitive", "vyre", "lego"]
categories = ["algorithms", "api-bindings"]
documentation = "https://docs.rs/vyre-primitives"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[features]
# Default: marker-types only, zero IR-builder deps. Consumers that
# need a Tier 2.5 builder enable the matching domain flag.
default = []

# Enable GPU-backend parity tests (requires CUDA driver + device).
gpu = []

# Enable host reference oracles for explicit parity harnesses. Release
# consumers should not enable this; CUDA/GPU dispatch builders remain
# available without host execution paths.
cpu-parity = []

# Internal marker feature  -  ON whenever any domain feature pulls
# vyre-foundation. Keeps `#[cfg]` expressions terse (one gate
# instead of `any(feature = "text", feature = "matching", …)`).
# AUDIT_2026-04-24 F-RANGE-03: replaces the previous dead
# `cfg(feature = "vyre-foundation")` which matched nothing.
vyre-foundation = ["dep:vyre-foundation"]

# Per-domain Tier 2.5 feature flags. See docs/lego-block-rule.md.
# Every domain pulls vyre-foundation  -  every primitive ships CPU
# reference + GPU `fn(...) -> Program` builder together.
text = ["vyre-foundation", "reduce"]
# `hash`: `matching/nfa_to_dfa.rs` imports `crate::hash::fnv1a` UNCONDITIONALLY, so
# the `matching` domain does not compile standalone without it. Previously omitted
# (the bug was masked in-workspace by feature unification, another member always
# enabled `hash`); a consumer enabling ONLY `matching` against the published crate
# fails with E0433. Self-enable it so `matching` is a complete, standalone feature.
matching = ["vyre-foundation", "hash"]
decode = ["vyre-foundation"]
# Subgroup-cooperative NFA step (G1). Composes bitset + matching.
nfa = ["vyre-foundation", "bitset", "matching"]
math = ["vyre-foundation", "graph", "fixpoint"]
nn = ["vyre-foundation", "math"]
hash = ["vyre-foundation"]
parsing = ["vyre-foundation", "text", "matching"]
graph = ["vyre-foundation", "bitset", "reduce", "hash", "fixpoint"]
bitset = ["vyre-foundation"]
reduce = ["vyre-foundation"]
label = ["vyre-foundation", "bitset"]
predicate = ["vyre-foundation", "graph", "bitset", "label"]
fixpoint = ["vyre-foundation", "bitset"]
# Geometric / Clifford algebra primitives (#8). Multivector products
# unify quaternions, dual quaternions, and projective transformations
# on a single substrate; reused by equivariant NNs (#33), physics
# simulation, robotics, 3D vision.
geom = ["vyre-foundation", "math"]
# Convex / combinatorial optimization primitives (#9, #14, #46).
opt = ["vyre-foundation", "math"]
# Persistent homology + simplicial complex primitives (#15, #32).
topology = ["vyre-foundation", "math", "graph"]
visual = ["vyre-foundation"]

# Category C hardware intrinsics. Every op here submits an
# `OperationRegistration`, so the registry feature comes with it rather than
# being a second thing to remember.
hardware = ["vyre-foundation", "inventory-registry"]

# Convenience aggregate  -  enable the entire Tier 2.5 substrate.
all-lego = [
    "text", "matching", "math", "nn", "hash", "parsing",
    "geom", "opt", "topology",
    "graph", "bitset", "reduce", "label", "predicate", "fixpoint", "decode",
    "nfa", "visual", "hardware",
]

# Enable canonical `OperationRegistration::primitive(...)` submissions so the
# universal conform harness and `cargo xtask print-composition` discover every
# registered primitive. Off by default to keep default-build dep-free.
inventory-registry = ["dep:inventory", "vyre-foundation"]

[dependencies]
vyre-foundation = { workspace = true, optional = true }
vyre-spec.workspace = true
inventory = { workspace = true, optional = true }
bytemuck.workspace = true

[dev-dependencies]
# Pinned to the published floor (not `workspace = true`) to break the
# dev-dependency publish cycle: vyre-primitives is published before vyre-driver/
# vyre-driver-cuda/vyre-reference, so a current-version req is unresolvable at publish.
# `^0.6.1` resolves against the already-published baseline; path keeps local builds
# on the workspace crates. Matches the pattern used by vyre-spec/vyre-driver-wgpu.
vyre-driver = { path = "../vyre-driver" }
vyre-driver-cuda = { path = "../vyre-driver-cuda" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
criterion.workspace = true
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Reads source text only, so it needs no domain feature: gating it on one would
# narrow the walk to the modules that feature happens to enable, and a class is
# not closed over a subset of the tree.
[[test]]
name = "shared_owner_closure"
path = "tests/shared_owner_closure.rs"

# Master plan: integration smoke needs hash builders + inventory walk.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["hash", "inventory-registry"]

[[test]]
name = "inflate_program"
path = "tests/inflate_program.rs"
required-features = ["decode"]

[[bench]]
name = "wire_throughput"
harness = false






