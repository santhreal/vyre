[package]
name = "vyre-primitives"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The vyre operations that cannot be composed: marker types, hardware intrinsics, and the per-domain kernels a backend sees as one unit."
readme = "README.md"
keywords = ["gpu", "ir", "primitive", "vyre", "lego"]
categories = ["algorithms", "api-bindings"]
documentation = "https://docs.rs/vyre-primitives"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[features]
# Default: marker types only, zero IR-builder deps.
default = []

# Enable GPU-backend parity tests (requires CUDA driver + device).
gpu = []

# Enable host reference oracles for explicit parity harnesses. Release
# consumers should not enable this; CUDA/GPU dispatch builders remain
# available without host execution paths.
cpu-parity = []

# Pulls vyre-foundation in as an optional dep. `hardware` and `vfs` need it;
# nothing else in this crate builds IR.
vyre-foundation = ["dep:vyre-foundation"]

# Category C hardware intrinsics: the one domain feature this crate declares.
# Every op here submits an `OperationRegistration`, so the registry feature comes
# with it rather than being a second thing to remember.
hardware = ["vyre-foundation", "inventory-registry"]

# Convenience aggregate: every domain feature this crate declares. It equals
# INTRINSIC_FEATURES union COMPOSITION_FEATURES from src/organization.rs, and
# COMPOSITION_FEATURES is empty because every composition moved to vyre-libs.
all-lego = ["hardware"]

# Enable canonical `OperationRegistration::primitive(...)` submissions so the
# universal conform harness and `cargo xtask print-composition` discover every
# registered primitive. Off by default to keep default-build dep-free.
inventory-registry = ["dep:inventory", "vyre-foundation"]

[dependencies]
vyre-foundation = { workspace = true, optional = true }
vyre-spec.workspace = true
inventory = { workspace = true, optional = true }
bytemuck.workspace = true

[dev-dependencies]
# Pinned to the published floor (not `workspace = true`) to break the
# dev-dependency publish cycle: vyre-primitives is published before vyre-driver/
# vyre-driver-cuda/vyre-reference, so a current-version req is unresolvable at publish.
# `^0.6.1` resolves against the already-published baseline; path keeps local builds
# on the workspace crates. Matches the pattern used by vyre-spec/vyre-driver-wgpu.
vyre-driver = { path = "../vyre-driver" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
criterion.workspace = true
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Reads source text only, so it needs no domain feature: gating it on one would
# narrow the walk to the modules that feature happens to enable, and a class is
# not closed over a subset of the tree.
[[test]]
name = "shared_owner_closure"
path = "tests/shared_owner_closure.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["hardware"]

[[bench]]
name = "wire_throughput"
harness = false

[[test]]
name = "hardware_conform"
path = "tests/hardware_conform.rs"
required-features = ["hardware"]

[[test]]
name = "hardware_registry_contract"
path = "tests/hardware_registry_contract.rs"
required-features = ["hardware"]

[[test]]
name = "generated_hardware_f32_matrix"
path = "tests/generated_hardware_f32_matrix.rs"
required-features = ["hardware"]

[[test]]
name = "generated_hardware_u32_matrix"
path = "tests/generated_hardware_u32_matrix.rs"
required-features = ["hardware"]

[[test]]
name = "generated_hardware_registry_matrix"
path = "tests/generated_hardware_registry_matrix.rs"
required-features = ["hardware"]
