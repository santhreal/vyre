[package]
name = "vyre-libs-hash"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hash and checksum compositions including FNV-1a, CRC-32, Adler-32, and BLAKE3"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-hash"

[package.metadata.vyre]
publication_class = "extension-sdk"

[lints]
workspace = true

[features]
default = ["hash"]
hash = []
"crypto-blake3" = ["hash"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }

[dev-dependencies]
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
