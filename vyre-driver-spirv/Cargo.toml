[package]
name = "vyre-driver-spirv"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SPIR-V backend adapter for Vyre."
readme = "README.md"
keywords = ["gpu", "compute", "spirv", "vulkan", "vyre"]
categories = ["hardware-support", "rendering::graphics-api"]
documentation = "https://docs.rs/vyre-driver-spirv"
exclude = ["**/SKILL.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []

# The spirv_parity suite validates every blob it emits with spirv-val, and a
# machine without that binary must skip the target rather than compile it and
# pass without validating anything, which is what it used to do. Registering the
# target behind a feature is the same remedy the oracle-matrix suite uses: a
# default run cleanly skips it, and the gate that enables it fails
# closed when the validator is missing.
spirv-val = []

[dependencies]
vyre-driver = { workspace = true }
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-lower = { workspace = true }
vyre-emit-spirv = { workspace = true }
inventory.workspace = true
ash.workspace = true

[dev-dependencies]
vyre-driver = { workspace = true, features = ["test-fixtures"] }
# integration tests/benches assert against these crates' public APIs
vyre-reference = { path = "../vyre-reference" }
tempfile.workspace = true

[[test]]
name = "spirv_parity"
path = "tests/spirv_parity.rs"
required-features = ["spirv-val"]
