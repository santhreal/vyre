[package]
name = "vyre-driver-spirv"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SPIR-V backend adapter for Vyre."
readme = "README.md"
keywords = ["gpu", "compute", "spirv", "vulkan", "vyre"]
categories = ["hardware-support", "rendering::graphics-api"]
documentation = "https://docs.rs/vyre-driver-spirv"
exclude = ["**/SKILL.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
vyre-driver = { workspace = true }
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-spec = { workspace = true }
vyre-lower = { workspace = true }
vyre-emit-spirv = { workspace = true }
inventory.workspace = true
ash.workspace = true
smallvec = { workspace = true }

[dev-dependencies]
# integration tests/benches assert against these crates' public APIs
vyre-reference = { path = "../vyre-reference" }
tempfile.workspace = true
