[package]
name = "vyre-libs-math"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linear algebra, matrix operations, scans, broadcasting, algebra, and succinct data structures"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-math"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[package.metadata.vyre]
publication_class = "extension-sdk"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["math", "geom", "opt", "representation"]
math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
"math-dialect" = []
"math-kernels" = []
"math-linalg" = ["math-dialect", "math-kernels"]
"math-scan" = ["math-dialect", "math-kernels"]
"math-broadcast" = ["math-dialect", "math-kernels"]
"math-algebra" = ["math-dialect", "math-kernels"]
"math-succinct" = ["math-dialect", "math-kernels"]
geom = ["math-kernels"]
opt = ["math-kernels"]
representation = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
inventory.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-reduce = { workspace = true }
vyre-libs-fixpoint = { workspace = true }

[dev-dependencies]
vyre-test-support = { workspace = true, features = ["semantic-parity"] }
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }
proptest.workspace = true
vyre-libs-fixpoint = { workspace = true, features = ["test-fixtures"] }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
