# Declared algebraic laws that carry no executable proof, one row per
# (operation, law) pair, with the payload the law's statement needs.
#
# A row is not a pass. It records that the prover derived no witness and names
# why, so the pair reads as unproven rather than proven. `unproven_cap` equals
# the number of such pairs the live registry reports: making a law provable
# deletes its row and lowers the cap, and the cap only ever moves down.
#
# `kind` is drawn from `UnprovenKind`: missing-element, missing-partner,
# missing-order, shape-not-composable, no-check-declared, nothing-to-execute.

