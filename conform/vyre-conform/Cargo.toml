[package]
name = "vyre-conform"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compatibility re-export shim for vyre_test_support::conform."
readme = "README.md"
publish = false

[package.metadata.vyre]
publication_class = "conformance-tooling"

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["vyre-test-support/conform-gpu"]
device-tests = ["vyre-test-support/conform-device-tests"]

[dependencies]
vyre-test-support = { workspace = true, features = ["conform"] }
