[package]
name = "vyre-libs-builder"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared IR composition infrastructure, child region skeletons, operands, and link anchors"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-builder"

[package.metadata.vyre]
publication_class = "extension-sdk"

[lints]
workspace = true

[features]
default = ["builder", "builder-ops", "cat-a-builder-options", "telemetry"]
builder = []
"builder-ops" = ["builder"]
"cat-a-builder-options" = ["builder"]
telemetry = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
vyre-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
