# `release_contract_path` names the document a release is judged against. It
# pointed at `../docs/RELEASE.md`, an operator runbook deleted with the mdbook,
# so the gate opened every run with a blocker naming a file no clone has. The
# surviving authority is the release train beside this manifest: it declares the
# versions, the product-scoped tags, the package membership, the repository, and
# the three approval-gated external actions, and unlike a prose runbook it is
# the file every generator and gate already reads.
schema_version = 2
release_contract_path = "release-train.toml"

[release]
vyre = "0.8.0"

[[requirements]]
id = "version-story"
title = "Manifest, tag, docs, and release-note version story is resolved"
status = "closed"
evidence = [
  "cargo_full run --bin xtask -- version-matrix --write",
  "evidence/version/version-matrix.json",
  "evidence/version/release-tag-plan.json",
  "evidence/docs/release-notes-version-story.md",
]

