# Release-train-level fields (required_*, package_verify_passed) must sit ABOVE
# the first [table] header: in TOML a bare key after `[tags]` binds INTO `[tags]`,
# which silently dropped them from `ReleaseTrainData` (xtask/src/release_train.rs
# expects them at top level) and made `xtask version-matrix` fail to parse this
# file ("missing field required_release_note_tokens"). Keep them here at top level.
required_release_note_tokens = [
  "Vyre 0.7.2",
  "vyre-driver-cuda@0.7.2",
  "vyre-driver-wgpu@0.7.2",
  "vyre-v0.7.2-rc.1",
  "vyre-v0.7.2",
]

required_packaging_steps = [
  "package versions align before tag creation",
  "release candidate tags are cut before final tags",
  "release notes cite the product-scoped tags",
  "release artifacts are generated after the version matrix has zero blockers",
]

package_verify_passed = [
  "vyre-macros@0.7.2",
  "vyre-spec@0.7.2",
  "vyre-lints@0.7.2",
]

[versions]
vyre = "0.7.2"
vyre_frontend_c = "0.7.2"

[tags]
vyre_rc = "vyre-v0.7.2-rc.1"
vyre = "vyre-v0.7.2"
policy = "Release packaging must use explicit product-scoped RC and final tags, not a bare v0.7.2 tag that could ambiguously refer to the root monorepo or Vyre crates."


[release_groups.vyre]
repository = "santhreal/vyre"
version = "vyre"
packages = [
  "vyre",
  "vyre-aot",
  "vyre-debug",
  "vyre-driver",
  "vyre-driver-cuda",
  "vyre-driver-metal",
  "vyre-driver-reference",
  "vyre-driver-spirv",
  "vyre-driver-wgpu",
  "vyre-emit-metal",
  "vyre-emit-naga",
  "vyre-emit-ptx",
  "vyre-emit-spirv",
  "vyre-foundation",
  "vyre-grammar-gen",
  "vyre-intrinsics",
  "vyre-libs",
  "vyre-lints",
  "vyre-lower",
  "vyre-macros",
  "vyre-megakernel",
  "vyre-primitives",
  "vyre-reference",
  "vyre-runtime",
  "vyre-scan",
  "vyre-self-substrate",
  "vyre-spec",
]


[[external_actions]]
id = "publish-crates"
description = "Publish approved crates in dependency order."
evidence = "scripts/publish-release.sh and release/evidence/package/publish-readiness.json"

[[external_actions]]
id = "verify-public-repository"
description = "Verify that santhreal/vyre has the approved public visibility."
evidence = "gh repo view santhreal/vyre --json visibility"

[[external_actions]]
id = "push-release"
description = "Push the approved release commit and product-scoped tags."
evidence = "scripts/final-launch.sh"
