id = "registered-target-compiler-contract-has-one-owner"
category = "Changed"
text = "The registered-target-compiler contract has one owner, `tests/support/target_compiler_contract.rs`, which every backend reaches with its own backend id, payload format identity and version, entry point and output access class. Four backends had restated all four statements, and the copies had drifted: two asserted the payload format version and two did not, three asserted the completion digest and one did not, each looked its registration up through only one of the two registry routes, and the value the fixture program stores was a separate literal from the value the assertion read back. The shared contract asserts both registry routes resolve to one registration, one emitted module per compiler-selected fusion group, entry-point agreement between the bundle and the payload entry, and the payload seal against the compiled artifact; whatever is target-native about a module is inspected by the caller's own closure inside its own crate. `vyre-driver-spirv/tests/shared_target_contract_discrimination.rs` proves the contract rejects a falsified payload format identity, format version, entry point, unlinked backend id and precedence rank, so a helper that accepted every argument cannot pass."

[[fragments]]
id = "resident-async-overlap-contract-has-one-owner"
category = "Changed"
text = "The resident asynchronous overlap contract has one owner, `tests/support/resident_async_overlap_contract.rs`. Two backends had carried it verbatim apart from acquisition, message text and one assertion. Device-measured time is now a parameter rather than a shared assumption, so a backend without a device timer on that path is still held to exact per-slot outputs and to enqueue and wait time being separated."

