[[fragments]]
id = "feature-isolation-axis-covers-the-newest-crates"
category = "Fixed"
text = "The feature-isolation gate records the eight pairs it was missing: `vyre-registry-link` with no default features and with each of its `cuda`, `metal`, `operations`, `reference`, `spirv` and `wgpu` features, and `vyre-test-support` with `ir-fixtures`. The gate derives its axis from the manifests at run time, so both crates turned it red the moment they landed after the recorded set was written. Every one of the eight compiles. The `SOURCES` builder in `vyre-registry-link/src/backend.rs` also stops binding a `mut` vector that only the feature-enabled builds mutate; the linked sources are now one `vec!` whose elements carry the `cfg`, so the no-default-features probe compiles without a warning."

[[fragments]]
id = "feature-isolation-judges-the-selections-this-workspace-asks-for"
category = "Fixed"
text = "The feature-isolation axis judges two kinds of selection it never covered. The plain default build of each member, which is what `cargo check -p <member>` resolves and which neither the `--no-default-features` probe nor any single-feature probe is, and every selection a workspace edge asks of a sibling, spelled in the `feature` column as a comma-joined list that opens with `(default)` when the edge keeps defaults. Both holes were load-bearing. `vyre-aot` and `vyre-pass-engine` do not compile under their own default build, which is why the public-API snapshot gate could not extract either surface, and `vyre-libs` asks `vyre-primitives` for `graph`, `inventory-registry` and `text` together, a combination no single-feature probe reaches. Cargo unifies features across a build, so a whole-workspace check hides a break inside such a selection behind whichever unrelated member happens to enable the missing piece. `--sweep --write` now merges what a run observed over the rows already recorded, and `--only-unrecorded` narrows the compiling to the selections that have no row yet, so recording one decision no longer costs a sweep of the whole axis, which is how the recorded set went stale."

[[fragments]]
id = "checkout-provenance-closed-for-tests-and-benches"
category = "Fixed"
text = "No test, bench, or fixture in the workspace resolves a repository path from a directory fixed at compile time. Every checkout of this repository shares one cargo target directory, and cargo hashes a workspace member by its path relative to the workspace root, so two checkouts compute the same unit hash and hand each other compiled binaries. Forty-eight source files read documents, workflows, scripts, manifests, evidence and pins through a compiled-in directory, and own-crate fixture and golden-file locators resolved that way too, so a byte-stability test compared its output against the other checkout's golden file and asserted byte stability against that tree. `vyre_test_support::monorepo::vyre_workspace_root` now delegates to `structure_gate::workspace_root`, the one owner of that answer, and `ConsumerBoundaryScan::for_crate` and `assert_registry_closure` take the crate directory as a path rather than a compiled-in string. `structure-gate/tests/checkout_provenance.rs` scans every `.rs` file under every workspace member's `src/`, `tests/` and `benches/`, plus the root `tests/` directory, with the member list read from the root manifest and every directory walked at run time, so a new crate or a new file is covered without an edit to the gate."

[[fragments]]
id = "release-evidence-citations-resolve"
category = "Fixed"
text = "Every path cited inside `release/evidence` resolves on disk, and the gate that says so now reads the whole document. Twenty-seven citations across five artifacts named files that three source moves had left behind: `module_cache.rs` and `eqsat.rs` became directories, and the megakernel schedule, device scratch, VAST walk builders, subgroup shuffle and conformance matrix sources moved to the crates that own them. Twenty-five of the twenty-seven were regenerated from the current tree by `hygiene-matrix`, which is the only correct fix for a scan artifact; the other two came from a hardcoded marker table in `xtask-evidence/src/release/backend_matrix.rs` and a stale row in `docs/optimization/THRESHOLD_POLICY.toml`, both of which now name the file that owns the tokens they prove. Citation discovery in `scripts/check_evidence_paths.sh` walked one shape only, a top-level key holding an array of objects, so 81 of 634 citations were never read; it now takes every `path` string at any depth and reports the route to it. The one dead citation that hid there, an unexpanded shell template naming a README in another repository, belonged to a pair of orphaned artifacts, `readme-contracts.json` and `readme-proof.md`, certifying a crate this workspace does not contain and that no longer exists under that name where it did; nothing here registered, generated or read them."

[[fragments]]
id = "publish-order-derived-from-manifests"
category = "Fixed"
text = "The release publish order is derived from the manifests instead of listed in source. It was a hardcoded table of twenty-six steps, and moving library code into `vyre-libs` gave that crate five consumers while the table still held it at index twenty-one, so the recorded evidence certified an order that publishes `vyre-pass-engine`, `vyre-driver`, `vyre-runtime`, `vyre-driver-cuda` and `vyre-driver-wgpu` against a `vyre-libs` version crates.io does not have yet, with `blockers: []` throughout. The order is now a topological sort over the crates the metadata matrix calls publishable, keyed on the same dependency edges the order check enforces, with name-ordered ties so one tree yields one order. It fails closed rather than guessing: a publishable crate whose manifest is not on disk is a blocker, and a cycle among publishable crates is reported per member instead of resolved into some order."

