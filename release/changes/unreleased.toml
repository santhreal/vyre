id = "clone-family-pins-name-the-identity"
category = "Fixed"
text = "The clone-family IR pins for `nn::softmax` and `nn::layer_norm` track the current shared child-region names. Renaming the reduce-family owners from `vyre-libs::substrate::*` to `vyre-libs::builder::*` moved the fingerprint of every program embedding them, because a region generator identity is part of the wire encoding, and the pinned digests were left on the old names. The drift went unnoticed because the target needs `nn-attention`, which the package-scoped test command does not enable. Rewriting only those identity strings in the built programs reproduces the previous digests exactly, so no node, buffer, expression or workgroup value moved. A companion rule now pins the region identities each entry point carries, which names a rename directly instead of reporting an opaque digest change, and asserts the reduce-family owner is still reached by more than one caller."

