schema_version = 1

[[fragments]]
id = "conformance-owner-consolidation"
category = "Changed"
text = "The standalone `vyre-harness` package is gone. Semantic operation identity, tier classification, and registration now live in `vyre-foundation`; library fixture views live in `vyre-libs`; conformance execution and parity policy live in `vyre-conform`; self-substrate behavior tests live with their owner."
[[fragments]]
id = "self-substrate-policy-shadow-removal"
category = "Removed"
text = "Self-substrate no longer publishes source-text validators for deleted C-frontend test files or parser release artifacts. Diagnostic and preprocessing conformance now belongs to the live frontend and conformance paths."

[[fragments]]
id = "byte-range-cutover"
category = "Changed"
text = "Scan products now return the foundation-owned `ByteRange { tag, start, end }`. The deprecated `Match` and `LiteralMatch` surfaces and the duplicate primitive range type are gone."

[[fragments]]
id = "canonical-module-cutover"
category = "Removed"
text = "Neural operations and opaque-payload helpers now use their category-owned module paths. Flat compatibility re-exports and the `matching::ops` shim are gone; unclassified backend failures use `BackendError::Other`."

[[fragments]]
id = "reference-owner-cutover"
category = "Changed"
text = "The reference interpreter now consumes foundation-owned IR, diagnostics, and operation metadata directly instead of depending on the public `vyre` facade."

[[fragments]]
id = "driver-owned-backend-registry"
category = "Removed"
text = "Backend registration is now consumed from `vyre-driver`, the `ReferenceKind` alias is gone in favor of `vyre-spec::CpuFn`, and `gpu_int_literal_scan()` no longer accepts an ignored source-length parameter."

[[fragments]]
id = "decorated-backend-device-profile"
category = "Fixed"
text = "Driver decorators now preserve the concrete backend device profile, including device-timestamp capability and timing quality."

[[fragments]]
id = "grouped-int4-batched-throughput"
category = "Added"
text = "Grouped affine INT4 linear now provides a typed batched program builder that dequantizes each immutable weight tile once and reuses it across independent resident batch rows. Release evidence measures normalized per-inference latency."

[[fragments]]
id = "compact-ptx-f32-canonicalization"
category = "Changed"
text = "PTX f32 canonicalization now uses native flush-to-zero multiplication plus NaN selection, preserving signed zero and canonical NaN semantics with fewer instructions and registers."

[[fragments]]
id = "benchmark-contract-failure-evidence"
category = "Fixed"
text = "Enforced benchmark contract failures now retain correctness, timing metrics, device identity, and measured speedup in the failed case report instead of collapsing into an unprobed error shell."

[[fragments]]
id = "release-benchmark-clock-warmup"
category = "Changed"
text = "Release benchmark commands now run 300 warmup samples before measurement so accelerator clock preconditioning is explicit and reproducible."

[[fragments]]
id = "resident-batch-device-timing"
category = "Fixed"
text = "Resident throughput batches preserve complete device-timestamp totals and normalize them per logical item. String bitmap scatter uses subgroup ballots to materialize 16 independent output rows in one resident dispatch, with exact CPU-oracle parity."

[[fragments]]
id = "wgpu-artifact-route-cutover"
category = "Removed"
text = "The WGPU host-ingress and raw persistent-kernel compiler routes are gone. Persistent product execution uses authenticated artifact sessions; concrete pipeline compilation remains available only as a hidden oracle helper for driver cache tests."


[[fragments]]
id = "heuristic-audit-root-resolution"
category = "Fixed"
text = "`xtask heuristic-audit` now resolves both standalone Vyre checkouts and the enclosing Santh workspace without duplicating the Vyre path."

[[fragments]]
id = "public-api-snapshot-contract"
category = "Fixed"
text = "Public API checks now discover every committed crate snapshot, parse exact package names, use dependency-noise-free output, and reject ordinary snapshot updates that remove or change an existing item."

[[fragments]]
id = "qk-gain-shape-arithmetic"
category = "Fixed"
text = "Empty QK-gain tensor shapes now declare a zero-byte output range instead of an unknown-size backend allocation, while overflowing positive shapes fail closed with an actionable trap program instead of wrapping their element count."

[[fragments]]
id = "grouped-query-attention-composition"
category = "Fixed"
text = "Grouped-query attention now composes the canonical max, normalization-sum, and weighted-write primitives with explicit KV-head bases. Overflowing row or element counts fail with a sharding error before buffer declarations are built."

[[fragments]]
id = "wgpu-grid-sync-splitting"
category = "Fixed"
text = "WGPU resident dispatch now splits `GridSync` programs at launch boundaries before compilation, preventing oversized resident fixed-point grids from deadlocking inside a software global barrier."

[[fragments]]
id = "stream-shard-error-surface"
category = "Fixed"
text = "The WGPU stream-sharding error is now nameable as `engine::multi_gpu::StreamShardError` without changing existing signatures."

[[fragments]]
id = "documentation-links"
category = "Fixed"
text = "Workspace documentation now resolves NFA conversion and megakernel table links."

[[fragments]]
id = "reduction-benchmark-routes"
category = "Fixed"
text = "The reduction benchmark now measures atomic-scalar and workgroup-tree sums on the same GPU at 32 and 1,048,576 elements. It verifies both routes exactly, selects the measured winner per size, and records contention and barrier counters. NVIDIA idle clocks no longer invalidate a cold, low-utilization microbenchmark as thermal instability."

[[fragments]]
id = "v055-uniform-loop-exit"
category = "Fixed"
text = "V055 now accepts a post-barrier loop exit only when its full return path is workgroup-uniform. It derives same-address loads from an acquiring barrier and rejects intervening writes, divergent indices, atomics, and lane-dependent guards. The DCE fixpoint loop therefore removes one redundant barrier per iteration without weakening the unsafe-exit rejection."

[[fragments]]
id = "publishable-api-snapshots"
category = "Fixed"
text = "Public API snapshots now cover every workspace package whose Cargo manifest permits publication, including CUDA and every emitter/runtime library. The manifest-derived gate rejects both missing snapshots and stale snapshots for packages that no longer publish."

[[fragments]]
id = "benchmark-feature-contract"
category = "Fixed"
text = "Removed the unreachable `vyre-bench` dataflow baseline module whose undeclared feature could never be enabled and whose engine dependency does not exist in this workspace. Benchmark feature guards now have a manifest agreement gate, so a hidden undeclared case cannot recur."

[[fragments]]
id = "regex-open-repetition-policy"
category = "Fixed"
text = "Regex DFA replay now gives open-ended repetitions an explicit finite policy instead of treating their minimum as a maximum. Whole-buffer variable-length matches derive exact starts from candidate origins, and region evidence returns one longest extent per pattern and origin."

[[fragments]]
id = "multi-adapter-corpus-benchmark"
category = "Fixed"
text = "Weighted paged-corpus scans now expose per-device timing and byte balance. The physical two-adapter benchmark verifies exact single-device parity and records paired end-to-end speedup, topology, staging overhead, and raw samples."

[[fragments]]
id = "package-local-registry-patches"
category = "Fixed"
text = "Package readiness now validates unpublished, version-matched release dependencies through local registry patches after Cargo normalizes path dependencies for packaging. Cross-repository `weirflow` archive evidence now records its real files, examples, Rust sources, and file-list digest."

[[fragments]]
id = "crate-ownership-registry"
category = "Fixed"
text = "Workspace crate ownership now comes from one manifest-checked registry. The tier gate rejects missing crates, undeclared production edges, and stale generated graph or ownership guides, while planned compiler boundaries stay visibly separate from current workspace members."

[[fragments]]
id = "generated-testing-guides"
category = "Fixed"
text = "Testing guides are now generated for all 36 workspace members from Cargo features and targets plus maintained hardware, evidence, skip, and failure metadata. The documentation gate rejects missing, orphaned, or stale guides."

[[fragments]]
id = "generated-crate-readmes"
category = "Fixed"
text = "Every workspace crate README now carries a manifest-backed contract for purpose, boundaries, a runnable example, features, errors, testing, release status, and ownership. Retired 0.4.x package claims and README drift fail the documentation gate."

[[fragments]]
id = "operation-schema-authority"
category = "Fixed"
text = "Operation documentation now has one generated JSON authority covering every linked library, primitive, intrinsic, and runtime dialect operation. Schema-derived inventories and subsystem catalogs expose exact tiers, categories, program or dialect signatures, Cargo feature routes, oracles, backend support evidence, algebraic laws, composition chains, and counts."

[[fragments]]
id = "root-readme-authorities"
category = "Fixed"
text = "The root README now derives every workspace crate's publication and support status from manifests and maintained metadata. Operation tier counts come from the canonical operation schema, backend claims come from executable backend evidence, and the architecture identifies Metal as Apple-active instead of planned."

[[fragments]]
id = "architecture-documentation"
category = "Fixed"
text = "Architecture guides now use the generated 36-crate dependency graph, joined operation registries, CUDA-first backend evidence, typed cross-program composition, and explicit runtime/compiler/driver megakernel boundaries. The earlier device-bytecode-interpreter RFC is retained as superseded rationale."

[[fragments]]
id = "documentation-reference-contract"
category = "Fixed"
text = "Documentation coverage now reports measured gates instead of universal completeness. Public guides distinguish generic consumers from named integrations, and the documentation gate rejects missing or gitignored repository inputs hidden in code spans and shell examples."

[[fragments]]
id = "documentation-matrix"
category = "Fixed"
text = "The documentation matrix now covers every indexed public document and workspace crate README. Each row records audience, owner, authority, source artifacts, verification date, executable examples, version coherence, support status, and claim-evidence blockers."

[[fragments]]
id = "documentation-revalidation"
category = "Fixed"
text = "Every current public guide is now revalidated for Vyre 0.7.2. Historical architecture, migration, release, operation, and testing documents are explicitly archived or superseded, generated views identify their source, and crate-local paths remain reproducible in a clean checkout."

[[fragments]]
id = "canonical-release-procedure"
category = "Fixed"
text = "Release operations now use one runbook and one generated checklist derived from release-train versions, repositories, package groups, tags, approval actions, and validated changelog fragments. The guarded launcher pushes candidate tags before publication, final tags afterward, and records completion only after external actions succeed."

[[fragments]]
id = "executable-cli-documentation"
category = "Fixed"
text = "Command-line documentation now inventories and executes all 12 workspace binaries and 84 subcommands, publishes exact help, exit-code, environment, configuration, hardware, and failure contracts in crate READMEs, and gates drift in documentation CI. The vyre-wgpu demo is documented and exercised on the real GPU lane, while helper --help routes are side-effect free."

[[fragments]]
id = "bounded-sharded-safetensors-ingestion"
category = "Added"
text = "The vyre-safetensors adapter reads bounded safetensors headers and sharded indexes without reading tensor payloads, confines shard paths to the checkpoint root, rejects duplicate or unmapped tensors, validates caller-supplied dtype and shape requirements, and streams complete shards against an exact trusted BLAKE3 set before returning an immutable checkpoint identity."

[[fragments]]
id = "resource-residency-lifecycle"
category = "Added"
text = "The runtime now owns immutable resources, reusable artifact instances, and mutable leased state through one budgeted residency boundary. Cold and warm admission, rollback, cancellation, generation-checked reset, completion, eviction, and manager destruction release resources without exposing stale state."

[[fragments]]
id = "typed-program-graph-wire"
category = "Added"
text = "ProgramGraph now composes reusable Programs through canonical typed value identities, explicit consumer and output ports, symbolic or concrete shapes, access and lifetime contracts, and validated state transitions. Its bounded VGR0 wire format embeds existing VIR0 Programs and rejects implicit casts, rank drift, alias conflicts, dangling state, malformed framing, and hostile counts before mutation."

[[fragments]]
id = "whole-program-graph-analysis"
category = "Added"
text = "ProgramGraph now validates complete compositions and derives canonical topological schedules, inclusive value liveness, and deterministic interval-colored allocation plans. Invocation-local values reuse only nonoverlapping slots, while immutable weights, sequence-state generations, and caller-visible outputs retain dedicated storage."

[[fragments]]
id = "program-graph-composition-identity"
category = "Added"
text = "ProgramGraph now derives one versioned, domain-separated BLAKE3 identity from canonical topology and Programs, typed port contracts, artifact schema, validated model configuration, exact symbolic bindings, and verified immutable-weight identities. Mutable sequence-state contents are excluded, so cache growth reuses compiled artifacts while any executable or provenance change invalidates the key."

[[fragments]]
id = "gated-rmsnorm-half-reference"
category = "Added"
text = "The neural library now provides gated RMSNorm with float32 accumulation, source-dtype rounding, learned scaling, float32 SiLU gating, and exact last-dimension row isolation. The reference interpreter now executes canonical F16 and BF16 loads, stores, and F32 conversions with round-to-nearest-even semantics while preserving raw element-byte APIs."

[[fragments]]
id = "last-dimension-l2-normalization"
category = "Added"
text = "The neural library now provides last-dimension L2 normalization for grouped query and key heads. It accumulates sum-of-squares in F32, applies epsilon inside the canonical inverse-square-root contract, isolates rows exactly, and converts output once to F32, F16, or BF16."

[[fragments]]
id = "causal-convolution-state"
category = "Added"
text = "The neural library now executes floating channel-major depthwise causal convolution with exact left padding, masks, bias, SiLU, F16/BF16 conversion, and output truncation. A short-chunk route emits an explicit next-state generation whose outputs and tail match full prefill across arbitrary token partitions and reset."

[[fragments]]
id = "recurrent-gated-delta"
category = "Added"
text = "The neural library now executes recurrent gated delta attention with F32 Q/K normalization, grouped heads, scaled queries, exponential decay, sigmoid beta, F32 matrix-state continuation, source-dtype output, and explicit validated prior and next state generations."

[[fragments]]
id = "normalized-rotary-causal-gqa"
category = "Added"
text = "The neural library now composes F32 query and key normalization, cache-position partial rotary embedding, explicit query-to-KV head grouping, and dynamically bounded causal attention in one typed ProgramGraph. Prompt and cached-decode routes exclude future cache rows and support configurable head ratios, head widths, and rotary dimensions."

[[fragments]]
id = "dense-gated-mlp-block"
category = "Added"
text = "The neural library now executes a reusable dense gated-MLP ProgramGraph with learned RMSNorm, checkpoint-native output-major gate and up projections, F32 SwiGLU math, output-major down projection, and residual addition. F16, BF16, and F32 storage use F32 normalization, projection accumulation, activation, and residual arithmetic with source-dtype boundaries."

[[fragments]]
id = "chunked-gated-delta"
category = "Added"
text = "The neural library now executes chunk-size-64 gated delta prefill with F32 cumulative log-decay, a strict lower-triangular solve, initial-state correction, chunk output reconstruction, and explicit final matrix state. F16, BF16, and F32 inputs retain F32 internal math. Guarded rows in the final structural tile cannot read padding, change state, or appear in truncated output."
[[fragments]]
id = "canonical-procedural-macro-surface"
category = "Removed"
text = "The macro crate now exports only the production-used AST registry and semantic pass registration generators. Test-only operation registration, algebraic-law derive, no-op builder marker, and generated decoder stubs are gone."

[[fragments]]
id = "owner-local-error-contracts"
category = "Changed"
text = "Foundation now exposes IR-specific `IrError` and `IrResult` contracts instead of a cross-domain error sink. Reference interpretation, backend execution, WGPU device selection, and runtime framing return owner-local typed failures."

[[fragments]]
id = "documentation-and-dependency-authority"
category = "Changed"
text = "Documentation pages now declare audience, owner, authority, kind, and generated/manual ownership. Crate dependency records declare purpose, features, target conditions, visibility, and destination seam, and optimizer pass reference pages are generated from the live pass registry."


[[fragments]]
id = "semantic-parity-fixture-projection"
category = "Changed"
text = "Floating-point parity now uses one foundation-owned comparison contract for semantic operation witnesses, including each operation's declared tolerance. The library operation catalog distinguishes the complete semantic inventory from its deterministic executable-fixture projection."

[[fragments]]
id = "callable-typedef-conformance"
category = "Changed"
text = "C typedef row phases remain canonical callable operations. The operation matrix marks them as inlined callees whose execution coverage belongs to fixture-backed parent operations."

[[fragments]]
id = "gate-wiring-unwired-checks"
category = "Changed"
text = "Five checks that no workflow invoked now run in `.github/workflows/gates.yml`: the transitive layer closure, benchmark registry coverage, internal dependency versions, the feature-isolated MSRV sweep, and the oracle-matrix sweeps with their volume waves. Each step names the class it closes and why no other workflow sees it."

[[fragments]]
id = "layering-gate-fails-closed"
category = "Changed"
text = "`scripts/check_layering.sh` discarded `cargo tree` stderr, so a cargo that could not resolve the workspace printed a green result and exited 0. It now derives every workspace member, requires a `docs/CRATE_OWNERSHIP.toml` decision for each, and holds every transitive internal edge to the declared closure."

[[fragments]]
id = "feature-msrv-sweep-derived"
category = "Changed"
text = "`scripts/check_feature_msrv.sh` printed a hardcoded 19-entry matrix and exited 0 without compiling anything. It now derives one entry per publishable member per declared feature from tracked manifests and compiles each alone on the toolchain `[workspace.package].rust-version` names, which must be installed."

[[fragments]]
id = "derived-gate-rosters"
category = "Changed"
text = "The internal dependency version rule, the benchmark coverage rule, and both sweep runners derive their crate, case, and test rosters from tracked manifests and sources instead of hardcoded lists, no longer write outside the repository, and fail on a cargo failure instead of reporting a clean tree. The volume sweep runner had a three-crate list that left one tracked volume wave in no shard, and a shard index outside the shard count selected nothing and exited 0."

[[fragments]]
id = "primitives-types-feature-dependency"
category = "Fixed"
text = "The `types` feature of `vyre-primitives` now depends on `vyre-foundation`, which its shape-predicate evaluator has always aliased. Enabling only that feature against the published crate failed to compile; in-workspace builds hid it because another member always enabled a feature that pulled the foundation in."

[[fragments]]
id = "dead-gate-removal"
category = "Removed"
text = "The `check_warning_budget` gate script is gone: its baseline lived at a gitignored path with no file, so it exited before measuring anything, it counted cargo summary lines as warnings, and a trailing `|| true` reported zero warnings for a failed build. `strict.yml` already builds the workspace with all targets and all features under deny-warnings, so the enforced ceiling is zero. The `check_tier_b_rule_contracts` gate script is gone: it required a repository-root `rules/` tree that does not exist here, and its second rule scanned a directory that does not exist behind a suppressed error."

[[fragments]]
id = "docs-reference-absolute-paths"
category = "Fixed"
text = "The documentation reference rule read an absolute path in a code span as workspace-relative, so a document mentioning `/dev/null` was reported as claiming a missing `dev/null` in this repository. An absolute path outside the checkout is no longer treated as a claim this repository can satisfy; one inside the checkout is still checked. The feature matrix for `vyre-libs` also named nine scan modules by a path that resolved nowhere, and one of them, the regex compiler, has been a directory rather than a file since it was split."

[[fragments]]
id = "gate-checkout-provenance-runtime"
category = "Fixed"
text = "Every gate now resolves the checkout it reports on from the working directory at run time. Two checkouts of this repository that share one cargo target directory compute the same unit hash for a member, so cargo hands one checkout a binary compiled by another; a `VYRE_CHECKOUT_ROOT` declared in `.cargo/config.toml` and read with `env!` was supposed to make the value a fingerprint input and did not, because cargo does not export a `relative = true` config variable to the process it runs. The shared `xtask` binary baked a worktree's path and `dup-scan` therefore read that worktree's pins, reporting this tree's `xtask` at 473 duplicated lines against a pin of 465 while this tree's own file said 411. The variable is gone, the walk has one owner in `structure-gate`, and the contract asserts the property rather than the mechanism: the resolved root must contain the directory the run was invoked in."

[[fragments]]
id = "driver-target-dialect-owner"
category = "Changed"
text = "The target-compiler shell has one owner, `vyre-driver/src/target_dialect.rs`. Every backend had written the same shell: hold the payload format, validate the profile, walk the selected modules, infer the dispatch grid from the logical element count, copy the canonical bindings through, and name the dialect in two error strings. Twenty-nine of the SPIR-V backend's seventy-six target-compiler lines were duplicated against cuda, metal and wgpu. A backend now declares a `TargetDialect` with its payload identity, its device limits and its emitter, and the shell derives the grid size, the workgroup size and the resource bindings so no dialect can disagree about them. Operator-facing failure text is unchanged."

[[fragments]]
id = "driver-hostile-input-closure-owner"
category = "Changed"
text = "The hostile-input closure obligations every backend owes are stated once, in `vyre-driver/src/hostile_input_closure.rs`. Each backend crate had written the probe programs and the assertion text again against its own backend type, so the wording drifted per crate while the contract did not. A backend's adversarial target now supplies the backend and names itself. The reference backend keeps the hostile-bytes and trailing-input obligations it had; the SPIR-V backend keeps zero-workgroup and trailing-input, and reports rather than fails when no Vulkan device is present."

[[fragments]]
id = "dup-scan-measures-the-repository"
category = "Fixed"
text = "The duplication gate measures the repository rather than the working directory. It walked the tree with `walkdir` and counted every `.rs` file present, including files an ignore rule excludes, so a pin recorded on a workstation described that workstation while CI measured a smaller tree, which is the direction that lets a pin pass by accident. This tree carried twenty-two ignored `.rs` files under one rule alone. The file list now comes from `git ls-files --cached --others --exclude-standard`, which is what a commit would carry: tracked files plus new files no rule excludes, so a copy still counts before it is committed. Running the gate outside a git checkout now fails with that as the remedy instead of measuring whatever is on disk."

[[fragments]]
id = "backend-hostile-closure-targets-are-tracked"
category = "Added"
text = "The reference and SPIR-V backends carry a tracked hostile-input closure target, `vyre-driver-reference/tests/hostile_input_closure_contract.rs` and `vyre-driver-spirv/tests/hostile_input_closure_contract.rs`. Both backends previously held their adversarial case in a file name the repository ignores, so the assertion ran only where someone had generated it and no branch could review it. The obligations come from `vyre_driver::hostile_input_closure`, and the ignore rule that asked for a crate-owned name is now satisfied for these two crates."

[[fragments]]
id = "libs-operation-registry-features"
category = "Fixed"
text = "The `vyre-libs` operation-registry target declares the features its assertions need. It pins the numeric tolerance of thirteen registered compositions, eleven of which are only compiled under an `nn` or `math` feature, and it had no manifest entry, so `cargo test -p vyre-libs` built it with default features and it failed on a missing registration rather than on a wrong tolerance. It now requires `math`, `math-linalg`, and the four `nn` domains that own those ops."

[[fragments]]
id = "quantized-matvec-registered-output"
category = "Fixed"
text = "The registered witness programs for `vyre-primitives::math::quantized::i4x8_matvec_f32_scaled` and `i4x8_batched_matvec_f32_scaled` bound their output buffer to a slot named `vector_scale` and sized it for one f32, so every lane above the first wrote out of bounds on the declared fixture. The registry safety rules read that as an out-of-bounds access on valid input, an out-of-bounds access under grid over-fire, and a cross-lane write-write race, three failures for one wrong buffer. Both now name the output `out` and declare only the three input buffers, matching the other packed-INT4 registrations."

[[fragments]]
id = "primitives-sweep-matrix-owners"
category = "Changed"
text = "The generated bitset and reduce sweeps are two parameterized matrices instead of twenty-five near-identical per-operation files. `sweep_bitset_oracle_matrix` carries one case list and one assertion body per call shape and fails when a registered `vyre-primitives::bitset` operation is neither swept nor exempted to a named suite; `sweep_reduce_oracle_matrix` does the same for the reducers. Every operation now runs the union of the populations the separate files used, and the in-place, exclusive-scan, and `cpu_ref_into` paths are swept for the first time. The CRC and graph-motif oracle matrices no longer restate the implementation they check: they compare against published CRC-32/ISO-HDLC and FNV-1a check vectors, a table-free bit-at-a-time walk, the concatenation law, and an edge-mask dictionary. Program-shape queries and the CSR frontier-step driver each have one owner rather than a copy per suite."
