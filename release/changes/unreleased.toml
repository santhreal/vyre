id = "evidence-blockers-structural-gate-registry"
category = "Added"
text = "A source-inspecting test is informational only when `docs/testing/STRUCTURAL_GATES.toml` declares it by file and test name with a reason, and a row the tree no longer backs is itself a release blocker. Twelve gates assert a property with no run-time witness, such as which crate owns a symbol or that no second file spells a constant; they cannot be rewritten as behaviour tests, and blocking on them permanently would have been answered by deleting them. Keying on the pair means a reviewed declaration exempts the gate it names and not the next one added to the same file."

[[fragments]]
id = "evidence-blockers-tooling-out-of-heredocs"
category = "Changed"
text = "Seven release gate scripts run `scripts/lib/<name>.py` instead of piping a Python program into an interpreter through a heredoc. A heredoc hides a whole second language from review, lint, and syntax checking, and these were the last seven. `scripts/cli_docs.py` invokes the workspace wrapper through `scripts/lib/cargo_runner.py`, the Python twin of the shell runner that already owned that decision."

[[fragments]]
id = "evidence-blockers-docs-and-features-complete"
category = "Fixed"
text = "`docs-check` and `feature-matrix` pass. The generated testing guide for `vyre-registry-link` had no row in the documentation manifest, and `vyre-test-support` declared features with no explicit default policy. A tree contract now derives the workspace member list at run time and fails when a member has no classified testing guide row, or when a row names a crate the workspace no longer has."

[[fragments]]
id = "benchscaffold-one-owner-per-bench-case-declaration"
category = "Changed"
text = "Benchmark case declarations have one owner, `vyre_bench::cases::harness`. Each of the eight honest cases open-coded the same ten-method `BenchCase` block, and the copies had drifted: `search.binary.u32.1m` omitted the smoke suite from its private list and so ran in no smoke suite, and `regex.backtracking.adversarial` inherited a byte-accounting default that reported reading and writing nothing because its prepared payload was not a bare program. A case is now a static `WorkloadDescription` plus a `CaseOps` record of the operations a description cannot carry, and it reports which owner built it through `BenchCase::declaration_owner`. `vyre_bench::cases::harness::HONEST_SUITES` is the single honest suite list, replacing two verbatim copies and one per-case spelling. The two YARA-like condition workloads likewise share one owner each for the nine per-rule parameters, for the five-condition conjunction their device programs are scored against, and for the four IR predicate blocks, in `vyre_bench::cases::conditional`; both previously held a private copy of all three, so a predicate dropped from one copy of the host oracle would have read as a device correctness violation rather than a host bug. Callers still concatenate the IR blocks in their own order, so both programs keep their recorded fingerprints. A new gate walks the inventory registry at run time and fails when an honest case reports no declaration owner or an owner serving only itself."

[[fragments]]
id = "tooling-frontend-branch-accounting-gate"
category = "Added"
text = "`scripts/check_branch_accounting.py` derives the campaign's own branch and worktree state from git at run time and fails when it is inconsistent: a branch no owner branch holds and no worktree carries is work nobody is doing and nobody is merging, and a branch an owner already holds while a worktree keeps it alive is a source tree every scan walks for nothing. Owners are the integration branch and the subsystem tier, and a branch never accounts for itself. The derivation refuses to run against a repository with fewer than two local branches or no integration branch, because a check that silently derives nothing is the same defect as no check."

[[fragments]]
id = "tooling-frontend-two-more-structural-gates-declared"
category = "Changed"
text = "Two coverage gates that derive their member set from source are declared in `docs/testing/STRUCTURAL_GATES.toml`: the resident queue materializer variant scan and the published quantized entry-point scan. Each asserts the absence of a case or a row, which no execution of the covered code can witness."

[[fragments]]
id = "optpasses-memory-alias-one-owner"
category = "Fixed"
text = "The buffer-interference proof the memory passes need before they may rewrite across a gap has one owner, `vyre_foundation::optimizer::passes::memory::alias`. `dead_store_elim` and `store_to_load_forward` each carried a full node-by-node copy of it, both exhaustive and both tested, and they disagreed: a compare-exchange against another buffer, which is how a lock is taken, blocked the dead-store proof and did not block the forwarding proof, so a load across a lock acquire was replaced with the value stored before it. Both copies also inspected only the one buffer `Node::Trap` and `Node::IndirectDispatch` name, while both pass module docs promised the node blocks outright; a host effect handler and a launched grid may touch any buffer, and a grid-synchronizing collective is at least a fence. The owner answers all of that once, and what stays per-pass is the one bit that genuinely differs: whether a write to the buffer interferes or only a read. Node descent and buffer naming come from `vyre_foundation::transform::visit`, so a new IR variant fails to compile here rather than defaulting to harmless."

[[fragments]]
id = "optpasses-memory-alias-gate"
category = "Added"
text = "`memory_pass_alias_owner` reads the pass set from the inventory registry at run time, keeps every pass in the memory phase, and asserts none of them changes how many times a program reaches a buffer across a gap node the alias owner reports as interfering. Each probe carries a control with a harmless gap that at least one pass must rewrite, so a pass that simply had nothing to do cannot pass for one that consulted the owner. Registering a third memory pass with its own copy of the analysis turns the suite red on the day it is registered rather than on the day someone diffs two files."

[[fragments]]
id = "optpasses-idempotence-covers-the-registry"
category = "Changed"
text = "`vyre_foundation::optimizer`'s per-pass fixed-point contract is measured against every registered pass, discovered through `vyre_foundation::optimizer::registered_pass_registrations` and scheduled with the passes it declares a requirement on. The seven pass names it hardcoded were a fifth of the registry and could not go stale loudly: a pass registered afterwards was never held to the contract and nothing said so. The entry-point half is now a declared table, so `canonicalize_engine::run` and `optimize` are each held to the union of what the two suites separately asserted, three runs compared structurally and on the wire with reference-interpreter parity checked on every run."

