text = "`vyre_primitives::decode::ziftsieve` publishes `ZiftsieveBuffers` and `ZiftsieveExtents`, so the five buffer names and three extents an indexed literal-copy program binds are named at every construction site instead of being passed as an eight-long positional list through three entry points and a composition wrapper. Every one of the five names is a `&str`: transposing `seq_literal_len` with `seq_literal_offset` compiled, read as deliberate from either side, and copied each literal run to the length it should have had rather than to its output offset. `ZiftsieveBuffers::CANONICAL` publishes the binding set the registered fixture already used, matching `SinkhornBuffers::CANONICAL`. `vyre_libs::decode::ziftsieve::ziftsieve_gpu` takes the same records and its tests now assert what the composition adds rather than restating the primitive's decode semantics: three of its four tests were copies of the primitive's own cases, while nothing asserted the family-scoped buffer rewrite that is the module's reason to exist. `NOTE_ZIFTSIEVE_GPU_DESIGN` is gone; a public constant holding a source path is not an API."

