id = "tooling-frontend-checkout-root-stays-runtime"
category = "Fixed"
text = "The gate crates resolve the checkout they report on from the working directory at run time, through `structure_gate::workspace_root`, and no checkout-identifying variable is declared in the cargo config. A `VYRE_CHECKOUT_ROOT` with `relative = true`, read with `env!` so its value entered each crate's dep-info, was tried as the way to stop one checkout being handed a binary another compiled; cargo does not export such a variable to the process it runs, so every gate fell through to its compiled-in value and the shared binary reported a worktree's numbers as this tree's. The declaration is rejected rather than absent, and the comment saying so is the only thing that stops it coming back. `structure-gate/tests/checkout_provenance.rs` rejects both spellings, assembling each from parts at run time so the gate does not report itself and needs no exemption."

