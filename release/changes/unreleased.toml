id = "feature-isolation-gate"
category = "Added"
text = "`xtask feature-isolation` judges whether every declared feature compiles on its own. A crate that builds under its default features and under `--all-features` can still be uncompilable under one feature alone, because `--all-features` is a union that supplies whatever a feature forgot to require, and only the consumer who enables that feature sees the break. The gate derives the axis from the tracked manifests at run time and holds all 140 (member, feature) pairs, 35 members with one `--no-default-features` probe each plus 105 declared features, to the outcome recorded in `xtask/feature-isolation.toml`. A pair with no row, a row naming a pair no manifest declares, and a row whose outcome disagrees with the sweep are each a failure, so a new member or feature is red until a decision is recorded for it. The declaration half runs inside the gate sweep; the compile half is `--sweep` and CI owns it."

[[fragments]]
id = "vyre-libs-primitive-feature-ownership"
category = "Fixed"
text = "Enabling one `vyre-libs` composition feature no longer resolves the whole primitive substrate. `vyre-libs` used to enable 19 `vyre-primitives` domains unconditionally, so a consumer that wanted substring scanning also compiled the neural-network, parsing, topology, geometry and optimization domains, and no feature declared what it actually used. The unconditional set is now the three domains the ungated module trees need: `graph` for `vyre-libs/src/graph/ast_walk.rs`, `text` for `vyre-primitives/src/text/char_class.rs`, and `inventory-registry` so primitive registrations reach the catalog. Every other domain rides the feature that gates its consumer: `math` on the five `math-*` features and on `visual`, `nn` on the four `nn-*` features, `matching` on `matching-substring`/`matching-dfa`/`decode`, `nfa` on `matching-nfa`, `decode` on `decode`, `visual` on `visual`, `hash` on `hash` and `intern`, `bitset` on `logical`, `parsing` on `c-parser` and `python-parser`, `predicate` and `label` on `security`, `predicate` also on `c-parser`. `geom` and `opt` are dropped; no `vyre-libs` module uses them. `vyre-pass-engine` now takes `vyre-libs` with `default-features = false`, since it uses only `dispatch_buffers` and `graph`, so an optimizer-only consumer resolves seven primitive features instead of thirteen."

[[fragments]]
id = "op-matrix-coverage-has-one-owner"
category = "Changed"
text = "The release conformance facts derived from `docs/optimization/OP_MATRIX.toml` are derived once. `xtask::release::conformance_op_matrix::evaluate_op_matrix_coverage` owns the covered and missing required-op counts, the supported release-backend row count, and the six blockers that follow from them; the registered-op matrix in `xtask-registry` and the per-backend conformance artifacts in `xtask` each carried their own copy of that arithmetic and of five of the six blocker messages, differing only in which set of observed op ids they judge the matrix against. The two artifacts report the same field names, so a correction applied to one copy left the other reporting a different coverage number for the same matrix and a release could be signed on whichever artifact was read first. `release_backend_rows.rs` held half of that decision for both callers and is folded into the matrix module, so the count is no longer reachable without the judgement it feeds."

[[fragments]]
id = "evidence-commands-share-their-argument-and-artifact-plumbing"
category = "Changed"
text = "Every evidence-producing xtask subcommand parses `--output`, reports the written artifact and chooses its exit code through one owner in `xtask::output_arg`. Each command used to carry its own copy of the option loop, the usage-error exit, the parent-directory creation and the wrote-then-exit epilogue, so exit 2 for a usage error and exit 1 for a failing gate were a dozen separate decisions that CI reads as one contract. `parse_output_and_flag_arg` covers the commands that take a second valueless flag, `parsed_or_exit` maps a usage error to exit 2, `report_evidence_artifact` prints the path and exits 1 on a non-empty blocker list, and `write_json` now creates the parent directory itself rather than each caller doing it first. Help text, blocker text and exit codes are unchanged."

[[fragments]]
id = "delegated-binaries-share-one-main"
category = "Changed"
text = "`xtask::delegate::run_delegated_main` owns what a delegated binary's `main` does: answer `--help` from the callee's own dispatch table, reject a missing subcommand, then resolve the name. `xtask-registry` and `xtask-evidence` each wrote that out, including the exit code for an unimplemented subcommand, so the two entry points could disagree about a contract that `xtask` and CI read as one. Each `main` is now a single call naming the package and why `xtask` routes there, and the `dispatch` wrapper each crate exported for its own `main` alone is gone. Help text, error text and exit codes are unchanged."

[[fragments]]
id = "benchmark-report-summary-has-one-owner"
category = "Changed"
text = "The release gate reads a benchmark report's blocker array and failed-case summary in one place. `check_benchmark_report_summary` owns the summary-versus-case-evidence mismatch and the failed-case message; the three gates that open a benchmark report each carried that arithmetic and its four messages, differing only in whether the report is named by evidence suffix or by path, so a correction reached one report and not the next. The four `require_case_metric_*` requirements now share one walk over the cases array, which also makes explicit that only the present-metric requirement treats a missing cases array as its own failure and that the positive-metric requirement reads the recorded percentile rather than accepting a bare scalar. An unreachable second copy of the markdown-evidence check is deleted: it had no callers and had drifted to demand an evidence-sources list from every markdown file, while the live check demands it only under `evidence/docs/`."

[[fragments]]
id = "hygiene-pattern-names-have-one-owner"
category = "Changed"
text = "The hygiene scan's pattern names are declared where the scan emits them. `xtask::gates::hygiene_matrix` exports the hidden-fallback, resource-bound and cargo-wrapper pattern lists, and the release-evidence check that requires each family to have been covered now references them instead of restating nineteen names. Adding a pattern to the scan previously left the gate accepting evidence that never looked for it."

[[fragments]]
id = "reference-call-abi-has-one-owner"
category = "Changed"
text = "The `Expr::Call` ABI in `vyre-reference` has one owner, `vyre-reference/src/execution/call.rs`. Callee resolution and its per-call-site cache, the arity check, the declared byte width of an argument, the 64 MiB input budget, the CPU-reference lookup and the output decode were each written twice, once for the statement evaluator in `expr.rs` and once for the hashmap interpreter in `node_step.rs`, and the two copies had already drifted in how they sized the output buffer and spelled the output type match. Both arms now bind that one ABI and supply only their own argument evaluator, and `ResolvedCall` replaces the two identical resolved-callee structs. A copy missed while changing the ABI would have made one reference execution path encode a call differently from the other while both still reported success, so the oracle would disagree with itself depending on which entry point a test used. The width table gained a registry-derived gate: `signature_param_spellings_all_have_a_declared_width` walks every registered callable signature at run time and fails when a parameter spelling has no declared width, instead of letting it fall through to the one-byte default and truncate an oracle input."

[[fragments]]
id = "reference-async-transfer-has-one-owner"
category = "Changed"
text = "The async byte copy in `vyre-reference` has one owner, `vyre-reference/src/execution/async_transfer.rs`, and the copy itself goes through two new window methods on the reference buffer. Each of the two reference node executors carried its own transfer enum, its own offset-and-size-to-byte-count conversion, its own short-tail-zero-padding read and its own past-the-end-dropping write, and the two writes disagreed: the statement executor recovered a poisoned byte lock with `into_inner()` while the hashmap executor panicked. A poisoned lock means a writer panicked mid-store, so the recovering arm could copy half-mutated bytes into an output buffer and hand the conform gate a golden value no correct backend can reproduce. Both arms now read and write through `read_window` and `write_window` in `oob.rs`, which own that policy, and the fail-closed test covers both helpers instead of only the hashmap path."

[[fragments]]
id = "spec-data-type-generator-has-one-owner"
category = "Changed"
text = "The proptest `DataType` generator in `vyre-spec` has one owner, `vyre-spec/tests/spec_variants/mod.rs`. The layout sweep and the `OpSignature` byte-accounting sweep each carried their own generator and the two had already diverged: the signature copy omitted opaque, device-mesh, block-sparse and quantized types, so nothing checked that a signature carrying one of them survives serialization. Both sweeps now draw from the shared generator, which widens the signature sweep to the full type space."

