[[fragments]]
id = "runtime-no-host-execution-route"
category = "Removed"
text = "Routing has no host arm. `PolicyRoute::CpuSimd`, `RoutingDecision::CpuSimd`, `ExecutionPolicy::use_cpu_fast_path` and the two host fast-path thresholds that only fed it are gone, and `ExecutionPolicy::route` no longer takes a byte count the deleted predicate was its only reader of. Vyre executes compute on a device; the only host arithmetic in the workspace is `vyre-reference`, which is a parity oracle and not a route. No executor arm ever served the variant and the standard policy rewrote every suggestion to the persistent megakernel regardless, so what the declaration bought was a caller that believed a degradation path existed. The routing contract test asserted that one plan did not pick that route. A workspace gate now recognises a routing enum by its own variants, wherever it is declared, and fails on a variant naming host execution or a route with no recorded executor, so a route added back under a fresh enum name fails on arrival."

[[fragments]]
id = "fp-parity-output-slot-owner"
category = "Added"
text = "`vyre_foundation::fp_parity::max_output_ulp` reports the largest ULP distance over a program's declared F32 output slots. Output-slot alignment is one internal walk shared with the tolerance comparison. The conform ULP audit carried its own copy of that walk: it decided per slot from `program.buffers()` while reading `output_buffer_indices` for the mapping, so a program whose outputs were not declared in slot order was audited against the wrong element type, and a saturated distance read as a measurement rather than as an incomparable pair. The gate and the audit now read the slots through one owner, and the one place they legitimately differ is documented on the function: an audit treats two NaNs as agreeing because a backend chooses its own payload, and the gate does not."

[[fragments]]
id = "decode-scan-fuse-adapter-budget"
category = "Changed"
text = "The decode-scan fusion pass takes its workgroup promotion budget from the caller's capability record instead of a fixed constant. `run`, `count_opportunities` and `candidate_handoffs` take an `AdapterCaps`, and `DecodeScanFuse::transform_for_adapter` promotes against a named target while `DecodeScanFuse::transform` keeps the conservative profile, so the default path is byte-identical. Previously every target was capped at the lowest reported shared-memory figure, which refused a handoff a reported budget allows."

[[fragments]]
id = "binop-parity-table-coverage-gate"
category = "Added"
text = "`vyre_test_support::binop_parity::assert_covers_every_synthetic_op` and `assert_covers_every_total_op` fail when a backend parity suite has no reference arm for an op the shared table declares, or names one the table does not. Before them each suite carried one hand-written test per op, so a row added to the table was dispatched by neither backend and nothing failed. The op set is read from the table at run time, so a row added tomorrow is required of every suite tomorrow."

