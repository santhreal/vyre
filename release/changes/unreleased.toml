[[fragments]]
id = "validator-program-rules-stated-once"
category = "Fixed"
text = "The program-header validation rules are stated once, in `validate_program_level`. The differential property test that compares the single-walk validator against the multi-walk one it replaced carried a verbatim copy of them: the region-wrapper rule, the workgroup-dimension rule, the duplicate-name, duplicate-binding and empty-workgroup-buffer rules, the output-buffer contract, the output markers, and the buffer lookup a walk needs. Those are not what the property compares, so a diagnostic corrected in production and not in the copy would have failed the property for a reason that has nothing to do with the walk, and the two copies had already drifted on the V105 suggestion text. The second arm still walks the node tree independently through `nodes::validate_nodes`, which is the only thing the property is for; mutating the production walk to skip the last statement of a body turns it red."

[[fragments]]
id = "test-only-opaque-payloads-declared-once"
category = "Changed"
text = "A test-only IR extension payload is declared through `vyre_test_support::test_expr_extension!` or `test_node_extension!` instead of six hand-written trait methods. Five of the six are the same in every test that needs an inert opaque leaf: report success from validation, hand back `self` for downcasting, and answer the identity questions from a literal. Only the kind string, the debug identity, the result type, the CSE answer and the fingerprint byte differ, so those are the arguments. A test that needs reachable structure, a wire body, or a validation failure still writes the impl out, because those are the cases where the boilerplate is the contract."

[[fragments]]
id = "naga-carrier-scope-has-one-owner"
category = "Changed"
text = "The WGSL emitter runs one carrier-scope protocol. A value produced inside a structured child body and read after it has to round-trip through a function-scope local, or naga's writer emits `let _eN = ...;` inside the closed child block and the reader after it fails validation with `no definition in scope for identifier _eN`. That protocol, snapshot the carrier state, find the op's position by identity, collect the ids that escape, seed each carrier local from the parent's pre-op value, emit the child, reload every carrier in the parent block, restore the parent state, was written three times: once in `emit_structured_block`, once in `emit_structured_if`, once in `emit_structured_for_loop`. The store-then-reload publish inside `bind_result` was written twice more, once per local pool, and `value_handle_for_id` spelled load-and-coerce four times. `emitter::carrier_scope` now owns it: `with_carrier_scope` for the block and if forms, `register_carrier_targets` plus `store_carrier_seeds` plus `publish_carriers` for the loop, which splits the seed across the index setup, and `publish_through_local` for both pools of `bind_result`. The two pools are one `LocalPool` value decided once per bind, so the publish, the trace name and the traced local type cannot disagree. A copy missed by a fix to any of these would not fail to build: it would emit a shader that passes vyre's own descriptor checks and is then rejected by wgpu at pipeline creation for one structured form only, or worse pass validation and read a stale carrier, which is how an accumulator seeded from a reused descriptor id summed from the wrong constant. The seed store keeps its two genuinely different meanings as an explicit `CarrierSeed`: a loop seeds verbatim because the index type already decided the carrier's type, while a block or if arm coerces to the local's type first. `collect_op_referenced_ids` reads a table of operand roles per structured op instead of four hand-written arms, so a new structured op is a row rather than a fifth arm to forget. Emitted text is unchanged: the pinned WGSL corpus, the determinism check and the carrier-scope regression suite all pass without a repin."

[[fragments]]
id = "naga-scalar-kind-mapping-has-one-owner-per-direction"
category = "Changed"
text = "The WGSL emitter maps between a canonical naga type handle and a scalar kind through one function per direction. `BodyBuilder::scalar_kind_of_type`, previously named `binding_types_lookup` for a lookup it does not perform, is the only reader of the seven canonical handles, and `coerce_value_to_type` had its own byte-identical copy of that if-chain deciding what to coerce toward; `canonical_type_for_scalar_kind` is the only writer, and the carrier-local allocator and the binary-operand unifier each had their own copy of it. `yields_bool` names the six comparisons and two logical connectives once, where `scalar_kind_of_expression` and `is_bool_expression_inner` each listed them. A naga release adding a comparison operator, or vyre admitting another scalar width, previously had to be tracked into two places per direction, and the failure of a missed copy is not a build error: a comparison whose result reads back as its operand kind is stored into a numeric local and rejected at pipeline creation as `InvalidStoreTypes`, or coerced with a `select` that silently reinterprets the value. `unify_binary_operand_types` also stopped rebuilding `Expression::Binary` at each of eight exits; it computes the operand pair and constructs the expression once, and its two operator sets are named for the rule they encode, that naga requires matching operand kinds and that the arithmetic and shift operators additionally reject a bool. The three `Expression::As` arms that differed only in target kind are one arm binding the kind. Emitted WGSL is unchanged and the pinned corpus passes without a repin."

