id = "wgpu-binding-and-readback-decisions-stated-once"
category = "Changed"
text = "Four binding and readback decisions in `vyre-driver-wgpu` are stated once. `pipeline::binding::declared_byte_size` owns the element-count-times-element-size product with its overflow refusal, previously written out in handle validation, in persistent padded sizing, and on the input path of record-and-readback; `pipeline::binding::accepts_params_handle` owns the params-slot predicate that pre-recorded and persistent dispatch each spelled out. `TimestampRecorder::pass_writes` and `TimestampRecorder::finish_and_resolve` own the timestamp write pair and the query resolve, which three and two callers respectively had inlined. Borrowed dispatch into caller buffers now runs the same `readback_persistent_outputs` pass as the owned path rather than a second copy of the output loop, so a change to output trimming cannot reach one entry point and miss the other, which would have returned differently trimmed bytes for the same program depending on whether the caller supplied the output buffers. Emitted shader text, binding order, and readback ranges are unchanged."

