id = "region-scopes-its-body-in-both-validator-walks"
category = "Fixed"
text = "Both validator walks agree that `Node::Region` scopes its body. The legacy multi-walk arm recorded no scope log for a region body, so a `let` inside a region was never undone and stayed live past the region, past an enclosing `If` branch, and on through the rest of the program, which let it shadow or collide with a later binding of the same name without a diagnostic. The pass that flattens a small region into its parent sequence re-wraps it in a `Node::Block` on a name collision, and that is sound only while a region body's bindings die at the region boundary."

[[fragments]]
id = "ir-shape-corpus-reaches-every-node-variant"
category = "Changed"
text = "The IR-shape proptest corpus generates all twenty `Node` variants, up from eight. Async transfers and waits, traps and resumes, the four collectives, indirect dispatch, regions and opaque extensions were never produced, so every property that walks the corpus was only ever compared on stores, lets, assigns, ifs, loops, blocks, barriers and returns. A gate enumerates the variant names the IR registry declares at run time and fails until each is either generated or recorded with a reason, so a variant added later cannot silently escape the corpus. Case counts on the two cross-walk properties are raised to match the wider shape space."

[[fragments]]
id = "u32-i32-wrapping-add-sub-in-the-reference-interpreter"
category = "Fixed"
text = "The reference interpreter evaluates `BinOp::WrappingAdd` and `BinOp::WrappingSub` on `u32` and `i32` operands. Both are aliases of `Add` and `Sub`, which the interpreter already evaluates with wrapping arithmetic and which the constant folder and every emitter lower identically, but only the `u64` branch listed them; a graph that named either on a 32-bit width was refused with `unsupported u32 binary operation` instead of evaluated. Four generated per-width sweeps covered the same operation table and none of them swept the pair, so the gap was invisible to all four."

[[fragments]]
id = "scalar-storage-graph-sweep-has-one-owner"
category = "Changed"
text = "One table drives the scalar storage-graph sweep and one table drives the dual scalar evaluator sweep, replacing four per-width harnesses that restated the corpus construction, the strided draw, the case loop and the diagnostic assertions once per width. Each row declares its literal, its corpus, its draw, its case counts and its expectations, and the operation set it exercises is derived from those expectations rather than listed a second time. The collapse raised coverage the copies had let drift: `f32` sweeps 4096 binary and 8192 unary cases rather than 2048 and 4096, `i32` samples 8192 unary cases rather than one pass over its corpus, and `i32` gained the saturating subtraction and multiplication cases the interpreter defines."

[[fragments]]
id = "scalar-sweep-closure-gate"
category = "Added"
text = "The scalar sweep is closed against the frozen public surface: every `NodeStorage` literal variant in the `vyre-foundation` snapshot must have a matrix row, a row naming a variant the surface does not carry fails, each row must sweep the full sampled depth or carry the reason it does not, each row must keep the operation count it declares today, and every operation a row leaves undeclared must still be refused by name. The dual sweep is closed the same way against the `vyre-reference` snapshot: every marker implementing `ReferenceEvaluator` is either exercised against its u32 contract or recorded with the payload shape it takes instead, and a marker that is both, or that the frozen surface no longer carries, fails. Adding a scalar literal, adding an evaluator, or widening the interpreter's operation table turns the suite red until a row records the decision."

[[fragments]]
id = "wire-fuzz-corpus-is-tracked-and-replayed"
category = "Fixed"
text = "The `program_wire` fuzz corpus is checked in, and every seed in it is replayed against the fuzz target's own three invariants on an ordinary test run. The corpus directory was covered by the `cargo fuzz init` default ignore rule while a gate asserted that its regression seeds were checked in, so that gate passed on the machine that had once run the fuzzer and failed on every fresh checkout. It also proved less than it read: the entry-count floor it enforced was met by fifty-nine near-copies of one seed, and one entry was byte-identical to another, which spends fuzzer budget re-deciding an input it has already decided. The replacement decodes every entry, requires each rejection to carry a `Fix:` hint, requires each decode to survive a `to_wire` round-trip under `structural_eq`, and requires each named valid-program seed to still decode, so a wire-format change that strands an old seed is red without libFuzzer and without a nightly run."

[[fragments]]
id = "structural-graph-kernels-have-one-caller-facing-name"
category = "Changed"
text = "The structural graph, causal and logic kernels are reached at `vyre_primitives::graph`, not through a second set of names in `vyre-libs`. `graph::dispatch::structural_kernel_pipeline` held sixty-six wrappers across a `dispatch` module and a `references` module, one per primitive builder and one per CPU oracle, each restating the primitive's parameter list verbatim and calling it with those parameters in that order. Nothing outside the module's own tests called one, so the layer bought a second signature to keep in step with the first and no behaviour, and a parameter added on one side was a compile error at sixty-six call sites or a silent divergence. What survives is the module's test, which pins the primitive contracts the graph dispatch layer relies on. Two ceilings on the Newton-Schulz IR shape now come from `vyre_foundation::transform::visit::walk_exprs` instead of a hand-rolled counter over `#[non_exhaustive]` enums whose catch-all arm read an unlisted variant as a leaf, so a tree that grew through a new variant counted as small."

[[fragments]]
id = "library-operation-entry-region-provenance"
category = "Fixed"
text = "`vyre-libs::security::aliases_dataflow` and `vyre-libs::security::taint_kill` name themselves on the region they hand out. The first returned a fused program straight from `fuse_programs`, so its entry region was `vyre.program.root` and the operation had no composition identity at all; the second reparented its children to its own id but never wrapped them, so its entry region was `vyre-primitives::bitset::and_not` and the operation was indistinguishable from the primitive it composes. Its macro-generated siblings all call `tag_program`, which also carries the self-exclusive region marking the hand-written copy dropped. `library_operation_provenance` reads the linked operation registry at run time and fails naming any library operation whose entry region is not a region generated by its own id, so a builder that forgets the tag cannot ship uncovered."

[[fragments]]
id = "libs-primitives-duplication-pins-lowered-to-measured"
category = "Changed"
text = "Two duplication pins record what the tree measures: `vyre-libs` 11425 to 10453 duplicated lines and `vyre-primitives` 6981 to 6384, each with `total_lines` measured. Collapsing one side of a copy lowers both crates' counts, and a pin with room under it hides the next copy."

[[fragments]]
id = "dispatch-grid-owner-reachable-from-every-domain"
category = "Fixed"
text = "The lane-count-to-dispatch-grid ceiling division has one owner, `vyre_primitives::dispatch_grid::lane_grid`, ungated at the crate root and re-exported from `vyre_primitives::graph` so every existing call path resolves unchanged. It previously lived inside the `graph` domain, where a domain that does not enable `graph` cannot see it: `decode` does not, and `vyre_primitives::decode::rle_segment_lengths` therefore split its lane count into whole blocks plus a tail block and floored the sum, its own fourth spelling of the same arithmetic. An owner a caller cannot reach is not an owner, and the caller that cannot reach it writes the copy. Routed onto the owner with it: `vyre_primitives::graph::union_find`, `vyre_primitives::graph::persistent_bfs::layout`, `vyre_primitives::math::scallop_join`, `vyre_primitives::math::scallop_join_wide`, `vyre_primitives::math::bigint_add_carry` and `vyre_primitives::math::scallop_persistent`, which carried a private ceiling helper of its own. The persistent-BFS copy spelled it `((count - 1) / width) + 1`, which underflows at zero and was safe only because its one caller guarded zero separately."

[[fragments]]
id = "bellman-binding-names-spelled-once"
category = "Fixed"
text = "`vyre_primitives::math::bellman_shortest_path::BellmanBuffers` publishes `CANONICAL` and `TERSE` binding-name sets, matching the `SinkhornBuffers::CANONICAL` it already had. Four sites spelled the same six names, one of them in another crate, while the record documented itself as the only place they were spelled. Every field is a `&str`, so a full re-spelling is a positional list wearing field names: a transposed `src`/`dst` or `dist`/`next_dist` compiles, looks deliberate from either copy, and silently relabels which buffer the relaxation reads. The two sets stay disjoint so an assertion that reads a name back out of a program cannot pass by matching the other set."

[[fragments]]
id = "persistent-fixpoint-routing-asserted-once"
category = "Fixed"
text = "The persistent-fixpoint routing contract is asserted in one place, `vyre_primitives::fixpoint::routing_contract`, over a description of what an op builds on either side of one workgroup width. Each routed convergence op previously carried its own copy of the same four obligations, and the copies had drifted in what they accepted: both pinned the grid fence count to a literal 8 without stating that the count is two fences per wave, so neither would have caught a build whose wave count changed. The contract now checks all four at four iteration budgets, and both ops register every way their dispatch outgrows one workgroup rather than only the widest state buffer: `vyre_primitives::math::bellman_shortest_path` registers node-widened and edge-widened spans, and `vyre_primitives::math::sinkhorn_iterate` registers scaling-widened and kernel-widened spans. The span is the widest declared buffer once a program carries atomics, so four nodes with 257 edges, and a 17-by-17 kernel over two 17-element scaling vectors, both cross the threshold while the ping-pong state still fits one workgroup."

[[fragments]]
id = "numerical-pipeline-names-the-sinkhorn-primitive"
category = "Changed"
text = "`vyre_libs::solvers::numerical_kernel_pipeline` re-exports the Sinkhorn entry points of `vyre_primitives::math::sinkhorn_iterate` instead of wrapping them. Seven wrappers forwarded every argument and added nothing, so their whole body was a restatement of the primitive's parameter list, up to twelve positional arguments, free to drift from the list it forwards to and unprovable from either side. A composition names the primitive it composes. The public names are unchanged."

[[fragments]]
id = "shared-owner-closure-gates"
category = "Added"
text = "`vyre-primitives` gates three duplication classes it has reintroduced after previous cleanups, each deriving its member set from source at run time so a new member is red on its first run rather than absent from a hand-maintained roster. No dispatch-grid function may compute its own ceiling division, and every domain declaring one must be able to reach the owner, which is checked against the feature closure parsed from the manifest. No binding record may have its full name set spelled twice anywhere in the workspace, and a new record must publish canonical names. Every op routing a convergence loop through `routed_persistent_fixpoint` must register with the one routing contract, and none may observe the routing obligations privately. Each gate asserts its own member count first, because a structural signature that stops matching the tree otherwise turns into a test that passes by finding nothing."

[[fragments]]
id = "evidence-dispatch-runs-the-dispatcher"
category = "Fixed"
text = "`release-evidence` runs its thirteen child subcommands through `xtask::delegate::dispatcher`, the one owner of which binary runs a subcommand. It resolved that child from the running executable, which was correct only while it lived in `xtask`; after it moved to `xtask-evidence` it re-entered itself, met that crate's six-entry table, and exited 1 with `is not implemented in xtask-evidence` for twelve of the thirteen. Only `backend-matrix` worked, because `xtask-evidence` happens to own it. Each failure was still labelled `xtask <name>`, so one wrong process read as twelve gates failing and the release evidence surface reported sixteen blockers where seven exist. The same resolution in `xtask::gates::sweep` and `xtask::release::release_gate` was three copies of the same eight lines of failure handling and is now one call."

[[fragments]]
id = "bounded-ranges-prefilter-width-is-data"
category = "Changed"
text = "The bounded-ranges candidate gate is a width value rather than a shape per width. `PrefilterWidth` records how many mask buffers a gate binds, which region generator the assembled program carries, which dispatch shape an error names and which fallible entrypoint a fail-closed panic points at; `PrefilterGate` holds the mask names as a prefix of `[end byte, bigram, trigram bloom]` and is only constructible through a per-width constructor, so an unbound slot cannot reach a buffer declaration. One assembler emits every match-emitting shape at every width, and the ungated scan is width zero of the same table instead of a fourth builder. Each width previously restated the six-buffer input ABI, the replay call and the build quintet, so the binding of the match sink was computed in three places from three copies of the mask count: a width added or a mask resized in one copy left the sink bound over a mask, which writes match triples into a read-only table and loses recall silently rather than failing."

[[fragments]]
id = "prefilter-width-closure-gate"
category = "Added"
text = "`scan_prefilter_width_closure` reads the `PrefilterWidth` variants out of the width table's own source at run time and fails when a width has no recorded dispatch ABI, when a recorded row names a width the source no longer declares, when a shipped program's bindings disagree with the row's counter, mask and sink layout, when a declared mask is never read by the emitted body, and when the widths stop forming a mask prefix chain. An empty or unparsable member set panics rather than passing, because an empty set makes every closure assertion vacuous."

