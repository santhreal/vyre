[[fragments]]
id = "enforcement-states-its-own-rule"
category = "Changed"
text = "Five enforcement sites state the contract they enforce instead of citing a document. `structure-gate` names the composition rule at `CATEGORY_A_CRATE` and the one-owner rule at `substrate_home_failures`; `gate1` states its complexity budget and records that the two-caller promotion rule of the deleted composition-policy document is void; the CLI surface contract names the generated README block it counts; and the tree-contract link unit states why two suites stay separate targets. A rule that lives only in a document stops being enforced the day the document is deleted, and four of these cited documents that already were."

[[fragments]]
id = "pipeline-compiles-for-a-named-adapter"
category = "Fixed"
text = "The optimizer compiles for the adapter it was given. `Autotune` and `DecodeScanFuse` both read device facts, and both hardcoded `AdapterCaps::conservative()` in their `ProgramPass::transform`, so every program that went through the standard pipeline was tuned for a device with no optional features whatever the real adapter reported; the caps-aware `transform_for_adapter` existed the whole time and only a caller who already knew to ask could reach it. Nothing failed, which is why it lasted: the pipeline produced a valid program and a slower one. `ProgramPass` now declares `transform_for_adapter`, whose default discards the adapter because an IR-only rewrite is the same program on every device, and `#[vyre_pass(adapter_dependent = true)]` is how a pass says its output moves with the device. `PassScheduler` carries the adapter it was built for, `PassScheduler::for_adapter` and `optimize_for_adapter` are the entries a backend uses once it has probed one, and a scheduler built without an adapter states the conservative fallback at the place that chose it instead of leaving it to whichever pass reached for a profile first."

[[fragments]]
id = "shift-fusion-one-owner"
category = "Fixed"
text = "Chained shift fusion has one owner and one answer. Constant folding and strength reduction each carried the rule, and they disagreed: folding declined a pair whose counts reach the word width and left the double shift for the backend, reduction folded it to zero. Both were also wrong about a count above 31, which the target text masks with `& 31`, so `(x << 40) << 1` shifts by nine and not off the end. `algebra::shift_fusion::reduce_shift` masks each count, folds to zero once the sum reaches the width, and fuses otherwise, checked against an evaluation of the chain it replaces for every count pair up to 40."

