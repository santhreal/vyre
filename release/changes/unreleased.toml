category = "Fixed"
text = "Every per-node validation rule lives in `vyre-foundation/src/validate/node_rules.rs`, which both the production single-pass validator and the legacy multi-walk arm call. The two walks each carried their own copy of the rule bodies, so a correction to one was not a correction to the other: the empty async stream tag reported as `V117` from an `AsyncLoad` or `AsyncStore` and as `V128` from an `AsyncWait`, giving one condition two stable rule identities, and the `V121` store-type message was missing a closing backtick on one side. The rule is now `V128` for all three async node kinds, `V117` is retired from the registry and the code catalog, and the walks differ only in how they traverse the node tree. An `AsyncLoad`, `AsyncStore` or `Trap` also validates its own operand expressions, which went unchecked in both walks, so a load from an undeclared buffer inside a transfer size or a trap address was accepted while the same load in a store index was rejected."

