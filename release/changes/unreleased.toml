id = "node-rewrite-walk-single-owner"
category = "Changed"
text = "The borrow-preserving structural `Node` rewrite has one owner, `vyre_foundation::transform::rewrite_walk`. Eight sites carried their own `match node { .. }` that rebuilt every variant: induction-variable substitution, fusion alpha-renaming, cache-key canonicalization, const-buffer folding, and four walks in the pass engine (encoded-order rewrite, cross-scope CSE occurrence collection and substitution, and same-scope let dedupe). They differed only in what they decided at each position, never in which positions exist, so a variant added to the IR had to be answered eight times and a fix to the descent order reached one pass. `rewrite_node` offers every rewritable position to a `NodeRewrite` policy in the order the program is written, identifiers and operands first and then child bodies, which is the order the pass engine's expression arena numbers expressions in, so a pass consuming a per-expression GPU verdict stays aligned with the encoder. The match is exhaustive with no catch-all: a new `Node` variant fails to compile until the author says which of its positions a rewrite owes a visit. Every hook answers `None` for unchanged, so an unchanged subtree is returned as the same allocation rather than an equal copy, and `Program::canonicalized` keeps that property on an already-canonical body."

[[fragments]]
id = "asymmetric-node-walks-reached-every-operand"
category = "Fixed"
text = "Two rewrites that enumerated `Node` themselves reached fewer operands than the analysis that fed them. Cross-scope CSE recorded occurrences inside the offset and size of an asynchronous copy and the address of a trap, but its substitution pass fell through to a clone for those variants, so it hoisted a `let` binding whose only reader was never rewritten to use it: a program with a repeated asynchronous-copy offset gained a dead binding and kept the duplicate expression. Const-buffer folding never descended into `Node::Region` at all, cloning the body instead, and since a wrapped `Program` always carries a root region the pass folded nothing on one; its own tests passed only because each flattened the region first. It also cloned asynchronous-copy offsets and sizes and trap addresses unfolded. Both now drive the shared rewrite walk, so the positions an analysis inspects and the positions a rewrite visits are the same list."

[[fragments]]
id = "arena-indexed-cse-walks-share-one-cursor"
category = "Changed"
text = "The two CSE passes in `vyre-pass-engine` that walk IR while counting expression-arena positions share one cursor, `optimizer::arena_cursor`. Each had its own copy of advancing an index per node, remembering a position to rewind to, and skipping a nested body's worth of ids, and the nesting each skipped was written out variant by variant, so a new statement-carrying variant would have misaligned an arena verdict against the node it was computed for without any error. `ArenaCursor` takes its nesting from `transform::visit::child_bodies` and stays in the pass engine, because the numbering is the encoder's and not the IR's. The hoisting decision and the same-scope let-dedupe decision stay separate: they are different decisions over the same walk."

[[fragments]]
id = "arena-pass-test-dispatcher-single-owner"
category = "Changed"
text = "The four `*_via_encoded` passes prove their decode against one test dispatcher, `optimizer::arena_kernel::FixedOutputDispatcher`, which takes the pass name, the input count it must be bound with, and the grid it must be asked for. Each pass had its own copy, and they had already drifted on the assertion that matters: three assert a single workgroup, which is their real contract, while const-fold dispatches `ceil(expr_count / WORKGROUP_X)` workgroups and its copy asserted a literal one-workgroup grid, correct only for the one-expression fixture every test used. The grid is now a stated expectation rather than a copied literal, so a pass whose dispatch shape changes has one place to say so."

[[fragments]]
id = "grid-sync-split-routes-share-one-invariant-and-one-fixture-set"
category = "Changed"
text = "The three non-native grid-sync dispatch routes in `vyre-driver` ask one owner whether a split produced segments. `reject_empty_grid_sync_split` in `grid_sync` states the invariant once; the resident timed route, the resident fixpoint route, and the host split route each carried the same eight-line guard with the same error text, so a route added or reworded without it would dispatch nothing, leave the caller's output buffers untouched, and return success. The split tests likewise share their fixtures: `grid_sync_chain` builds the returning-region-per-segment program eleven call sites wrote out by hand, `barrier_chain` covers the two that vary the barrier ordering or the workgroup size, `cross_segment_store_program` states the cross-segment accumulator regression once instead of four times, and `apply_out_stores` is the single reading of a segment body the stand-in device backends interpret. Two copies of that walk existed, so a nested node form one of them forgot would hide a dropped store behind a passing test. Dispatch behavior, segment counts and error strings are unchanged."

[[fragments]]
id = "resident-sequence-fallback-has-one-owner"
category = "Changed"
text = "The unfused resident-sequence fallback in `vyre-driver` has one owner, `backend::resident_sequence`. Two decisions were written five times between the `VyreBackend` defaults and the grid-sync split decorator: the launch configuration a sequence step gets, which is that step's grid override and nothing else from the caller's config, and the conversion of a readback range list into the one `download_resident_ranges_into` call that ends the sequence. `dispatch_resident_steps`, `resident_step_config` and `read_resident_ranges_into` now hold them, so the plain sequence default, the timed default, the repeated default and both decorator overrides read the same sequence. A copy that drifted would have launched a step with the wrong grid or read back a different set of ranges than the sequence it belongs to, on the backends that do not fuse the sequence and therefore have no other check on it. Dispatch order, launch counts and readback ranges are unchanged."

[[fragments]]
id = "planner-storage-reserve-adapter-declared-once"
category = "Changed"
text = "The six planners in `vyre-driver` that reserve their scratch before they decide anything declare their storage-reservation failure adapter with one line. `reservation_policy::storage_reserve_failure_adapter!` owns the conversion, which carries the field being reserved, the entry count requested, and what the allocator said; result compaction, device diagnostic aggregation, benchmark pass selection, the megakernel barrier planner, the megakernel frontier memory planner, and multi-query execution each wrote that function out identically. A seventh fact added to the shared reservation layer had to be threaded through six copies, and a planner missed in that pass would have reported a reservation failure with less context than the layer had already produced. Each planner's rendered message stays its own, because it names the planner and the sharding that fixes it. Error variants, message text and reservation behavior are unchanged."

