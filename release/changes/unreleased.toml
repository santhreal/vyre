id = "backends-batched-readback-rows"
category = "Changed"
text = "Batched dispatch readback has one owner and one allocation for its rows. `vyre_driver::BatchOutputs` stores every dispatch's output row end to end in a single buffer and hands rows out borrowed, replacing the `Vec<Vec<Vec<u8>>>` returned by `vyre_driver_wgpu::pipeline::compound` and `vyre_driver_wgpu::engine::graph`. The middle level of that type held exactly one output slot at every call site, so an n-dispatch batch allocated 2n+1 vectors to carry n byte rows and copied each row out of the mapped staging range into a vector of its own. `vyre_driver::program_walks::enforce_output_budget` now owns the `DispatchConfig::max_output_bytes` policy that a second wgpu-local implementation had restated with its own wording, and `vyre_driver_wgpu::pipeline::WgpuPipeline::dispatch_coalesced_borrowed` absorbed the private function whose arguments it forwarded unchanged. A new `xtask` tree contract, `nested_byte_row_types`, parses every crate that implements the backend trait and fails on any three-deep byte-row vector; scope comes from the root manifest and a parsed trait scan at run time, so a backend crate added later is covered the day it lands. The existing ratchet counted the legitimate two-level per-slot output in one crate only, which left a three-deep copy in any other crate unobserved."

[[fragments]]
id = "backends-one-narrowing-cast-matrix"
category = "Changed"
text = "`vyre_test_support::cast_parity::NARROWING_CASES` holds the four `u32` narrowing casts as data, and each backend arm keeps only its dispatch and walks the matrix, so a case added there is dispatched by both without editing either arm. `NarrowingCase::assert_target_words` checks the pin before comparing a target's words, so a drifted oracle is reported as a drifted oracle rather than as a device divergence. The wgpu arm also stops open-coding the elementwise program, the little-endian packing and the readback decode that `vyre_driver::parity_harness` owns and the CUDA arm already used. `the_matrix_covers_every_narrowing_target_the_cast_table_admits` reads the integer-like scalar predicate out of `vyre_foundation::validate::cast` at run time and requires a case for every admitted integer under 32 bits, so admitting a narrower integer there is red until both arms dispatch it; enumerating the `DataType` enum instead would demand a case for the sub-byte quantization storage families that predicate deliberately excludes."

[[fragments]]
id = "exprtype-one-owner-for-expression-type-inference"
category = "Fixed"
text = "Expression type inference has one owner, `vyre_foundation::validate::typecheck::expr_type`, and the environment its consumers supplied differently is the `vyre_foundation::validate::typecheck::TypeEnv` trait: a scalar lookup, a buffer element lookup, and a hook that observes the type of every subexpression a walk resolves. `vyre_foundation::optimizer::fact_cache::type_facts` and the reverse-mode forward pass in `vyre_foundation::transform::autodiff::grad` each carried a second `Expr` walker, and the three answers had drifted. `Expr::BufferRef` was a word in both copies where validation reports nothing on purpose, so a buffer name could pass an operand typecheck it must never pass; the validator's answer wins. Arithmetic in the fact cache was the left operand's type falling back to the right, so a mixed-width expression took the left operand's width; it now unifies, and an unknown or mismatched pair answers `u32`, which is what validation already assumes of the same expression, so an optimizer fact cannot contradict a validation decision. `BitAnd`, `BitOr`, `BitXor`, `AbsDiff`, `WrappingAdd`, `WrappingSub`, `MulHigh` and `Shuffle` were typed from their operands in the fact cache and are integer-typed by the owner; logical `And` and `Or` and the comparisons stay `bool`, as all three copies already had them. Autodiff typed `Expr::SubgroupShuffle` and `Expr::SubgroupReduce` as words, so the adjoint of an f32 moved between lanes was refused as a non-differentiable cast; both now report their value operand's type. Autodiff also inherits the iterative walk, so a deep forward expression can no longer overflow the stack while its locals are typed. The deliberate i32 `AbsDiff` rejection and the unknown result type of `Expr::Call` are unchanged. A contract reads the `Expr` enum's own source at run time and fails when a variant has no recorded answer, or when a second file in the crate defines an `expr_type` walker."

[[fragments]]
id = "exprtype-constant-division-recognition"
category = "Changed"
text = """
`vyre_foundation::optimizer::passes::algebraic::strength_reduce` recognizes four
constant-divisor shapes before it lowers them. A divisibility test `x % d == 0`
becomes Lemire's `rotate_right(x * inverse(odd(d)), trailing_zeros(d)) <= limit`,
which reads the operand once and emits two operations where lowering the
remainder emitted five. A common factor between a dividend's multiplier and the
divisor cancels, a constant division chain fuses into one division, and a nested
modulus narrows, each guarded by a range proof from a new provable-upper-bound
analysis so a rewrite that would only hold without 32-bit wrapping is declined.
Chained shift fusion no longer folds an over-width total to zero, which was a
miscompile for a signed right shift, where the sign bit replicates instead.
Rewrites that re-evaluate their operand now clear one duplication budget owned
by `strength_reduce`, so a remainder of a buffer load no longer emits three
loads of the same address.
"""

