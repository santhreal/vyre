[[fragments]]
id = "loop-fusion-pair-after-refusal"
category = "Fixed"
text = "Loop fusion no longer skips a fusable pair after a refusal. When two adjacent loops could not be fused, the walk advanced its cursor by two instead of one, so the pair formed by the second loop and its successor was never considered; a comment claimed the scheduler retried the skipped pair, and nothing did. The pass now bails before cloning a body that holds no fusable pair at all, rather than deep-cloning the whole body and discarding it."

[[fragments]]
id = "optimizer-hot-path-allocations"
category = "Changed"
text = "Three optimizer hot paths stopped allocating per sample. `HotPathHints::record` allocated the key on every call including a repeat sample, and its LRU eviction cloned every key in the map to find the oldest; it now takes a `get_mut` fast path and clones the one key it evicts. `reaching_def_propagate` keyed its propagatable-let map and its shadowed-binding set by `String`, so every binding heap-allocated and memcpy'd its name twice per scope walk; both are keyed by `Ident`, which is an `Arc<str>` refcount bump and hashes through the same `str`, so `&str` lookups are unchanged. `loop_fission` walked its body building a new `Vec` node by node whether or not a fissionable loop existed; it locates the loop first and copies the prefix in one `extend_from_slice`."

[[fragments]]
id = "anonymous-generator-owner"
category = "Fixed"
text = "`abstraction-gate` no longer demands an operation registration for a region that names no operation. Two prefixes mean the same thing: `inline::`, minted by `reparent_entry_node` for a body the composer reparented onto its caller, and `anonymous::`, written by a builder that needs a named phase boundary inside one operation. The gate knew only the first, and fell back to `source_region.is_some()` for the second, which proves nothing because composition stamps `source_region` onto every entry region it reparents. Seven regions were reported as unregistered building blocks that must not be registered. `vyre-foundation/src/algebra/composition.rs` owns the answer as `ANONYMOUS_GENERATOR_PREFIXES` and `is_anonymous_generator`, and the gate's fix text now names the rename. The gate also descends through `vyre_foundation::transform::visit::child_bodies` rather than its own list of node arms, so a new nesting variant cannot hide a region from it."

[[fragments]]
id = "hot-path-scan-excludes-test-bodies"
category = "Fixed"
text = "`hot-path-scan` counts runtime code only. It claimed to skip `#[cfg(test)]`, calling those \"intentional dev-only lines, not runtime cost\", but an attribute annotates the item that follows it and the scan skipped the attribute line alone. Every `panic!`, `format!` and `.to_string()` inside a `mod tests` body was reported as hot-path cost and weighted per kLOC, and the same bodies inflated the `count_code_lines` denominator, so a file's real density read lower than it is. Seventeen of 125 findings were test code, one `mod tests` spanning 575 lines of a backend dispatch file. The scan now tracks the item a `#[cfg(test)]` annotates to its closing brace, or to its semicolon when it has no body, with a brace counter that ignores braces inside string and character literals and a `'` that opens a lifetime rather than a literal. The `hot-path-scan` pin falls from 170 to 154 and `abstraction-gate` from 32 to 23."

