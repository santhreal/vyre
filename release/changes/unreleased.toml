category = "Fixed"
text = "Benchmark case declaration and span timing each have one owner. `api::metric::elapsed_ns` narrows every measured nanosecond count, replacing three spellings across 35 sites in 28 files: a bare `as u64` cast, a `min(u64::MAX)` clamp, and a `try_from().unwrap_or()`. The bare cast wrapped, so a span past about 18.4 seconds reported as a short one and the slowest sample read as the fastest. `cases::honest_case` owns the suite list, metadata and memory floor every honest case declares; `search.binary.u32.1m` had omitted the smoke suite from its own copy of that list and was never smoke-tested. `cases::reference_sample::run_against_reference` accounts both halves of a reference comparison, closing two records that published a baseline carrying only a wall time and one that read the baseline's written-byte total off the device output. `cases::release_workloads::resident_batch` owns resident batch dispatch and its metric points, replacing two hardcoded reset-byte constants with the uploaded payload length and routing the metadata condition workload through the shared run assembly it had bypassed, which is where it had been silently omitting its throughput metrics. `api::case::prepared_as` and `api::case::prepared_as_mut` own borrowing a prepared payload as its own type and own the wording when it is the wrong type. Sixteen cases hand-rolled that downcast; the read-only and mutable flavours meant nine copies survived a first collapse, and the message had drifted into three unrelated sentences for one condition. An `Option`-returning downcast is a different operation and stays where it is. `case_declaration_contracts` derives its coverage from the case registry and a walk of the crate source, so a new case or a reintroduced narrowing fails by name rather than going uncovered."

