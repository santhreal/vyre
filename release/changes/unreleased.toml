id = "one-gate-registry"
category = "Changed"
text = "Every registered xtask subcommand is now a gate answering one contract: it returns findings and notes instead of printing, and the runner decides what that means. The `Kind` enum is gone, so no check is exempt from the sweep by category. The `check-cat-a` and `release-gate` composites are named subsets of the registry, `xtask gates --subset cat-a` and `--subset prepublish`, and the cargo invocations they drove are gates of their own: `workspace-check`, `workspace-clippy`, `workspace-tests`, `workspace-docs` and `lockfile-clean`. `scripts/check_op_names.sh` and `scripts/check_parity_testing_not_leaked.sh` became the `op-names` and `parity-testing-isolated` gates. `xtask/gate-baselines.toml` pins `findings` rather than output lines, one row per registered gate, and the sweep enumerates the registry at run time so a gate without a row and a row without a gate both fail. A gate that owns a generated artifact checks it against the tree and rewrites it under `--write`, so regeneration is never a subcommand of its own."

[[fragments]]
id = "registry-gates-one-contract"
category = "Changed"
text = "The seventeen registry-linked checks answer the gate contract. Each one returns findings instead of an exit code, so the sweep counts what it found and pins that count. catalog, list-ops and optimization-docs now own docs/generated/catalog.toml, docs/generated/op-inventory.toml and docs/generated/optimizer-passes.toml, compared on every run and regenerated with --write. lego-audit runs its repo-context checks unconditionally and has no report-only mode, lego-quick scans the whole tree unless --staged narrows it, heuristic-audit has no advisory mode, compile and shrink run over the generated release corpus, and verify-rewrite-proofs fails when no solver can discharge an obligation."

