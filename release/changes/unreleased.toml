id = "release-gate-prepublication-default"
category = "Changed"
text = "`vyre-release-gate` judges prepublication evidence by default and takes `--launch-complete` for the post-ship mode. The default was launch-complete, which demands `public_launch_complete`, all three approval-gated external actions complete and zero blockers, so the gate every sweep runs with no arguments could not pass before the version it guards had shipped. The removed `--prepublish` flag is rejected rather than ignored."

[[fragments]]
id = "release-docs-name-documents-that-exist"
category = "Fixed"
text = "Four release surfaces named documents the book deletion removed, and each failed open. `release_contract_path` pointed at `docs/RELEASE.md` and now names `release-train.toml`, the surviving authority for versions, tags, package membership and the approval-gated actions. `hygiene-matrix` listed `docs/RELEASE.md` three times and skipped every entry that is not a file, so it reported clean while scanning none of the documents it names; a listed document that is absent is now a finding. The version matrix resolved release notes to `docs/release/v<version>.md` and repeated one path twice, so its tag-command scan spent its blockers on unreadable files and double-counted the one file it could read. `scripts/final-launch.sh` passed that same missing page to `gh release create --notes-file`, so the last outward step of a release would have failed after the crates were published; `scripts/release_docs.py` now generates `release/evidence/docs/release-notes-body.md` from the fragments the changelog is built from and `--check` holds the two together."

