id = "optimizer-passes-have-one-descent-and-one-candidate-scan"
category = "Changed"
text = "Every structural optimizer pass in `vyre-foundation` now holds its rewrite rule and nothing else. Eighteen analysis bodies restated the same shape, an O(1) node-kind bitset filter followed by a scan of the entry tree for a candidate, and sixteen transforms restated a recursive descent plus the same changed-flag bookkeeping; both are stated once in `vyre-foundation/src/optimizer/passes/driver.rs`. Three of those descents applied themselves to every child twice, once through the child map and again through the body map, which is `2^depth` node visits for a nest of that depth. The descent also preserves borrows: the owned entry walk the passes used cannot report `no change`, so each of them rebuilt the whole entry tree on every run and dropped the cached facts behind it, including on the runs that changed nothing. A pass whose rule does not fire now hands back the caller's program unchanged, which is the common case under the optimizer fixpoint. Legality is stated once per pass instead of twice, so an analysis can no longer schedule a pass for a node its own rewrite then declines."

