id = "validation-rule-catalog-generated"
category = "Changed"
text = "The validation rule registry is one table in `vyre-foundation/src/validate/catalog.rs`, carrying each code's phase, invariant and corrective action. `docs/generated/error-codes.toml` is rendered from it and `vyre-foundation/tests/validator_error_docs.rs` fails on divergence, reporting one finding per divergent code. `ValidationCode` gained `phase`, `invariant` and `corrective_action` accessors. The hand-maintained table in `docs/error-codes.md` was a second copy that had already drifted: four codes carried the placeholder text `Program validation error 0NN` with the corrective action `See diagnostic output`, which the catalog replaces with the invariant each emission site actually checks."
[[fragments]]
id = "gate-sweep-no-legal-failure"
category = "Changed"
text = "`xtask gates` no longer accepts a failing gate. `xtask/gate-baselines.toml` pinned both a `status` and an `owner` sentence per row, and the sweep treated `status = \"red\"` as the expected result whenever the row named an owner, so a gate could fail indefinitely while the sweep reported that every gate held its baseline; three did, for a fortnight. Both fields are gone from the schema and a row that still carries either fails to load rather than being ignored, because a default derive would accept and discard it. What remains is a finding ratchet: `output_lines` may fall and be lowered, may not grow, and a nonzero exit is a failure whatever the pin says. `--write-baseline` refuses to record a run in which any gate failed."
[[fragments]]
id = "mdbook-deleted"
category = "Removed"
text = "The mdbook is deleted: 134 files, every `.md` under `docs/` plus `book.toml`. It described a tree that had moved out from under it, and a document that contradicts source is worse than no document, because a reader who checks it is misled and a reader who does not is unserved. What remains under `docs/` is machine-readable contract data that gates read directly: the `.toml` policies including `OWNERSHIP.toml`, `HOT_PATHS.toml`, `OP_MATRIX.toml`, `TESTING.toml` and `STRUCTURAL_GATES.toml`, the per-crate public-API `.txt` snapshots, `OP_SCHEMA.json` and `architecture.svg`. `README.md` and per-crate `README` files remain the documentation surface. `scripts/release_docs.py` accordingly generates `CHANGELOG.md` alone, and the release train's required artifact tokens are generated into its unreleased section from `release/release-train.toml` rather than checked against prose that could disagree with it."
