id = "wgpu-dispatch-guards-have-single-owners"
category = "Changed"
text = "The wgpu dispatch guards that every path repeats have one owner each. `vyre-driver-wgpu/src/dispatch_timeout.rs` answers the three questions a `DispatchConfig::timeout` raises: the absolute instant the budget expires at, whether a requested budget is even serviceable by this backend's queue and readback window, and whether the budget is already spent at a given phase. The spent-budget comparison existed in seven copies across the asynchronous, batched, resident and pending-dispatch paths, each with its own diagnostic wording, so a correction to the comparison reached only the copies it was applied to and a path holding a stale copy would keep waiting on a dispatch whose budget had run out instead of reporting the overrun. Wall-clock telemetry is likewise one call: `numeric::WGPU_NUMERIC.elapsed_nanos_u64` replaces three local nanosecond conversions that each re-decided what happens when an elapsed duration does not fit `u64`. Reported nanosecond values are unchanged."

