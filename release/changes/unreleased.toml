id = "lower-analyses-share-their-fixtures-and-literal-reader"
category = "Changed"
text = "Three concepts in `vyre-lower` had two copies each. The constant behind an index operand is written in one of two encodings, a `Literal` op whose first operand is a pool index or an operand id that is itself a pool index, and bank-conflict and coalescing classification each resolved both encodings with its own copy, so a third encoding would have had to be added twice; `analyses::constant_u32_operand` now owns it, beside the producer map it reads. The one-buffer descriptor fixture was written out as a struct literal in `descriptor/` and again in `analyses/op_histogram/`, so a new `KernelDescriptor` field had to be chased through both; it is stated once, through the public builder. The load-count precondition fixture was byte-identical in texture promotion and AoS-to-SoA layout, doc comment included, and now lives with the traversal that defines the op shape it builds."

[[fragments]]
id = "clone-family-pins-name-the-identity"
category = "Fixed"
text = "The clone-family IR pins for `nn::softmax` and `nn::layer_norm` track the current shared child-region names. Renaming the reduce-family owners from `vyre-libs::substrate::*` to `vyre-libs::builder::*` moved the fingerprint of every program embedding them, because a region generator identity is part of the wire encoding, and the pinned digests were left on the old names. The drift went unnoticed because the target needs `nn-attention`, which the package-scoped test command does not enable. Rewriting only those identity strings in the built programs reproduces the previous digests exactly, so no node, buffer, expression or workgroup value moved. A companion rule now pins the region identities each entry point carries, which names a rename directly instead of reporting an opaque digest change, and asserts the reduce-family owner is still reached by more than one caller."

[[fragments]]
id = "libs-registry-closure-has-a-caller"
category = "Fixed"
text = "`vyre-libs` runs the registry/coverage closure gate. `vyre_test_support::assert_registry_closure` is the workspace's single enumerator of `pub fn -> Program` builders, and no crate called it, so the contract it exists to enforce was unenforced everywhere: a builder that is neither submitted through `inventory` nor named by a test still compiles, still appears in the generated catalog documents, and still diverges from its reference arm with nothing red. `vyre-libs/tests/registry_closure.rs` is the caller, with an empty waiver and a floor under the enumerated builder count so a broken source scan fails instead of reporting a clean sweep of an empty set. The enumerator also stopped excluding itself by one hardcoded file name, which was the name of a gitignored file rather than the one its own documentation gives; it now excludes any test file that calls it, so a waiver entry cannot cover itself."

[[fragments]]
id = "rule-condition-verdict-declares-its-count"
category = "Fixed"
text = "Every scalar rule leaf is runnable again. `vyre_libs::rule::condition_op::condition_program` declared its verdict slot as a backend-allocated output with no static element count, which fails IR validation with V130, so all eleven leaves (six file-size predicates, two pattern-count predicates, the two literals, and the pattern-existence check) built successfully and were refused before execution. The builder was neither registered nor named by a test, which is why nothing reported it. It now declares the one element it writes, and a frame contract pins the binding order, the slot each accessor reads, the region identity, the verdict store, and the element count, executing every leaf through the reference interpreter. The leaf table is checked against the operation ids declared under `vyre-libs/src/rule` on each run, so a twelfth predicate turns the suite red until it is pinned."

[[fragments]]
id = "ac-emit-paths-share-one-record-loop"
category = "Changed"
text = "The Aho-Corasick emit paths in `vyre-libs/src/scan/` read the flat output-record span through one owner. Six builders each wrote their own loop over `out_begin..out_end` binding `pattern_id` from `output_records`, and four of them also wrote their own per-pattern presence write, `presence[rs_base + (pattern_id >> 5)] |= 1 << (pattern_id & 31)`, spelled out node by node: the bounded presence and per-region presence builders, the fused presence-and-positions builder, the anchored region admission walk, and the fused region evidence program. A change to the record layout or to the bitmap indexing had to land in every copy, and a copy that was missed would produce a program that still built, still dispatched, and reported a different set of patterns. `bounded_ranges::output_record_loop_node`, `pattern_bitset_or_node` and its `presence_bit_write_node` form, `match_span_start_nodes`, and `bounded_walk_matched_nodes` now own the record loop, the bitset write, the floored match-start computation, and the accept-gated bounded walk. The emitted IR is unchanged: the presence reference, per-region ground-truth, fused presence-and-positions, transition-walk ownership, region-chain and conformance-matrix suites pass without repinning."

[[fragments]]
id = "certificate-pins-name-the-values-they-cover"
category = "Fixed"
text = "The conformance certificate regression pin passes, and a future drift in it is attributable. Seven pinned values had been stale long enough that the gate was red on every checkout: the region-chain bundle carries the test operation id in an `Expr::call`, so respelling that id from `vyre-conform.test.identity_u32` to `vyre_conform_test::identity_u32` when the operation and target registries were unified put one more byte in its wire body, 324 to 325, and moved its digest; and all five signatures had moved because the signable body covers `reference_output_blake3`, the digest of what the reference returns, which a wire-identical program can change underneath. Each new signature was reproduced independently from the bundle digest, the corpus digest, and the single output word each program stores before being written down. The test now asserts those words through the same planning and interpreter entry point the issuer uses, so a signature that moves while the words hold is a framing change and one that moves with them is a semantic one, where before either read as an opaque hash mismatch. `tests/_compute_pins.rs`, a second copy of all five bundle builders and the signing body whose only output was the constants to paste, is deleted: a generator that can drift from the test it feeds prints pins for programs nobody is checking, and the failing assertion already names the value to write."

[[fragments]]
id = "node-variant-traversal-closure"
category = "Fixed"
text = "Adding an IR `Node` variant can no longer be handled by a catch-all arm nobody chose. The AST registry macro emits `NODE_VARIANT_NAMES` and `node_variant_name` from the declaration site, `vyre_foundation::transform::visit::node_shape` records for every variant whether it nests statements, carries operand expressions, or holds an opaque payload, and `child_bodies` is the one exhaustive owner of child enumeration. Two traversals that re-derived that list were wrong: the reference interpreter's barrier scan claimed an exhaustive match but let `Node::Region` fall into its default, so a barrier inside a region body read as absent; and `walk_exprs` skipped the `offset` and `size` operands of asynchronous copies and the `address` operand of a trap, hiding those buffer references from every analysis built on it. Loop unrolling's local-declaration check now also treats a region body as scope-transparent. Tail duplication's read check now answers yes for a statement form it does not recognise instead of no, so an unfamiliar tail costs a missed duplication rather than code sunk past a live read. The duplicate visitor implementations in `vyre_foundation::visit` now delegate to that owner rather than restating the variant list, and the descendant scan uses an explicit worklist so a deep tree cannot overflow the native stack."

[[fragments]]
id = "optimizer-pipeline-benchmark"
category = "Added"
text = "`vyre-foundation` has a criterion benchmark over the whole optimizer pass pipeline: the eight release corpus families, wide kernels at 16 and 64 buffers, and a 4x8 loop nest. The pipeline had per-pass timing inside the scheduler report and no measurement of the pipeline as a whole, so a rewrite of the walk every pass runs through had nothing to be measured against."

[[fragments]]
id = "program-canonicalization-borrow-preserving"
category = "Changed"
text = "`Program::canonicalized` reports what canonicalization changed instead of rebuilding the tree to discover it changed nothing. An already-canonical program keeps its entry body, its buffer table, and its memoized fingerprint rather than being replaced by an equal copy, and a program that only needs its buffer table sorted keeps its entry body. Canonicalization stays a fixed point in one application and a semantic no-op, both now asserted over the shipped release corpus and over shapes the corpus does not generate: a `Block` that owns a binding is a scope, so it survives, while a `Block` that owns none is spliced into its parent at every body position."

[[fragments]]
id = "scheduler-gate-facts-per-program"
category = "Fixed"
text = "The pass scheduler judged a rewrite against facts taken from the wrong program. A pass that reported no change while rewriting the program had its effect, linearity, shape, and cost certificates recorded against the program it returned rather than the program it was handed, so the next pass was measured against a certificate describing its own input and a cost regression was accepted as flat. Facts are now derived once per program, keyed on the program fingerprint, and reused across every gate and every fixpoint iteration, which also removes one deep clone of the program per running pass."

[[fragments]]
id = "checkout-provenance-in-crate-contracts"
category = "Fixed"
text = "Contract tests resolve the checkout they report on from the working directory at run time. `vyre_test_support::monorepo::vyre_workspace_root` delegates to `structure_gate::workspace_root`, the one owner of that question, instead of its own compiled-in manifest directory, which cargo emits as a relative path and which names whichever checkout built the binary when a target directory is shared. Seven `vyre-foundation` contract suites covering workflow script references, frozen trait contracts, bench corpus duplication, example orphans, validator error codes, wire fuzz infrastructure, workspace naming, and the consumer boundary went through that compiled-in path and now ask the helper. `ConsumerBoundaryScan::for_crate` takes the crate directory as a path."

[[fragments]]
id = "registry-closure-gates-are-in-the-repository"
category = "Added"
text = "Every registry closure gate in the workspace is a tracked test. The gate asserts that each `pub fn ... -> Program` builder a crate publishes is reachable from its `inventory` registry or named by one of its tests, that the source enumeration finds at least a declared floor, and that a builder listed as an exception has not since gained coverage, which is what keeps the exception list only-shrinkable. Nineteen crates ran that gate from a file no checkout had: a blanket ignore rule for `**/tests/adversarial_registry_closure.rs` kept each copy out of the repository, so the gate existed on one machine, ran in no continuous-integration job, and appeared in no review. Seven of those crates publish builders and now carry `tests/registry_closure.rs` with that crate's floor and exception list; the other twelve enumerate no builders at all, so their gate could only ever pass, and a target that cannot fail is worse than none because it reads as coverage. Two of the invisible gates were failing. `vyre-driver` left the three hostile-input probe programs every backend's obligations are asserted against unregistered, untested and unlisted; those probes are now pinned by a contract target, because a probe whose buffer count or workgroup shape drifts leaves the backend assertions green while an over-supplied buffer case becomes the correct call and a zero workgroup dimension launches. `vyre-primitives` left three builders uncovered and unlisted; each is a second call convention over a builder that is swept, and each now says so on its own line. The same ignore rule also hid the lexer oracle's hostile-input half, which asserts that bytes outside the accepted subset fail loudly instead of tokenizing to a wrong answer; it is tracked under a name that says what it drives."

[[fragments]]
id = "queue-bench-families-one-owner-per-concern"
category = "Changed"
text = "The GPU queue bench families in `vyre-bench` have one owner per concern. The skewed-CSR and IFDS cases each carried their own copy of the queue-materialize dispatch sequence, the queue-driven traversal plan, the queue-closure payload and its CPU oracle, the single-dispatch frontier step, and the four-column Rust lexer dispatch, so a fix to any of them reached one family and not the other. Those concerns now live in `cases/queue_materialize.rs`, `cases/queue_traverse_plan.rs`, `cases/queue_closure.rs`, `cases/queue_closure_oracle.rs`, `cases/frontier_step.rs`, and `cases/rust_frontend/lex_columns.rs`, and nine cases are described by a `WorkloadDescription` plus `CaseOps` over a shared payload instead of a hand-written `BenchCase` impl. Case ids, metric names, error strings, and readback ranges are unchanged. The `vyre-bench` duplication pin drops from 3397 to 2491 lines."

[[fragments]]
id = "registry-link-anchors-have-one-owner"
category = "Fixed"
text = "Every reader of the operation registry and the backend registry reads it through `vyre-registry-link`, which references a real symbol in each submitting crate and asserts that each linked source reached the registry. An `inventory` registration lives in the object file of the declaring crate, and the linker keeps that object only when a symbol inside it is referenced, so `use vyre_libs as _;` and `std::hint::black_box(METAL_BACKEND_ID)` linked nothing: the conformance test binaries registered two backends where the build declared four, and their registry rules judged that partial set without failing. The five driver crates now expose `registered_backend_id`, a function call that anchors the object file and reports whether the target compiled the registration at all, and the discarding imports and `force_link_backend_inventory` helpers they replaced are gone."

[[fragments]]
id = "structure-gate-rejects-registry-discarding-imports"
category = "Added"
text = "`structure-gate` derives the set of crates that submit `inventory` registrations from the tree and rejects any `use <that crate> as _;` in workspace sources, naming `vyre-registry-link` as the way to read the registry instead. The submitting set is read at scan time rather than listed, so a new submitting crate is judged the moment it submits, and a companion contract fails when the scan finds no submitters, which is the state that would accept every discarding import in the tree."

[[fragments]]
id = "registry-link-layer-and-guide-profile-closure"
category = "Fixed"
text = "The layer ordering places the registry link owner where its dependencies allow it. It has to name every registration source, including the concrete drivers, and it is read by the conformance and tooling crates, so it sits above the facade and below conformance rather than in tooling, which the conformance crates cannot depend on. The crate-guide generator now also rejects an error profile for a layer no crate occupies, alongside the check for a layer with no profile. Only the second direction was checked, so a profile survived a crate absorption while describing a layer that no longer existed, and the two layers introduced since had no profile at all, which left the generator failing for every crate rather than for the ones that were wrong."

[[fragments]]
id = "csr-frontier-step-one-walk-per-direction"
category = "Changed"
text = "One CSR frontier step is stated once. `graph::csr_frontier_step` already owned the Program builder for both edge directions, but the host reference was written twice: `csr_forward_traverse` scattered into the destination bit and `csr_backward_traverse` gathered from it, each with its own row scan, its own edge-kind filter, its own bitset-word arithmetic, and its own copy of the CSR input validator, which the reverse walk reached across a sibling module to call. The walk is now one function whose argument is the direction, so the read endpoint and the write endpoint of an allowed edge are the only thing that varies, and the two published entry points every step op republishes under its own name (`cpu_ref` and `cpu_ref_into`, plus the predicate-level pairs for a masked step) come from `define_csr_frontier_step_cpu_ref` instead of six hand-copied parameter lists. `csr_forward_traverse_with_op_id` and `csr_backward_traverse_with_op_id` are gone: they differed only in the direction constant they passed, and `predicate::edge` and `predicate::size_argument_of` now build through the predicate program builders that already existed for that purpose. A missed copy is why a bounds guard can hold on one direction and not the other: the forward walk range-checked its destination against `node_count` while the reverse walk range-checked only against the frontier length, and a reference that is wrong in one direction blesses a wrong program in that direction. Emitted IR is unchanged, and the 2048-case hostile sweep in `csr_frontier_step` still compares both directions against two scalar walks written independently of the primitive."

[[fragments]]
id = "csr-queue-one-abi-per-lane-strategy"
category = "Changed"
text = "One queued-row CSR expansion ABI, one owner. Five entry points build the same queue-driven traversal and differ only in how lanes are assigned to a queued row, yet each restated the whole surface: `csr_queue_strided` declared `CsrQueueStridedForwardParams`, a field-for-field second name for `csr_frontier_queue::CsrQueueForwardTraverseParams`, then destructured it, repeated the zero-node and zero-capacity refusal with its own diagnostic, and reassembled the step spec; the delta pair repeated its thirteen-argument positional list in both files. A second name for one buffer contract is how a field added for one lane strategy silently misses the others, and the strided path also carried a hand-written CPU reference that only forwarded to the queue reference it is checked against. The queued-row ABI now owns its refusal rule and its step spec, one macro states the positional argument list per family, the strided op publishes the queue reference under its own names instead of copying it, and the offset-count overflow contract is one assertion both forward entry points run against the invalid-output program shape."

[[fragments]]
id = "csr-closure-call-shapes-stated-once"
category = "Changed"
text = "A CSR closure states its call shapes once. Iterating a one-step CSR traversal to a fixpoint is one algorithm with several call shapes: allocate the two frontier buffers or borrow the caller-owned pair, observe each attempted step or not, report a malformed graph or panic on it. `csr_bidirectional` published six of those shapes and `csr_forward_or_changed` three, each retyping the same seven to ten argument names above a body that only forwarded them, and the `vyre-libs` reference facades for both ops retyped the pair again to add a dispatch-call count. Plumbing repeated per op is how one shape keeps a `#[must_use]`, a clippy allowance, or a fix the siblings never receive, and a facade with a hand-written body is one edit away from being a second implementation of a fixpoint it is only supposed to count. `graph::csr_closure_entry_points` now owns the argument list and generates the allocating, borrowing and panicking shapes above the hooked driver that carries the semantics; each op supplies its own documentation and its own diagnostic. The infallible shape is exported, so the composition facades in `vyre-libs` pass a counting hook to the primitive driver instead of restating it, and the traversal pipeline reference, which counted nothing at all, is now the primitive shape published under the pipeline name."

[[fragments]]
id = "csr-graph-removed-public-shapes"
category = "Removed"
text = "Three `vyre-primitives` graph shapes are gone, all behind the `graph` feature. `CsrQueueStridedForwardParams` is deleted: the row-strided queue expansion takes the same inputs as the scalar one, so `csr_queue_strided_forward_traverse_with` now accepts `CsrQueueForwardTraverseParams`, whose fields carry the same names. `csr_forward_traverse_with_op_id` and `csr_backward_traverse_with_op_id` are deleted; the direction-parameterized frontier-step reference covers what they were for and nothing called them. Every other CSR closure and queue entry point keeps its exact name, arity and argument order even where it is now generated from a macro or published as a re-export, so a caller that used one of those needs no edit. The default-feature public-API snapshots for `vyre-primitives` and `vyre-libs` are unaffected, since `graph` is not a default feature."

