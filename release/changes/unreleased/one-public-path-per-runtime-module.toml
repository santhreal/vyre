category = "Changed"
text = "Every runtime type, function and constant has one public path: the module that owns it. The crate root re-exported about thirty items that were already public at `vyre_runtime::replay`, `::tenant`, `::pipeline_cache`, `::artifact_admission`, `::persistent_executor` and `::recovery`, so the published surface carried 122 duplicate entries and a reader had no way to tell which path was canonical. The root re-exports are gone, every caller in the tree names the owning module, and the `vyre` facade re-exports from those module paths rather than from a second index."
