category = "Fixed"
text = "`vyre-driver-wgpu`'s loop-carrier scope-latch dispatch test reads `TOK_LBRACE` and `TOK_RBRACE` from `vyre_spec::c11_token` instead of declaring its own pair with the values 1 and 2. Those two declarations were the only `TOK_`-prefixed constants outside `vyre-spec` in the tree, so `vyre-spec`'s `no_file_outside_the_owner_declares_a_token_id` failed on this file. The test pins the shape the c-parser scope walker emits, and it now pins that shape against the real numbering the walker actually sees: the canonical ids are 12 and 13. Nothing observable moves, because the program compares `scope_kind` for equality against the same constants the fixture inputs are built from, and every assertion is on `scope_open` and `scope_depth`."
