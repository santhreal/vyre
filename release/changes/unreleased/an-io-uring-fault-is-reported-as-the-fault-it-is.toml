category = "Fixed"
text = "An io_uring or tenant-accounting fault reports the condition it detected: a range past a registered region reports `PipelineError::RegionBounds` with the offset, length, and region size, a value too wide for its destination reports `PipelineError::IntegerWidth` with the value and the bit width, counter arithmetic that left its range reports `PipelineError::CounterOverflow` with the owning scope and both operands, a consumed count past its produced count reports `PipelineError::CounterOrder` with both counters, a malformed request reports `PipelineError::InvalidRequest` with the observed value and its bound, and a resubmission to an occupied ingest slot reports `PipelineError::SlotInFlight`; all of them previously rendered as `io_uring submission queue at capacity`, which `PipelineError::QueueFull` now states only for a submission or completion queue that is genuinely full, alongside the entry count it holds."
