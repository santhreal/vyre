category = "Fixed"
text = "The release macro benchmarks no longer time a CPU baseline that rebuilds its own input. `synthetic_cpu_count` regenerated every record from its index inside the timed region, twelve to twenty-four rotate-multiply rounds per column, while the GPU side was handed pre-materialized, pre-uploaded buffers. The recorded evidence read 5508x to 6729x for the count patterns and 928x for the one case that already read materialized bitmaps, and the gap was the generator, not the device. `synthetic_cpu_count_over_inputs` now counts over the same host buffers the device reads and the generator cross-check happens outside the clock. Re-measured on the shipping path, release.condition_eval.1m reports 165.708x with a 4422427 ns baseline p50, and no speedup pin had to move."
