category = "Changed"
text = "The WGPU C-frontend token tests share the fixture builder, the CPU pipeline runner, and the row readers with the CPU-side tests instead of carrying a second copy of each. The support file became a directory module, because a top-level file under `tests/` is its own test binary and therefore cannot reach the shared support module, which is what forced the copy. The shared fixture builder now models the lexer for whitespace and comment lexemes: they contribute source text and no token row, so a preprocessor fixture states real source layout instead of inventing rows for trivia."
