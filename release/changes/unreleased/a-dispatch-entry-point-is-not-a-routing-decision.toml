category = "Fixed"
text = "A grid-sync program whose grid exceeds the device's cooperative residency now takes the host-orchestrated split from every CUDA dispatch entry point. `dispatch` and `dispatch_borrowed` consulted the residency route; `dispatch_borrowed_timed`, `dispatch_async` and `dispatch_borrowed_async` went straight to the native cooperative launch and returned `CooperativeResidencyExceeded` for the same program the synchronous entry points ran correctly. Timing goes through the timed entry point, so the one path with no route was the one path every performance measurement of a large multi-block scan took. The shared registry wrapper had the same hole from the other side: it asked whether the host split was permitted before asking whether a native route existed, so a backend that lowers a grid barrier natively and merely cannot make one grid resident was denied the fallback that `ErrorCode::CooperativeResidencyExceeded` documents. Refusing the split still means what it meant, that a backend will not emulate a barrier its device does not have."
