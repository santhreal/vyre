category = "Fixed"
text = "A backend feature marker is scored against implementation text: line, trailing, block and doc comments are removed, `#[cfg(test)]` and `#[test]` items are removed, and string literals are kept because emitted target text is implementation. The scan removed whole-line comments only, so four tokens were satisfied by prose that outlives the feature it claims: `cp.async` appeared in the async staging pattern only in its header comment, and the no-CPU-fallback marker scored the words never, cpu and fallback against a test file. The staging marker now names `supports_async_copy`, `supports_ldmatrix` and `KernelOpKind::StoreShared`; the fallback marker names the adapter selector that refuses a CPU adapter; the batched megakernel dispatch marker the release gate required and nothing emitted is declared again against the persistent pipeline. The required marker ids and the marker floor are read from the declarations that produce them instead of from two hand-written lists, one of which required a marker no longer emitted and floors that had drifted to 12 of 17 and 7 of 9."
