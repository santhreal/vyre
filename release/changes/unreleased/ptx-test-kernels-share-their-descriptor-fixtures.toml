category = "Changed"
text = "The `vyre-emit-ptx` test surface states each kernel shape once. Five atomic RMW descriptors, four subgroup reductions, two subgroup shuffles, five predicated-store preludes and thirteen cast kernels each carried their own inline copy of the same op list, operand indices and literal table, so a slot index, a literal position or a dispatch width could drift in one copy while the test kept its name and kept passing against a program it no longer describes. `atomic_kernel` in `<crate>/src/tests/mod.rs` is the only writer of the one-slot atomic body and is now shared with the unsupported-op refusal in `subgroup.rs` that had a fifth copy; `subgroup_reduce_kernel`, `subgroup_shuffle_kernel`, `predication_kernel`, `cast_kernel` and `chained_cast_kernel` own the remaining shapes, and the pre-existing `f32_cast_kernel` and `u32_cast_kernel` delegate to `cast_kernel` instead of rebuilding it. `assert_xor_butterfly_steps` states once that a 32-lane XOR butterfly takes log2(32) exchange steps, where three reduction tests each spelled out the same two count assertions and their messages. Emitted PTX is unchanged: every fixture reproduces its callers' descriptor field for field."
