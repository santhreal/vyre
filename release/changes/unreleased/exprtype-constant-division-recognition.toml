category = "Changed"
text = "`vyre_foundation::optimizer::passes::algebraic::strength_reduce` recognizes four\nconstant-divisor shapes before it lowers them. A divisibility test `x % d == 0`\nbecomes Lemire's `rotate_right(x * inverse(odd(d)), trailing_zeros(d)) <= limit`,\nwhich reads the operand once and emits two operations where lowering the\nremainder emitted five. A common factor between a dividend's multiplier and the\ndivisor cancels, a constant division chain fuses into one division, and a nested\nmodulus narrows, each guarded by a range proof from a new provable-upper-bound\nanalysis so a rewrite that would only hold without 32-bit wrapping is declined.\nChained shift fusion no longer folds an over-width total to zero, which was a\nmiscompile for a signed right shift, where the sign bit replicates instead.\nRewrites that re-evaluate their operand now clear one duplication budget owned\nby `strength_reduce`, so a remainder of a buffer load no longer emits three\nloads of the same address.\n"
