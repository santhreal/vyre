category = "Changed"
text = "The `vyre-libs` feature table is generated from a machine-readable domain roster in `docs/CRATE_OWNERSHIP.toml`, so a facade row forwards a domain capability instead of declaring it a second time, and adding a domain is one ownership record rather than a row in the facade manifest and a row in the domain manifest. Three `vyre-libs-graph` features were renamed to the capabilities they gate: `analysis` is `dense-reachability`, `reasoning` is `impact-mask`, and `visual` is `interactive-graphics`, so `--features visual` no longer builds the graph domain. The configuration space model now proves the declared constraints over every selection a build can ask for and reports the assignment it proved, instead of restating that no other check reported a finding."
