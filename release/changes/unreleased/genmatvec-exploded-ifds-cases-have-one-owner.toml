category = "Changed"
text = "The exploded-supergraph (IFDS) CPU-reference corpus has one owner, `vyre_test_support::exploded_ifds_cases`, which declares the cases and owns what a correct CSR for them is. `vyre_libs::graph::exploded` pins its allocating, fallible and workspace-reusing builders against it, and `vyre_libs::graph::dispatch::exploded` pins its host reference, its node-count helper and its dispatched path. The mixed intra/inter/GEN/KILL case stream was written twice and the copies ran different counts, 1024 against 512, so the dispatched path was never asked about the upper half of a corpus its own file defined. The rule semantics that were hand-checked per suite, KILL suppression, GEN injection and inter-edge fact propagation, are now declared as dense edge expectations both arms are held to."
