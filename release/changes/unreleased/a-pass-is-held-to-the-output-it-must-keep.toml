category = "Changed"
text = "The optimizer borrow-preservation suite now judges the passes it used to skip. A pass reporting changed: true was exempt from the borrow assertion, so an empty allowlist proved less the more passes overreported. Every pass is now held to three things: a no-change report hands back the caller's program, a change report means the returned program actually differs, and the fixture's observable store survives whatever the pass did to the wrapper, the buffer set, or the geometry. The last of those found the dead_buffer_elim defect. The descent uses visit::any_descendant rather than a local match, because a pass may legitimately move a store under a guard and a hand-written walk read that as a deletion."
