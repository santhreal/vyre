category = "Fixed"
text = "The gate-canon gate holds the registry, the pinned baselines and the subsets to each other and fails on the seven shapes that soften them: a baseline count that rises, a floor constant that moves up, a weakened target, a gate removed while its baseline row survives, a baseline row with no gate, a registered gate in no subset, and a lowered floor whose doc comment records no measured count. The rules are derived from the registry and the baseline file at run time, so a new gate is covered without being listed anywhere."
