category = "Fixed"
text = "The public-API snapshot for the CUDA driver names the crate its adapter signatures actually come from. Ten of its public items take or return `FrontierTypedPlan`, `DeviceResidentTokenFactGraph`, `MegakernelScaleSample`, and `MegakernelScheduleError`, which moved to `vyre-libs` when the pass engine narrowed to pass execution; the snapshot still spelled them under the pass engine, so the stability gate reported drift on a surface nobody had changed and would have gone on reporting it in front of every real change to that crate."
