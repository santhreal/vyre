category = "Fixed"
text = "The loop restructuring passes ask three questions before they reorder statements, and each now has one owner. `vyre_foundation::optimizer::passes::loops::var_reads`, `touched_buffers` and `bound_names` are public, and `vyre_foundation::transform::visit::node_bound_name` answers which statement binds a name with no catch-all arm. The walks they replace named their own variants and ended in `_ => {}`, so a `Var` read in `Node::Trap.address` or in an async copy's `offset` reported ABSENT: `loop_fusion` fused two loops across a scalar one of them assigns, which silently changes the values the program computes, and `legality::bindings_flow_across` weakened the capture guard for both fusion and fission. The rematerialization pass asked the same question through a `_ => false` arm and could inline a stale definition across a rebinding."
