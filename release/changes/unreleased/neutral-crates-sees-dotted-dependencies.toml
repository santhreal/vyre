category = "Fixed"
text = "The substrate-neutrality rule can see the dependency form this tree uses. `scripts/check_architectural_invariants.sh` matched `^name =` against manifest text, so a dependency written `name.workspace = true` never matched, and the forbidden-edge half of the rule was unreachable for its whole life. The `neutral-crates` gate reads the parsed manifest, so both spellings are one entry, and it reports the edge the shell form could not: `vyre` depends on `vyre-runtime` in `[dependencies]`. Retired crate names are checked over every tracked manifest instead of through a ripgrep whose nonzero exit was read as no hits, and nothing is written outside the repository. The script is deleted, architectural-invariants.yml names `neutral-crates` and `layering`, and the workflow no longer sets `CARGO_BUILD_JOBS`, which is build configuration and belongs in `.cargo/config.toml`."
