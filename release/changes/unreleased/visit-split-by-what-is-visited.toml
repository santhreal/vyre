category = "Changed"
text = "`transform::visit` is split by what is being visited. `node` owns the per-variant `Node` decisions a traversal cannot re-derive safely - which bodies a variant nests, which scalar name it binds and what it does to that name, which operands it evaluates, which buffers it names and in which direction - `expr` owns the same for the value namespace, and `walk` owns the traversals, which are written entirely against those two and restate neither. Every item is re-exported from `transform::visit`, so no caller changes. The file was 1789 lines against an 829-line cap, and every match in it is exhaustive with no catch-all arm on purpose, which is the mechanism that makes a new IR variant a compile error rather than a silent leaf classification; one file that size hides which of those decisions a reader is looking at."
