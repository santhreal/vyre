category = "Changed"
text = "The tooling and workspace-contract source walks have one owner each. `tests/support/source_scan.rs` owns the workspace Rust walk, the brace matcher and the comment/string masker the two workspace contract scanners each carried; `xtask/src/tree_walk.rs` owns the prune rule that seven xtask WalkDir walks each spelled differently, so a build directory added to one is now skipped by all of them; `xtask/src/manifest_walk.rs` owns the read-parse-name sequence for a package manifest that the feature and metadata generators each repeated; `xtask::release::conformance_evidence_semantics` owns the conformance read bound and its error context, previously copied per module; `xtask/tests/common` owns the `path:line:column` violation format. `vyre_test_support::ir_variants::single_u32_output_program` owns the validator program fixture that three validation suites each built by hand."
