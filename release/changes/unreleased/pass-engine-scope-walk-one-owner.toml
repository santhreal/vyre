category = "Changed"
text = "The pass engine has one scope walk. `optimizer::rewrite_walk` owns the encoder's reachable-prefix truncation and the borrow-preserving rebuild, and const propagation, cross-scope CSE, encoded CSE and the encoded-order rewrite call it. Four copies of the same loop stood beside each other and three of them discarded the walk's unchanged answer, so a pass that propagated nothing still deep-copied every nested body it visited. Constant propagation also stopped enumerating `Node` itself: it is a policy over the one structural node rewrite, so a body-bearing variant added to the IR is descended into instead of switching propagation off for everything inside it."
