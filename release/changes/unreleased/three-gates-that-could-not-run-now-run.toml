category = "Fixed"
text = "Three gates that reported `could not run` now run and report a number. `list-ops` and `catalog` failed while building the canonical operation schema: five registered `vyre-primitives::math` operations, the symmetric-eigen Jacobi family, had no backend support row, because `docs/optimization/OP_MATRIX.toml` was generated before they were registered. Regenerating it gives each a row, and both gates then reported the artifact they own does not exist; `docs/generated/op-inventory.toml` and `docs/generated/catalog.toml` are now committed. `verify-rewrite-proofs` needed a solver on PATH and discharges all ten shipped rewrite obligations as unsatisfiable. A gate that cannot run records no finding, and a baseline that stores its zero is a baseline that reports a defect as an achievement."
