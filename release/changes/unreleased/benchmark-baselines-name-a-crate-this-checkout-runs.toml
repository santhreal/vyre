category = "Fixed"
text = "A benchmark performance contract may only name a CPU baseline this checkout can run. Ten release workload rows advertised tree-sitter, libclang, Hyperscan, ripgrep, egg and unnamed SIMD or optimized CPU implementations, bigint.modexp.4096 named rug 1.27 with a GMP backend, and interpreter named a hand-tuned C threaded interpreter with computed goto. None of those were linked: every one of those cases timed an in-tree scalar Rust routine. The labels now come from one owner that describes the routine actually timed, and a new contract test resolves every named crate against the workspace members and the vyre-bench dependency tables read at run time, so a case that invents a competitor fails instead of shipping. The baselines that do run, faer, openssl, hashbrown, pcre2 and rayon, are unchanged."
