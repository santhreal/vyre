category = "Added"
text = "`vyre_test_support::case_table::ArmCoverage` reads a shared case table's declared group names at run time, records which groups a crate's arm actually asserted, and fails naming every declared group that crate has no branch for. A corpus shared through an include has a hole a per-crate copy also had: the table declares a group, one crate grows an arm, the other does not, and the crate without the arm still passes because nothing in it mentions the group. Group-count and case-count floors make a collapsed table fail rather than report a clean sweep of an empty set. Both the dense-matvec and exploded-IFDS tables are enrolled, in four arms across two crates."
