category = "Fixed"
text = "The Gate 1 budget is measured once, by `gate1`, over `xtask-registry::gates::composition_budget`. Two gates walked the region tree with their own copy of the count and disagreed about what composition is: one credited every node inside a region carrying a `source_region`, which a phase wrapper around inlined code also carries, so `vyre-primitives::graph::dominator_tree` read as 91.1 percent composed there and as 0.0 percent in the other walk. The reading that could not fail was the one wired to the pin, so nine operations over the loop and node budget stood green. A node now counts as composed when it is a call to another registered operation or sits inside one, `abstraction-gate` keeps the boundary questions and reports the budget no longer, and the shared walk takes its child bodies from `vyre_foundation::visit::child_bodies` rather than a hand-written variant list that counted a new nesting variant as a leaf."
