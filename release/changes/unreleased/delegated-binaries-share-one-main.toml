category = "Changed"
text = "`xtask::delegate::run_delegated_main` owns what a delegated binary's `main` does: answer `--help` from the callee's own dispatch table, reject a missing subcommand, then resolve the name. `xtask-registry` and `xtask-evidence` each wrote that out, including the exit code for an unimplemented subcommand, so the two entry points could disagree about a contract that `xtask` and CI read as one. Each `main` is now a single call naming the package and why `xtask` routes there, and the `dispatch` wrapper each crate exported for its own `main` alone is gone. Help text, error text and exit codes are unchanged."
