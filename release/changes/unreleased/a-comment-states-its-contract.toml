text = "Four comments deferred their contract to docs/lego-block-rule.md instead of stating it: the Category A/C placement rule in vyre-libs, the discovery checklist in the visual dialect, the single-caller promotion rule in the box shadow, and the tier vocabulary in the tier-claim gate. Each now states the rule where the code has to follow it. The document remains the manual; a comment that points at a file cannot tell when that file is deleted."
