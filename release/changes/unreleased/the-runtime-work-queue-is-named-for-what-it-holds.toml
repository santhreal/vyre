category = "Changed"
text = "The runtime module that owns persistent slot residency is `vyre-runtime/src/resident_work_queue/`, and its lane, its test files, and its architecture page carry the same name. The directory was `megakernel/`, a name the crate's own types never used: nothing in it is named `Megakernel`, the artifact compiler `vyre-megakernel` is a different crate that legitimately keeps the word, and the module was reached through a path attribute pointing at a directory the public paths did not mention. The 24 `megakernel_*` test files, the `runtime_megakernel` ownership lane in `docs/optimization/OWNERSHIP.toml`, the hot-path and hygiene rows, and the regenerated testing guides now all name the resident work queue. `vyre-runtime/ARCHITECTURE.md` described three types that do not exist and a directory that no longer did; it now describes the real submodules and the real public surface."
