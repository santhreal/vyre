category = "Fixed"
text = "The WGPU backend stages a launch-time zero for a target binding whose canonical value the same module produces. The emitted binding order carries no gap for such a slot, so the dispatch expects bytes for it, and nothing has bound the value yet because a caller supplies bytes only for what a kernel reads at launch. The refusal that resulted rejected nine hardware primitive operations on WGPU with `canonical artifact value N for target binding \"out\" is unbound`. A value the module does not produce and nothing bound is still refused. `MaterializedInstance::gather` now returns slices that may borrow from the instance as well as from the bound state."
