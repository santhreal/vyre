category = "Changed"
text = "Every item the composition move brought into vyre-libs has one public path, and that path names the module that owns the item. A codec is reached through its own module, so vyre_libs::decode::hex::hex_decode replaces vyre_libs::decode::hex_decode. The encoding-classification constants are reached through text, the adaptive traversal selectors through graph::adaptive_traverse, the d-DNNF gate encoding through graph::knowledge_compile, the region triple through matching, gaussian_weights through math::conv1d, and the semiring through math::semiring_gemm."
