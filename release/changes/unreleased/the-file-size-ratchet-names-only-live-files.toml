category = "Fixed"
text = "The per-file line ratchet holds ceilings for files that exist. Forty-eight rows named files that had already been split away, one row excluded the whole resident runtime tree while its restructure was pending, and twenty-three audit rows were dead or shadowed by a tighter core row; a ratchet row on a missing file holds no ceiling and reports nothing. The stale rows are deleted, the tree exclusion ended with the restructure it waited on, and the six files split in this change are replaced by rows measuring their largest children, so each one is now held to a tighter number than the file it came from."
