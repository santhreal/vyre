category = "Changed"
text = "A file name states what the file holds, and the gate now judges every tree a crate compiles rather than src/ alone. The prohibition on names like common, support, helpers, types and utils was written for library modules and never reached test-adjacent files, which is where the population had moved: 15 of the last 16 offenders were tests/common/mod.rs or tests/support/mod.rs. The same words as a suffix are the same dumping ground with a qualifier bolted on, so spec_types is now op_signature, backend_impl is backend_dispatch, test_support is test_parity_oracles, and each crate's shared test module is named for what it provides: harness, program_fixtures, wire_words, fixture_backend, gate_fixtures, workspace_sources. Two further classes are rejected: sibling files told apart only by a number, where the number carries the distinction and the name carries none, and a file that repeats the directory holding it, which is the directory's mod.rs. A number inside a name that means something has no numbered sibling, so crc32 and flash_attention_2 are untouched. A module stays exempt only while the committed public-API snapshot publishes it, so vyre_libs::parsing::core and vyre_driver_wgpu::ext keep their names until the snapshot stops publishing them."
