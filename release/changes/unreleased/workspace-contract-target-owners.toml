category = "Changed"
text = "The workspace contract suite no longer compiles into `vyre-foundation`'s test target. `tests/contract/mod.rs` was included by `vyre-foundation/tests/contract_workspace.rs`, so a contract that judges the whole workspace could not run until the compiler built, and a crate that has nothing to do with the routing rule decided whether the rule ran at all. Each contract now sits with its subject: the device-only routing rule and the node child descent rule are `structure-gate` tests, which is the crate that reads source text and depends on no vyre crate; the validator rejection contract is a `vyre-foundation` test target; the public-API snapshot check joins the other snapshot contracts in `xtask`. `structure_gate::source_scan` owns the workspace source walk, the brace matcher and the comment and literal masker, and the masker is built on the same `opaque_span` the registration parser uses, so a masker and a parser can no longer disagree about whether a raw string or a nested block comment holds code."
