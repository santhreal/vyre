category = "Changed"
text = "Every published item is reachable at exactly one path. A submodule that exists because a file was split is crate-private and its owning module re-exports what it holds, so `vyre_foundation::types::shape::ShapeInterner`, `vyre_spec::extension::ExtensionSchema`, `vyre_driver::semantic_resource_abi::ImageFormat`, `vyre_megakernel::real_time::RealTimeObjective` and the rest are now written one way. `vyre_spec` also publishes the four extension traits and their id types at the crate root, and `vyre_foundation::region_ssa` publishes `DominanceVerifier`."
