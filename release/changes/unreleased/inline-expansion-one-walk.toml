category = "Fixed"
text = "Call inlining expands a call in every operand position. The caller side and the callee side each enumerated `Node` themselves and had diverged: the caller copied the `AsyncLoad` and `AsyncStore` offset and size and the `Trap` address verbatim, so a call written there survived a pass whose contract is that no call reaches a backend. Both sides are now policies over one expansion walk, `transform::inline::expand_walk`, which descends through the structural node rewrite. A call inside a callee body was also expanded under the caller's substitution, which renames locals but does not bind callee parameters or retarget buffer-reference arguments, so `call outer(BufferRef(data))` with a nested call in `outer` produced a program reading a buffer only the callee declares. Nested-call arguments are expanded under the callee's policy."
