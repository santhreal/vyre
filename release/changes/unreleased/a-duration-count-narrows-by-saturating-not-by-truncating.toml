category = "Fixed"
text = "`Duration::as_nanos` answers a `u128`, and a bare `as` cast discards the high bits instead of clamping, so a count past the target maximum is recorded as an unrelated small number and reads as a fast span. `vyre-foundation/src/perf.rs` narrowed both of its accumulation sites that way and now routes them through one saturating narrowing. A `truncating_duration_cast` rule in `xtask hygiene-matrix` makes the cast a release blocker in every crate, matching the whole-file code with whitespace removed so the spelling rustfmt splits across two lines is caught as well; the crate-local gate in `vyre-bench` that closed the same class there could not see either surviving site. The claim that the truncation showed up after 18.4 seconds was wrong in four documents: `u64::MAX` nanoseconds is about 584 years, so the boundary is unreachable for a measured span and what the cast loses is the number's meaning, not its range."
