category = "Changed"
text = "Three facts the `vyre-emit-ptx` tests depend on are now stated once each. The canonical MMA op kind, six coupled fields naming an `m16n8k16` row-by-column f16 multiply accumulating in f32, appeared in four places: twice in `index_facts.rs`, once in the schedulability probe in `<crate>/src/emitter/schedule.rs`, once in the MMA emission contract; `tests::f16_mma_kind` is now the only writer, so a shape or element-type change cannot leave one probe testing a combination the emitter no longer sees. The nine-op chain a four-way vector load fuses from, a base index and a stride feeding four loads at result ids 2, 4, 6 and 8 with the index add between them, appeared three times with the load kind as the only difference; `tests::four_load_chain` takes that kind and callers append their own tail, which also states that the `LoadConstant` shape `const_buffer_promote` leaves behind is the same chain rather than a similar-looking one. The two whole-program emit probes, grid-sync-in-a-loop refusal and nested-return branching, each carried their own copy of the region wrapper their programs are measured inside and of the lower-then-emit pipeline that reports which stage refused; `<crate>/tests/emit_probe/probe.rs` owns both, so a probe cannot wrap its body differently from the probe it is being compared against. Emitted PTX is unchanged."
