text = "Every CODEOWNERS row names a path this tree carries, and a tree contract fails when one stops resolving. Nine of fourteen rows named an older layout, including `/spec/src/lib.rs`, `/conform/src/reference/`, a threat-model document that is not in the tree and two scripts described as future files, and GitHub ignores a pattern that matches nothing, so the review requirement on the algebraic laws and the CPU reference interpreter had been off for as long as those directories had their current names. The rows now name `/vyre-spec/`, `/vyre-reference/`, `/conform/`, `/xtask-evidence/` and `/release/evidence/`."
