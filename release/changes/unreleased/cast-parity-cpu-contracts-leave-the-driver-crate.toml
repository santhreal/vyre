category = "Fixed"
text = "The asm-alias, mixed-initializer and incomplete-initializer classification contracts live with the rest of their family in `vyre-libs`. Nothing in them dispatches anything, so holding them in a driver crate's tests made the CPU classification of three C constructs depend on that driver compiling and left a package-scoped `vyre-libs` test run unable to check them. Deleted with the move: a second fixture builder for `typedef int (*fn_t)(int); fn_t f;`, whose four assertions were already made against the byte-identical `c_frontend::fixtures::declarator_matrix_constructs::fixture_nested_typedef_complex_declarator`."
