category = "Fixed"
text = "The `vyre-primitives::hardware::subgroup_add` intrinsic performed no subgroup operation. It summed thirty-two memory neighbours in a serial loop, so every lane re-read and re-added its whole subgroup out of storage, while registering the hardware semantic for a subgroup add and documenting itself as mapping to one. It now builds `Expr::subgroup_add`, the reduction the IR already carries and all three emitters already lower, with the lane value in a guarded local and the collective in uniform control flow so the participating-lane set is defined. Values are unchanged: the reference oracle and its three boundary cases are untouched and pass, including two subgroups of thirty-two."
