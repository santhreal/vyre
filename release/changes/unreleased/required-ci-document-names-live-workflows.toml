category = "Fixed"
text = "The `ci-required` gate resolves every workflow file name `.github/CI_REQUIRED.md` quotes, not only the ones under a blocking heading. The contexts under a heading were resolved against real workflows and a file name written as prose was read by nothing, so the deep-gate rows went on naming two lanes after both had been moved to `.github/workflows-paused`. A quoted name that is in neither workflow directory is now a finding, and a paused workflow named as a blocking section is a second one, because a paused workflow cannot report a context branch protection waits for."
