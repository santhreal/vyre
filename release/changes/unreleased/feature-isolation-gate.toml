category = "Added"
text = "`xtask feature-isolation` judges whether every declared feature compiles on its own. A crate that builds under its default features and under `--all-features` can still be uncompilable under one feature alone, because `--all-features` is a union that supplies whatever a feature forgot to require, and only the consumer who enables that feature sees the break. The gate derives the axis from the tracked manifests at run time and holds all 140 (member, feature) pairs, 35 members with one `--no-default-features` probe each plus 105 declared features, to the outcome recorded in `xtask/feature-isolation.toml`. A pair with no row, a row naming a pair no manifest declares, and a row whose outcome disagrees with the sweep are each a failure, so a new member or feature is red until a decision is recorded for it. The declaration half runs inside the gate sweep; the compile half is `--sweep` and CI owns it."
