category = "Fixed"
text = "A gate that needs its own crate directory resolves it at run time through `structure_gate::member_directory`, reached as `vyre_test_support::monorepo::vyre_crate_directory(env!(\"CARGO_PKG_NAME\"))`. Nine files, eight of them gates added this cycle, built a repository path from a compiled-in manifest directory. Every checkout here shares one cargo target directory and cargo hashes a member by its path relative to the workspace root, so two checkouts compute the same unit hash and hand each other compiled binaries: the reused binary then reads the OTHER tree's pin, fixture or golden file and asserts about that tree while claiming to describe this one. The resolver walks the root manifest's member roster rather than joining the package name onto the root, because a member's directory is not always its package name."
