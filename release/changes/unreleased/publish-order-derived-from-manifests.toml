category = "Fixed"
text = "The release publish order is derived from the manifests instead of listed in source. It was a hardcoded table of twenty-six steps, and moving library code into `vyre-libs` gave that crate five consumers while the table still held it at index twenty-one, so the recorded evidence certified an order that publishes `vyre-pass-engine`, `vyre-driver`, `vyre-runtime`, `vyre-driver-cuda` and `vyre-driver-wgpu` against a `vyre-libs` version crates.io does not have yet, with `blockers: []` throughout. The order is now a topological sort over the crates the metadata matrix calls publishable, keyed on the same dependency edges the order check enforces, with name-ordered ties so one tree yields one order. It fails closed rather than guessing: a publishable crate whose manifest is not on disk is a blocker, and a cycle among publishable crates is reported per member instead of resolved into some order."
