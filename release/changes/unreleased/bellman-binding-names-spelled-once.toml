category = "Fixed"
text = "`vyre_libs::math::bellman_shortest_path::BellmanBuffers` publishes `CANONICAL` and `TERSE` binding-name sets, matching the `SinkhornBuffers::CANONICAL` it already had. Four sites spelled the same six names, one of them in another crate, while the record documented itself as the only place they were spelled. Every field is a `&str`, so a full re-spelling is a positional list wearing field names: a transposed `src`/`dst` or `dist`/`next_dist` compiles, looks deliberate from either copy, and silently relabels which buffer the relaxation reads. The two sets stay disjoint so an assertion that reads a name back out of a program cannot pass by matching the other set."
