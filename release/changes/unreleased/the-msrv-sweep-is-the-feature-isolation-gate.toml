category = "Removed"
text = "`scripts/check_feature_msrv.sh`, `scripts/lib/check_feature_msrv.py` and `scripts/lib/cargo_runner.sh` are gone. The MSRV class is `feature-isolation --sweep --msrv`, which reads `[workspace.package].rust-version`, installs that toolchain when rustup does not carry it, and compiles an axis derived from the same manifests: every member rather than only publishable ones, plus the cross-member edge selections the retired matrix never built. The workflow step that read the manifest with a second reader is gone with it, and each script that resolved its own cargo now runs the tracked `./cargo_full` wrapper that every workflow already runs."
