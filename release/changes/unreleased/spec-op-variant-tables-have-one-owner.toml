category = "Changed"
text = "The frozen `vyre_spec` operator variant space is enumerated in one place, `tests/support/spec_variant_tables.rs`, instead of once per suite. Five suites carried their own list of every `BinOp`, `UnOp`, `AtomicOp` and buffer `DataType`, and the lists had drifted in both directions: the random-IR corpus was missing `WrappingAdd`, `WrappingSub` and `MulHigh`, and the wire round-trip sweep was missing six `UnOp` and six `BinOp` variants, so a variant no list named was a variant no suite exercised. The tables cannot be derived from the types, which are `#[non_exhaustive]` with no variant iterator, so the completeness gate reads the variant set out of the rustdoc public-API snapshot at run time and fails naming any variant a table omits. The xorshift sweep generator the suites had copied verbatim now lives in `tests/support/sweep_rng.rs` and rejects a zero seed, which is a fixed point of xorshift and would emit a constant corpus."
