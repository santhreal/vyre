category = "Fixed"
text = "The dead_buffer_elim pass deleted every store into a plain WriteOnly storage buffer. It rooted liveness in is_output(), the declaration flag, while BufferDecl::is_backend_allocated_output is the single cross-backend definition of a buffer the backend allocates and reads back, and it counts any WriteOnly buffer. A program whose whole body was one store to a WriteOnly output therefore optimized to nothing while the interpreter and every driver still read that buffer. Three further sites respelled the same predicate instead of calling it: autotune ranked a WriteOnly result buffer as an input when inferring a guard bound, and the grid-sync segment splitter did not recognise a WriteOnly accumulator an earlier segment had written, which is the fresh-WriteOnly overwrite its own comment warns about."
