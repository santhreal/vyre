category = "Added"
text = "`vyre_foundation::loop_bounds` reports every loop in a program whose iteration count is read from buffer contents rather than fixed when the program is built. Such a loop runs for as many iterations as one out-of-contract word states, and a guard inside the body does not bound it because the iteration already ran. The per-variant decision behind the answer is `visit::expr_magnitude`, exhaustive over `Expr` with no catch-all arm, so an expression variant added to the IR fails to compile until its magnitude is stated. The registry-wide scan over `vyre-libs` programs now reads that owner instead of a second copy of the same classification, and both walks are iterative, so an adversarially deep program costs heap rather than native stack."
