category = "Changed"
text = "The structure gate rejects concrete backend vocabulary in production source of a substrate-neutral crate, reading the word list from structure-gate/backend-vocabulary.toml at run time. The roster is every workspace member whose layer in docs/CRATE_OWNERSHIP.toml is neutral, so a new neutral crate is scanned without a rule edit. Documentation and comments in vyre-driver, vyre-lower, vyre-runtime, vyre-spec, vyre-reference, vyre-libs, vyre-foundation and vyre-primitives name capabilities and target dialects instead of vendors and emitter crates. vyre_runtime::uring::gpudirect renames its stats reader and byte cap to read_gpudirect_stats and MAX_GPUDIRECT_STATS_BYTES."
