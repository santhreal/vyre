category = "Fixed"
text = "The six byte counts that decide a megakernel wave's device-memory plan travel as one value, `vyre_driver::megakernel_execution::MegakernelByteLayout`, instead of a positional list of six `u64` arguments restated at every hop from the caller that measures them to `plan_megakernel_memory_budget`. The list was written out nine times across `vyre_driver::megakernel_execution`, `vyre_driver::megakernel_frontier`, `vyre_driver_cuda::megakernel_plan_cache`, `vyre_driver_cuda::megakernel_scheduler` and `vyre_driver_cuda::megakernel_barrier_planner`, and any two of the six could be exchanged at a call site without a compiler complaint because they share a type: swapping the scratch and output counts, or the per-node and per-edge counts, produced a plan that was arithmetically valid and wrong. Named fields make each of those a type error. `MegakernelExecutionRequest` carries the same value rather than a second copy of the same six fields, and the CUDA plan cache's unbounded sparse probe now says so in its own argument instead of leaving a bare `u64::MAX` in the eighth position."
