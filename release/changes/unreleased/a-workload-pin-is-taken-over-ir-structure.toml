category = "Fixed"
text = "The micro benchmark workload pins are taken over the canonicalized buffer roster and node tree instead of `Program::fingerprint`. That fingerprint is blake3 over the canonical wire bytes, whose first framed field is the wire format version, so raising the version from 8 to 9 moved all seven pins at once while no program's meaning moved, and the only answer a wire-digest table admits is copying the new numbers in. The new column is a function of the IR model alone, so a changed operand, a dropped node or a changed ABI moves it and a serialization revision does not."
