category = "Added"
text = "The `ci-required` gate holds the required status contexts to the workflows that define them: every context resolves to a job by display name or job id, every workflow carrying one runs on pull requests and on pushes to the protected branch without a path filter, and a fan-in job that always runs reads a dependency result and exits nonzero. Those six assertions used to run only when an operator applied branch protection by hand, so they ran on no schedule at all. The fail-closed rule now reads the job that opted into always running rather than searching the whole file, where an unrelated build step that exits nonzero satisfied it. The operator script keeps the API mutation and runs the gate before it applies anything."
