category = "Fixed"
text = "Region fusion reads which buffers each side touches, and both of the walks that answered it enumerated buffer positions per node variant and ended in a catch-all. Neither had an arm for the four collective statements, which name their operands as buffers and carry no operand expression at all, so an all-reduce, all-gather, reduce-scatter or broadcast was reported as touching nothing; an atomic read-modify-write was reported as a pure read. The positions are now owned exhaustively in `vyre-foundation/src/transform/visit.rs`, where adding a variant fails to compile, one walk collects both directions, and a node carrying an opaque payload reports the sets as a lower bound rather than as empty, which declines the fusion instead of guessing at it. The test that should have caught this compared two inline copies of the walk against each other and never called the production one."
