category = "Changed"
text = "Compiling a small graph into a canonical artifact is one fixture. Four crates each carried their own copy of it, and `vyre-megakernel` and `vyre-runtime` carried theirs byte-identically because their assertions compare artifact digests, which only agree while the two copies agree. The copies also each restated which buffer declaration a value contract implies, so a fixture whose declared element count disagreed with its contract shape was accepted by whichever crate wrote it and rejected by the next one to copy it. `tests/support/artifact_fixtures.rs` owns the mapping, the one-node graph and the compile request, and rejects a uniform or workgroup contract instead of silently making it global storage. Shared through `#[path]` the same way `tests/support/preferred_dispatch_backend_contract.rs` is. The facade's own `artifact_workflow` test keeps its inline construction: what it proves is that every type needed to build and compile a graph is reachable through `vyre`, so naming those types is the contract rather than setup."
