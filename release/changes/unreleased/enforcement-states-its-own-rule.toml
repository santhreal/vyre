text = "Five enforcement sites state the contract they enforce instead of citing a document. `structure-gate` names the composition rule at `CATEGORY_A_CRATE` and the one-owner rule at `substrate_home_failures`; `gate1` states the countable half of the composition budget it enforces and leaves the reuse criterion to the policy an author applies; the CLI surface contract names the generated README block it counts; and the tree-contract link unit states why two suites stay separate targets. A rule that lives only in a document stops being enforced the day the document is deleted, and four of these cited documents that already were."
