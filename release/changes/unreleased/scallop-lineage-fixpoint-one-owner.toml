category = "Changed"
text = "`vyre_libs::math::scallop_persistent` owns `lineage_fixpoint_program` and `accumulate_lineage_words`. `scallop_join` and `scallop_join_wide` each carried their own copy of the persistent program envelope and the lineage word join, so a change to the convergence protocol had to be made twice and the two spellings had already drifted in how they reported change. Both now call the owner."
