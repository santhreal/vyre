category = "Fixed"
text = "The registration-visibility walker in `xtask-registry` carried a hand-written list of four macro names to decide which lines open a registration, and called `structure_gate::submits_registrations` with the arity it had before that function learned to take a derived macro set, so the test target did not compile. Both readings now come from the same set the structure gate derives from the workspace tree, which is the closure over macro definitions that submit and macros that invoke one; the earlier list held four of the eighteen submitting macros this workspace already had."
