category = "Fixed"
text = "A tiled or blocked contraction seeds its accumulator and pads a partial tile with a zero of the buffer's own element type, so an f16, bf16 or i32 GEMM is no longer built with a `u32` literal the IR validator rejects. `ContractionEpilogue::QuantizedScale` declares the row-scale and batch-scale buffers its expression reads and indexes the batch scale at zero on 2D geometry, the cooperative tiled body stages tiles through the buffer names its spec supplies rather than two hardcoded names, and the MMA path accumulates in f32 with cast operand loads and declares no workgroup tiles, because its body reads A and B from global memory."
