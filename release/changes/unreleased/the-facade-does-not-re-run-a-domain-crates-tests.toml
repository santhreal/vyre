category = "Changed"
text = "`vyre-libs` no longer carries 177 integration test files that already exist in the `vyre-libs-*` crate that owns the code they exercise, and 37 of its 46 `[[test]]` targets go with them. Each removed file is content-identical to a file the destination crate's own test target compiles, differing only in whether it reaches the composition through the facade re-export or through the owning crate. One assertion had no destination, `substring_search_boundaries_do_not_panic`, and is now `vyre-libs-pattern/tests/substring_search_boundaries.rs`. The 252 files with no counterpart anywhere stay in the facade and still run. A new tree contract rejects a `.rs` file under the `tests/` directory of a package with `autotests = false` that no target compiles, and a `[[test]]` row naming a file that does not exist, which cargo reports only when that row's required features are on. `vyre-libs` also drops nine dependencies it never used: libm, rayon, regex-syntax, rustc-hash, serde, serde_json, smallvec, thiserror and tracing."
