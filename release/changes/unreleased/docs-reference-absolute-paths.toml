category = "Fixed"
text = "The documentation reference rule read an absolute path in a code span as workspace-relative, so a document mentioning `/dev/null` was reported as claiming a missing `dev/null` in this repository. An absolute path outside the checkout is no longer treated as a claim this repository can satisfy; one inside the checkout is still checked. The feature matrix for `vyre-libs` also named nine scan modules by a path that resolved nowhere, and one of them, the regex compiler, has been a directory rather than a file since it was split."
