category = "Added"
text = "A gate resolves every name a `run:` step passes to cargo or to a shell against this tree: each `-p` package is a workspace member, each `--test` and `--bin` target is declared or auto-discovered by the package the same command line addresses, and each `scripts/` path is published. Steps are extracted by indentation and each is its own scope, so a target is never resolved against a neighbouring step's package. Nothing is listed in the test: a workflow added tomorrow is judged tomorrow, and renaming a target without updating its workflow is red locally instead of in CI."
