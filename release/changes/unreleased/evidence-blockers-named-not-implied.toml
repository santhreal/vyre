category = "Fixed"
text = "Every evidence subcommand prints its blockers to stderr before exiting 1, through the one owner of that epilogue, `xtask::output_arg::report_evidence_artifact`. It wrote the artifact and exited on a non-empty blocker list without naming a single entry, so nine gates reported a bare exit code and the cause was readable only by opening the JSON. `xtask::release::release_conformance` returned a count of failing backends instead of the failures; it now returns each one prefixed by its backend id. `xtask_registry::release::conformance_matrix` kept a private write-then-exit epilogue beside the owner and is routed through it."
