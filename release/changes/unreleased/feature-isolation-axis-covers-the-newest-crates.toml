category = "Fixed"
text = "The feature-isolation gate records the eight pairs it was missing: `vyre-registry-link` with no default features and with each of its `cuda`, `metal`, `operations`, `reference`, `spirv` and `wgpu` features, and `vyre-test-support` with `ir-fixtures`. The gate derives its axis from the manifests at run time, so both crates turned it red the moment they landed after the recorded set was written. Every one of the eight compiles. The `SOURCES` builder in `vyre-registry-link/src/backend.rs` also stops binding a `mut` vector that only the feature-enabled builds mutate; the linked sources are now one `vec!` whose elements carry the `cfg`, so the no-default-features probe compiles without a warning."
