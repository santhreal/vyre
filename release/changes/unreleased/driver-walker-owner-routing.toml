category = "Changed"
text = "`vyre-driver` no longer enumerates `Node` for itself. Indirect-dispatch discovery, the launch-geometry scan, and backend support validation each descend through the owning enumerations in `vyre-foundation`, so a new statement variant reaches them without an edit. The three hand-written walks ended in a catch-all arm and `Node` is `#[non_exhaustive]`: an unsupported operation nested inside an unrecognised variant validated clean, and a kernel that read launch geometry inside one read as not reading it. `visit::any_expr_in` is public, as the composition of the node, operand, and expression owners that a scan over both namespaces needs."
