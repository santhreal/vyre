category = "Added"
text = "Two duplication classes in `vyre-libs` are gated, each deriving its member set from source at run time so a new member is red on its first run rather than missing from a hand-maintained roster. Every quantized dispatch entry point published as `_via` must carry a row asserting how it rejects a malformed backend readback, checked against the re-export list parsed from `vyre_libs::solvers::quantized_dispatch`. Every `ResidentCsrQueueMaterializer` variant must have a case pinning the step sequence it launches, checked against the variants parsed from `vyre_libs::graph::dispatch::csr_frontier_queue_scratch`. Each gate assertion names the fix rather than the failed comparison."
