category = "Changed"
text = "The reference oracle evaluates a program through one route. The dual-reference registry, the statement executor, the storage-graph interpreter and the flat adapters were four more answers to the same node semantics, and every `reference_eval*` entry point now resolves to the canonical evaluator. `vyre_reference::dual`, `dual_impls`, `dual_registry`, `cpu_op`, `dialect_dispatch`, `flat_cpu`, `expr`, `node`, `sequential` and `run_storage_graph` are removed; `reference_eval_expr` with `ReferenceMemory` evaluates one expression against the same evaluator."
