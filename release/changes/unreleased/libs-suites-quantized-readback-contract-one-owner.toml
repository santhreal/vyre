category = "Fixed"
text = "Every INT4 entry point in `vyre_libs::solvers::quantized_dispatch` rejects a backend output buffer count other than one through `shapes::expect_one_output`, which already owned that diagnostic while four of the six inlined their own copy of it. The copies were each half a contract: only `i4x8_batched_matmul_top1_f32_scaled_via` rejected two output buffers, and only it rejected a buffer shorter than the decoded shape, while the other four rejected only a longer one. `unpack_i4x8_via` checked neither. `decode_output_exact` compares byte lengths for inequality, so both directions always held for all six and no suite asserted more than one of them. Three parity assertions also compared results through `zip`, which passes on a truncated readback; they now compare the whole buffer."
