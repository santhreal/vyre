category = "Removed"
text = "Three shell copies of the lint hygiene rules are gone: `scripts/check_expect_has_fix.sh`, `scripts/check_unsafe_budget.sh` and `scripts/check_unsafe_justifications.sh`. The `lint-expect-fix`, `lint-unsafe-budget` and `lint-unsafe-justification` gates own those rules, read tracked files rather than the working tree, and cannot mistake a failed search for a clean one. The expect ratchet in particular took its ceiling from `VYRE_EXPECT_BASELINE`, so any caller could raise it from the environment; the pin now lives in `xtask/gate-baselines.toml`, which no caller can override."
