category = "Removed"
text = "`vyre_libs::prelude` is gone. It re-exported forty items that each already had a path, so `TensorRef`, `BuildOptions` and every built-in builder were reachable at two paths and some at three. It was declared as the one seam a dialect crosses through, but one module in the crate reached through it and one template outside the crate glob-imported it, so the seam described a discipline no code followed. Callers name the module that owns the item: `reasoning::do_calculus_change_impact` names `analysis::dataflow_fixpoint`, and the dialect template names `vyre_foundation::ir`, `vyre_libs::region` and the crate root."
