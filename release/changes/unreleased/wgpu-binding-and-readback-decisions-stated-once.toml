category = "Changed"
text = "Four binding and readback decisions in `vyre-driver-wgpu` are stated once. `pipeline::binding::declared_byte_size` owns the element-count-times-element-size product with its overflow refusal, previously written out in handle validation, in persistent padded sizing, and on the input path of record-and-readback; `pipeline::binding::accepts_params_handle` owns the params-slot predicate that pre-recorded and persistent dispatch each spelled out. `TimestampRecorder::pass_writes` and `TimestampRecorder::finish_and_resolve` own the timestamp write pair and the query resolve, which three and two callers respectively had inlined. Every resident dispatch entry point reads its outputs back through one trimmed-readback pass. Emitted shader text, binding order, and readback ranges are unchanged."
