category = "Fixed"
text = "The C-AST parity families evaluate one case list on both backends. Each family has a CPU classification arm reading the oracles and a backend parity arm dispatching the same kernels, and each arm used to enumerate its cases by writing one test function per fixture it named, so the two lists were independent and had drifted. `c_frontend::fixtures::declarator_matrix_constructs::fixture_gnu_restrict_qualifier` was named by the CPU arm and by no backend arm, leaving GNU `__restrict` normalization proven on the oracle and unproven on every device; `c_frontend::fixtures::semantic_gap_constructs::fixture_inner_typedef_shadows_outer` reached no backend arm either, so the one construct in that family whose purpose is scope-dependent typedef visibility was never dispatched; six declarator-matrix cases and `fixture_anonymous_struct_union` reached a backend classifier but never a backend property-graph lowerer. Both arms now iterate the family's `CASES` table beside its fixtures, and `c_frontend::parity_matrix` owns the four stages, every program they dispatch, and the comparisons, so a construct cannot be proven on one side and unproven on the other."
