category = "Fixed"
text = "The persistent-fixpoint routing contract is asserted in one place, `vyre_libs::fixpoint::routing_contract`, over a description of what an op builds on either side of one workgroup width. Each routed convergence op previously carried its own copy of the same four obligations, and the copies had drifted in what they accepted: both pinned the grid fence count to a literal 8 without stating that the count is two fences per wave, so neither would have caught a build whose wave count changed. The contract now checks all four at four iteration budgets, and both ops register every way their dispatch outgrows one workgroup rather than only the widest state buffer: `vyre_libs::math::bellman_shortest_path` registers node-widened and edge-widened spans, and `vyre_libs::math::sinkhorn_iterate` registers scaling-widened and kernel-widened spans. The span is the widest declared buffer once a program carries atomics, so four nodes with 257 edges, and a 17-by-17 kernel over two 17-element scaling vectors, both cross the threshold while the ping-pong state still fits one workgroup."
