category = "Fixed"
text = "Twenty-two path citations in Rust doc comments named files the tree no longer carries. The docs-references gate reads tracked Markdown, so a citation written in a `//!` header was never judged: the primitives-to-libs move left `vyre-primitives/src/hash/adler32.rs`, `vyre-primitives/src/reduce/indexed_move.rs` and two test paths pointing at nothing, five tests still credited a deleted `scripts/check_public_api_snapshot.sh` for a snapshot the `public-api` gate now regenerates, and a barrier-count claim rested on a C parser module that was removed. Each now names the live owner, and the CUDA grid-sync header cites the five top-level barriers `vyre-libs/src/graph/persistent_bfs/program.rs` actually ships."
