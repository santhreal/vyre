category = "Changed"
text = "The recurrent and chunked gated delta schedules no longer carry private copies of the parts they share. The head partition, the matrix-state copy, the key and query L2 normalizers, and the normalized key and scaled query operands are built once in nn::attention::gated_delta_spec and used by both. Only the schedules differ: the recurrent form advances the state one token at a time and needs no tile scratch, so it keeps its 64 head slots per workgroup, while the chunked prefill keeps its cumulative-decay triangular tile. The chunked program is unchanged. The recurrent program derives its value head with a remainder, normalizes the key and the query in two loops instead of one fused loop, and orders the operands of each scaled product to match the chunked form, which changes its emitted representation without changing any value it computes."
