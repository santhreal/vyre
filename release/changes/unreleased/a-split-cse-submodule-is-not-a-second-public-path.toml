category = "Changed"
text = "Cross-scope CSE and the analysis Programs it dispatches were reachable at two public paths each: `optimizer::cse_via_encoded`, which the module documentation names as the owner, and `optimizer::cse_cross_scope` and `optimizer::cse_programs`, which exist only because that file was split. Seven items answered to two names, so a consumer could pin either and a rename could break one path while the other kept compiling. The two split submodules are now private and `cse_via_encoded` re-exports what they hold; `apply_cross_scope_cse`, `apply_cross_scope_cse_with_lookup`, `build_canonical_id_program`, `build_canonical_delta_compact_program` and `build_structural_hash_program` keep the path the documentation always named."
