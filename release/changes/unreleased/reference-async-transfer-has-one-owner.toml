category = "Changed"
text = "The async byte copy in `vyre-reference` has one owner, `vyre-reference/src/execution/async_transfer.rs`, and the copy itself goes through two new window methods on the reference buffer. Each of the two reference node executors carried its own transfer enum, its own offset-and-size-to-byte-count conversion, its own short-tail-zero-padding read and its own past-the-end-dropping write, and the two writes disagreed: the statement executor recovered a poisoned byte lock with `into_inner()` while the hashmap executor panicked. A poisoned lock means a writer panicked mid-store, so the recovering arm could copy half-mutated bytes into an output buffer and hand the conform gate a golden value no correct backend can reproduce. Both arms now read and write through `read_window` and `write_window` in `oob.rs`, which own that policy, and the fail-closed test covers both helpers instead of only the hashmap path."
