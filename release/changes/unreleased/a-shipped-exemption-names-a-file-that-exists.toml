category = "Fixed"
text = "The exemption list shipped with vyre-lints drops 59 rows that named a file no longer in the tree, and a test now fails on any row that names nothing. An exemption keyed on a path silently exempts nothing after a rename or a split, so the count it holds back grows by every construction site in the files that moved. The header states what the file is: the default configuration of the shipped lint, read by no workspace gate."
