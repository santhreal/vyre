category = "Removed"
text = "vyre-driver::shadow is deleted. It let a driver run a program on the reference interpreter beside the device, which put a host execution path inside a shipped crate. AccuracyStrategy::{Direct, ShadowReference} is now ConformanceStrength::{Standard, Exhaustive}, StrategyPlan::accuracy is StrategyPlan::conformance, and AccuracyPlan::shadow_reference_recommended is AccuracyPlan::exhaustive_conformance_required. Comparing a device result against a reference belongs to the conformance harness, which reports a mismatch rather than substituting the host answer."
