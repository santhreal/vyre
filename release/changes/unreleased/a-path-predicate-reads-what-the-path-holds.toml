category = "Fixed"
text = "Four path predicates decided a name by `.is_dir()`, which stays true after every file under the directory is deleted. `consumer_manifests` returned an empty roster when `consumers` held no manifest instead of reporting the read, `composition_crate_sources` and `partition_domain` counted a source directory that holds no Rust file, and the test-target closure walk selected the members it judges by the presence of a `tests` directory rather than the test files the tree supplies. Each now reads content, so an empty directory left behind by a move stops the run instead of shrinking the set that is judged."
