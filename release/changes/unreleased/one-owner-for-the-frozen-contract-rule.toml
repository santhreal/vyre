category = "Removed"
text = "`scripts/check_trait_freeze.sh` is gone. It was a second implementation of the frozen-declaration check with its own table of seven contracts, their source files and their keywords, invoked by no workflow, so the two owners of one rule could disagree without anything noticing. The `frozen-contracts` gate is the only owner. `vyre-foundation/tests/ci_script_frozen_contract_coupling.rs` held a third copy of the same table and is gone with it; the workflow-reference rule it also carried now lives in the gate sweep, where the registry, the baseline, the subsets and the workflows already have to agree. The script's section left `xtask/script-assertion-ledger.md` by deletion."
