category = "Fixed"
text = "A default build of vyre-libs emitted programs whose child regions named builder operations that build was not compiling. The two shared builder child regions register behind builder-ops, and the dialects that emit them, math-dialect, math-linalg, nn-activation, nn-norm, nn-attention and llm, did not name that feature, so thirteen catalog entries lowered to a region reference no registry in that build could resolve. Each composing dialect now names builder-ops, and a test walks every catalog entry under the selection it is compiled with and fails on any region naming an operation the running registry does not hold."
