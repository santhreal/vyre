category = "Changed"
text = "The lint policy is declared once, in [workspace.lints], and every workspace member inherits it. Two members declared their own tables and twenty crate roots overrode the policy with an inner attribute, so vyre-driver-metal allowed unsafe_code outside the reviewed budget and vyre-grammar-gen held missing_docs at warn while the workspace denied it. Blanket allows that warn by default moved into the workspace table with their justifications; the pedantic and restriction names beside them were suppressions of lints no member enables and are gone. The new lint-one-policy gate reads the member roster from the workspace manifest at run time and reports a member that declares its own table, omits the inheritance, or sets a level at its crate root; the only accepted crate-root exception is allow(unsafe_code) alone, which xtask/unsafe-budget.txt already reviews. It replaces lint-missing-docs-override, which read one lint out of that population. Deleting vyre-driver's crate-wide allow(unused_imports) exposed twelve unused imports, and one crate-root override was hiding a missing crate document."
