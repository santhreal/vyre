category = "Fixed"
text = "`vyre_foundation::transform::rewrite_walk::rewrite_node` is the only rewriting enumeration of `Node`, which it already claimed to be. `vyre_foundation::optimizer::rewrite` carried a second exhaustive match over every variant, and the pair had diverged: the owner descended into an async copy's `offset` and `size` and the copy did not, so every pass routed through the optimizer's whole-program expression rewrite left those two expression positions alone. The by-value copies in `vyre_foundation::optimizer::passes::algebraic::const_fold::reaching_def_propagate` and `vyre_foundation::optimizer::passes::loops::loop_lower_bound_normalize` are gone as well; each ended in a catch-all arm, so a `Node` variant added later would have been walked as a leaf and its children never substituted, which for a substitution is a stale variable reference rather than a missed optimization. Lower-bound normalization now calls `vyre_foundation::transform::subst`, which already owned that rewrite and additionally refuses to substitute into a nested loop that rebinds the name."
