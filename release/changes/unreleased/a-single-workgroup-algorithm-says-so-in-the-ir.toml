category = "Fixed"
text = "Three registered compositions published a different result once the dispatch was rounded up past the grid they were built for. `builder::strided_accumulate` let every workgroup write the final single-value store, and the Jacobi eigen body shared by `math::symmetric_eigen_jacobi` and `math::tensor_train_decompose` seeded the identity eigenbasis across whichever workgroups were launched, so a second workgroup re-seeded it after the first had finished sweeping and the caller received an identity matrix. Both now state the constraint in the IR: the accumulate store is guarded on the first workgroup and lane zero, and the whole cooperative Jacobi body runs under a first-workgroup guard, which is workgroup-uniform and therefore keeps the barriers inside it legal."
