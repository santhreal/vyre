category = "Added"
text = "`vyre-libs` gates the row contract the C typedef-annotation family agrees on, deriving its member set at run time from the `pub use` re-exports of `vyre_libs::parsing::c::parse::vast::typedef_ann` so a new builder is red on its first run until someone records what it writes. No builder may declare a zero-length buffer for an empty node table, every builder must size its row tables by the one shared stride at several row counts, and every pass must carry every VAST field it does not declare that it writes, checked by running each program on a table whose carried fields all differ per row."
