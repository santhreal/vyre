category = "Added"
text = "`xtask` declares `default-run`, and a tree contract derives every `cargo run` in the workflows and scripts at run time, derives the binary targets from every member's manifest and source layout, and fails when an invocation does not resolve to exactly one target. A package that ships more than one binary and declares no default makes a bare `cargo run -p <package>` exit 101 before running anything, which is a property of the manifest rather than of any line of code: adding a second file under `xtask/src/bin` failed nineteen hosted jobs at their first step and nothing in the workspace could see it. The sweep already asserted that every registered subcommand is named by a workflow; this is the other direction. An invocation form the scan cannot attribute is an error rather than a skip, because a form nobody checked is how this reached CI."
