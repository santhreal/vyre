category = "Added"
text = "`docs/book.toml` builds `docs/` as one mdBook. `src` is the documentation directory itself, so the navigation mdBook reads is the `SUMMARY.md` that `xtask docs-check` renders from `DOCS.toml`, and there is no second table of contents to keep in step. `create-missing = false` turns a chapter the navigation names and the tree lacks into a build failure instead of an empty page. `docs/archive/0.7-2026-08-15/` holds the frozen 0.7 book: the two authored pages it still carried, plus the thirty pages deleted on 2026-08-12 recovered from history, each registered `status = archived` with `nav = false`, so the record is one directory rather than a directory plus a commit range. The documentation gate already excludes archived pages from navigation and from link resolution."
