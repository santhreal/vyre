category = "Fixed"
text = "An op the whole-program compiler splits into more than one fusion group can build a target payload. `selected_resource_bindings` resolved a descriptor binding name against the entry ABI, which lists what the host binds and therefore excludes a value one group writes and another reads, so every such op failed target compilation with `fusion group N descriptor binding \u0060X\u0060 has no canonical artifact resource`: `vyre-libs::security::aliases_dataflow`, `flows_to_to_sink`, `flows_to_with_sanitizer`, `integer_overflow_arith`, `sink_intersection`, `taint_pollution` and `vyre-primitives::text::line_index`, on every dispatch backend. The lookup is now built from the artifact resource set, which is the owner of value identity, and one artifact that gave two values the same resource name is refused by name rather than resolving to whichever came first. Payload entry identity moved from the entry symbol name to the canonical node for the same reason: every fusion group emits its own module image with its own entry symbol, so two groups both naming their entry `main` is correct, and requiring the names to be unique across a payload rejected every artifact with more than one group. A value an entry produces without reading it is no longer requested from the caller as a host input, because an inter-group intermediate is device state rather than a caller buffer."
