category = "Fixed"
text = "The feature-isolation gate no longer stores a compile outcome. Every row of xtask/feature-isolation.toml recorded whether the selection compiled and whether a sweep had ever measured it, so a fact that goes stale the moment a feature edge moves lived in a tracked file, and the file could not tell a measurement from a value someone typed. A row now declares the selection and, when it cannot compile, the constraint that exempts it. Whether a selection compiles is produced by the run that compiles it and is never deserialized, a sweep narrowed by member or by unrecorded selections reports every selection it left unmeasured and exits non-zero instead of reporting agreement it did not observe, and a data file that still carries the measured key or an outcome of compiles is rejected with the reason the column moved into the run. The probe also resolves cargo through the one owner of that decision rather than reading CARGO itself, which is unset on a CI step that does not run under cargo."
