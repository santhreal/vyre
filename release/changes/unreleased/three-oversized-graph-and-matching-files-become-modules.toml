text = "Three oversized vyre-libs sources become directory modules named for their concerns. pattern/nfa_to_dfa.rs splits into error, state_set, subset and dedup; graph/motif.rs into pattern, layout, plan, program and registry; graph/toposort.rs into error, csr, plan and program, each with its contracts under tests. Every body moved verbatim, so the emitted programs and the operation catalogs are unchanged."
