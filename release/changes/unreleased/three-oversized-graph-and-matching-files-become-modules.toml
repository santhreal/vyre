category = "Changed"
text = "Three oversized vyre-libs sources become directory modules named for their concerns. matching/nfa_to_dfa.rs splits into error, state_set, subset and dedup; graph/motif.rs into pattern, layout, plan, program, cpu_ref and registry; graph/toposort.rs into error, csr, edge_list, plan and program, each with its contracts under tests. Every body moved verbatim, so the emitted programs and the operation catalogs are unchanged. The motif host reference carried the cpu-parity gate once per item; the gate now sits on the module declaration, where an omission cannot ship a host classifier into a device build."
