category = "Fixed"
text = "Acquiring the wgpu backend from two threads at once no longer kills the process. Every adapter query and device request built its own wgpu instance, and two overlapping instance constructions raced inside the Vulkan loader: one thread negotiating an ICD in vkCreateInstance left the loader dispatch table half written, and the other called through a null function pointer from vkEnumerateInstanceExtensionProperties. Instance construction is now serialized process-wide, and the instance stays per acquisition because the GLES backend inside it owns a thread-current EGL context."
