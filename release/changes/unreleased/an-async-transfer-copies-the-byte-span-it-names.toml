category = "Fixed"
text = "An asynchronous transfer carries its offset and length in bytes, but the naga emitter turned the byte offset into a word index by dividing it by four, so every offset that was not a multiple of four copied from the wrong byte and the GPU disagreed with the reference evaluator by a byte rotation. A store also shortened the copy to the length of the source instead of padding with zeros, and both directions overwrote up to three destination bytes past a length that was not a whole number of words. The emitted loop now assembles each word from the two source words the span straddles and merges a partial end word under a byte mask, and an offset and length that are literal multiples of four still emit one load and one store per word."
