category = "Added"
text = "`vyre-foundation` adds domain-neutral `ProgramGraph` whole-graph composition APIs (`ProgramGraphBuilder`, `inline_subgraph`, `add_bounded_loop`, `add_conditional_branch`, `add_effect_barrier`, `add_stream`, `ValueLifetime::Stream`, `ExternalEffect`, `ControlBounds`), completes 10-variant `LogicalRegionKind` definitions with scratch, progress, ordering, and numeric contracts, and provides schedule distribution lowering across lanes, subgroups, workgroups, grids, queues, and resident partitions; `vyre-libs` implements representative complete multi-domain graph compositions and proves identical production compilation paths across neural, graph traversal, and streaming parser domains."
