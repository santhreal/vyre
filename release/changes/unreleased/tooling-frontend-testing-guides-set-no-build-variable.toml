category = "Changed"
text = "The thirty-six generated testing guides, their `docs/testing/TESTING.toml` command rows, the contributor gate list, and the performance notes all invoke `./cargo_full` with no `CARGO_BUILD_JOBS=1` prefix. The wrapper already exports that variable, so every prefixed command was a second copy of one setting, and the copies taught a rule the repository forbids: a build-affecting variable belongs in the cargo config or the wrapper, not on a command line. The generator and the two contract tests that pinned the prefixed text move together, and the contributor guide no longer claims a `rustc-wrapper` the cargo config does not declare."
