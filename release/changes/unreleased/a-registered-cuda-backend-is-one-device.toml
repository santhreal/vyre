category = "Fixed"
text = "The registered CUDA backend resolves one shared device handle for both its dispatch facet and its materializer facet. Each facet used to call `CudaBackend::acquire()` on every request, so a seven-stage resident optimizer run built seven device generations, each with an empty module cache, empty allocation pools, a private resident store whose handles the other generations reject, and private telemetry counters that no caller could read. One run of the resident optimizer pipeline on an RTX 3080 Ti cost 48.2 ms and reported zero host-to-device bytes, zero readback bytes and zero synchronization points; it now costs 35.3 ms and reports 6028 host-to-device bytes, 1224 readback bytes and 21 synchronization points."
