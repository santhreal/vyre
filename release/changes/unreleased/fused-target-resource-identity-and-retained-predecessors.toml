text = "Materialized artifact execution preserves declared retained values across multi-segment dispatches and resolves all resource identities in fused multi-node modules. `ResourceRecord` explicitly persists canonical `retained_predecessor` lineage across schema version 6 framing, from which `InstanceCore` derives predecessor relationships and updates antecedent retained values upon absorption. `InstanceCore` derives module inputs and outputs directly from the target entry point's resource bindings in descriptor order, target payload admission permits canonical resources bound across distinct descriptor slots for fused producer/consumer aliases, and target resource binding projection resolves exact buffer names across member nodes without cross-node slot collisions."
