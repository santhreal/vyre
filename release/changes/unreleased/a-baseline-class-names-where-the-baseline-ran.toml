category = "Fixed"
text = "A benchmark baseline class states where the baseline ran, and the recorded timing has to agree with it. `foundation.optimizer.impact` dispatches the same program twice, with and without the semantic optimizer, and filed the pair as `CpuSota`; a class is a provenance claim, so a self-comparison read as a speedup over a host implementation of the primitive. `BaselineClass` gains `SelfUnoptimized`, every case declares its own class instead of inheriting one, and release evidence is refused when a host class records a dispatched baseline or a device class records none. The placement is an exhaustive match, so a class added later does not compile until it says which side it is on."
