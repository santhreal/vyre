category = "Fixed"
text = "The f32 parity canonicalizer has one owner. `vyre_foundation::fp_parity::canonical_f32` states the rule once: a NaN becomes the canonical quiet NaN and a subnormal becomes a zero of the same sign. Three production copies of that body existed, in the foundation scalar operations, the foundation IR evaluator, and the reference float operations, so a change to the parity contract had to be made in three places to take effect. The wire encoder keeps its own canonicalizer because it enforces a different contract: it also collapses negative zero and flushes subnormals to positive zero, which loses sign. The two test-side restatements also stay, each now saying why: a judge that calls the code it judges proves nothing."
