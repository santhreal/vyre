category = "Fixed"
text = "Enabling one `vyre-libs` composition feature no longer resolves the whole primitive substrate. `vyre-libs` used to enable 19 `vyre-primitives` domains unconditionally, so a consumer that wanted substring scanning also compiled the neural-network, parsing, topology, geometry and optimization domains, and no feature declared what it actually used. The unconditional set is now the three domains the ungated module trees need: `graph` for `vyre-libs/src/graph/ast_walk.rs`, `text` for `vyre-primitives/src/text/char_class.rs`, and `inventory-registry` so primitive registrations reach the catalog. Every other domain rides the feature that gates its consumer: `math` on the five `math-*` features and on `visual`, `nn` on the four `nn-*` features, `matching` on `matching-substring`/`matching-dfa`/`decode`, `nfa` on `matching-nfa`, `decode` on `decode`, `visual` on `visual`, `hash` on `hash` and `intern`, `bitset` on `logical`, `parsing` on `c-parser` and `python-parser`, `predicate` and `label` on `security`, `predicate` also on `c-parser`. `geom` and `opt` are dropped; no `vyre-libs` module uses them. `vyre-pass-engine` now takes `vyre-libs` with `default-features = false`, since it uses only `dispatch_buffers` and `graph`, so an optimizer-only consumer resolves seven primitive features instead of thirteen."
