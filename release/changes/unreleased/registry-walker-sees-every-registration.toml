category = "Fixed"
text = "The tool that generates every operation document from the live registry now links every crate feature that gates a registration. Its dependency edge on `vyre-primitives` named fourteen domain features by hand, and `geom`, `opt`, `decode` and `visual` had fallen out of that list long after the documents were generated with them on, so nine files of registrations were invisible: the walker reported a smaller registry, and every generated document agreed with it. Nothing was red except three backend matrix rows reporting `no live registration` for `clifford2_geometric_product`, `tfn_scalar_mix` and `homotopy_euler_predictor`, which also took down the inventory contract in `vyre-foundation`. Both edges now name the source crate's own aggregate feature instead of a list kept by hand, and the regenerated documents are byte-identical, which is the proof that the documents were right and the edge was wrong."
