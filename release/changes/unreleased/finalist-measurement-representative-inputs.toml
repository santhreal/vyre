category = "Changed"
text = "Compiler finalist evaluation binds representative workload inputs rather than zero-filled buffers so valid production traps do not abort compile-time device timing. `CompileRequest` owns representative bytes keyed by `GraphValueId`, and `RequestIdentity` commits to their ordered digests and lengths. `DeviceFinalists` fails closed on missing or mismatched host resources. `ProductionSession::compile_with_representative_inputs` and `ExecutionRoute::open_with_representative_inputs` accept Program host-input order. Runtime-sized host buffers keep dynamic target IR while their representative bytes establish exact artifact resource counts."
