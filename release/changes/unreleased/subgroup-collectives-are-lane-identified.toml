category = "Fixed"
text = "The registered witness programs for `vyre-primitives::hardware::subgroup_ballot` and `vyre-primitives::hardware::subgroup_shuffle` passed an unguarded buffer load as the collective's operand, and the reference interpreter resolved a lane's subgroup peers by the position the schedule happened to step them in. Every lane of a subgroup contributes to a collective, so an operand written as `load(buffer, idx)` is a read at every lane index in the subgroup rather than only at the indices a store guard admits: the ballot performed 112 out-of-bounds loads and the shuffle 224 on their own declared-valid fixtures, on the natural grid and one workgroup past it. Both now compute the operand into a control-flow-guarded per-lane local and take the collective in uniform control flow, where the participating-lane set is well defined instead of dependent on the active mask of a divergent branch. The interpreter now captures its lane snapshots indexed by lane, so a ballot returns its own subgroup's mask and a shuffle sources the lane it was asked for under any step order; before, a reversed schedule gave lane 0 the mask of the neighbouring subgroup. Category C registrations are enumerated from the registry at run time and run through every safety rule, including reversed and rotated lane orders, so a new intrinsic cannot arrive with a witness program no gate executes."
