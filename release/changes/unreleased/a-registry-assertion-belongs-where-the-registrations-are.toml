category = "Fixed"
text = "vyre-test-support::operation_registration_universe asserted a 40-operation floor against the global inventory registry, but its own crate links nothing that registers, so both callers ran against an empty registry and neither could pass. The coverage lane exposed this the moment it began building each package alone. The module and its two unpassable tests are gone; the assertions that carry a contract, that every registration has an id, a non-zero semantic version and either a builder or a signature, now run in vyre-libs/tests/operation_registry.rs over the registry itself rather than a hardcoded floor."
