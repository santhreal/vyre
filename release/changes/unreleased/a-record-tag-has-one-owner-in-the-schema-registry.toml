category = "Fixed"
text = "`BundleCertificate` no longer declares `vyre-conformance-certificate-v1` as one of its own retired record tags. That tag belongs to the conformance certificate lineage, so two schemas retired one tag and neither recorded the bundle's actual previous spelling, which is now `vyre-bundle-certificate-v1`. `SchemaRegistry::tag_authority_violations` reports every way a `domain_separator` and a `stale_fixtures` entry can collide in their shared string namespace: a tag live for one schema and retired by another, two schemas sharing a separator, one tag retired twice, and a `semver` bump that never reached the version the separator carries into the digest."
