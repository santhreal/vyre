category = "Changed"
text = "`vyre_foundation::pass_substrate::dataflow_fixpoint` is now `pass_substrate::semiring_closure`. Two modules in one crate carried the name `dataflow_fixpoint`: this substrate, which closes a semiring matrix product to a fixpoint, and `transform::compiler::dataflow_fixpoint`, the live compiler primitive. A reader who found one had no way to know which one, and a caller who imported the wrong one got a type error rather than a name error. The substrate is named for what it computes, its twelve callers name it, and `pass_substrate/mod.rs` carries a header and one documented line per module instead of an allow for missing documentation."
