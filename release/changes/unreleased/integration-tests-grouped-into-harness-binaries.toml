category = "Changed"
text = "Integration tests link one binary per crate and required-feature set instead of one per file, cutting 1,342 test targets to 94. Every test file is now a module of the harness for its feature set, `autotests = false` in every member stops cargo from discovering a second copy, and a test that mutates process-global state keeps a target of its own under the decision recorded in `xtask/test-harness-isolation.toml`. The new `test-target-membership` gate rejects a test file no target declares, a package that leaves autodiscovery on, a file with test cases in two harnesses, and an isolated test compiled into a shared one. The per-package test-binary deletion loop in CI is gone with the disk pressure that required it."
