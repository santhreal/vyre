category = "Fixed"
text = "The buffer-set equivalence property reads the declared owners instead of restating them. `referenced_buffers` answers from `ProgramFacts`, whose SoA extraction fills its `buffer_refs` column from its own exhaustive match, and nothing made that column agree with `visit::node_buffer_refs` and `visit::expr_buffer_ref`, which are the declared owners of which variant names a buffer. The oracle that checked it was a third enumeration ending in `_ => {}`, so a variant added to both real enumerations was reported as naming nothing by the oracle and the property passed while the two sides were free to disagree about it. It now composes the two owners, which makes it an oracle for the agreement rather than a second opinion about the variant list."
