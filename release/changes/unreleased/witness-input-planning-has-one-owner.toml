category = "Changed"
text = "Every witness input expansion routes through `WitnessInputPlan`. Three copies of the planner existed beside the owner: the per-op ULP audit and the cross-backend parity matrix each carried a full reimplementation differing only in the prefix on each error string, and a rename layer aliased the owner's type and forwarded its functions under the copies' names. The owner gained the two operations only the copies had, `buffer_indices` and `plan_witness_inputs_owned_into`, and each copy's unique test moved to it. Three expansions of one fixture is three chances for a gate to compare against an input stream the dispatcher never saw."
