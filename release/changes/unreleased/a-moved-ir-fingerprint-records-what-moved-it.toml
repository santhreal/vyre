category = "Fixed"
text = "The digraph resolution phase of the C11 lexer no longer borrows another crate operation id for its name. That child region was labelled with the utf8 validation id and then, when the constant went crate-private, with the line index id: two different primitives for one body that resolves digraphs and splices lines and calls neither. It is a phase boundary inside one operation, so it carries the anonymous prefix and names what it does. Nineteen pinned IR fingerprints across the lexer and parser walk families are re-recorded with the change that moved each of them: this rename, the earlier rename of every child region that had derived its name from its parent operation, and the collapse of the C declaration prefix walk onto one owner whose disqualifier token set differs from the copy the annotate builders had been reading."
