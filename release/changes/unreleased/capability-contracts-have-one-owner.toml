category = "Changed"
text = "Program capability scanning and backend capability enforcement are proved in one place, `vyre-foundation/tests/capability_contracts.rs`. An inline test module beside `vyre_foundation::program_caps` exercised the same public surface and the two had drifted in opposite directions. The suite derives its expectations from the public API snapshot at run time: every boolean `RequiredCapabilities` field must have a scan case that a program needing the feature sets and a scalar program does not, and every `supports_*` parameter of `check_backend_capabilities` must have a case where withholding it rejects a program that needs it, so a capability added later fails the suite until somebody records what proves it."
