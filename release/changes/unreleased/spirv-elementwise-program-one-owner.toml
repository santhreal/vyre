category = "Changed"
text = "The element-wise programs the SPIR-V dispatch tests and the Vulkan probe example run have one owner in `vyre-driver-spirv/tests/support/elementwise.rs`, shared by path include. The add, output-first add, and multiply-add programs plus the `u32` byte conversions were written twice, once in the test and once in the example, so the example could drift from the shape the test pins. The test also grew a reference-output helper and a lane comparison, which replaces two copied assertion loops and three copies of the little-endian input encoding."
