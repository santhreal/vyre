category = "Fixed"
text = "The reference interpreter states one input ABI in both of its refusals. A vector longer than the reference input count named `vyre_reference::is_reference_input` as the predicate that selects inputs, while a vector one Value short asked for one Value per non-output non-workgroup buffer, which is the longer vector the same function rejects. A caller following the shorter refusal built the list that the other arm refuses. Both now name the predicate, and a test pins the short-list message the way the long-list message was already pinned. The post-loop count check is removed: the long arm refuses a longer vector and the per-buffer lookup refuses a shorter one, so it could not fail."
