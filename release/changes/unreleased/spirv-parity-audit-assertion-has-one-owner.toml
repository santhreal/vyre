category = "Changed"
text = "The cross-emitter parity suite states the audit contract once. Three tests each listed all four audit layers, substrate-neutral plus one per target, and asserted that each carried the kernel id it was handed; two of them differed only in whether they audited a descriptor before or after verification, so the copies were near-identical bodies whose divergence would have been invisible. `assert_audits_carry_kernel_id` is the single list, and it also pins the PTX report's target, which only one copy checked. The smallest store descriptor was built twice in the same file, once as the corpus entry and once inline for the id test with a different binding name; `store_one_kernel` takes the id and the slot and owns the shape."
