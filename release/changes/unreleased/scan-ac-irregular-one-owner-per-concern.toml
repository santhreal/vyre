category = "Changed"
text = "The irregular Aho-Corasick bench case cluster has one owner per concern. `vyre-bench/src/cases/scan_ac_irregular/mod.rs` held module wiring, the shared constants, and one of the two case implementations, and the literal scan and the count preflight each carried their own copy of the workgroup validation, grid derivation, resident reset-then-scan dispatch, transfer accounting, and BenchRun assembly. The case now lives in `literals.rs`, the sampling path in `sample.rs`, the 4 MiB fixture in `haystack.rs`, and the match wire format in `match_triples.rs`; `support.rs`, which was named for a shape rather than a concern, is gone. Reported metrics, error strings, and readback ranges are unchanged."
