category = "Changed"
text = "One online-softmax core serves the whole attention family in vyre-libs. The scalar flash-attention kernel, flash_attention_2 and the reference copy each carried their own running-maximum recurrence, so a fix to one left the others wrong; the scalar path is now the tiled core at tile_size 1 and nn::attention::tiled_online_softmax is the single registered owner of the recurrence. The layout family collapses the same way: layout_permute, head_to_token, token_to_head and kv_cache become one index-map base that names its move, and the typed twins beside them are gone. Public API break: flash_attention_2_reference is removed. It was a scalar copy of the recurrence under test, so it agreed with the kernel by construction rather than by being right; compare against nn::attention::attention_reference, the offline three-pass schedule, which is the oracle every parity test in the family already uses. The pinned IR fingerprints for flash_attention move, because the scalar plan now stages scores through the shared score tile and renames its accumulator scratch. Both plans now report the shared-memory figure their program declares: the scalar plan counts the score tile and the accumulator alongside the query scratch instead of the query scratch alone, and the tiled plan drops the split-reduction state, which combines across workgroups and is therefore never allocated as workgroup memory."
