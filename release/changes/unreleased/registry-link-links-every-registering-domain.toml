category = "Fixed"
text = "The crate that exists to link every operation registration linked vyre-libs on default features, so 78 of the 327 registered operations never reached the registry it publishes: the geometry, optimization, topology, logical, succinct, algebra, attention and quantization registrations were absent from every walk that read it. Its per-source floor could not see this, because a source linked with a narrow feature selection still contributes more than nothing and every count shrank together. vyre-registry-link now names vyre-libs feature `full`, and a new rule reads the operation ids out of the generated catalog at run time and fails when any of them is missing from the live registry."
