category = "Changed"
text = "Every module directory under a `src/` tree is entered through its own `mod.rs`. The workspace carried both layouts at once: 363 directories had a `mod.rs` while 113 modules were a file sitting beside the directory holding their children, so where a module began depended on which crate you were reading. The 113 files moved into their directories, and the 189 `path` attributes that had been pointing the compiler back out of those directories are deleted, because the default resolution now finds every child. No item moved between modules and no public path changed."
