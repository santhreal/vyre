category = "Fixed"
text = "Every CUDA graph, executable graph, stream and device pointer guard keeps a reference to the context it destroys its handle against. The guards took their context liveness from a sibling field of the enclosing struct, and both enclosing structs declare that field first, so the context was released before the destroy calls ran. cuGraphExecDestroy then read freed driver memory and blocked forever on a lock word with no owner: a conformance dispatch stopped with no CPU use, no device work and no error, and the cross-backend parity matrix never reported a summary."
