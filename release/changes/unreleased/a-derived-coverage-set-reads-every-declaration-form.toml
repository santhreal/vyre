category = "Changed"
text = "A derived coverage set reads every declaration form. The two tests that enumerate an enum from its own source each recognised one variant shape, one struct-like and one unit, so a variant of the other shape was absent from the derived set and the comparison agreed with itself while the axis had grown; both now call one parser that accepts struct-like, tuple and unit forms, and a case states it against all three. The fused sampler names its three intermediates __vyre_llm_sampling_adjusted, __vyre_llm_sampling_candidates and __vyre_llm_sampling_weights instead of unscoped literals, which is the naming every other shared intermediate in the crate already uses. The registered online-softmax witness supplies its three logical inputs and no output placeholder, so the reference interpreter allocates the output the way it does for every other library registration instead of taking its legacy input path. The paged key-value append and gather document the block-table range precondition alongside the injectivity one: an entry naming a block at or past the block count addresses past the cache, and neither guard can bound it."
