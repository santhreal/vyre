category = "Changed"
text = "Which operand position of a structured kernel op names a child body now has one owner on both sides in `vyre-lower`. `child_body_operands` already owned the reading side, but every test fixture that built a branch spelled the operand vector out by hand, so a moved position could go unnoticed on one side; `if_then`, `if_then_else` and `for_loop` in `vyre-lower/src/descriptor_builder.rs` own the writing side and a new test drives each constructor's output through the reader. The shared-memory and constant-buffer promotion analyses both read their load-count precondition through `vyre-lower/src/analyses/load_counts.rs` instead of each carrying its own recursive walk, and a test pins the two to the same answer on a nested body. The three copies of the lowered-loop locator in the lowering tests collapse onto `vyre-lower/src/lower/loop_site.rs`, and `fixture_builders.rs`, whose module was never imported and whose constructors were a second copy of the descriptor builder's, is deleted."
