category = "Fixed"
text = "A release provenance document records a measured digest for every code generator or it stops. The two digest helpers answered `file_missing` and `dir_missing` when a path reached nothing, and the published document carried those sentinels for `xtask/src/gate_metadata.rs` after the table became a directory and for `conform/structure-gate/src` after the crate moved, so a rebuild was checked against a string that identifies no source. The roster is now one table both the document builder and its contract test read, the `xtask-registry` row points at `xtask-registry/src` and lists the two artifacts that crate writes, a path that reaches no file stops the document with the path in the message, the directory walk is recursive so `vyre-macros/src/pass` is inside the digest, and each file's path is folded in relative to the directory so the same commit digests the same at any checkout location."
