category = "Fixed"
text = "The script assertion ledger is generated where it counts and checked where it claims. Its totals and its two derived lists are rendered from the rows and from the tracked files, the prose above them states no number, and every row is held to two facts: a row may claim its script is present only while the tree carries it, a row whose script has left the tree must name the registered gate that carries its assertions and the injection that proved that gate red, and a row whose script is still tracked must record it as an operator action."
