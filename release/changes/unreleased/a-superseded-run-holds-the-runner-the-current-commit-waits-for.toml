category = "Fixed"
text = "Nine workflows ran without a concurrency group, so a push left the run measuring the previous commit alive. Both GPU lanes take one job at a time, and the GPU parity workflow serialises eleven jobs on one device host, so an obsolete run held that device for hours while the run for the current commit queued behind it. Every workflow a branch push or a pull request starts now declares `group: <workflow>-${{ github.ref }}` with `cancel-in-progress: true`, and the new `ci-concurrency` gate holds the class: it reads the trigger block rather than a file name, exempts a lane only a tag or a schedule starts, and rejects a group that is constant across refs, because that spelling makes one branch cancel another branch's run."
