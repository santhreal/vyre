category = "Changed"
text = "The C11 hostile-parser fixtures are spelled through `c_frontend::spelling::c_rows` rather than one `TOK_` constant per line. Six distinct constructs shared long runs of `LBRACE DOT IDENTIFIER ASSIGN` and `LPAREN IDENTIFIER RPAREN`, which read as copied text and buried each construct in thirty lines of scaffolding plus an identical three-line span tail. A contract test pins the token count and the load-bearing rows of every fixture, because a spelling is a second way to say the same thing and a mistyped kind name would retarget a positional contract at another token while every assertion still passed. The union field designator both initializer-designator families index is one stream in `tests/support/c_frontend/fixtures/initializer_designator_streams.rs`, under one name in both."
