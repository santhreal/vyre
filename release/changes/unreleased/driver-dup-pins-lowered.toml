text = "The duplication pins for the four driver crates in this change record what this branch measures in isolation: vyre-driver-cuda 3238 to 3187, vyre-driver-wgpu 4017 to 3918, vyre-driver-spirv 194 to 118, vyre-driver-reference unchanged at 23 with its stale total corrected. Every `total_lines` is measured, not carried forward. Duplication is cross-file, so collapsing one side of a copy moves the other: vyre-driver-metal fell 251 to 175 and vyre-driver 1082 to 1069 without either being edited, and both sit below pins this change does not touch."
