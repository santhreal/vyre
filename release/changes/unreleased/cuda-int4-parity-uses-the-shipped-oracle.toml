category = "Fixed"
text = "The live CUDA INT4 parity contracts diff against the CPU oracles `vyre-primitives` publishes behind `cpu-parity`, not against a private reimplementation of them. `vyre-driver-cuda/tests/int4_quantized_gpu_parity.rs` carried its own packed-nibble pack and extract, its own dot, matvec, batched matvec, batched matmul and top-1 references, and its own little-endian word packing and reading, all asserted bit-exactly. A correction to a shipped oracle therefore left the CUDA arm pinning bit-equality against a definition nobody ships, and the GPU could have matched a stale reference while diverging from the product one. The lane patterns, shape tables, deterministic generators and binding order stay local to the CUDA arm, each with one owner, and the shape tables that genuinely differ between the fixed-pattern and generated sweeps now say so by name instead of reading as drift."
