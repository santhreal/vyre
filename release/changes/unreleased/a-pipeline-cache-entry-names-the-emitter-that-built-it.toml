category = "Fixed"
text = "A cached pipeline outlived the emitter that produced it. The wgpu early pipeline cache and the CUDA PTX source cache, including its on-disk half, keyed each entry on the program, the adapter and a lowering label that a person had to edit by hand, so a shader or PTX lowering fix that arrived without a label edit left every key unchanged and both backends kept dispatching kernels the previous emitter compiled. Each emitter now stamps a digest of its own source at build time and both caches mix that digest into their keys, so a lowering change invalidates every entry it could have produced."
