category = "Fixed"
text = "Inlining reaches a call inside a subgroup operand. `vyre_foundation::transform::inline` enumerated `Expr` itself and classified `SubgroupBallot`, `SubgroupShuffle` and `SubgroupReduce` as carrying nothing, so a call in one of those operands was handed back verbatim: the program kept an `Expr::Call` that inlining exists to refuse, and where unresolved calls are kept deliberately, that call's own arguments were never inlined either. Operand positions now come from the one owner. Because that walk is bottom-up, a call site is reached with its arguments already inlined, so the argument loop that walked every argument a second time is gone."
