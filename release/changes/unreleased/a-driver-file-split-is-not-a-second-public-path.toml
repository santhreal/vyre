category = "Removed"
text = "The four driver crates publish each item at one path. `support_certificate` in `vyre-driver` and `external_resource` in `vyre-driver-cuda`, `vyre-driver-metal` and `vyre-driver-wgpu` are file splits of the crate root, so `FactStatus`, `ProductionPathFact`, `ProductionPathStage`, `SupportCertificate`, `SupportCertificateRegistry`, `SupportStatus`, `SUPPORT_CERTIFICATE_SCHEMA` and each backend's external memory descriptor, memory handle, resource importer and imported record are reachable at the crate root and nowhere else. Those four module paths and the 96 items they restated left the published surface."
