category = "Fixed"
text = "The test-material gate follows `#[path]` module links. It derived a module chain from directory layout alone, so the nine `#[cfg(test)] #[path = \"<name>_tests.rs\"]` suites in the workspace resolved as declared by nothing and compiled into every build, and the support-reference rule reported each of them. The gate now reads every `#[path]` declaration in a member, resolves the target against the directory of the file that declares it, folds `..` segments, bounds a malformed cycle with a visited set, and inherits the declaring attributes, so a relocated test module reads as test-only and a relocated module that is not gated still reports."
