category = "Fixed"
text = "The contract that a failing xtask command says why it failed judges the exit itself. It used to match one shape of the original defect, an `if` whose condition named a blocker and whose branch exited, and the gate architecture removed every member of that set, because a gate now returns findings and only the dispatcher exits: the rule matched nothing and passed by judging nothing. It now derives every nonzero `process::exit` in the xtask crates at run time and requires an enclosing block to write the cause on either stream, so a silent exit added anywhere in the tooling fails it."
