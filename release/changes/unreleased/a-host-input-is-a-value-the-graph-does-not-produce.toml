category = "Fixed"
text = "`ArtifactSession::host_bindings` and `submit_host_inputs` ask for one buffer per graph external. The set was the union of every artifact entry's inputs, so a program the compiler split across fusion groups demanded a buffer for each inter-group intermediate as well, and the count refusal named a number the caller could not derive from the graph it authored. A value some entry produces is device state; a value no entry produces has no source but the caller. A slot whose value is missing from the artifact resource set is now refused instead of bound at zero bytes."
