category = "Fixed"
text = "No crate publishes an item at more than one path. The atomic and bit-count compositions in vyre-libs published each op both flat and through a generated module, vyre-primitives carried a prelude and a facade module for another crate's wire envelope, vyre-lower kept two import-boundary modules that only re-exported the fact modules beside them, the wgpu pipeline re-exported the bind-group statistics and the persistent dispatch item, the driver root re-exported one validator out of the validation module that owns it, and the reference crate re-exported its op counter at the root. Every second path is deleted and every caller names the owner."
