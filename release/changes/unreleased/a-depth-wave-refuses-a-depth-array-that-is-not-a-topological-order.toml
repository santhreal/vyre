category = "Fixed"
text = "The depth-leveled sum-product evaluator assumed its depth array described the circuit it was evaluating. Given an array that does not, an internal node reads a child the same wave is still writing, and the two arms disagree rather than fail: the reference walks lanes in order and observes the child's new value, a device runs them at once and observes the old one. Composition made that reachable from a registered operation piping an all-zero buffer into the depth input, where the reference produced a value the device left at zero. A non-leaf node now checks that every child sits at a strictly smaller depth and traps otherwise, so an out-of-contract depth array is refused by both arms."
