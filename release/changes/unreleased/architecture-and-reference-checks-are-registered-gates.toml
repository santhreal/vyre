category = "Changed"
text = "The architecture coherence check and the published-reference check are registered gates instead of Python scripts. `architecture-contract` holds `docs/ARCHITECTURE.md` to the workspace roster, the release train, the generated operation schema, the backend evidence, the ownership registry and the documentation manifest, and `docs-references` resolves every path-like code span and command argument in a published document against the listed tree. Both are in the `docs` subset, both carry a pinned baseline, and both report every failure in one run rather than exiting on the first. The operation schema version is now pinned by two constants in one build instead of a number compared as text across two languages, so the drift that once shipped a generator on 3 against a checker demanding 2 cannot compile."
