category = "Fixed"
text = "`scripts/check_bench_baselines.sh` requires a `benches/RESULTS.md` section for every crate that owns a bench source file, not for every directory named `benches`. The directory search demanded a measured section for `vyre-grammar-gen`, whose `benches/` directory holds documentation and no target, so the gate could not pass without an invented number. `benches/RESULTS.md` now carries the criterion medians of `cargo bench -p vyre-primitives --bench wire_throughput` and `cargo bench -p vyre-bench --bench release` with the machine, GPU, CPU, toolchain, and commit they were measured on."
