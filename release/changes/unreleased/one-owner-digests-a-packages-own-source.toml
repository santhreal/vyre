category = "Changed"
text = "The WGSL and PTX emitters each carried their own copy of the source-tree digest: two build scripts and two tests, each with its own FNV-1a-128 constants, directory walk and byte cap, and no other owner of that hash existed in the workspace. `vyre_foundation::source_digest` now owns the walk, the BLAKE3 framing, the byte cap and the `cargo:` directives, so each emitter build script names only its package, its variable and its domain, and each test recomputes through the same function. The digest refuses an empty source directory, a path it cannot frame as UTF-8 text, a variable name cargo cannot pass through, and a tree over the cap, so a digest that identifies nothing fails the build instead of giving every compiler version one cache key."
