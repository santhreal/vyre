category = "Fixed"
text = "The hygiene scan reported every unit test of every source-reading gate as a release blocker, including the tests that prove the scanner itself: a test that writes a source tree in a temporary directory and runs an analyzer over it reads Rust source, which was the whole rule. The scan now separates the tree a test authored from the checkout it runs in, and keeps the finding when the same test also reads Rust source rooted at the checkout. The checkout read has to be the statement that names the Rust path, so a fixture workspace that copies one tool out of the checkout is no longer read as a walk over the real tree."
