category = "Changed"
text = "Every `vyre-foundation` module has one public path. `algebra`, `analysis` and `dispatch` were grouping directories, each holding one or two unrelated modules, and each needed a crate-root re-export because callers named the short path: `vyre_foundation::composition` and `vyre_foundation::algebra::composition` were the same module reached two ways, as were `graph_view`, `dialect_lookup` and `extension`. The wrappers are gone and the five modules sit at the crate root, which is the path 200 files already used. The crate-root item re-exports of `from_graph`, `to_graph`, the graph types, and the operation signature types are gone with them; two callers now name `dialect_lookup` directly. `visit` split into `node`, `expr` and `walk` while publishing all three, so every traversal answered to two paths; the submodules are private and the re-export at `visit` is the one path, which is what its own module documentation already claimed."
