category = "Fixed"
text = "Three published items linked to types rustdoc could not resolve from the module the link was written in, so the rendered documentation carried dead link text: the `vyre-driver-cuda` crate doc named `VyreBackend`, which lives in `vyre-driver`; `CudaMegakernelPlanCacheStats` named `CudaMegakernelPlanCache` from a records module that does not import it; and the `AsyncUringStream` mention in the `from_host_visible_owner` constructor sits inside a `concat!` doc string, where the surrounding module is not the linking scope. Each link now carries the path that resolves it, so `cargo doc --workspace --all-features` reports no unresolved intra-doc link."
