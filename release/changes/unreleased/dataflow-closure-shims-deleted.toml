category = "Changed"
text = "The host dataflow closures are read from their owner. `vyre-libs` carried a module whose six public functions each did nothing but call the identically named function in `vyre_foundation::pass_substrate::semiring_closure`, and it had grown a copy of the owner's whole test module: five assertions verbatim, plus two that could not fail because they compared the forwarder against the function it forwards to. The forwarders are gone and every caller names the owner. What remains is the one thing this crate adds, the call counter, in a file named for it."
