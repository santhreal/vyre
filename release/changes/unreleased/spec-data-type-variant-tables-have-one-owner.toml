category = "Changed"
text = "The scalar-leaf and quantized-storage `DataType` tables in `vyre-spec` have one owner, `vyre-spec/tests/spec_variants/mod.rs`. The leaf list was retyped in the proptest generator, the seeded signature matrix, the seeded wire-payload matrix and the edge matrix, and the nine quantized storage types were retyped in five places including two seeded generators that only produced five of them. Every sweep now indexes the shared tables, and `data_type_surface.rs` checks `DataType::is_quantized_storage` against the shared table in both directions over every scalar leaf instead of four hand-picked negatives, so widening one without the other turns red."
