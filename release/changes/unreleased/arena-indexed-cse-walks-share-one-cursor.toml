category = "Changed"
text = "The two CSE passes in `vyre-pass-engine` that walk IR while counting expression-arena positions share one cursor, `optimizer::arena_cursor`. Each had its own copy of advancing an index per node, remembering a position to rewind to, and skipping a nested body's worth of ids, and the nesting each skipped was written out variant by variant, so a new statement-carrying variant would have misaligned an arena verdict against the node it was computed for without any error. `ArenaCursor` takes its nesting from `transform::visit::child_bodies` and stays in the pass engine, because the numbering is the encoder's and not the IR's. The hoisting decision and the same-scope let-dedupe decision stay separate: they are different decisions over the same walk."
