category = "Changed"
text = "Three shapes repeated across the `vyre-libs` test corpus have one owner each. `vyre-libs/tests/support/optimizer.rs` owns `assert_optimizer_is_idempotent` and the debug first-difference reporter that names which node moved when the optimizer fails to reach a fixed point; three idempotence contracts carried their own copy of both. `vyre-libs/tests/support/ir_fingerprint.rs` owns the pinned-fingerprint family guard that proves a collapsed clone family still emits what every former copy emitted. Seven files that reimplemented little-endian `pack`/`unpack` read `vyre_primitives::wire::pack_u32_slice` and `decode_u32_le_bytes_all`, the crate that owns that layout."
