category = "Fixed"
text = "The sparse-queue step sequence of `vyre_libs::graph::dispatch::adaptive_traverse` is asserted once, over a table naming which queue materializer each graph width and frontier selects. Five near-identical cases previously each rebuilt the dispatcher, graph, scratch and packed frontier and then spelled their own step expectation, and the copies disagreed about what to check: two cases exercised the same materializer with the same expectation, only the wider one asserted that no word-partial buffers are allocated, three of five asserted the upload set, and two of five asserted the plan cache. No case sat on the block count at which frontier word prefixes stop inlining block offsets, so shifting that threshold by one left the suite green."
