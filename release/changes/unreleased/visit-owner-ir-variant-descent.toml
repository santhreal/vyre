category = "Fixed"
text = "IR variant descent has one owner per reference mode. `vyre_foundation::visit::child_bodies_mut` is new and owns the body slots of a node held by unique reference, alongside `child_bodies` for a shared read and `vyre_foundation::transform::rewrite_walk::rewrite_node` for a borrow-preserving rebuild. `vyre_foundation::visit::node_map::map_body` took its slot list from a hand-written match ending in a catch-all that returned the node unchanged, so a body-bearing variant the list had not been told about made every pass composed on it a silent no-op inside that variant, including `rematerialize_cheap_let` and the pass engine's constant propagation. The scalar namespace also has one owner, `vyre_foundation::visit::node_scalars`, reporting the bound name, what the statement does to it, and the operand expressions in one record; `node_operands` and `node_bound_name` are derived from it, and `vyre_foundation::visit::bound_names` no longer classifies an unrecognised variant as binding nothing. `vyre_foundation::optimizer::cost` folds the divergence dimension over the owning descent instead of a search that stops at the first match, and `vyre_foundation::transform::autodiff::grad` reads its forward types and adjoint targets from the owner and reports an unsupported node by its registry variant name rather than by a `Debug` rendering truncated at sixty characters."
