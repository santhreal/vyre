category = "Fixed"
text = "A value produced and consumed inside one fusion group is routed through a single buffer in the emitted target module. Fusion unifies buffers by name and each arm carried the name its own Program declared, so a producer writing `sum_out` and a consumer reading `s_in` merged into a module with two buffers, no read-after-write barrier between the arms, and a read-only declaration whose bytes the launch demanded from the caller for a value the module computes itself. Every connected graph whose consumer named an internal edge differently from its producer was refused at submission with an unbound-input rejection, and a graph that happened to bind it read foreign bytes without a barrier. The target compiler now renames the consumer arm's buffer to the producing member's name before merging, which upgrades the merged declaration to read-write, marks it backend-allocated, and inserts the barrier."
