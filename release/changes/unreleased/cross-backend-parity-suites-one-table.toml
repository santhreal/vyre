category = "Changed"
text = "The cross-backend u32 parity suites read one op table instead of one hand-written test per op. `synthetic_binop_parity`, its CUDA twin, and both `div_zero_shift_mask` suites loop over the shared table with a per-backend reference arm and a per-backend divergence note, and each opens with the coverage assertion so a missing arm fails before a device is acquired. The reference arms stay per backend by design: the naga multi-step synthesis and the PTX instruction selection are unrelated lowerings of one contract and each owes its own live proof against the CPU reference. What is shared is which ops exist."
