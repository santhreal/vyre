category = "Changed"
text = "The programs the native Metal tests dispatch have one owner in `vyre-driver-metal/src/tests/fixtures.rs`. The single WriteOnly `u32` output word, declared with count 1 and an output byte range of 0..4, was restated at nine call sites across four modules, and the ReadOnly-input-plus-WriteOnly-output pair at four more, twice byte for byte inside one file. The declared element count and the output byte range together decide how many bytes the backend collects, so every test asserting a single little-endian word was asserting against a shape it also restated: one edited count would have retargeted the assertion at a different number of bytes in one place and left the others agreeing with each other. Each module now imports what it uses once at module scope instead of repeating the same two `use` lines inside every test function."
