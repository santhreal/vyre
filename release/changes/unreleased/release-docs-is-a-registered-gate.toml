category = "Changed"
text = "The changelog and the release notes body are generated by the registered gate `xtask release-docs`, not by a Python script beside the registry. The gate reads the release train and one fragment file per change, renders the unreleased section, and writes both documents under `--write`; without it, a document that disagrees with the fragments is a finding. It reports what the script reported and three rules the script did not: the number of approval-gated external actions is taken from the launch contract rather than restated as a literal, a fragment is read from the directory so one written but not yet staged still reaches the changelog, and every finding names its file and its corrective action instead of raising on the first error."
