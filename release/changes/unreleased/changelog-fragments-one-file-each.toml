category = "Changed"
text = "A changelog fragment is one file, `release/changes/unreleased/<id>.toml`, holding `category` and `text` with the file name as the id. Every fragment used to be a `[[fragments]]` table appended to one file, and a three-way merge of two branches that each appended one matched the shared blank line and `[[fragments]]` header between the two sides, left them out of the conflicting region, and resolved only the differing tails. The `merge=union` attribute then concatenated those tails under one header, so one fragment carried two ids and the file stopped being valid TOML; without the attribute the same merge stops on a conflict instead. The attribute is gone with the file it named, and `release-docs` reads the directory, rejects an unknown key and refuses a fragment whose text is empty. A regression test builds two branches that each add a fragment and merges them, so the fusion cannot come back quietly."
