category = "Fixed"
text = "The op matrix generator marked seven operations `wgpu = \"not_applicable\"` because their programs rendezvous at grid scope. That is what the program needs, not what the backend refuses. wgpu lowers no cooperative launch but does not override `VyreBackend::allows_host_grid_sync_split`, which defaults to true, so the registry wrapper splits the barrier into sequential host dispatches and the recorded wgpu conformance run observes all seven passing. `BackendSupport::grid_sync` is the disjunction of the two routes for exactly this reason. The generator no longer predicts a device answer it cannot see."
