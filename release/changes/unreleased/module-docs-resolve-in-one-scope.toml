category = "Fixed"
text = "Six intra-doc links were unresolved or pointed at a private item, and each was reported only by the public-API gate's rustdoc pass rather than by a build. A module carrying both an outer doc comment on its `mod` declaration and an inner `//!` header has the two merged and resolved in the PARENT scope, which is why `vyre-driver`'s `TargetDialect` link failed from inside the module that defines it; that one is now fully qualified. The five links naming a private item are plain code spans, because a link to an item a reader cannot reach is not a link."
