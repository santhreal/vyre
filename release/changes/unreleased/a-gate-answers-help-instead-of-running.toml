category = "Fixed"
text = "A gate asked for `--help` answers with its usage and reads nothing. `bench-crossback --help` read 35 measurements across 18 cases and reported a clean gate, which is the check running on the caller who asked what the check takes. The dispatcher answers a leading `--help` from what the gate declares, a delegated gate answers from the package that implements it, and the answer travels back as report notes so the report protocol holds. Every option a gate names in its help line is declared as a usage line, and the rule reads the gate table at run time, so a gate registered later with an option it never names goes red."
