category = "Changed"
text = "A changelog fragment is its own file under `release/changes/unreleased/`, named for its id, carrying a category and text. Ten times in one week a merge ate a `[[fragments]]` header: every fragment opened with that identical line, so diff3 aligned it as common context between two appended blocks, only the differing lines reached the merge driver, and the second block kept `id`, `category` and `text` while losing the header that separated it. Its keys then parsed as a second `id` in the fragment above, so the file stopped being valid TOML and every release document stopped regenerating behind a parser position that named no cause. A `merge=union` attribute could not fix it, because there was no conflict to resolve; `.gitattributes` carried that attempt and is deleted with the file it named. Two fragments now share no line, no header and no identity, and a merge that keeps both files keeps both fragments. A file in the retired shape is rejected by name rather than folded into its neighbour."
