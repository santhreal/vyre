category = "Removed"
text = "The C frontend has moved to a project of its own. `vyre-libs/src/parsing/c` and everything that existed only to build, test, benchmark or document it are gone: 675 files, 30 registered operations, the `c-parser` feature and every consumer that enabled it, the wgpu and cuda C parity suites, the `vyre.frontend.c.*` optimization documents, and the `parser.c_lexer.small_state_transition.4k` benchmark case. The language-neutral parsing substrate stays: `parsing/core` (AST node kinds, shunting yard, binding, blocks), `parsing/go`, `parsing/python`, `parsing/lr_tables` including the C11 expression table, the source cache, the parallel parse driver and the VAST wire. The shunting-yard AST builders were gated behind `c-parser` and are now ungated, reading token ids from `vyre-spec::c11_token`, which `vyre-grammar-gen` and the wgpu loop-carrier dispatch test already own. The three regressions that used the C lexer only to have a real program to lower now use the Python 3.12 lexer, which has the same signature and the same loop-carrier structure, and `vyre-debug`'s function-locals contract derives its expected names from the descriptor it walked instead of pinning one lexer's variable spelling."
