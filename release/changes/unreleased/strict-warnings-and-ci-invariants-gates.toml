text = "The architectural-invariants, strict-warnings, and registered gates workflows run cleanly. Workflow subcommand reference extraction segments multi-line shell blocks into individual commands, preventing unrelated command flags from misclassifying as dispatcher subcommands. Live CUDA execution tests and concrete driver dependencies are removed from vyre-libs, preserving neutral layer boundaries and ensuring workspace unit tests succeed on non-accelerated runners. Registered gates CI steps install SMT and public-API prerequisites, and backend evidence matches current source measurements."
