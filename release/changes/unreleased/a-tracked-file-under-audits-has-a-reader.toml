category = "Removed"
text = "Fifteen point-in-time reports under `audits/` are gone: five critique and audit narratives, five `V7_*.toml` finding tables, a 416 KiB filtered unwrap inventory, a pre-sweep error dump, and a closure report whose every row read completed while citing ten audit files the tree no longer carries. No gate, workflow, script, test or manifest read any of them. `audits/lego-composition.tsv` stays, because `lego-audit` reads it as the checked-in bootstrap composition baseline. The `audit-status` gate goes with them: it judged files carrying a `Status legend:` line, its subject class is now empty, and its own corrective action named deletion as the alternative to inventing one."
