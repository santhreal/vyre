category = "Fixed"
text = "Every library composition in vyre-libs sits behind a feature. The text, representation, parsing and graph module trees were declared with no cfg, so forty-two files submitted an operation registration in every build that linked the crate, and the default selection did not compile at all because those trees reach bitset, fixpoint and the parser kernels without a feature that enables them. Each tree now carries the gate its registrations route to, the parsing substrate that registers nothing stays available to a kernels-only build, and the two shared builder child regions register behind builder-ops. The manifest gained representation and builder-ops, full names both, and matching-dfa names text because the scanner post-process folds the reference byte histogram into its entropy oracle."
