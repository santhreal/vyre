category = "Fixed"
text = "The CUDA release memory floor is derived from the registered benchmark catalog instead of asserted as a device class. It was a flat 16384 MiB restated at several call sites while the largest registered workload declares 1024 MiB of resident bytes, so the number rejected hardware that runs every workload correctly and at full occupancy. It is now the largest declared working set plus a fixed CUDA context reserve, which also closes the class: a workload that grows raises the floor without anyone editing a constant. The compute-capability floor of 8.0 stays, because that one is a feature floor for the asynchronous copies and cooperative launches the CUDA backend emits."
