category = "Fixed"
text = "The committed public-API snapshots for `vyre-driver`, `vyre-driver-spirv`, `vyre-libs` and `vyre-pass-engine` record the surface those crates publish now. The identifier type moved to `vyre_foundation::ir::model::expr::ident::Ident` when that file was split, the driver publishes `ErrorCode::summary`, `ErrorCode::ALL`, the `error_catalog` module and `migration::DEPRECATED_OP_CODE`, the SPIR-V registration no longer answers seven capability questions one method at a time, and the tiled matmul builders are reachable through the composition prelude. A stale snapshot fails the drift check for every crate at once, which hides the next real change behind noise."
