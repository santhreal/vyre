category = "Fixed"
text = "A decorator that wraps a `VyreBackend` forwards the contract through `backend::forward`, split into the non-dispatch surface and the `Program`-carrying surface. `GridSyncSplitBackend` restated all 57 methods by hand and left seven on their trait defaults, so through the grid-sync registry wrapper a device-buffer-capable backend reported `UnsupportedFeature` for allocation, upload, download, free and device-buffer dispatch, a backend with distributed collectives reported none, and `cooperative_grid_sync_fits` answered `false` for every device. Device-buffer dispatch of a program that needs the host-side grid-sync split now fails closed naming the borrowed path, because the split carries each segment's state through host byte buffers and the device-buffer path exposes no readback between segments."
