category = "Fixed"
text = "`vyre-primitives::reduce::multi_block_prefix_scan_inclusive_sum` now declares a workgroup every registered target admits. Its default builders previously used 1024 lanes on the false claim that every target admitted that width, so a target profile capped at 256 refused the payload with `target workgroup extent 1024 exceeds profile limit 256`. The default block builders now read the single target-neutral floor, `vyre_foundation::ir::PORTABLE_WORKGROUP_INVOCATIONS`, directly; no operation declares a crate-local geometry alias. Backend-specific lowering can still select a wider admitted launch through `LaunchGeometry`. The cooperative block width is load-bearing for the scan, so the block was rebuilt at the selected width rather than clamped after construction."
