category = "Fixed"
text = "`vyre-primitives::reduce::multi_block_prefix_scan_inclusive_sum` declares a workgroup every registered target admits. `BLOCK_LANES` was 1024 on the claim that 1024 is the universal maximum workgroup size; the wgpu target profile admits 256, so admission refused the payload with `target workgroup extent 1024 exceeds profile limit 256`. The portable floor is now one named constant, `vyre_foundation::ir::PORTABLE_WORKGROUP_INVOCATIONS`, and the block width reads it. Each backend keeps its own limit in its own capability record; the constant is the extent an op may declare without knowing which backend will run it. The cooperative block width is load-bearing for the scan, so the block was resized rather than the launch clamped. Closes 1 diverging (backend, op) conformance pair."
