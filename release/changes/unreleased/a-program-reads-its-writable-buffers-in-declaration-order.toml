category = "Fixed"
text = "The artifact route returns a Program's writable buffers in the order the Program declares them. `ArtifactSession::ordered_outputs` projects canonical ABI slot order, which numbers graph values, and a graph lifted from one Program mints an external value for every retained read-write buffer before the node that produces the declared outputs. Slot order is therefore retained-then-output, so a Program declaring an output buffer before a retained one had its outputs returned transposed: `vyre-libs::decode::base64` returned its 4-byte decoded length where the caller reads the 24-byte payload, `decode::inflate_stored_block` 4 against 40, `matching::emit_hit` 4 against 64, and `nn::ln_scale_backward` returned `grad_scale` where `grad_x` was read, which read as an f32 value disagreement rather than a transposition. Slot order cannot express declaration order, because an output value does not exist before the node that produces it, so the projection back onto declaration order is now `ArtifactSession::program_outputs`, keyed on the canonical resource names, and every caller holding the Program takes it: `vyre-conform`'s production session and all three `vyre-bench` artifact submissions. `ordered_outputs` keeps its slot-order contract for a caller that authored the graph and has no Program to declare an order. Closes 7 diverging (backend, op) conformance pairs."
