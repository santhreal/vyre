category = "Changed"
text = "Eighteen composition domains moved out of vyre-primitives into vyre-libs: bitset, decode, fixpoint, geom, graph, hash, label, math, matching, nfa, nn, opt, parsing, predicate, reduce, text, topology and visual. vyre-primitives now holds marker types, the wire encoding, the dispatch grid owner, the IR safety helpers, the hardware intrinsics and the virtual file system, and its feature list is default, gpu, cpu-parity, vyre-foundation, hardware, all-lego and inventory-registry. Every path of the form vyre_primitives::<domain> is now vyre_libs::<domain>; no compatibility re-export is left behind. Registered operation ids are unchanged, so built IR and the operation catalog keep the same names. Each moved domain has a feature of its own in vyre-libs that names only the domains its own source reaches."
