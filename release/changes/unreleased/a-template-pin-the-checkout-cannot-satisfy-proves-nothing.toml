category = "Fixed"
text = "The libs template pinned vyre crates at 0.7.2 while this checkout ships 0.8.0, so the [patch.crates-io] section example-capability writes was inert and the template was compiled against the published crates instead of the surface under test. It imported two functions the shipping crate exports and 0.7.2 does not. The template now pins 0.8.0, the gate reports any workspace-member pin the checkout cannot satisfy, and it resolves the rendered crate's lockfile explicitly before building it, because the workspace runner appends --locked and a template ships no lockfile."
