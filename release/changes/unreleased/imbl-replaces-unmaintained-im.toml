category = "Changed"
text = "The persistent collections come from `imbl` 7.0.2 instead of `im` 15.1.0. `im` carries RUSTSEC-2026-0248 as unmaintained, pulls `bitmaps` 2.1.0 which carries RUSTSEC-2026-0247, and its `OrdSet` insertion has an aliasing violation, RUSTSEC-2023-0126; `cargo deny check advisories` failed on all three. `imbl` is the maintained fork with the same API. The dependency states an exact version: `imbl` 7.0.1 resolves `imbl-sized-chunks` 0.1.3, which carries RUSTSEC-2026-0292, a double free and use after free when an element's `Drop` panics, and 7.0.2 resolves `imbl-sized-chunks` 0.2.0 and drops the `bitmaps` dependency with it. The structural sharing is why a std map is not the answer: the DCE live set is cloned at every branch arm and every loop body, and the lowering variable scope snapshots its binding map per scope, so a std map would deep-copy every identifier where the persistent map shares its structure. `vyre_foundation::optimizer::passes::fusion_cse::dce::LiveSet` is new and is the one place the live-set type is named, replacing the concrete set spelled in four files."
