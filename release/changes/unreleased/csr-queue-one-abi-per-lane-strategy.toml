category = "Changed"
text = "One queued-row CSR expansion ABI, one owner. Five entry points build the same queue-driven traversal and differ only in how lanes are assigned to a queued row, yet each restated the whole surface: `csr_queue_strided` declared `CsrQueueStridedForwardParams`, a field-for-field second name for `csr_frontier_queue::CsrQueueForwardTraverseParams`, then destructured it, repeated the zero-node and zero-capacity refusal with its own diagnostic, and reassembled the step spec; the delta pair repeated its thirteen-argument positional list in both files. A second name for one buffer contract is how a field added for one lane strategy silently misses the others, and the strided path also carried a hand-written CPU reference that only forwarded to the queue reference it is checked against. The queued-row ABI now owns its refusal rule and its step spec, one macro states the positional argument list per family, the strided op publishes the queue reference under its own names instead of copying it, and the offset-count overflow contract is one assertion both forward entry points run against the invalid-output program shape."
