category = "Removed"
text = "`vyre_primitives::effects` is gone. `EffectRow`, `EffectKind`, `Handler`, `handler_apply` and `handler_compose` restated the seven effect kinds and three bit operations that `vyre_foundation::lower::ProgramEffects` already declares, on the same bit assignments, and a kind added to one would not appear in the other. The one live consumer is `vyre-libs::analysis::effect_signature`, which takes `ProgramEffects` directly: `check_signature` returns the unpermitted row as a verdict and `residual_effects` names what stays open after a handler discharges. Handler composition is row union, so it needs no function of its own."
