category = "Added"
text = "`xtask-registry` asserts that every crate submitting an operation registration in source contributes at least one operation to the live registry. Dropping one of those links left the registry answering with hundreds of ids from the crate that was still linked, every count agreeing with itself, and a whole tier missing from the catalog. The expected set is read from the sources when the test runs, so a third registering crate is covered the day it registers. This replaces a smoke test that grepped `list-ops` output for one crate's prefix from another crate's test target."
