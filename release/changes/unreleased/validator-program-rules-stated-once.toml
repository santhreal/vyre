category = "Fixed"
text = "The program-header validation rules are stated once, in `validate_program_level`. The differential property test that compares the single-walk validator against the multi-walk one it replaced carried a verbatim copy of them: the region-wrapper rule, the workgroup-dimension rule, the duplicate-name, duplicate-binding and empty-workgroup-buffer rules, the output-buffer contract, the output markers, and the buffer lookup a walk needs. Those are not what the property compares, so a diagnostic corrected in production and not in the copy would have failed the property for a reason that has nothing to do with the walk, and the two copies had already drifted on the V105 suggestion text. The second arm still walks the node tree independently through `nodes::validate_nodes`, which is the only thing the property is for; mutating the production walk to skip the last statement of a body turns it red."
