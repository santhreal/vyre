category = "Fixed"
text = "The generated documentation navigation regenerates over its own staleness. `docs-check` resolved every link before rendering and returned on the first finding, so deleting a page from the manifest left the stale summary linking a file that no longer exists, and `--write` reported that link instead of writing the summary that no longer carries it: the only way out was to hand-edit a generated document. Links are now resolved after the navigation is written, a manifest that does not hold still blocks the render, and a check run reports the drift and the dead links together instead of stopping at the first."
