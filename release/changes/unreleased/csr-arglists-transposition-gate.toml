category = "Added"
text = "A gate over `vyre_libs::graph` rejects the argument-transposition class. It walks the module directory and parses every declared signature at run time, so a CSR entry point added later is covered without editing a list: closure entry points must receive the graph as a bundle and must not declare three or more consecutive parameters of one type, and the wider slice-taking family must give each role a single name across the tree."
