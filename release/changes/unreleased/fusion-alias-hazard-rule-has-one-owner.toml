category = "Fixed"
text = "The fusion-alias hazard rule `V116` has one owner, the whole-program pass in `vyre-foundation/src/validate/fusion_safety.rs`, which both the production single-pass validator and the legacy differential arm call. Production carried a second copy inside its frame stack that recorded only two of an async transfer's four operands, so an atomic sitting in an `AsyncLoad` or `AsyncStore` `offset` or `size` expression was not recorded as an access and did not raise a hazard against an unsynchronized read of the same buffer: the program validated clean and was fused. The hazard is a relation between two nodes rather than a property of a frame, and one rule with two implementations gave one program two answers depending on which arm read it. `V113`, the malformed-alias-frame code the deleted copy raised, is retired from the registry and the code catalog."
