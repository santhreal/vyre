category = "Fixed"
text = "The `cargo_full` wrapper no longer exports `CARGO_BUILD_JOBS`. An environment variable overrides `.cargo/config.toml`, so the wrapper's default of `1` silently replaced the declared `[build] jobs = 16` on every invocation, and every build, test run, and gate in this workspace ran one codegen job at a time regardless of how many cores the host had. Parallelism is declared once, in the config file, where it is reviewable and applies to every build equally."
