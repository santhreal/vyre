category = "Changed"
text = "Eleven builders computed their own buffer cell count and wrote their own overflow message. `vyre_libs::math::matrix_cells` and `square_matrix_cells` now own both: the count of a `rows x cols` operand, the `n == 0` rejection for a square one, and one sentence naming the caller and the shape that did not fit. The messages change text. They previously named a domain noun the op id already carries, and eleven copies had drifted to eleven phrasings of the same fact."
