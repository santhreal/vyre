category = "Removed"
text = "vyre-grammar-gen is deleted. It generated the host-side C11 lexer DFA and LR(1) tables for the C frontend that is leaving vyre, and its src carried CPU implementations of C preprocessing and lexing, which no crate outside vyre-reference may hold. Nothing consumed its output: vyre-libs/src/parsing/lr_tables/c11_expr.rs is hand-written Rust built from pack_shift and pack_reduce and takes its terminal ids from vyre_spec::c11_expr_token, not from a blob this crate emitted. The neutral DFA and LR machinery stays in vyre-libs/src/parsing/lr_tables with its contract suite, and the C11 token id tables stay in vyre-spec. The workspace member row, the c-grammar-gen dependency alias, the path-only dev-dep in vyre-driver-wgpu, the structure-gate member roster row, the duplication pin and the crate documentation pages are removed with it."
