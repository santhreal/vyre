category = "Security"
text = "The build wrapper passes --locked to every resolving cargo subcommand, so a build compiles the dependency versions this repository committed and nothing else. CI steps previously re-resolved from the registry at run time, which compiles and executes the build script of anything published since the lockfile was written. cargo-deny additionally bans proc-macro1 outright and pins arrayref away from 0.3.10: 0.3.10 was published on the day every arrayref release back to 0.3.5 was yanked, and it depends on proc-macro1, whose build script disables TLS verification, downloads a per-platform binary to /tmp/rust-setup, and spawns it."
