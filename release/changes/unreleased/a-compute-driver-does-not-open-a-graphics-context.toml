category = "Fixed"
text = "Concurrent wgpu backend acquisition deadlocked on teardown. Every instance enabled the GL backend, whose EGL runtime registers a thread-local destructor that takes an EGL lock at thread exit, and `vkDestroyDevice` joins threads that run it: two workers releasing backends at once closed a cycle across that lock, the Vulkan loader lock, and the join, which no deadline can break. A conformance run with one backend per worker stopped for hours with no output. Instances and adapter probes now name the backends this driver dispatches compute through, which excludes GL and the no-op backend, and the concurrency contract collects each thread's report under a deadline so a regression fails as an expired wait instead of a suite that never returns."
