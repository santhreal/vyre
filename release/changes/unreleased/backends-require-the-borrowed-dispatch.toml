category = "Changed"
text = "Every dispatch trait requires the borrowed-row form and defaults the owned one over it. `vyre_driver::VyreBackend::dispatch_borrowed`, `vyre_driver::backend::CompiledPipeline::dispatch_borrowed` and the C-preprocess `ProgramOracle` are now the methods an implementor writes; `dispatch` is a default that borrows the rows it was handed. It was the other way around, so a backend that binds caller memory received rows it had to own first and `clone_borrowed_inputs_for_dispatch` copied every input byte on the path whose purpose is not to. That helper is deleted, the four backends that carried a reverse shell of the same body no longer declare one, and the oracle's owned entry point is gone rather than kept as a second door. The inherent `dispatch` methods the wgpu, CUDA, SPIR-V and reference backends published leave the public surface with it."
