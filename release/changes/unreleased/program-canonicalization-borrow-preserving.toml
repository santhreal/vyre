category = "Changed"
text = "`Program::canonicalized` reports what canonicalization changed instead of rebuilding the tree to discover it changed nothing. An already-canonical program keeps its entry body, its buffer table, and its memoized fingerprint rather than being replaced by an equal copy, and a program that only needs its buffer table sorted keeps its entry body. Canonicalization stays a fixed point in one application and a semantic no-op, both now asserted over the shipped release corpus and over shapes the corpus does not generate: a `Block` that owns a binding is a scope, so it survives, while a `Block` that owns none is spliced into its parent at every body position."
