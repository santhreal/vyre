category = "Changed"
text = "The C typedef-annotation builders in `vyre_libs::parsing::c::parse::vast::typedef_ann` share one owner for the row plumbing every one of them needs: `vyre_libs::parsing::c::parse::vast::typedef_ann::row_io` declares the node table, the packed and expanded haystacks and the declaration-context table, sizes each by the one row stride, and emits the store loop that copies a VAST row forward with named field overrides. Five passes each carried their own copy of that loop and their own buffer declarations, so each was free to size a table by a stride of its own or to drop a field it only carries forward. Neighbour-row kind reads move to `vyre_libs::parsing::c::parse::vast::build::vast_row_fields`, which now also publishes the forward-neighbour read the passes were writing by hand. Eight forwarding wrappers in `vyre_libs::parsing::c::parse::vast::build::typedef_visibility::chain` are gone and their callers name `decl_context_row_access::decl_context_base` directly."
