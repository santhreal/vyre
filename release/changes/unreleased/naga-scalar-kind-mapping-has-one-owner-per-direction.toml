category = "Changed"
text = "The WGSL emitter maps between a canonical naga type handle and a scalar kind through one function per direction. `BodyBuilder::scalar_kind_of_type`, previously named `binding_types_lookup` for a lookup it does not perform, is the only reader of the seven canonical handles, and `coerce_value_to_type` had its own byte-identical copy of that if-chain deciding what to coerce toward; `canonical_type_for_scalar_kind` is the only writer, and the carrier-local allocator and the binary-operand unifier each had their own copy of it. `yields_bool` names the six comparisons and two logical connectives once, where `scalar_kind_of_expression` and `is_bool_expression_inner` each listed them. A naga release adding a comparison operator, or vyre admitting another scalar width, previously had to be tracked into two places per direction, and the failure of a missed copy is not a build error: a comparison whose result reads back as its operand kind is stored into a numeric local and rejected at pipeline creation as `InvalidStoreTypes`, or coerced with a `select` that silently reinterprets the value. `unify_binary_operand_types` also stopped rebuilding `Expression::Binary` at each of eight exits; it computes the operand pair and constructs the expression once, and its two operator sets are named for the rule they encode, that naga requires matching operand kinds and that the arithmetic and shift operators additionally reject a bool. The three `Expression::As` arms that differed only in target kind are one arm binding the kind. Emitted WGSL is unchanged and the pinned corpus passes without a repin."
