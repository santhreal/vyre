category = "Added"
text = "`c_frontend::parity_matrix::assert_case_table_covers_fixture_file` reads a fixture family's own source at run time, collects the fixture builders it declares, and fails when the family's `CASES` table does not name one of them. Adding a construct and forgetting to enumerate it used to leave it proven on no backend and indistinguishable from a construct that passed, which is how GNU `__restrict` normalization stayed unproven on every device. A companion contract reads the fixture directory itself, so a new family is red until it either has a case table or is recorded as proven another way with the reason."
