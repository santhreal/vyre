category = "Fixed"
text = "A CUDA device no longer advertises trap propagation it does not perform. `Node::trap` is how an op refuses an input outside its declared domain, and `vyre-emit-ptx` lowers `KernelOpKind::Trap` to a source comment and a branch to the kernel exit: the trapping lane leaves and nothing is recorded, so the host cannot tell a refused dispatch from a completed one. Both CUDA capability records reported `supports_trap_propagation: true`, which is the flag `vyre_foundation::program_caps::check_backend_capabilities` admits a trap-declaring program on, so every guard in nine trap-declaring source files was a guard that did not exist on that backend and a domain violation returned wrong data with no error. Both records now report false, so such a program is refused by name instead. The refusal is the interim truth, not the destination: the destination is the PTX trap sidecar, recording into the reserved binding the lowering already inserts and reading it back on the host the way the wgpu path does, at which point both records flip back in the same change. `vyre-driver-cuda/tests/trap_propagation_capability.rs` asserts the implication in both directions, so neither side can move alone."
