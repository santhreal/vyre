category = "Fixed"
text = "A CUDA device now reports a device trap instead of returning wrong data. `Node::trap` is how an op refuses an input outside its declared domain, and `vyre-emit-ptx` lowered `KernelOpKind::Trap` to a source comment and a branch to the kernel exit: the trapping lane left and nothing was recorded, so the host could not tell a refused dispatch from a completed one. Both CUDA capability records nevertheless reported `supports_trap_propagation: true`, which is the flag `vyre_foundation::program_caps::check_backend_capabilities` admits a trap-declaring program on, so every guard in nine trap-declaring source files was a guard that did not exist on that backend. The emitter now declares a four-word module-scope trap record, claims it with one `atom.global.cas.b32` so exactly one trapping lane writes it, and stores the address operand, the trap tag code, and the reporting lane in the same word layout the secondary text emitter uses. The host resolves the symbol when it loads the module, parses the code-to-tag table out of that module's own text, zeroes the record once per launch sequence, and reads it back after the stream synchronize; a written record refuses the dispatch and names the address, code, lane, and tag. Trap tag numbering has one owner, `vyre_lower::descriptor_trap_tags`, replacing three copies of the same walk. Because the record is per-module, a launch that holds it serializes against other launches of the same module through the gate that already serialized cooperative launches, and CUDA graph capture refuses a trap-declaring program up front because a capture cannot synchronize and so could not read the record back."
