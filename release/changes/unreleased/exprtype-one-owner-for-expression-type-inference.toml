category = "Fixed"
text = "Expression type inference has one owner, `vyre_foundation::validate::typecheck::expr_type`, and the environment its consumers supplied differently is the `vyre_foundation::validate::typecheck::TypeEnv` trait: a scalar lookup, a buffer element lookup, and a hook that observes the type of every subexpression a walk resolves. `vyre_foundation::optimizer::fact_cache::type_facts` and the reverse-mode forward pass in `vyre_foundation::transform::autodiff::grad` each carried a second `Expr` walker, and the three answers had drifted. `Expr::BufferRef` was a word in both copies where validation reports nothing on purpose, so a buffer name could pass an operand typecheck it must never pass; the validator's answer wins. Arithmetic in the fact cache was the left operand's type falling back to the right, so a mixed-width expression took the left operand's width; it now unifies, and an unknown or mismatched pair answers `u32`, which is what validation already assumes of the same expression, so an optimizer fact cannot contradict a validation decision. `BitAnd`, `BitOr`, `BitXor`, `AbsDiff`, `WrappingAdd`, `WrappingSub`, `MulHigh` and `Shuffle` were typed from their operands in the fact cache and are integer-typed by the owner; logical `And` and `Or` and the comparisons stay `bool`, as all three copies already had them. Autodiff typed `Expr::SubgroupShuffle` and `Expr::SubgroupReduce` as words, so the adjoint of an f32 moved between lanes was refused as a non-differentiable cast; both now report their value operand's type. Autodiff also inherits the iterative walk, so a deep forward expression can no longer overflow the stack while its locals are typed. The deliberate i32 `AbsDiff` rejection and the unknown result type of `Expr::Call` are unchanged. A contract reads the `Expr` enum's own source at run time and fails when a variant has no recorded answer, or when a second file in the crate defines an `expr_type` walker."
