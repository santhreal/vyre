category = "Changed"
text = "Two concepts that a consumer crate had re-derived now have one owner. `vyre_test_support::ir_regions` owns the three helpers that slice a stretch of generated IR out of a program and compare it against a sibling, which `vyre_primitives` and `vyre_libs` each wrote out; a comparison helper decides what its test can see, so a widened slice in one copy weakened an assertion in a crate whose author never read the change. `vyre_libs::solvers::bellman_tn_order` no longer re-proves the shortest-path relaxation of `vyre_primitives::math::bellman_shortest_path`: what it owes is the routing assertion it already carries, that its composition emits the primitive program unchanged."
