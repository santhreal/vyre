category = "Changed"
text = "`vyre_libs::graph::dispatch::traversal_dispatch_pipeline` names the `vyre_primitives::graph` program builders it composes instead of re-publishing them. Twenty-one wrappers forwarded every argument and returned the result unchanged, so each body was a restatement of the primitive's parameter list, free to drift from the list it forwards to and unprovable from either side. Nothing outside the module's own tests called any of them. This follows the same removal already applied to the sibling `structural_kernel_pipeline`."
