category = "Changed"
text = "`vyre-libs` no longer carries 120 integration test files whose compositions a `vyre-libs-<domain>` crate owns. 109 move to the owning crate: 32 to vyre-libs-math, 20 to vyre-libs-pattern, 15 to vyre-libs-graph, 11 to vyre-libs-reduce, 8 to vyre-libs-decode, 7 to vyre-libs-hash, 4 each to vyre-libs-bitset and vyre-libs-nn, 3 each to vyre-libs-parsing and vyre-libs-text, and 2 to vyre-libs-fixpoint. 11 are removed because the destination already proves the same cases: three fixture modules the destination holds a superset of, `graph_sweep_fixtures` whose one-round frontier-step runner joins the vyre-libs-graph copy, `adversarial_graph.rs` and `adversarial_frontier_queue_clear.rs` whose 13 cases vyre-libs-graph states name-for-name, and four `visual_compositions__*` contract cases plus `visual_compositions.rs` that the registry-derived conformance test in vyre-libs-visual subsumes. The 166 remaining facade tests are multi-domain compositions, workspace contracts, and single-domain cases needing a dev-dependency outside a partition crate's vocabulary."
