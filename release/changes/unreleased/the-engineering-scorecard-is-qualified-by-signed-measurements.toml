category = "Changed"
text = "The engineering scorecard reports `unqualified` unless every package, axis and target cell is covered by a measurement signed by two distinct registered reviewers on distinct hosts, taken on a clean checkout of the recorded source fingerprint against thresholds registered in `release/engineering-qualification.toml` before the holdouts were disclosed. It previously reported 22 of 22 axes passing for every crate from the registry listing alone, with no measurement behind any cell. The scorecard artifact schema is version 2 and carries the qualification status and the reason it was withheld."
