category = "Added"
text = "The `ci-matrix` gate reports a hosted CI matrix that has lost a platform or a toolchain, and a device escape hatch inside it. The rule it replaces asked whether the workflow file contained the word `stable` anywhere, which a step name satisfies, and whether it contained `macos-latest`, which a commented-out axis satisfies, so an axis could be deleted and the check stayed green. The gate reads the axis values out of the matrix block, which is what expands into jobs."
