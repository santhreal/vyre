category = "Fixed"
text = "The public-API snapshot is taken with every feature enabled. It read the default feature set only, so every feature-gated public module was outside the file that claims to pin the public API: the whole `graph` surface of vyre-primitives, including an exported macro, was unmeasured, and a change that deleted three public items there left the gate green. The check is now the registered gate `public-api-snapshot`, which derives the publishable roster from the manifests, reports a snapshot naming a package that no longer publishes, refuses an extraction with no items instead of skipping the crate, and prints the added and removed items of every snapshot it writes so an unintended bless of somebody else's in-flight surface is visible."
