text = "The C11 typedef annotation path now composes registered row phases instead of inlining them: c11_identifier_row_hash, c11_identifier_row_hash_packed_haystack, c11_enclosing_function_lparen_for_row and c11_builtin_declaration_kind_for_row are registered operations with reference oracles, and one shared owner emits the phase program buffer contract."
