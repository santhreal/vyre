category = "Changed"
text = "`recurrent_gated_delta` and `chunked_gated_delta` take `&GatedDeltaSpec`, which is now public, and the chunked schedule is exported from the module that builds it. Each entry point had restated the same sixteen positional parameters and then rebuilt the same spec literal field by field, so eighty-two lines existed only to pass a value straight through, and any two of the eight buffer names could be swapped at a call site without a type error. The two builders that consume the spec are the entry points, so there is no wrapper left to drift. `nn_attention_clone_family_ir_invariance` pins the built IR of both schedules at both dtypes by hash, and those hashes are unchanged."
