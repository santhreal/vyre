category = "Fixed"
text = "An artifact whose math reaches `Exp`, `Log`, `Sin`, `Cos` or `Tanh` compiles for CUDA. `vyre-driver-cuda` built `PtxEmitOptions` with `ulp_budget: None`, and the PTX emitter refuses to lower a transcendental to an approximate native instruction without a positive budget, so 21 registered ops failed target emission on the production artifact route with a refusal naming a budget no caller on that route could set. The window is a property of the selected program, owned by `vyre_foundation::fp_parity::f32_ulp_tolerance`, which is the same function the reference comparison judges the output with; `SelectedLowering::f32_ulp_budget` reads it, so the emitter's approximation right and the comparator's acceptance window are the same number by construction. The direct dispatch route already passed that window through `DispatchConfig::ulp_budget`, so the two routes now emit the same PTX for the same program instead of one refusing what the other lowers."
