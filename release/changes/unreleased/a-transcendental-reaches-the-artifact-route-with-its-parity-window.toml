category = "Fixed"
text = "An artifact whose math reaches `Exp`, `Log`, `Sin`, `Cos` or `Tanh` compiles for CUDA. The PTX emitter refused to lower those ops to a native instruction unless `PtxEmitOptions::ulp_budget` was positive, so 21 registered ops failed target emission on the production artifact route with a refusal naming a setting no caller on that route could reach. The refusal described a choice that does not exist: PTX has only an approximate `tanh`, `ex2`, `lg2`, `sin` and `cos`, so there was no strict form to fall back to and nothing for a budget to select. It is gone, and those ops now emit their one instruction unconditionally. The budget still governs `InverseSqrt` and `Reciprocal`, where PTX does offer both a `.approx` and a `.rn` form, and `Sqrt` was always exact. `vyre_foundation::fp_parity::f32_ulp_tolerance` remains the owner of the acceptance window the reference comparison judges output with."
