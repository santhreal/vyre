category = "Fixed"
text = "The reference oracle interprets a whole-grid fence where it stands instead of cutting the program with `transform::grid_sync_split`, the transform a backend without a cooperative launch runs. Sharing the cut shared its blind spot: that transform hoists a fence only out of an unconditional `Block` or `Region`, so a fence under a `Loop` or an `If` stayed inside its container and degraded here to a workgroup barrier, and the oracle certified an unsynchronized result for the one shape the backend also gets wrong. A lane now suspends on `MemoryOrdering::GridSync`, the dispatch driver runs every other workgroup to its own fence, and only then does any lane resume, so a loop-nested fence orders the grid on every iteration and workgroup memory survives the fence rather than being rebuilt from zero. The single-workgroup statement executor `node::step` cannot observe the rest of the grid and now refuses a grid fence instead of releasing it as a workgroup barrier."
