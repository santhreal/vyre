category = "Fixed"
text = "Every `vyre-primitives` feature compiles alone. The operand-shape guards `matrix_cells` and `square_matrix_cells` lived behind the `math` feature while `graph` used them, and `math` already enables `graph`, so the missing edge could not be added without a feature cycle: `--features graph`, `math`, `nn`, `geom`, `opt`, `topology` and `all-lego` all failed to build. The guards now live in `vyre_primitives::operand_shape`, compiled unconditionally because a shape check is not a domain, and all twenty-four features build in isolation."
