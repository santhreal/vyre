category = "Fixed"
text = "`vyre-driver-metal`'s poisoned-resident-table test poisons the lock. It was named for the poison path and documented the sentinel, then contained a comment-only block whose note explained that `MetalBackend` does not expose `resident_buffers`, and asserted only that a healthy snapshot carries both resident keys with a count of zero. It could not fail on the bug it existed for. It now allocates a resident buffer, poisons the table from a thread that panics while holding the lock, and asserts the count and byte total are both `u64::MAX`, that `metal_resident_buffer_error` is 1, and that the unrelated counters survive. The healthy test asserts the error key is absent, so the pair separates poison from emptiness instead of proving one state twice. `resident_buffers` is `pub(crate)` because poisoning the lock is the only way to observe the contract."
