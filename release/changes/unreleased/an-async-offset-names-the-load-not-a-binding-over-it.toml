category = "Fixed"
text = "The uniformity proof V139 wants belongs to the operand an async transfer is written with, not to a name: a load from a read-only buffer at a uniform index is workgroup-uniform where it is written, and the same load hoisted into a `Let` is judged by the ordinary uniformity analysis, which refuses every load. `vyre-libs::vfs::resolve` bound its transfer offset for readability and lost the proof, so the one operation the crate registers for asynchronous block loads built a program the validator refused and no dispatch path could run it. The offset names the load. A new test validates the neutral program of every operation the library catalog registers, against exactly the capabilities that registration declares, so a program the validator refuses is a red test rather than a failure inside a consumer's program; the asymmetry between the operand and the binding now has a test of its own in the V139 suite."
