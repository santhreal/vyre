category = "Changed"
text = "An optimizer pass now reports whether it changed the program by comparing structure, not by hashing the program before and after. Hashing forced a full canonical wire encode plus BLAKE3 over a freshly built program whose memos were cold, once per pass invocation, which measured as roughly half of the optimizer pipeline's instruction count. The structural comparison answers the same question, ignores buffer declaration order exactly as the canonical fingerprint did, and short-circuits when an engine hands its input back untouched. A pass that changes nothing now returns the program it received, so fingerprint, statistics, and shape memoization survive into the next pass."
