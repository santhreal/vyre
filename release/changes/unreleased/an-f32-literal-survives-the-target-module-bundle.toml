category = "Fixed"
text = "An f32 literal reaches a materializer with every bit intact. `LiteralValue::F32` was written as a JSON number inside the target-module bundle, and JSON has no non-finite number, so a lowering that seeds a running maximum with negative infinity produced a bundle carrying `null` where the literal belonged and every backend refused it with `invalid type: null, expected f32`. That took `vyre-libs::nn::top_k` and `nn::softmax_top_k` out of the conformance certificate. A non-finite literal now carries its IEEE-754 bit pattern in hex; a finite one is still a plain number, byte for byte what it always was, so no other surface carrying a descriptor changes shape. The escape is asked for only where the format is self-describing: a compact format carries all 32 bits in a number and answers no `deserialize_any`, so a dumped descriptor stays decodable and a descriptor hash taken over that encoding keeps its value. `TARGET_MODULE_BUNDLE_SCHEMA_VERSION` moves to 3 because the payload can now hold values version 2 could not represent."
