category = "Fixed"
text = "An f32 literal reaches a materializer with every bit intact. `LiteralValue::F32` was written as a JSON number inside the target-module bundle, and JSON has no non-finite number, so a lowering that seeds a running maximum with negative infinity produced a bundle carrying `null` where the literal belonged and every backend refused it with `invalid type: null, expected f32`. That took `vyre-libs::nn::top_k` and `nn::softmax_top_k` out of the conformance certificate. The literal now serializes as its IEEE-754 bit pattern, which is lossless in every serde format the descriptor travels through, and `TARGET_MODULE_BUNDLE_SCHEMA_VERSION` moves to 3 so a stored version 2 bundle is refused by version rather than reinterpreted under an encoding it was not written in. The version check in `TargetModuleBundle::from_bytes` now runs before the per-module descriptor loop, so a stale bundle is reported as the stale schema it is instead of as a malformed descriptor. Closes 3 diverging (backend, op) conformance pairs."
