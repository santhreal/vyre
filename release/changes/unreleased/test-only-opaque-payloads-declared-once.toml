category = "Changed"
text = "A test-only IR extension payload is declared through `vyre_test_support::test_expr_extension!` or `test_node_extension!` instead of six hand-written trait methods. Five of the six are the same in every test that needs an inert opaque leaf: report success from validation, hand back `self` for downcasting, and answer the identity questions from a literal. Only the kind string, the debug identity, the result type, the CSE answer and the fingerprint byte differ, so those are the arguments. A test that needs reachable structure, a wire body, or a validation failure still writes the impl out, because those are the cases where the boilerplate is the contract."
