category = "Fixed"
text = "The megakernel IO sidecar serviced the DMA on the device. It compare-exchanged a `PUBLISHED` slot the host pump also claims, read the transfer offset and size from a queue word the device itself writes, started a workgroup-collective transfer under the divergent control flow of the single winning lane, and published `slot::DONE`, a status no reader in the IO protocol accepts: the requesting lane in the `LOAD_MISS` handler polls for `io_status::OK`, so it spun to `u32::MAX` and the slot never returned to `EMPTY`. The IR validator refuses a transfer offset and size read from a read-write buffer under V139, so `build_program_jit`, `build_program_jit_slots`, `build_program_priority`, `build_program_priority_slots` and `build_program_sharded_with_io_polling` produced programs the crate could build and never run. The sidecar is now the completion recycler the protocol documents: it returns a slot the host completed with `io_status::OK` or `io_status::ERROR` to `slot::EMPTY`, claims nothing, and starts no transfer. Every re-exported megakernel builder is now held against IR validation and against starting a device-side transfer at all."
