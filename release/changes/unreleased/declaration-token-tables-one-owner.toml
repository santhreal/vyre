category = "Fixed"
text = "Four token tables that decide whether an identifier is a declarator name are single-owner in `parsing::c::parse::vast::token_grammar::declarations`. The declarator-follower set no longer admits `]`, which had made the bound in `int a[N];` a declarator on the precomputed path only. The declaration-prefix set gained `auto` and `register`, and the precomputed path now reads it instead of a 23-entry copy that omitted every C23 scalar type, `_Alignas`, `typeof` and the GNU specifiers. A new matrix reads the token vocabulary out of `vyre-spec` at test time and fails when any kind is classified differently by the two paths."
