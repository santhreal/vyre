category = "Removed"
text = "`vyre_primitives::types` is gone. `LinearDiscipline` declared the same four substructural disciplines and the same `forbids_drop` and `forbids_reuse` predicates as `vyre_foundation::ir::LinearType`, and `check_linear_use` was a second implementation of the per-buffer decision `vyre_foundation::validate::linear_type` already makes and reports with a fix hint. `ShapeFormula` aliased `vyre_foundation::ir::ShapePredicate` and its evaluator forwarded to that type's own method. Both had no callers, and the foundation owner's own tests already assert every boundary the copies asserted."
