category = "Added"
text = "Closes Rows 102, 105, and 104 by introducing orthogonal semantic type components (ScalarType, VectorType, TensorType, RecordType, VariantType, Sparsity, QuantizationMeaning, ResourceCapability, OwnershipMutability, LifetimeEpoch, NumericalContract), an interned symbolic shape engine and affine solver in vyre_foundation::types::shape, nine closed memory and effect types with no defaults in vyre_foundation::memory_model, and a declarative verifier with Verified<SemanticModule> and dynamic invariant certification in vyre_foundation::verifier."
