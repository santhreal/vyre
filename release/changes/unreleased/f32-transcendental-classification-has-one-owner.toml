category = "Fixed"
text = "`Log2`, `Exp2`, `Tan`, `Acos`, `Asin` and `Atan` had two different f32 parity windows depending on which gate ran a program. The per-op ULP audit had forked the transcendental classifier behind `f32_ulp_tolerance` and its operator set was a strict superset, so those six got the 128 ULP backend window in the audit and the 4 ULP elementary window everywhere else. `vyre-foundation/src/fp_parity.rs` now classifies the union, which is the correct direction because each lowers to an approximate native instruction, and the fork is gone. `Reciprocal` stays in the elementary window: cuda and wgpu both lower it to a division. A gate enumerates every frozen `UnOp` and fails on one that neither classification table names, so a new variant cannot inherit the elementary window by omission."
