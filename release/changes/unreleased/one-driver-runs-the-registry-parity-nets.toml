category = "Changed"
text = "The four registry parity nets have one implementation. Every registered surface owes the same contracts: a registered program reads no buffer out of bounds on its own fixture, stays in bounds when the dispatch over-fires by a whole workgroup, returns the same bytes at both grids, and returns the same bytes when the lane step order is reversed. The nets were written once per crate and the copies drifted, so the same un-evaluable fixture was refused on one surface and skipped on the other, which reported a clean sweep of a subset. `vyre_test_support::registry_nets` now holds the driver, `vyre-libs` and `vyre-primitives` supply only their populations, and a new control suite hands each net a population carrying exactly the defect it names and requires it to fail."
