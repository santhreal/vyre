category = "Added"
text = "The scalar sweep is closed against the frozen public surface: every `NodeStorage` literal variant in the `vyre-foundation` snapshot must have a matrix row, a row naming a variant the surface does not carry fails, each row must sweep the full sampled depth or carry the reason it does not, each row must keep the operation count it declares today, and every operation a row leaves undeclared must still be refused by name. The dual sweep is closed the same way against the `vyre-reference` snapshot: every marker implementing `ReferenceEvaluator` is either exercised against its u32 contract or recorded with the payload shape it takes instead, and a marker that is both, or that the frozen surface no longer carries, fails. Adding a scalar literal, adding an evaluator, or widening the interpreter's operation table turns the suite red until a row records the decision."
