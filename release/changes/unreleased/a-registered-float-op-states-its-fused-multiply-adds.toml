category = "Fixed"
text = "Nine registered floating-point operations left a multiply feeding an add for a backend to contract on its own, so a device took one rounding where the reference took two. `vyre-libs::math::dot_partial`, the attention max, sum and write passes, the online-softmax recurrence, the quest page scores, the turboquant score and value accumulations, the partial-rope rotations and the 4-bit linear dot product now state `Expr::fma`, which the reference, the naga emitter and the PTX emitter all answer with a single fused rounding. Five rows left the unstated-contraction ledger at zero and the tensor-train row fell from ten sites to eight. The operations were visible only with every feature enabled, which is how the whole `nn-attention` family stayed unmeasured."
