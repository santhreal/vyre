category = "Fixed"
text = "The generated operation schema reads the tier and the enabling features each operation registers instead of deriving them from the identifier. Reading the vyre-primitives and vyre-libs prefixes reported 163 intrinsics against 164 compositions where the tree has 9 intrinsics and 318 compositions, and a table of 18 domain names supplied a feature for every operation whether or not one gated it. The defining crate of an operation is now the crate that registers it, found by walking module declarations from each crate root, and the number of registrations that record no enabling feature is a pinned count rather than a fabricated one."
