category = "Fixed"
text = "`vyre_foundation::scalar_ops` is the single owner of scalar operator semantics. The literal folder in `vyre_foundation::ir_eval` and the storage-graph interpreter in `vyre_foundation::ir_inner::model::node_kind` each carried a full per-width operator table, and the two tables disagreed on more than thirty (operator, width) pairs: the folder retyped integer transcendental, rounding, classification, `Abs` and `Sign` expressions to f32, folded i32 `AbsDiff`, `And`, `Or`, `RotateLeft` and `RotateRight`, f32 `Mod`, and bool `BitXor`, all of which `vyre_foundation::validate` rejects, while the interpreter had no answer for u32 `Negate`, the unpack operators, i32 `BitNot`, `Popcount`, `Clz`, `Ctz` and `ReverseBits`, the f32 unary math set, or f32 comparisons. The validator decides every row. f32 `Div` and i32 `Shl`/`Shr` are now total, matching IEEE-754 division and the shift-count-modulo-width rule the backends lower to, instead of bailing on NaN, zero or a negative count."
