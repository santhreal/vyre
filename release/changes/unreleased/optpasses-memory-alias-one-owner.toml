category = "Fixed"
text = "The buffer-interference proof the memory passes need before they may rewrite across a gap has one owner, `vyre_foundation::optimizer::passes::memory::alias`. `dead_store_elim` and `store_to_load_forward` each carried a full node-by-node copy of it, both exhaustive and both tested, and they disagreed: a compare-exchange against another buffer, which is how a lock is taken, blocked the dead-store proof and did not block the forwarding proof, so a load across a lock acquire was replaced with the value stored before it. Both copies also inspected only the one buffer `Node::Trap` and `Node::IndirectDispatch` name, while both pass module docs promised the node blocks outright; a host effect handler and a launched grid may touch any buffer, and a grid-synchronizing collective is at least a fence. The owner answers all of that once, and what stays per-pass is the one bit that genuinely differs: whether a write to the buffer interferes or only a read. Node descent and buffer naming come from `vyre_foundation::visit`, so a new IR variant fails to compile here rather than defaulting to harmless."
