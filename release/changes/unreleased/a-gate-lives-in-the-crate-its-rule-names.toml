category = "Fixed"
text = "The lego-quick gate answers from source text and no longer links the operation registry: it moved to xtask, which is where both crates already say a source-text gate belongs, so a pre-commit run stops building the registry crate. Its rule against sibling-dialect imports in vyre-libs is replaced by one against an import the manifest does not declare, because composing another dialect is what the composition policy asks for and undeclared coupling is what it forbids; dialect membership is now derived from the cfg attributes in vyre-libs/src/lib.rs instead of a hand-kept list of five names, and the fix text names the shared builder and descriptor modules. Two checks are gone: a large-file advisory that was a third owner of a measurement the file-size cap and the composition audit already own, and a ban on IR construction under vyre-libs, which forbade the one thing a Category A composition is defined to do and whose 203-row path exemption list had rotted to 59 dead rows because no path list survives a file split."
