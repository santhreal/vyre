category = "Changed"
text = "`vyre-driver/tests/async_dispatch_contract.rs` is the sole owner of what the default async dispatch adapter guarantees: error propagation before any await, a ready handle that never blocks, independent handles per dispatch, object safety through both awaits, and the default `dispatch_borrowed` and resident-async paths. The counting, failing, and resident backend fixtures are declared once. `async_dispatch_always_nonblocking.rs` carried byte-identical fixtures and three duplicate tests and is gone; every assertion it made is made here, and the borrowed-dispatch case now checks the forwarded payload rather than only that the call succeeded."
