category = "Fixed"
text = "A failed CUDA enqueue is cleaned up by one function. Four sites, two in the resident async dispatch path, one in the resident batch path and one in the host dispatch path, each carried the same ordering decision written out by hand: synchronize the stream so the device is no longer reading the buffers, record the sync point in telemetry, release the launch resource lease, drop the resident in-flight guard, then forget the allocations that the device may still own. That ordering is the whole correctness argument, and four copies of it can drift one at a time, with the failure landing as a use-after-free on the abandon path where nothing routine exercises it. `vyre-driver-cuda/src/backend/enqueue_cleanup.rs` now owns `FailedEnqueueGuards` and `abandon_failed_enqueue`, which perform that sequence once and return the same error text the four sites produced."
