category = "Changed"
text = "The release evidence readers in `xtask-evidence` read each shared concept through one owner. The eight wall-clock minima are a single `WallClockMinima` record flattened into the three artifacts that publish them, the schema-2 JSON read, the workload matrix, the `u64` field read and the array length read are one function each, the optimization family list is `vyre_foundation::optimizer::corpus::RELEASE_OPTIMIZATION_FAMILIES`, and the benchmark case fixtures are built rather than restated. A copy that a reader forgets to update is a gate that passes on evidence nobody checked."
