text = "The `vyre` facade wire suites share one program fixture in `vyre/tests/support/mod.rs`. The round-trip suite proves a valid program survives an encode and a decode byte for byte and the malformed-wire suite proves hostile bytes never decode into one, so two copies of that program let the two halves of the claim drift. In `vyre-grammar-gen` the LR table the wire round trip exercises is the sample grammar `vyre-grammar-gen/src/lr.rs` already owned, not a second copy of it. Pins lowered to the measured tree: vyre 22 to 0, vyre-grammar-gen 137 to 119."
