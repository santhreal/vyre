category = "Changed"
text = "No module in vyre-libs calls reference_eval any more. The last ten modules that built their own Value vectors now go through fixture_bytes, and a determinism probe that ran a program in declaration lane order and again reversed has one owner, eval_bytes_lane_order, instead of a copy of the branch in two crates' fixpoint tests. In bitset_fixpoint, two composition witnesses were imported under the aliases reference_eval and reference_eval_warm_start, which gave the interpreter's name to something that is not the interpreter; they are difference_flag and warm_start now."
