category = "Fixed"
text = "The single-workgroup prefix scan indexes its workgroup scratch with `LocalId` and runs under a `WorkgroupId == 0` fence. It read `InvocationId`, the global id, which is the same number only when the launch is one workgroup wide. At or below the portable workgroup width it is, which is why every test of the builder passed; above it the inferred grid is `ceil(n / lanes)` workgroups and every lane past the first workgroup stored into a workgroup buffer holding `lanes` slots. On CUDA that faults with an illegal address rather than returning a wrong answer, so a 1024-element scan through `scan_prefix_sum` could not run on a device at all. A program that is correct at one launch geometry must not read a geometry-dependent id."
