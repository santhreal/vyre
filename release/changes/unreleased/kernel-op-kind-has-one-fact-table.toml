category = "Changed"
text = "`KernelOpKind` is enumerated in exactly one place. `vyre-lower/src/op_facts.rs` owns an exhaustive match with no wildcard arm answering both per-kind questions the workspace asks: which operand names the first child body, and whether the op must be kept when its results are unused. `child_body_operands` and the dead-op purity predicate both read it, replacing two separate lists of the same variant universe, and `vyre-emit-ptx/src/patterns/predicated_execution/mod.rs` reads it instead of restating sixteen variant names. What stays in the PTX pass is the judgment that only a plain global or shared store is maskable by a `@%p` instruction predicate. Adding a variant now fails to compile until both facts are stated for it, rather than defaulting to no child body and removable."
