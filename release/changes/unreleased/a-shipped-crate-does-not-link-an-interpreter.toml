category = "Added"
text = "The host-oracle-elimination gate now reads manifests as well as sources. Containing no host oracle is not the same as linking none: a shipped crate that names vyre-reference or vyre-driver-reference under [dependencies] carries the interpreter into the binary whether or not a line calls it, and a later caller only has to reach for what is already there. Every crate whose layer in docs/CRATE_OWNERSHIP.toml is a shipping layer is now checked for a production route to a host evaluator, and the finding names the route. [dev-dependencies], [build-dependencies], and the conformance and tooling layers are exempt, because running the interpreter is what they are for."
