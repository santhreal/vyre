category = "Changed"
text = "A frozen-contract snapshot records the declaration and nothing else: the item line, its signatures and its closer. Default method bodies, doc comments and blank lines are left out. Before, a refactor inside a default body or a repointed doc link reported a semver-major contract change, and the fix text told the reader to bump the major version for it, so the seven snapshots had drifted on work that changed no contract. Braces are counted on code alone, because a brace in a comment or a string literal nests nothing. `VyreBackend` reads as 182 lines of signatures where it was 940 lines of bodies."
