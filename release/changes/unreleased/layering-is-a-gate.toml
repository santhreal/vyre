category = "Changed"
text = "The transitive layer closure is a registered gate. `scripts/check_layering.sh` and `scripts/lib/check_layering.py` are deleted and `layering` reads the graph from the manifests and `Cargo.lock` instead of from `cargo tree`, so it produces a verdict on a workspace cargo cannot resolve, which is the state the rule exists to describe. Member edges are read with the member's own default features activated, the edge set `cargo tree --edges=normal` prints; third-party edges come from the lockfile, so a substrate-neutral crate that reaches a backend API only through another third-party crate is caught rather than missed. A finding names the chain it found, not just the endpoints. An unregistered member, a layer with no neutrality decision, a decision no member uses, and a backend API name absent from `[workspace.dependencies]` are all errors rather than findings, because each of them makes the neutrality rule answer for a roster nobody reviewed."
