category = "Added"
text = "The crate-structure gate now fails when a src/ module file sits beside a directory of its own name, and when a module or binary name states no contract (common, core, helpers, misc, types, utils, or an _ext suffix). It judges every crate in the checkout, found by walking for a manifest that declares a package, so a crate outside the workspace roster is judged too. A module the committed public-API snapshot publishes keeps its name while it stays published, because renaming it renames a path consumers import; a binary root has no module path and is judged by the name a reader types to run it."
