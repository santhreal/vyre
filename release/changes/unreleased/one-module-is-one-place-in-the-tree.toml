category = "Added"
text = "The crate-structure gate now fails when a src/ module file sits beside a directory of its own name, and when a module name states no contract (common, core, helpers, misc, types, utils, or an _ext suffix). Both file lists come from the tree at run time. A module the committed public-API snapshot publishes keeps its name while it stays published, because renaming it renames a path consumers import."
