category = "Changed"
text = "The flat-evaluator test harness in `vyre-reference` has one owner, `vyre-reference/tests/flat_expr_eval/mod.rs`. The adversarial proptest, the adversarial gap suite and the subnormal flushing contract each carried their own wrapper program, zero invocation, expression-evaluation entry, literal `BinOp`/`UnOp` builders and float-bit extractor, and the copies had already drifted in panic text. The IEEE-754 canonicalization the sweeps compare against stays an independent restatement rather than a call into the interpreter, so the oracle still does not check itself."
