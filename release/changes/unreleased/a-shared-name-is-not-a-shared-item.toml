category = "Fixed"
text = "The one-public-path gate reads the crate source to tell an item at two paths from a name several sibling modules each declare. A snapshot line is identical for both, so a terminal id table per grammar, a per-op identifier and a lint entry point named for the scan it runs all read as one item published four ways, and a quarter of the measured count could not be closed by deleting anything. A name the crate declares twice is two items; only a name declared at most once can be one item at two paths. The count of shared names is reported and left unpinned, because a module is what disambiguates two grammars naming the same bracket."
