category = "Changed"
text = "`vyre_libs::solvers::numerical_kernel_pipeline` re-exports the Sinkhorn entry points of `vyre_libs::math::sinkhorn_iterate` instead of wrapping them. Seven wrappers forwarded every argument and added nothing, so their whole body was a restatement of the primitive's parameter list, up to twelve positional arguments, free to drift from the list it forwards to and unprovable from either side. A composition names the primitive it composes. The public names are unchanged."
