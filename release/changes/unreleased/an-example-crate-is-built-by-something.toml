category = "Removed"
text = "Four demonstrators under `examples/` are gone. `external_backend_extension` declared its own workspace and was compiled by no target and no workflow. `wgpu_readwrite_count_repro` was excluded from the workspace, so the regression test beside it never ran. `libs-template` was a cargo-generate scaffold exempt from the demo test rule, and the authoring recipe it pointed at lives in `vyre-libs/AUTHORING.md`. `three_substrate_parity` held a README and a manifest that named the live parity gates and published reports under a `docs/parity/` tree that no longer exists. `examples/external_ir_extension` stays; the external-IR demo gate builds it. The workspace `exclude` list drops the two entries that named deleted directories."
