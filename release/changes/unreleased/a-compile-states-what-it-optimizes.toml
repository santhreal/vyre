category = "Changed"
text = "Every production compile now states a versioned `CompileObjective`: a primary ordered metric, tie breakers, weighted or worst-case workload classes, a risk statistic, an amortization horizon, hard per-metric bounds including the artifact byte ceiling, and an artifact portfolio policy. Candidate selection preserves the legal Pareto frontier until the objective orders it, a metric priced by a target fact the device withheld is refused by name, and the objective participates in request, artifact and cache identity."
