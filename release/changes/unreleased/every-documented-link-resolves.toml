category = "Fixed"
text = "Every intra-doc link in the workspace resolves, so `cargo doc` builds with `broken_intra_doc_links` denied. The regex DFA module pointed readers at `crate::scan::RegionEvidencePipeline`, a type that exists nowhere in the tree; it now names `crate::scan::regex_anchored_window`, the module that actually consumes candidate origins from a prefilter, and disambiguates `nfa_to_dfa()` from the module of the same name. A module header comment resolves its links in the scope of the parent that declares the module, so the telemetry and security family-mask headers name their items by full path instead of by bare name."
