category = "Changed"
text = "The resident work-queue buffer set the megakernel benchmark cases dispatch over has one owner, `vyre-bench/src/cases/resident_queue.rs`. Each of the three cases carried its own copy of the four-buffer control/ring/debug/io encoding, its own post-dispatch transfer accounting and its own resident-pool metric point. Each case keeps what it measures: its own ring builder, its own CPU reference, and its own grid override, because the latency case drains a single workgroup while the condition case drives the full grid and that difference is the measurement."
