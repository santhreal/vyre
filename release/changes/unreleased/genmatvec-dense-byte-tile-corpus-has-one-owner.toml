category = "Changed"
text = "The dense byte-tile Four-Russians matvec corpus has one owner, `tests/support/dense_matvec_cases.rs`, with one arm per crate: `vyre_libs::bitset::four_russians` pins its byte-LUT builder, word-count helper, CPU reference and dispatch Program, and `vyre_libs::encoding::bitset_transform_pipeline` pins its own sizing, LUT builder, parity oracle and composed Program. The corpus generator, the frontier masking and the naive boolean-semiring oracle were written twice, and the two copies swept different bounds: 0..=18 byte tiles by 1..=5 destination words on the primitive side, 0..=24 by 1..=4 on the substrate side, so 384 cases in the union were exercised by neither. Both arms now run the union, plus a saturated-frontier group neither had, which is the only way the all-ones LUT row of every tile is reached at once."
