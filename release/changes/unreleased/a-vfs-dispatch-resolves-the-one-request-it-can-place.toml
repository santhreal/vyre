category = "Fixed"
text = "`vyre-libs::vfs::resolve` took a request count and gated its transfer on the workgroup index being below it, but an async transfer names a source offset and a length and lands at the head of its destination, so every workgroup in that grid wrote the same destination region with a different file's bytes and the surviving copy was whichever workgroup finished last. The signature promised a batch the node cannot place. `vfs_resolve_dma` now resolves the one request a dispatch can resolve and takes `block_words`, which sizes the destination and the transfer together instead of naming a fixed 4096-byte length that was silently clamped to whatever the destination held."
