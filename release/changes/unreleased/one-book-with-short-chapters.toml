category = "Added"
text = "The documentation is one book of short chapters under docs/, each stating one concern with its examples first: guide/install, guide/first-program and guide/backends for a caller; architecture/crates, architecture/artifact, architecture/compile-search and architecture/parsing for a contributor; reference/values, reference/operations, reference/diagnostics and reference/wire-format for the API surface; extending/operation and extending/backend for an out-of-tree author; conformance/program and release/process for the two lifecycle contracts. Every claim in them is read off the current source: the backend acquisition example now names vyre_driver::acquire rather than a pub(crate) module path, the wire envelope is recorded as the VYRE magic tag at schema version 6 reading versions 4 through 6, and the validation catalog is recorded as 96 rules across eight phases."
