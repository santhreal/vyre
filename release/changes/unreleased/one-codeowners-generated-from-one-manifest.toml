category = "Changed"
text = "`.github/CODEOWNERS` is generated from the new `docs/PROTECTED_BOUNDARIES.toml` by the `codeowners` gate, and the root `CODEOWNERS` is deleted. GitHub reads the root file first and ignores every later location, so the repository's active policy was a file naming `spec/`, `vyre-wgpu/` and `core/src/ir/`, none of which exist. The manifest records a protection decision for every workspace member, so a new crate fails the gate until one is written down, and branch protection now requires the code-owner review that made those lines binding in the first place."
