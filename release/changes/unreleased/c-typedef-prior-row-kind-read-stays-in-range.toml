category = "Fixed"
text = "`vyre_libs::parsing::c::parse::vast::build::vast_row_fields` clamps the index before loading a prior row kind. The subtraction was unclamped, and because a select in this IR evaluates both arms, row 0 wrapped its index to near `u32::MAX` and the untaken arm addressed a row far past the end of the table. Three of the five hand-written copies of the read already clamped. The global-typedef fast pass also read its forward neighbour with no out-of-range fallback while every sibling and the CPU oracle substituted the sentinel; both reads now come from the shared owner."
