category = "Fixed"
text = "Four comments in substrate-neutral production source named a concrete backend where the neutral concept was what they meant. `vyre-driver` described a materialization failure as belonging to one portable target rather than to the backend dispatch and to a device case, and the fused-multiply-add rationale in `vyre-libs::math::preconditioner` and `vyre-libs::math::tensor_train_decompose` named the two emitters that answer an `Fma` with a single rounding instead of saying that every emitter does. The measurements the comments cite are unchanged."
