category = "Fixed"
text = "A program whose result depends on how many invocations ran launches enough of them to cover the input span it declares. A logical region states its domain from one declared value, so an atomic reduction over 4096 elements accumulating into a single accumulator reported a domain of one point, was scheduled as one workgroup, and returned that workgroup's lane count as the sum. The baseline schedule now takes the wider of the region domain and the coverage `vyre_foundation::launch_covers_full_input_span` states for an atomic, a subgroup collective or a workgroup-scoped buffer, and an artifact carrying a geometry record that covers fewer logical points than its program states is refused where the record is minted rather than reported as a wrong number by a device."
