category = "Fixed"
text = "Every reader of the operation registry and the backend registry reads it through `vyre-registry-link`, which references a real symbol in each submitting crate and asserts that each linked source reached the registry. An `inventory` registration lives in the object file of the declaring crate, and the linker keeps that object only when a symbol inside it is referenced, so `use vyre_libs as _;` and `std::hint::black_box(METAL_BACKEND_ID)` linked nothing: the conformance test binaries registered two backends where the build declared four, and their registry rules judged that partial set without failing. The five driver crates now expose `registered_backend_id`, a function call that anchors the object file and reports whether the target compiled the registration at all, and the discarding imports and `force_link_backend_inventory` helpers they replaced are gone."
