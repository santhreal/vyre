category = "Changed"
text = "`vyre_reference::composition_witness` states each finite-category construction once. Left and right Kan extension were four functions differing in whether the fold summed or multiplied and whether it ran per object or over a table; they are now `kan_extension_at_witness` and `kan_extension_table_witness` taking a `KanDirection`, over one shared fold. `adjoint_pair_witness` returns the pair and its witness rather than a bool, and `natural_transformation_count_witness` returns the count of natural transformations."
