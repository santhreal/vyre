category = "Fixed"
text = "`BinOp::result_class` is the one answer to what a binary operator's result type is, and `BinOp::takes_numeric_operands` is derived from it. `validate::typecheck` asked that question twice and wrote its own operator list each time, once to give an expression a static type and once to decide what its operands must be. The lists had already drifted on `AbsDiff`, which is in the operand list and not the type list; that happens to be correct and nothing said so, and nothing would have caught the reverse. Both lists ended in a catch-all, and `BinOp` is `#[non_exhaustive]`, so a new operator took whatever the last arm held. The match now lives in `vyre-spec` beside the enum with no catch-all arm, so adding an operator fails to compile there instead. `BinOpResult` is closed on purpose: a new operator is additive, a new RESULT CLASS is a new answer every consumer has to decide for."
