category = "Changed"
text = "Batched dispatch readback has one owner and one allocation for its rows. `vyre_driver::BatchOutputs` stores every dispatch's output row end to end in a single buffer and hands rows out borrowed, replacing the `Vec<Vec<Vec<u8>>>` returned by `vyre_driver_wgpu::pipeline::compound` and `vyre_driver_wgpu::engine::graph`. The middle level of that type held exactly one output slot at every call site, so an n-dispatch batch allocated 2n+1 vectors to carry n byte rows and copied each row out of the mapped staging range into a vector of its own. `vyre_driver::program_walks::enforce_output_budget` now owns the `DispatchConfig::max_output_bytes` policy that a second wgpu-local implementation had restated with its own wording, and `vyre_driver_wgpu::pipeline::WgpuPipeline::dispatch_coalesced_borrowed` absorbed the private function whose arguments it forwarded unchanged. A new `xtask` tree contract, `nested_byte_row_types`, parses every crate that implements the backend trait and fails on any three-deep byte-row vector; scope comes from the root manifest and a parsed trait scan at run time, so a backend crate added later is covered the day it lands. The existing ratchet counted the legitimate two-level per-slot output in one crate only, which left a three-deep copy in any other crate unobserved."
