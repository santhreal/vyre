category = "Changed"
text = "`vyre_test_support::cast_parity::NARROWING_CASES` holds the four `u32` narrowing casts as data, and each backend arm keeps only its dispatch and walks the matrix, so a case added there is dispatched by both without editing either arm. `NarrowingCase::assert_target_words` checks the pin before comparing a target's words, so a drifted oracle is reported as a drifted oracle rather than as a device divergence. The wgpu arm also stops open-coding the elementwise program, the little-endian packing and the readback decode that `vyre_driver::parity_harness` owns and the CUDA arm already used. `the_matrix_covers_every_narrowing_target_the_cast_table_admits` reads the integer-like scalar predicate out of `vyre_foundation::validate::cast` at run time and requires a case for every admitted integer under 32 bits, so admitting a narrower integer there is red until both arms dispatch it; enumerating the `DataType` enum instead would demand a case for the sub-byte quantization storage families that predicate deliberately excludes."
