category = "Changed"
text = "Five domains left `vyre-primitives` for `vyre-libs`, because an operation belongs in `vyre-primitives` only when it cannot be composed, meaning it needs its own backend emitter arm and its own reference-interpreter arm. None of these did: `cat` is now `reasoning::finite_category`, `zx` is `reasoning::zx_diagram`, `dnnf` is `reasoning::dnnf`, `types::linear_check` and `types::shape_smt` and the whole `effects` domain collapse into `analysis`. The `cat`, `zx`, `dnnf`, `types` and `effects` features are gone with them, and `vyre-libs` reasoning now depends on `vyre-primitives/graph` alone."
