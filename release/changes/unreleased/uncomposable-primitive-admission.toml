category = "Changed"
text = "Five domains left `vyre-primitives`, because an operation belongs in `vyre-primitives` only when it cannot be composed, meaning it needs its own backend emitter arm and its own reference-interpreter arm. None of these did: the `cat`, `zx` and `dnnf` host constructions are witnesses in `vyre_reference::composition_witness`, the d-DNNF device evaluator is `vyre_libs_graph::graph::knowledge_compile::ddnnf_evaluate`, and `types::linear_check`, `types::shape_smt` and the whole `effects` domain collapse into `analysis`. The `cat`, `zx`, `dnnf`, `types` and `effects` features are gone with them, and `vyre-libs` reasoning now depends on `vyre-primitives/graph` alone."
