category = "Fixed"
text = "A backend that cannot report its compute-unit count reports `0`, and the grid-stride reduction benchmark read that as one workgroup. On WGPU it therefore launched a one-million-element reduction at a single block: the correct sum at 0.08 times a multithreaded CPU baseline, which only a performance contract could see. `DeviceProfile::grid_stride_workgroups` now answers the question, returning the reported count when there is one and no cap when there is not, and the reduction builder clamps the request to what the shape admits. The value is a ceiling and never an index."
