category = "Fixed"
text = "Ten registered compositions read outside their input buffers. `Expr::select` evaluates both arms and `Expr::and` evaluates both operands, so a load whose value is discarded still performs the read, and a sentinel index such as the `u32::MAX` the Python parsers use for a missing token reaches memory. The six `python312_*` parsers, the Python lexer, the 3x3 stencil that `math::conv2d` samples, `nn::partial_rope`, and `nn::linear_4bit_affine_grouped` now fold every sentinel-indexed load into range before it is issued, which preserves the zero out of range that the reference interpreter already returned. `vyre-libs` also gained the whole-registry nets `vyre-primitives` already had: every catalogued composition is checked for out-of-bounds access on its own fixtures and under an over-fired grid, for output invariance under that grid, and for race freedom under lane reversal."
