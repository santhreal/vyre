category = "Fixed"
text = "Every assertion the repository shell scripts made is a registered gate. The CUDA and SPIR-V parity budgets, the feature-and-MSRV axis, the oracle and volume sweeps, the Metal counter roster, the wire determinism diff, the crate ownership registry, the crate READMEs and the per-crate testing guides are subcommands with a pinned baseline, a subset and a workflow step; the fifteen scripts that carried them are deleted. A workflow step may no longer name a script by glob, which is how a deleted assertion used to stay in a workflow that still read as coverage."
