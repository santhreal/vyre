category = "Fixed"
text = "The production backend scan reads every phrase the hidden-fallback family declares. It carried five of them as its own list, so `silent gpu skip`, `skipped: no gpu`, `cfg(not(feature = \"gpu\"))`, `synthetic gpu timing` and the fake timing formula were reported by the tree-wide hygiene scan and never read on the driver surface the release gate blocks on. The family has one owner and publishes its phrases, the scan reads them through that accessor, and a test derives the expected set from the owner so a phrase added there fails until this scan reads it."
