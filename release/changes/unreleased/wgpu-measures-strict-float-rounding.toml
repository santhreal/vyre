category = "Fixed"
text = "The wgpu backend now measures whether an adapter's shader compiler preserves per-operation IEEE-754 rounding, and refuses `FloatLoweringMode::StrictIeee` by name on one that does not. The emitter answers the strict mode by expanding every approximable f32 operation and publishing each product through a `u32` reinterpretation emitted as its own statement, which is a property of the emitted module and not of the machine code: the platform compiles the module a second time, and on the Metal path `wgpu-hal` builds every library with a default `MTLCompileOptions`, leaving fast math enabled to fold the reinterpretation, fuse across statements and substitute approximate transcendentals. A strict dispatch therefore returned contracted arithmetic under a bit-identity contract, and `exp(8.765743)` came back as 4096.001 against a true 6410.825. The verdict comes from one witness dispatch whose two possible answers differ in exactly the bit a fused multiply-add retains, taken once per adapter and shared by every backend on it; the refusal names the mode, the backend, and the contracted mode's ULP budget as the alternative."
