category = "Changed"
text = "The megakernel wave-policy corpora in `vyre-driver` are read from `megakernel_fixtures` by every test that drives them. The barrier planner suite rebuilt the two-wave cycle and the four-wave chain inline next to the fixtures it already imported, the frontier suite declared its own two-wave growing pair, and both generated sweeps wrote their own copy of the width-by-depth layered DAG edge generator. That module exists because a corpus edited on one side turns a backend parity gate into two suites that agree about nothing and still pass, so an inline copy of a corpus defeats the gate it was written for. `CYCLE_DEPENDENCIES`, `LONG_CHAIN_DEPENDENCIES`, the new `GROWING_PAIR_WAVES`, which is the first two `DIAMOND_WAVES` by construction rather than by retyped numbers, and `layered_dag_dependencies` now own those shapes. Every planned barrier count, group width and peak byte figure the suites assert is unchanged."
