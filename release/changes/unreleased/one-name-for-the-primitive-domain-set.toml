category = "Changed"
text = "The `all-lego` feature of vyre-primitives is gone. It aggregated the composition domains that have since moved to vyre-libs, so it had become an alias for `hardware` that gated no source line, while three manifests still justified requesting it in terms of bitset, decode, graph, geometry and optimization operations the crate no longer carries. Consumers name `hardware`, which is the one domain the crate declares. The conform workflow was naming twelve vyre-primitives test targets that moved to vyre-libs with their domains; it now runs each target against its owning crate with the features those targets require."
