category = "Changed"
text = "The in-memory and on-disk pipeline caches ask the same question about a rule-graph change. `pipeline::cache_impact::RuleImpactQuery::impact_mask` owns the reachability walk and its error mapping; both invalidation paths used to carry the eight-argument list and their own mapping around it, so the two could disagree about which entries a change reaches and one cache would serve a pipeline the other had already discarded. `disk_cache_invalidation.rs` no longer decides what invalidation means, only where entries live and how they are removed, so it is named `disk_cache_entries.rs`. `device.rs` in the wgpu device runtime repeated its parent and named nothing; it owns device acquisition, the process-wide cached device, feature negotiation against the adapter, and the host waits acquisition needs, so it is `vyre-driver-wgpu/src/runtime/device/acquire.rs`."
