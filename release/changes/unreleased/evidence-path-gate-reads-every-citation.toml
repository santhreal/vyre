category = "Fixed"
text = "The release-evidence path gate reads every citation in a document rather than one key. It matched the key `path`, which named 629 of the 3418 filesystem paths those artifacts cite; the rest sit under `manifest`, `artifact`, `evidence_link`, `source_artifact`, `workflow` and bare array members, and nine were dead, all naming one crate's manifest after that crate had been folded into another. A citation is now any string with no whitespace whose last component carries an extension the tree itself uses, so the vocabulary extends with the first file of a new kind and never needs an edit here, and version strings, operation ids and schema ids stay out. Reported locations carry the key that holds the citation. The hand-written duplication consolidation scan records the exact command behind each of its findings and was re-measured: `CpuOp` moved to `cpu_op.rs`, and the `Target` it named is no longer in the scanned set."
