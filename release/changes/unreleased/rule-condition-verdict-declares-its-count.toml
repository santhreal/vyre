category = "Fixed"
text = "Every scalar rule leaf is runnable again. `vyre_libs::rule::condition_op::condition_program` declared its verdict slot as a backend-allocated output with no static element count, which fails IR validation with V130, so all eleven leaves (six file-size predicates, two pattern-count predicates, the two literals, and the pattern-existence check) built successfully and were refused before execution. The builder was neither registered nor named by a test, which is why nothing reported it. It now declares the one element it writes, and a frame contract pins the binding order, the slot each accessor reads, the region identity, the verdict store, and the element count, executing every leaf through the reference interpreter. The leaf table is checked against the operation ids declared under `vyre-libs/src/rule` on each run, so a twelfth predicate turns the suite red until it is pinned."
