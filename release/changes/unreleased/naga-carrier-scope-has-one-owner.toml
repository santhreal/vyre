category = "Changed"
text = "The WGSL emitter runs one carrier-scope protocol. A value produced inside a structured child body and read after it has to round-trip through a function-scope local, or naga's writer emits `let _eN = ...;` inside the closed child block and the reader after it fails validation with `no definition in scope for identifier _eN`. That protocol, snapshot the carrier state, find the op's position by identity, collect the ids that escape, seed each carrier local from the parent's pre-op value, emit the child, reload every carrier in the parent block, restore the parent state, was written three times: once in `emit_structured_block`, once in `emit_structured_if`, once in `emit_structured_for_loop`. The store-then-reload publish inside `bind_result` was written twice more, once per local pool, and `value_handle_for_id` spelled load-and-coerce four times. `emitter::carrier_scope` now owns it: `with_carrier_scope` for the block and if forms, `register_carrier_targets` plus `store_carrier_seeds` plus `publish_carriers` for the loop, which splits the seed across the index setup, and `publish_through_local` for both pools of `bind_result`. The two pools are one `LocalPool` value decided once per bind, so the publish, the trace name and the traced local type cannot disagree. A copy missed by a fix to any of these would not fail to build: it would emit a shader that passes vyre's own descriptor checks and is then rejected by wgpu at pipeline creation for one structured form only, or worse pass validation and read a stale carrier, which is how an accumulator seeded from a reused descriptor id summed from the wrong constant. The seed store keeps its two genuinely different meanings as an explicit `CarrierSeed`: a loop seeds verbatim because the index type already decided the carrier's type, while a block or if arm coerces to the local's type first. `collect_op_referenced_ids` reads a table of operand roles per structured op instead of four hand-written arms, so a new structured op is a row rather than a fifth arm to forget. Emitted text is unchanged: the pinned WGSL corpus, the determinism check and the carrier-scope regression suite all pass without a repin."
