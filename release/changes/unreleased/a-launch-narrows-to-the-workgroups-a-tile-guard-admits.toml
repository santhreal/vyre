text = "An inferred launch span now narrows to the whole workgroups a program's axis-0 tile guards admit, not only to the lanes its logical-index guards admit. A tile bound removes whole workgroups, which no workgroup-scoped buffer, subgroup collective or atomic couples across, so the fused two-pass tree reduction launches the 32 workgroups that reduce instead of the 1024 its input span declares. An atomic, and a program that packs several logical points into one declared element, keep the declared span."
