category = "Fixed"
text = "A gate that detects a stub may spell it. A code-call pattern found only inside a string literal is a rule definition, the same reason a doc comment was already exempt, so a pattern table row reading text equals todo-open no longer reports the gate that owns the rule. A real call still blocks the release. The two lists of files that own a rule are named once and a test requires every row to resolve, after two rows had outlived the tree they named."
