category = "Changed"
text = "`vyre_lints::read_source_bounded` is public surface with its bound stated, and `vyre_lints::LINT_SOURCE_READ_CAP` is public beside it so the number a caller is refused at has one home instead of a constant and a sentence that can disagree. The `vyre-lints` binary is a separate compilation unit and reads the workspace manifest through the same reader, so making it crate-internal would have meant a second reader with a second cap in the binary. The public API snapshot records both."
