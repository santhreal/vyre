category = "Fixed"
text = "`WgpuBackend::compile_pipeline` is the single compile entry point, taking the program, the dispatch config, and an optional pre-authenticated target. Two near-identical wrappers existed, one for a caller-supplied WGSL and descriptor pair and one that lowered them itself, and both carried a `dispatch_arena` parameter that no line of either body read: six call sites threaded an arena through to nothing, which reads as a live dependency of compilation on arena state that does not exist. The authenticated pair is now the `pipeline::AuthenticatedTarget` record rather than two loose arguments, and the dead parameter is gone from the three signatures and every caller. Public signatures and emitted pipelines are unchanged."
