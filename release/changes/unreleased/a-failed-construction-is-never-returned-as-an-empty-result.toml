category = "Removed"
text = "The infallible wrappers `vyre_driver::grid_sync::split_on_grid_sync`, `vyre_driver::cache_eviction_heat::entries_to_evict`, `vyre_runtime::scheduler::WorkStealingScheduler::partition`, `vyre_runtime::resident_work_queue::protocol::encode_load_miss` and `vyre_reference::composition_witness::chebyshev_filter_witness` are gone; their `try_` forms are the only entries. Each discarded a construction failure into an empty value that the caller cannot distinguish from a real empty result: no dispatch segments, nothing to evict, no shards, a slot with no opcode, and a filtered signal of zero samples."
