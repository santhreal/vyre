category = "Changed"
text = "The `tests/SKILL.md` contracts for `vyre-spec`, `vyre-foundation`, `vyre-macros`, `vyre-reference` and `vyre-primitives` now state the category contract where it is read instead of pointing at a file the tree does not contain, and every claim in them is checked against source. They previously routed op semantics to `vyre-ops`, which is not a package here; listed bench and fuzz targets for directories four of the five crates do not have; named `--test adversarial`, `--test property`, `--test gap` and `--test integration` where only two of those targets are declared anywhere; and described `vyre-primitives` as marker types with no runtime behavior and no bench, while it owns the Tier 2.5 substrate and declares the `wire_throughput` bench."
