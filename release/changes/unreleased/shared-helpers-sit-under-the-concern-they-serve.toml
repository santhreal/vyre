category = "Changed"
text = "Five helpers that sat at a crate root now sit under the concern they serve. The signed fixed-point pair fixed_mul_16_16_expr and fixed_sdiv_by_positive_expr is vyre_libs::math::fixed. fixed_u32_matmul and chebyshev_recurrence are vyre_libs::math. nodeset_filter is vyre_libs::label::nodeset_filter, under label rather than predicate because predicate already reaches label and the reverse edge would invert that closure. demote_intermediate_outputs is vyre_libs::plumbing::program::outputs. lane_grid has one owner reachable as vyre_primitives::lane_grid and the graph re-export of it is deleted. The unsigned helper in the visual dialect that shared the name fixed_mul_16_16_expr is now fixed_mul_16_16_unsigned_expr; it delegates to wide_mul_shr_u32 and builds the same nodes as before. The graph scratch reservation helpers fold into the crate scratch owner as reserve_items, reserve_capacity, reserve_items_with and resize_vec."
