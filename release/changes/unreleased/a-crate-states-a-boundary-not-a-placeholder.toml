category = "Fixed"
text = "The crate pages gate refuses a placeholder where a crate states what it must never contain, so a body reading none recorded, none, n/a, tbd or nothing fails the same clause an absent section fails. A boundary with only an inclusion half admits everything, and a non-empty check passed on the page that stated no exclusion at all. The bound on the output a failed benchmark child contributes to a report applies to the joined text, so a command writing on both streams no longer contributes twice the bound."
