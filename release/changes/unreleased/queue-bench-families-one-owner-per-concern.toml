category = "Changed"
text = "The GPU queue bench families in `vyre-bench` have one owner per concern. The skewed-CSR and IFDS cases each carried their own copy of the queue-materialize dispatch sequence, the queue-driven traversal plan, the queue-closure payload and its CPU oracle, the single-dispatch frontier step, and the four-column Rust lexer dispatch, so a fix to any of them reached one family and not the other. Those concerns now live in `vyre-bench/src/cases/queue_materialize.rs`, `vyre-bench/src/cases/queue_traverse_plan.rs`, `vyre-bench/src/cases/queue_closure.rs`, `vyre-bench/src/cases/queue_closure_oracle.rs`, `vyre-bench/src/cases/frontier_step.rs`, and `vyre-bench/src/cases/rust_frontend/lex_columns.rs`, and nine cases are described by a `WorkloadDescription` plus `CaseOps` over a shared payload instead of a hand-written `BenchCase` impl. Case ids, metric names, error strings, and readback ranges are unchanged. The `vyre-bench` duplication pin drops from 3397 to 2491 lines."
