category = "Changed"
text = "`vyre_lower::op_facts` was both a module and a function inside it, so a doc link to either was ambiguous and `crate::op_facts` resolved to whichever rustdoc preferred. The function is `facts_for`, reached as `vyre_lower::facts_for` or `vyre_lower::op_facts::facts_for`. Five call sites and the crate root re-export name the new spelling."
