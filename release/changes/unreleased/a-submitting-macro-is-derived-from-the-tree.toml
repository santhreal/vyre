category = "Changed"
text = "The registry-linkage rule read `inventory::submit!` and a hand-kept roster of four macros that submit a registration on a caller's behalf. The workspace already had eighteen, so a crate whose only submission came through one of the other fourteen was judged to submit nothing, and a discarding import of it was accepted. `structure_gate::registration_macro::submitting_macros` now closes over every `macro_rules!` body in the tree: a body that calls `inventory::submit!` submits, and so does a body that invokes a macro that submits, however many links out. The call is read at code offsets, so a comment quoting the registry and a string literal holding the call are not submissions."
