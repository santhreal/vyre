category = "Changed"
text = "Asking whether the emitted WGSL entry point contains a given operation is one probe. Three tests each opened the entry point's expression arena, iterated it and hand-matched a `naga::Expression::Unary` or `Expression::Binary` variant with the operator pinned in the pattern and the rest wildcarded, which is a shape that silently stops matching when naga adds a field to either variant: the assertion then reports the operation as absent rather than failing to compile. `entry_has_unary` and `entry_has_binary` sit beside the block probes in `<crate>/src/tests/naga_probe.rs`, renamed from `naga_block_probe.rs` now that it probes statements and expressions rather than blocks alone."
