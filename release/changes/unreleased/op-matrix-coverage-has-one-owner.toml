category = "Changed"
text = "The release conformance facts derived from `docs/optimization/OP_MATRIX.toml` are derived once. `xtask::release::conformance_op_matrix::evaluate_op_matrix_coverage` owns the covered and missing required-op counts, the supported release-backend row count, and the six blockers that follow from them; the registered-op matrix in `xtask-registry` and the per-backend conformance artifacts in `xtask` each carried their own copy of that arithmetic and of five of the six blocker messages, differing only in which set of observed op ids they judge the matrix against. The two artifacts report the same field names, so a correction applied to one copy left the other reporting a different coverage number for the same matrix and a release could be signed on whichever artifact was read first. `release_backend_rows.rs` held half of that decision for both callers and is folded into the matrix module, so the count is no longer reachable without the judgement it feeds."
