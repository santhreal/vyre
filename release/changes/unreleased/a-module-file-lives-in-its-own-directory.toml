category = "Fixed"
text = "Seven modules whose source file lived outside the directory of the module that declared it are moved inside it. A `path` attribute was carrying each one across a directory boundary: the typecheck critical-contract tests, the resident work queue telemetry tests, the C preprocessor GPU byte filter and its eleven program files, the validate rule-pipeline tests, the fusion tests, the resident planner contracts (which were named `core_tests` two directories up), and the reference round-robin node stepper. Each now sits under the module it belongs to and is declared without an attribute. The fusion tests had two declaring owners, the parent module and the file they prove; only the file that proves them declares them now."
