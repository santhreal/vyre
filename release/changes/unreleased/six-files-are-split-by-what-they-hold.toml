category = "Changed"
text = "Six source files over their measured ceiling are split along the boundaries already inside them, and each new file is named for its contents. `vyre-runtime/src/tenant.rs` became `tenant/{error,quota,handle,registry}.rs`; `vyre-primitives/src/matching/dfa_compile.rs` became `dfa_compile/{wire,compile}.rs`; `vyre-driver-wgpu/src/buffer/handle.rs` became `buffer/{handle,staging,bind_group_cache}/`; `vyre-primitives/src/math/sinkhorn_iterate.rs` became `sinkhorn_iterate/{program,reference,reference_f64}.rs`; `vyre-primitives/src/text/utf8_validate.rs` became `utf8_validate/{program,sequence_rules,reference}.rs`; and `vyre-driver-wgpu/src/runtime/readback_ring.rs` became `readback_ring/{slot,stats,capacity,ring,ring_set}.rs`. Every public path is unchanged. Each test module moved next to the code it proves, which is what keeps `lock_inner` and `lock_cache` private to the bind-group cache instead of widening them for a test in another module."
