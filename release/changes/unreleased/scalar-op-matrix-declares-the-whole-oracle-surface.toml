category = "Fixed"
text = "The scalar storage-graph matrix declares every operation the scalar oracle defines. It declared 40 and the oracle defines 76: the four bit-unpack ops at both 32-bit integer widths, the whole bitwise set at `i32`, and the transcendental, rounding and classification set at `f32` were all undeclared, so the matrix asserted that the oracle refuses operations it evaluates. The row that reports an undeclared operation now reports every one of them in a single run instead of the first, which is what turned a 36-item finding into one measurement rather than 36 rebuilds."
