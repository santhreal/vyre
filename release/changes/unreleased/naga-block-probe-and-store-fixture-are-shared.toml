category = "Changed"
text = "The `vyre-emit-naga` test surface states two things once. Four recursive probes over an emitted `naga::Block`, whether it contains a barrier, a loop or an atomic at any depth and how many `If` statements it holds, existed in full in both the crate's inline emitter tests and `<crate>/tests/adversarial_emit_program_matrix.rs`, eight copies of the same descent across nested blocks, both if arms, and a loop's body and continuing block. They are now one counting walk plus four predicates in `naga_block_probe.rs`, which the integration test includes with `#[path]` because the probes are test scaffolding and do not belong on the crate's public surface. The smallest descriptor that emits a global and a statement, one binding and two literals feeding a `StoreGlobal`, was written out twice, once in the pattern-audit tests and once in the entry-emission tests; `tests::single_store_desc` owns it. Both duplicates were the kind that fails quietly: structured lowering moves the depth at which statements are wrapped in `Statement::Block`, so a probe updated in one file and not the other reports an emitted barrier as absent and the assertion that was meant to catch a regression passes instead."
