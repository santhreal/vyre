category = "Fixed"
text = "Pairwise composition parity compared a fused two-stage program against the reference under the larger of the two operations' tolerances, which assumes the second stage does not amplify. It does: the first stage is allowed to drift by its own budget, and a cancelling reduction downstream multiplies that drift, so the comparison reported the second stage for arithmetic the first stage chose. A divergence is now attributed. The second stage is re-evaluated by the reference on the intermediate the device produced and held to its own declared tolerance, and the attribution is refused rather than guessed when the second stage writes the piped buffer. No budget was widened."
