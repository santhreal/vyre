category = "Changed"
text = "The three-dispatch scope-aware typedef annotation sequence, identifier prehash then brace-scope precompute then annotate, has one owner in `c_frontend::parity_matrix::arm_annotated_vast`. It was written twice in the driver's parity support and once more in a family root, and that third copy dispatched the global-fast annotator instead: a kernel documented as having no scope model, compared against the exact oracle it cannot reproduce under shadowing. Removed with it, having no callers left, a wrapper whose body forwarded a fixture's source bytes to the sequence."
