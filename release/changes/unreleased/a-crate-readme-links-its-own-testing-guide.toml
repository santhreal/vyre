category = "Fixed"
text = "Each crate README links the testing guide rendered for that crate instead of the data file every guide is rendered from. The generated Testing section pointed at `docs/testing/TESTING.toml`, which sends a reader to a table of every crate to find the rows describing one, and the generated per-crate page is what answers the question. The section now links `docs/testing/<crate>.md` and names the TOML as its authority."
