category = "Added"
text = "The docs-coupling gate holds an authored page to the code it answers for. Every current authored page row in docs/DOCS.toml declares covers, the source paths it states the content of, and both sides of the check derive from that declaration at run time: a page without covers is a finding, a covers entry matching no path is a finding, a repository path a page cites inside a code span or fence and the tree does not hold is a finding, and a diff that changes a covered path without changing its page, or without any changelog fragment, is a finding. It ran red on a real broken pointer on first use, a parsing chapter citing vyre-libs/src/parsing/vast as a directory when the module is a file. The gate is in the docs subset, which the gates workflow already runs, and its pinned count is zero. With no base ref and a clean worktree it reads an empty diff, so the coupling rule contributes nothing and a push event answers on the other three."
