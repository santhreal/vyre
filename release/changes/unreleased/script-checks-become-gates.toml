category = "Changed"
text = "Repository checks that lived in shell scripts are registered gates with pinned finding counts. The frozen contract snapshots, the backend extension rule, the readback ring routing, the program wire field classification, the source file size ratchet, the device loudness scan, the cross-crate unification rows, the release evidence path oracle, the invariant test citations and the doc claim manifest now run from the gate sweep and hold to `xtask/gate-baselines.toml`. Snapshot regeneration is `--write` on the gate that owns the snapshots. Three device loudness patterns had been unreachable since they were written, because a malformed expression made the search exit with an error that read as no match."
