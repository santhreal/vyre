category = "Fixed"
text = "The wire-roundtrip and ProgramStats property suites draw statements and programs from the one random-IR owner, not just expressions. `ir_arbitrary` already owned identifiers, data types, literals and expressions after an earlier collapse, but each suite still carried its own copy of the five statement leaves, the three body-carrying statements, and the nine-buffer program wrapper the generated body is placed in. The buffer table is what makes a generated body valid, since the statement generator stores into `out`, `rw` and `bytes_out` and the expression generator loads from every declared name, so a suite holding its own copy had to be kept in step with both generators by hand and the copies had already drifted once. The stats suite generates seven statement forms the wire suite does not, so the shared control flow enters its choice weighted at three, which leaves each of `If`, `Loop` and `Block` the same one-in-eleven share it had when all eleven arms were written out."
