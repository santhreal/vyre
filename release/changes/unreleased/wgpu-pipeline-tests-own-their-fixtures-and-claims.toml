category = "Fixed"
text = "The `vyre-driver-wgpu` pipeline tests build their store-a-constant program through one `stores_u32` fixture instead of six copies of the same six-node builder, so adding an IR field to that shape no longer has to be chased through three test files. The output-slot test was a verbatim copy of `vyre-driver`'s own policy test, all 4096 cases of it, which proved the shared policy twice and proved nothing about this backend: it now asserts what is actually wgpu's to get right, that a reservation failure is reported against the `WGPU pipeline` label and directs the caller to split the dispatch batch before readback, plus the grow, hold, shrink and empty boundaries of the resize itself."
