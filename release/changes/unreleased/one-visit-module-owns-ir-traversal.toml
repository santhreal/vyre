category = "Changed"
text = "IR traversal has one module. vyre-foundation published two modules named visit, each with its own ExprVisitor and NodeVisitor trait: one the exhaustive per-variant contract, one a pair of one-method callbacks a walk pushes into. A crate cannot say which ExprVisitor a reader means, and the exhaustive contract already imported child_bodies from the other. The traversals, the per-variant decisions they are written against (node_parts, expr_parts) and the visitor contracts now live under vyre_foundation::visit, and the walk callbacks are named for what they are: NodeSink::accept_node and ExprSink::accept_expr. Lowerable and Evaluatable moved into files named for the contract each holds instead of a module named traits."
