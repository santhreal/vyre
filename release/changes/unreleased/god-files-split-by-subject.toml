category = "Changed"
text = "Six IR and serialization files are split along the seam their contents already had. `BufferDecl` keeps its own file and the two records it carries move out with the tests that own their grammar, `linear_type` and `shape_predicate`. Program metadata separates the bounded wire-hash fallback and the canonical buffer key, which decides program equality, from the `Program` methods that call them. Type checking separates the one static type walker from what each operator accepts in each operand position. The wire encoder and decoder each grow a `buffer_table` module holding the buffer-table and memory-region halves, which mirror each other and were the two largest blocks in either file. `Ident` moves out of the expression module. No signature changes and no re-exports removed."
