category = "Added"
text = "A registration behind a feature the registry walker does not enable is invisible rather than absent, so nothing was red when one fell out. Two rules in `xtask-registry` close that class, both derived from the tree at run time rather than from a list: every file that submits a registration is reachable through the walker's declared feature selection, resolved transitively through the source crate's own feature table, and every feature that gates a registration is one the source crate's widest aggregate turns on. A new domain feature carrying registrations turns both red until the aggregate covers it, and a consumer naming the aggregate then needs no change. The `vyre` facade now keeps the CUDA and WGPU registration providers linked when their optional features are enabled, with feature-specific tests that fail if either provider is reduced to an unused manifest dependency."
