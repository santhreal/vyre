category = "Removed"
text = "Three checks that could not fail are gone. Release hygiene named an xtask command module `release_gate` that has no source file, beside the `vyre_release_gate` that does. `scripts/architecture_docs.py` guarded a superseded-RFC contract behind `if the file exists`, and the RFC is deleted, so the whole block was unreachable; its fixture also wrote three pages the checker never opens, and the test that proved the stale-version rule poisoned one of them. `xtask/feature-isolation.toml` recorded five `vyre-primitives` feature selections - cat, dnnf, effects, types, zx - that no manifest declares since those domains moved to `vyre-libs`, and `scripts/docs_manifest.py` claimed provenance for a `RELEASE_CHECKLIST.md` no generator writes."
