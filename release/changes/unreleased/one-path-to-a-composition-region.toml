category = "Changed"
text = "A composition region is wrapped through vyre_foundation::composition and nowhere else. vyre_libs::region re-exported the three wrappers under shorter aliases, vyre_libs::operation_catalog re-exported those aliases again, and vyre_primitives::hardware::region reimplemented all three over Node::Region, so one fact had four names and two implementations. Both modules are deleted and every caller in vyre-libs and vyre-primitives names wrap_region, wrap_anonymous_region, wrap_child_region, tag_program and reparent_program_children directly, as the rest of the workspace already did. The dialect template, the authoring guide and the gate fix messages name the same path."
