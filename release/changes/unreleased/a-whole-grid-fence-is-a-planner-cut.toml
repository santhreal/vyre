category = "Fixed"
text = "A whole-grid fence is cut into sequential dispatches during compile-request validation instead of failing at emit. Program fusion writes MemoryOrdering::GridSync inside one node body, so a single-node graph had no fusion pair to reject and every wgpu compile of a fused security flow such as taint_pollution failed in the WGSL emitter. The node now becomes one node per segment, ordered by an explicit retained-state succession that fusion legality cannot contract back together. A fence inside a loop body has no correct cut and is refused with the loop named."
