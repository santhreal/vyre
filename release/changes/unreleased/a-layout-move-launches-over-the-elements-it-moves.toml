category = "Fixed"
text = "A layout move in vyre-libs launches over the elements it moves. Every move guards on an element count and declares its buffers, and a launch geometry inferred from those buffers takes the largest one, which is the output for a gather and the whole cache for a scatter. The paged key-value append is the first scatter: it moves one decoded token chunk into a cache that is deliberately much larger, so an inferred launch fired one lane per cache element on every decode step and let the guard discard the rest. nn::attention::attention_layout_dispatch_grid and ATTENTION_LAYOUT_WORKGROUP_SIZE are now the owners of a layout move launch, llm::paged_kv::paged_kv_dispatch_grid sizes both paged moves from the token count they touch, and the grid and the guard read the same element count so a launch cannot cover a different domain from the one the move admits."
