category = "Changed"
text = "An expected expression-shape row is stated as one call. It was an eight-field tuple written across ten lines, so a precedence ladder read as three hundred lines of columns and two suites expecting the same row for the same operator matched as duplicated text. `binary_row` and `conditional_row` join `shape_none_row` in the shared support module and fix only what the grammar determines: a binary row's third link is the sentinel, and a ternary's operator spelling, precedence band, and associativity are constants. Precedence and associativity stay explicit arguments for binary operators, because deriving them from the parser's own table would make the assertion agree with the implementation by construction."
