category = "Changed"
text = "The quantified-condition release kernel now ballots matches per subgroup and performs one global atomic count per workgroup. On the RTX 5090 release host this reduced median device time from 29,056 ns to 10,112 ns and raised the measured CPU-baseline speedup from 93.0x to 266.5x for `release.quantified_condition_loops.1m`."
