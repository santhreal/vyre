category = "Fixed"
text = "The test guides for `vyre-driver` and `vyre-driver-wgpu` describe what the crates contain. Both previously pointed at a category contract file that does not exist, listed bench and fuzz targets for directories neither crate has, and gave `cargo test --test` invocations for target names (`adversarial`, `property`, `gap`, `integration`) that were never declared. `vyre-driver`'s guide also claimed sealing through a macro name that is not in the source and invariants for a `DialectRegistry` the crate does not define. Every invariant now names a construct that exists, and the sealing entry names `backend::private::Sealed`."
