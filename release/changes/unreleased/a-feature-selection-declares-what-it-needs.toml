category = "Fixed"
text = "Three integration suites declared the feature they import through. The scope_rewrite_owner_contract and encoded_rewrite_walk_contract suites in vyre-pass-engine reach vyre_pass_engine::optimizer, and the registry_link_rules suite in vyre-registry-link reaches vyre_registry_link::operation, so a selection without optimizer or operations failed to build the crate's test targets. Each suite now carries required-features for its prerequisite, which makes cargo skip it for a selection that cannot host it instead of failing the build. Both features are default, so a plain test run still executes all three. The feature-isolation sweep found the eight affected selections; they had been recorded as compiling."
