category = "Fixed"
text = "The logical-span scale walk listed the node variants it descends into and ended in a catch-all, so a nesting variant added to `Node` would have stopped the descent there without a build failure and the widening factor would have been read from part of the program. It takes its children from `visit::child_bodies`, keeps the arms that bind or forget a name, and forgets the loop variable and the names a loop body rebinds before entering any child."
