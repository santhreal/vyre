category = "Changed"
text = "The device-resident token/fact graph ownership gate compared four declarations against one named file, so splitting that oversized module moved `csr_out_degree_profile` to a sibling and turned the gate red without any owner changing, while a second copy inside `vyre-libs` itself stayed invisible because the whole owning crate was skipped. The gate now counts declaring files across the workspace roster, requires exactly one site each, and requires that site to be in the owning device module: a file-size split moves a declaration between siblings, a rename that leaves nothing to count fails, and a duplicate inside the owner fails."
