category = "Removed"
text = "vyre-driver::shadow is deleted. It exported a ReferenceExecutor that took a host-supplied closure evaluating a user program on the CPU, plus a conformance matrix runner built on it, so host interpretation was reachable through a production driver API and a wrong device result could be concealed behind a second result path. Nothing outside its own test used it. AccuracyStrategy is ConformanceStrength, whose variants are Standard and Exhaustive: planning states how strongly a program's numerics must be checked and never names an execution strategy that runs a host oracle. The conformance harness is the one package that depends on vyre-reference outside dev-dependencies, and it runs the interpreter after device completion rather than instead of it."
