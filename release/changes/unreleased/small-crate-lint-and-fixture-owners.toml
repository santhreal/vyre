category = "Changed"
text = "The five `vyre-lints` scans share one source walk in `vyre-lints/src/scan.rs`, and the CLI reads a lint registry instead of four near-identical entry points. `ViolationKind` gains `ALL`, `position` and `as_str` so the CLI and the JSON writer read the enum rather than restating it, and a kind that reaches no lint now fails the suite. The CLI reports its declared scan scope under `--print-default-roots`, so the production-root test asserts the property those roots must satisfy instead of restating the list. `raw_ir_in_libs` kept a second workspace-relative path function that disagreed with `vyre-lints/src/paths.rs` on the vyre-libs prefix; it is gone."
