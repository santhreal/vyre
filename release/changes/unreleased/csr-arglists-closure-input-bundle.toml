category = "Changed"
text = "CSR closure entry points take the graph as one named bundle. `vyre_libs::graph::csr_closure_inputs` owns `CsrGraphView { node_count, edge_offsets, edge_targets, edge_kind_mask }` and `CsrClosureInputs { graph, allow_mask, max_iters }`, and every closure entry point in `vyre_libs::graph::csr_bidirectional`, `vyre_libs::graph::csr_forward_or_changed`, `vyre_libs::graph::csr_backward_or_changed` and `vyre_libs::graph::persistent_bfs` now receives them instead of seven or nine positional slots. Neither struct has a constructor: a struct literal is the only way to build one, so a transposed buffer is a compile error rather than a wrong closure. The dispatcher-backed consumers in `vyre_libs::graph::dispatch::csr_bidirectional`, `vyre_libs::graph::dispatch::csr_forward_or_changed` and `vyre_libs::graph::dispatch::persistent_bfs` take the same bundle, so the flat shape no longer exists at any layer."
