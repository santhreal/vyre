category = "Fixed"
text = "The no-reinvention check reads the outcome tables a reviewer records into. Two operations reached through one shared builder share that builder's emitted shape, so the check reported the extraction it asks for as the defect it asks to fix, and the only edit that could clear the finding was withdrawing one of the two names. It now skips a pair recorded in `IMPLEMENTATION_FAMILY_ROWS` or in `REVIEWED_DISTINCT_OPERATIONS`, which is what the operand-shape check already did, and a test derives both populations from the tables at run time."
