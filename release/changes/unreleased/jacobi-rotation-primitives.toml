category = "Added"
text = "Five operations now own the pieces the Jacobi eigensolver used to spell inline: `givens_rotate_pair` rotates one strided element pair, `jacobi_apply_rotation` applies one rotation at a pivot to a matrix and its accumulator, `matrix_identity_fill` seeds a rotation accumulator, `matrix_diagonal_extract` reads a diagonal out, and `eigenvector_column_sign` fixes the sign of every eigenvector column. `symmetric_eigen_jacobi` composes them and emits identical numerics; the three column, row and accumulator rotations inside one Jacobi step were byte-identical five-node loops differing only in base offset and stride, and are now one builder with two address parameters."
