category = "Changed"
text = "The encoded-order IR rewrite walk in `vyre-pass-engine` has one owner, `optimizer::rewrite_walk`. Three copies of the same recursive rebuild existed, in the walk module, in const folding, and in resident arena-delta decoding, so a fix to the descent order reached one pass and not the others. Each pass now supplies only its per-expression decision: `fold_decision` for const folding and `arena_delta_decision` for the combined resident deltas, which applies const fold, then pattern-match action, then canonicalize swap. The fused level-wave kernel skeleton and the arena row buffer declarations are likewise owned once, by `optimizer::arena_kernel`, and the region entry unwrap by `optimizer::rewrite_program_entry`. Program output is unchanged; `vyre-pass-engine/tests/encoded_rewrite_walk_contract.rs` pins the walk and both decision functions against the rebuilt tree they must produce."
