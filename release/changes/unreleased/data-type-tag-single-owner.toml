category = "Changed"
text = "The `DataType` wire-tag table has one owner, `vyre_foundation::serial::wire::tags::data_type_tag`. Two copies were reading against it: the dense memory-region encoder, which now states only its narrower domain, and `vyre_driver::specialization`, whose copy had already lost `DataType::Quantized` and therefore filed every quantized specialization under the shared unknown-variant sentinel, so two element types could draw one cache key and one of them the other's compiled shader. Fixtures for the enum live in `vyre_test_support::data_type_variants`, checked against the declaration at run time."
