category = "Fixed"
text = "A subgroup reduction now folds its lanes in the order the explored schedule steps them, so an f32 `Add` or `Mul` reduction whose result depends on the association is reported as a schedule disagreement instead of certified. The interpreter folded ascending lane index under every explored order, which made one association the expected output: a device that reduced in a shuffle-down tree was graded against an answer no hardware has to produce. `SubgroupReduceOp::is_f32_order_independent` records which operators may disagree, and ballot and shuffle are unchanged because both address lanes by identity rather than by fold position."
