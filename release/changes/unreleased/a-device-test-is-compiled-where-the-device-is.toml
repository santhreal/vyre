category = "Fixed"
text = "Every test that acquires a GPU is behind the `device-tests` feature, off by default, and the lanes that own hardware turn it on. Three `vyre-conform` certificate contracts and the whole test surface of the three concrete driver crates used to link into the hosted CPU-only matrix, where the acquisition panics inside the CUDA driver dependency; the package loop died at `vyre-conform` and never reached the driver crates, so their tests were passing nowhere and failing nothing. The `device-test-gating` rule reported 206 of these and now reports none. It also gained the other half of the rule: a package that declares the admission feature and has no workflow step building it with that feature is reported, because a test gated into a lane that does not exist is deleted rather than gated. A backend acquisition quoted inside a string literal is no longer read as a call, which is what made the rule report its own fixtures."
