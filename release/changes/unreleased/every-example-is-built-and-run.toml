category = "Added"
text = "The `example-capability` gate builds every crate under `examples/` outside the workspace and runs what it asserts. Subjects come from the tracked tree, so a new example is covered when it is added: a directory with files and no manifest is reported, a manifest without its own `[workspace]` table is reported, a standalone crate needs a committed lockfile and passes `cargo test --locked`, a crate with a binary is also run, and a `Cargo.toml.liquid` scaffold is rendered against this checkout and its tests run. A template placeholder the gate has no value for is reported instead of substituted."
