category = "Changed"
text = "The `vyre-reference` and `vyre-runtime` public-API snapshots record two moves already in the tree. Every `LocalSlots::visit_*` signature names `vyre_foundation::ir_inner::model::expr::ident::Ident`, which is where the identifier type lives since the expression module was split by what it holds. `ReplayFailureEvidence` and `ReplayFailureClass` are named from the `vyre-runtime` crate root, and the replay log's record and capacity constants `HEADER_BYTES`, `LOG_MAGIC`, `LOG_VERSION`, `MAX_REPLAY_RECORDS` and `RECORD_BYTES` are public, so a consumer sizing a replay log reads the same numbers the writer uses."
