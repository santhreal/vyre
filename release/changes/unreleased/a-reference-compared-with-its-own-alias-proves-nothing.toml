category = "Fixed"
text = "Two graph dispatch contracts compared a CPU reference against itself. `substrate_exploded_ifds_arms_cover_every_declared_case_group` asserted `reference_build_ifds_csr` equals `build_cpu_reference`, and `matches_primitive_directly` asserted `bfs_expand` equals `cpu_ref`; in both pairs the first name was a `#[cfg(test)]` re-export alias of the second, so neither could fail on any defect in the reference it named. The aliases are gone, each reference has one name, and the exploded arm now asserts what the substrate actually owes: the CSR the reference builds is the declared one, with one row offset per node plus the terminator."
