category = "Fixed"
text = "Two CI jobs named cargo test targets that do not exist and would have failed with `no test target named` on the first run that reached them. The architecture gate ran `--test architecture_docs --test canonical_first_workgroup_guard` after both became modules of the `tree_contracts` target, and the conformance CPU job ran `--test generated_graph_oracle_matrix`, a `vyre-primitives` target deleted when its content moved and never repointed, so the nine `sweep_graph_*_oracle_matrix` sweeps it stood for went unrun there. The existing CI inspector could not see either, because it asserts that a command STRING appears in a workflow file, which is as true of a command naming a deleted target as of one naming a live target."
