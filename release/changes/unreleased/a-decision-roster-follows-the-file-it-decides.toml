category = "Fixed"
text = "Three decision rosters name files that the split of `vyre-libs` into domain crates moved or deleted. The test-harness isolation roster loses four rows whose files no longer exist, repoints three onto `vyre-libs-parsing`, `vyre-libs-pattern` and `vyre-libs-solvers`, and gains six rows for test files that name a process-global API and had no decision. The node-child-descent waiver roster loses five rows whose walks now take their children from `child_bodies` or `any_descendant` and one row for a deleted reference evaluator file, leaving the surviving row on `hashmap/step/node_step.rs` to hold that seam. The backend-vocabulary row for the resource capability interface points at `vyre-spec/src/resource_capability`, which is the directory the file became."
