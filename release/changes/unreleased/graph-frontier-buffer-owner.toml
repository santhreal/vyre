category = "Changed"
text = "The buffer layout every CSR graph primitive appends to the read-only ProgramGraph bundle has one owner. `graph::program_graph` gains `word_buffer`, `frontier_buffer`, and `push_frontier_changed_buffers`; thirteen call sites across the forward, backward, frontier-step, degree-sum, motif, reachability, tensor-flow and persistent-BFS builders read them instead of restating the declarations. Two of those sites disagreed on the frontier word count for a zero-node graph, one declaring a zero-word storage binding that no backend can allocate, and the excluding forward step bound its extra input at the index its own module documents as the output frontier. `bitset_words` had three spellings; the two forwarding shims are gone and every caller reads `bitset::bitset_words`."
