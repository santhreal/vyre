category = "Changed"
text = "Target-payload admission has one owner for the last five clusters the four driver copies still shared. `MaterializerDevice::admit_modules` runs the admit-size-decode loop and each backend supplies only its dialect decode; `InstanceCore::submit_host_only` is the whole submission path for a backend with no resident route, and it reads the refused backend off the recorded device generation instead of a constant restated at the call site; `InstanceCore::ordered_resident_resources` owns the resident handle lookup, so the two backends with a resident path no longer each project buffer names onto canonical values; `materialize::omitted_output` owns the omitted-output rejection, whose sentence six copies had written out and one had already lost the recompile instruction the other five give; and `executable_module!` answers the two `ExecutableModule` methods every backend stored under the same two field names."
