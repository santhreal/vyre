category = "Fixed"
text = "The feature-isolation axis judges two kinds of selection it never covered. The plain default build of each member, which is what `cargo check -p <member>` resolves and which neither the `--no-default-features` probe nor any single-feature probe is, and every selection a workspace edge asks of a sibling, spelled in the `feature` column as a comma-joined list that opens with `(default)` when the edge keeps defaults. Both holes were load-bearing. `vyre-aot` and `vyre-pass-engine` do not compile under their own default build, which is why the public-API snapshot gate could not extract either surface, and `vyre-libs` asks `vyre-primitives` for `graph`, `inventory-registry` and `text` together, a combination no single-feature probe reaches. Cargo unifies features across a build, so a whole-workspace check hides a break inside such a selection behind whichever unrelated member happens to enable the missing piece. `--sweep --write` now merges what a run observed over the rows already recorded, and `--only-unrecorded` narrows the compiling to the selections that have no row yet, so recording one decision no longer costs a sweep of the whole axis, which is how the recorded set went stale."
