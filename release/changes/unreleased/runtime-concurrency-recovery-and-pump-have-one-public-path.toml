category = "Changed"
text = "Runtime structured concurrency, atomic recovery and the io_uring completion pump are reached at `vyre_runtime::structured_concurrency`, `vyre_runtime::atomic_recovery` and `vyre_runtime::uring_completion_pump`, and the tenant quota at `vyre_runtime::tenant::TenantQuota`. The crate root re-exported the contents of all three modules, twice through a glob, and `session_quota` re-exported `tenant::TenantQuota` into a root glob of its own, so 43 published items carried two paths and nothing in the source stated which one a consumer writes. The root re-exports are gone and every caller names the owning module."
