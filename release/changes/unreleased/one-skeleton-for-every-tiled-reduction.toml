category = "Fixed"
text = "Tiled reductions share one program skeleton. reduce_mean, rms_norm, layer_norm and softmax each hand-built the same reduce-then-publish shape (bind the lane, accumulate with a stride, reduce through workgroup scratch, publish from lane zero of workgroup zero, stream the normalized output back), so a change to the barrier placement or the publish guard had four places to be made. The skeleton lives in the unconditional builder module, above the separately gated math and nn dialects that reach for it, and the emitted IR is unchanged. A publish that is the last thing a program does no longer emits the barrier that fenced it, because nothing reads the published scalars."
