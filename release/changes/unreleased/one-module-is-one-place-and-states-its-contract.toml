category = "Changed"
text = "Six modules had a file beside a directory of the same name, so a reader looking for one module found half of it in a listing: `vyre-driver-metal` runtime, `vyre-foundation` operation and validate expression rules, and `vyre-runtime` artifact admission, prefix cache and resource residency now keep their own items in `mod.rs` beside their children. Seven module files named a dumping ground rather than a contract; they now state what they hold: prefix-cache contract values, resident launch decisions, resource-set admission, operation semantics, CUDA graph lifecycle, megakernel plan-cache records, and the bind-group entry store."
