category = "Fixed"
text = "The hand-written node descent scan reads its child-slot vocabulary from the Node enum at run time. It carried four field names written into the test file, so a variant declaring a body under a new name was invisible to it: the descent would bind a field the scan did not know, the block went unreported, and the roster stayed green while the shape it exists to find sat in the tree. Named fields whose type holds nodes and variants carrying a body in a tuple position are now both read from the declaration, a pattern that renames the field it binds is followed to the binder, and a constructed node is told apart from a destructured one so a rebuild is not reported for iterating what it just built. The wider vocabulary found one site the old one could not see: node_reads_any in the tail_duplication pass derived Block children by hand behind a catch-all, and is now exhaustive like its neighbour, so a new variant stops the pass at compile time instead of being refused by an arm nobody wrote."
