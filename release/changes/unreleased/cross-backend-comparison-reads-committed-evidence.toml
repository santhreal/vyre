category = "Fixed"
text = "The cross-backend comparison gate derives its table from the committed release benchmark evidence and records it under release/evidence/benchmarks/. It used to time an unrelated loop inside the build-task crate, record no backend measurement at all, and write the result into a gitignored directory, so a fresh checkout reported the table missing and one local regeneration turned the gate green on a table nobody could read. A table carrying no measured backend row, a measurement arriving without its commit, source-tree fingerprint or device signature, and a recorded table that disagrees with the evidence are findings now, and a backend a case contract declares without a measurement is listed in the table instead of dropping out of it."
