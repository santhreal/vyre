category = "Changed"
text = "The generated CUDA reference matrices share one sweep runner. Six files each carried the same runner loop: dispatch a case on the direct and the compiled CUDA path, diff both against the reference interpreter, accumulate the lanes each comparison actually checked, and assert the total against cases times lanes times two. Fifteen copies of that loop, five copies of the guarded lane store, two copies of the six comparison-word builders `vyre-driver-cuda/tests/common/mod.rs` already exported, and per-dtype program builders that differed only in which buffer types they declared. `vyre-driver-cuda/tests/common/mod.rs` now owns `generated_lane_program`, `guarded_generated_store`, `guarded_generated_store_at`, `GeneratedMatrixCase`, `assert_u32_matrix_sweep` and `assert_f32_matrix_sweep`, and the binding order every matrix depends on is fixed in one place instead of restated per file. Case tables, adversarial corpora and ULP bounds stay local, because they differ on purpose. Three sweeps got stronger rather than shorter: the scalar bool tables, the cast table split by output dtype, and each of them now asserts its own lane coverage, where a single combined total let one group's over-count hide another's shortfall."
