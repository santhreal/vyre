category = "Fixed"
text = "A strong barrier is narrowed to the address spaces its body touches, and that decision was covered only by two pinned backend corpora. One of them was stale: the WGSL golden carried the narrowed storage barrier while the SPIR-V golden still pinned the memory-semantics word for the wider fence, so the SPIR-V byte-stability test failed on a change nobody had made. The mapping is now tested where it is decided, including the storage-only, scratch-only, both, neither and nested-body cases and the refusal of relaxed and grid-wide orderings, and the SPIR-V corpus is regenerated to the narrowed word."
