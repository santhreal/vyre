category = "Fixed"
text = "Splitting a grid-sync program for a backend without native cooperative launch rebuilt each segment's buffer table from a scan that recognized only stores and collectives, so a buffer named in a statement's ident field kept its node and lost its declaration. An asynchronous copy source or destination, an indirect dispatch count buffer, and a tile load or store target were all dropped, and the segment then failed descriptor lowering with an undeclared buffer reference at dispatch time. The scan now reads the canonical node buffer references, and a segment carrying an extension node keeps every declaration instead of trusting an incomplete set."
