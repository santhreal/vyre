category = "Changed"
text = "The vyre-libs crate root is a table of contents. Fourteen loose files sat beside twenty-five dialect directories, so the root did not say what the crate is. Each one now sits under the concern it serves: buffer names, tensor references and operand shape under plumbing::operand, program introspection and fused-output demotion under plumbing::program, type signatures, contract presets and the catalog view under plumbing::registration, operand marshalling, scratch reservation, the shape-keyed program cache and the composition counters under plumbing::host, and the byte-range ordering predicates and the builder registrations under builder. Every path that was public is still public at the same spelling, and no operation id, registration or built program changed."
