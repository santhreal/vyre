category = "Fixed"
text = "The INT4 conformance requirement is a gate blocker instead of dead code. `conformance-matrix` carried a private routine that required every INT4 quantization op to be registered with fixture inputs and expected outputs, and to be present in the op matrix catalog. Nothing called it, so no INT4 op was ever held to it. The requirement now runs inside the gate, computed from the same entries the evidence document reports, and a missing fixture or a missing catalog row is reported as a blocker. The live registry satisfies it, so the gate reports no INT4 blocker today."
