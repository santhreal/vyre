category = "Removed"
text = "The buffer-name form of each classic Aho-Corasick program left the published surface of vyre-libs. The `build_*`/`try_build_*` entry that binds the pinned ABI names is the one published path per program. The legacy buffered inflate-then-scan builder is deleted, and the tile-width form of the fused stored-block scan is internal to its module."
