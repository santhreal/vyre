category = "Changed"
text = "The three benchmark checks are registered gates. `bench-baselines` requires a published `benches/RESULTS.md` section for every package `cargo bench` can run a target for, derived from the manifests rather than from a directory name, so a crate whose `benches/` holds only prose owes no invented number and a nested target is named as `-p` accepts it. `bench-smoke-runtime` enforces the wall-clock budget declared in `contracts/perf_targets.toml` rather than a number of its own. `bench-coverage` holds each measured dimension to a registered case and resolves every `--case` a workflow or evidence manifest names against the live registry. Each reports every failure in one run."
