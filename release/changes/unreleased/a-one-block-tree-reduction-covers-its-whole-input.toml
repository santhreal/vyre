category = "Fixed"
text = "`grid_stride_tree_sum_u32` took its single-block form whenever the caller asked for one block, and that form reads one tile and nothing else, so a reduction over more elements than a tile returned a prefix and reported it as the total. A backend whose device profile reports no compute units asks for one block, which made a 1M-element release reduction return the sum of its first 256 elements. One block now takes the strided pass like any other count, both tail loads are gated by a branch instead of a select so a lane past the element or block count no longer reads past the buffer end, the partial store is guarded on the block index so a launch wider than the built grid discards the extra blocks instead of writing past the partial buffer, and the release reduction case pins the grid its program was built for."
