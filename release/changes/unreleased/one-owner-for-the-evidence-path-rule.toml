category = "Removed"
text = "`scripts/check_evidence_paths.sh` is gone, and with it `vyre-pass-engine/tests/release_evidence_path_contract.rs`, which existed to give the script a cargo-visible entry point. The `evidence-paths` gate owns the rule. Its four fail-direction fixtures moved into the gate: a citation that resolves to nothing is reported at its route, a cited path that exists but is gitignored is reported for reachability rather than absence while a committed path stays clean, every placement a narrower filter once missed is read, and a version, schema id, operation id, fingerprint, command or ratio is not read as a citation."
