text = "The CI registry keeps a row for every workflow path the tree carries or once carried, and the row says whether it runs, is paused with a way back, is superseded by the workflow and gate that run its checks, or leaves a verification class uncovered. Seven lanes were deleted in one commit and nothing went red, because the wiring is derived from the tree and a deleted lane derives to nothing: adversarial input generation, CODEOWNERS trust-boundary coverage, mutation coverage of the verifier and the bitset primitives, and repeat-dispatch determinism on CUDA are recorded as uncovered rather than gone, the catalog, book and randomized-order lanes name what runs their checks now, and a workflow deleted from here on leaves a row that fails the gate until someone records where its checks went."
