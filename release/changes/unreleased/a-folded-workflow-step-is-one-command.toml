category = "Fixed"
text = "The CI step gate joins a YAML block scalar the way the runner receives it, so a workflow command written as a folded `run:` block across several lines is checked whole. The reader joined shell continuations only, and every package, feature and test target named after the first line of a folded step was discarded unread: 226 selectors across 108 commands now resolve against the manifests where 159 did before, in both the unresolvable-selector direction and the silently-skipped-target direction. A paused workflow that names a script the checkout does not carry is reported, and a parked file still credits no check. The registry names `ci-registry --write` as the writer of the declaration it reads."
