category = "Fixed"
text = "The conformance runner exercises each backend through the route its registration declares. A backend that registers a target compiler and a materializer takes the production artifact route, as before; the reference interpreter registers neither and is now dispatched directly, instead of failing every one of its 356 pairs on a materializer its registration says it does not have. The dispatch route submits under the invocation grid the program needs, because a neutral program dispatched under the default grid executes one invocation and leaves every other output element at zero. A pair whose backend is the reference interpreter and whose operation records no expected outputs now fails with that reason, because comparing the interpreter against itself is not evidence."
