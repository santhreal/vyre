category = "Fixed"
text = "`docs/CLI.md`, `docs/CRATE_GRAPH.md`, `docs/OWNERSHIP.md` and the 35 per-crate testing guides are present again. The book deletion removed them without retiring the generators that own them, so `crate_ownership.py`, `testing_guides.py` and `cli_docs.py` each failed `--check` against a tree their own `--write` reproduces, and `docs/DOCS.toml` listed two pages out of forty. `docs/optimization/OWNERSHIP.toml` also assigned two scopes that match nothing: a gitignored `BACKLOG.md`, which made the architecture-docs verdict depend on an untracked file, and a deleted `docs/catalog/**`."
