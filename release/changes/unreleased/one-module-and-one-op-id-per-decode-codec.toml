category = "Changed"
text = "Each decode codec is one module with one registered op id. base64, hex and inflate had a builder and a registration on both sides of the crate boundary, so a built program carried a registered region nested inside a second registered region naming the same work. The surviving ids are vyre-libs::decode::base64, vyre-libs::decode::hex, vyre-libs::decode::inflate_stored_block and vyre-primitives::decode::ziftsieve_literal_copy. The ids vyre-primitives::decode::base64_decode, vyre-primitives::decode::hex_decode, vyre-primitives::decode::inflate_stored and vyre-libs::decode::ziftsieve are gone, and programs from the three collapsed codecs lose one level of region nesting. The inflate trap diagnostics now name vyre-libs::decode::inflate_stored_block. ziftsieve_literal_copy_with_op_id is removed; it existed only to stamp a caller-supplied op id across the crate boundary the collapse deleted."
