category = "Added"
text = "`docs/lego-block-rule.md` is back, rewritten against source. It owns the four things nothing else states: the discovery step, the Category A and Category C placement test, the promotion criteria, and the Gate 1 budget in prose. The mdbook deletion took it out while `check-tier-deps` still read it for the cross-crate promotion contract, so the gate reported five findings against a file that was not there, and the workspace rules named required reading that did not exist. Every claim in it was checked: the discovery commands are the subcommands that exist, the budget numbers are the constants the gate compiles, the promotion contract forbids the compatibility shim this workspace does not ship, and the worked example names the primitive that survived it. `gate1` states the countable half and points at the policy for the rest, instead of recording that the policy was deleted."
