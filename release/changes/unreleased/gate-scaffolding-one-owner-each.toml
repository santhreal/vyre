category = "Changed"
text = "Five shapes the gate crates repeated per gate have one owner each. `xtask::toml_text` renders a TOML basic string and a one-line string array, which four generators spelled with two different escapers. `xtask::tree_walk` is public, so a gate outside `xtask` walks the tree through the one prune rule instead of a hand-rolled `read_dir` recursion: dependency drift, the heuristic audit and the lego audit cross-dialect scan all read the same set of directories now, and the three that pruned only `target` and `.git` no longer read `target-codex`, `target_tests` or `.cargo-target`. `xtask::output_arg::cargo_runner` is the one resolver for the bounded cargo wrapper. `xtask_registry::corpus::selected_cases` selects release corpus cases for the compile and shrink gates, which carried the same filter and the same empty-selection error."
