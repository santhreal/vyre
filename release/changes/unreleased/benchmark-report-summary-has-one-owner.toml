category = "Changed"
text = "The release gate reads a benchmark report's blocker array and failed-case summary in one place. `check_benchmark_report_summary` owns the summary-versus-case-evidence mismatch and the failed-case message; the three gates that open a benchmark report each carried that arithmetic and its four messages, differing only in whether the report is named by evidence suffix or by path, so a correction reached one report and not the next. The four `require_case_metric_*` requirements now share one walk over the cases array, which also makes explicit that only the present-metric requirement treats a missing cases array as its own failure and that the positive-metric requirement reads the recorded percentile rather than accepting a bare scalar. An unreachable second copy of the markdown-evidence check is deleted: it had no callers and had drifted to demand an evidence-sources list from every markdown file, while the live check demands it only under `evidence/docs/`."
