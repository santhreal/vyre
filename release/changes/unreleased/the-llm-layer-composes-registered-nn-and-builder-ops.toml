category = "Added"
text = "vyre-libs gains an llm composition layer behind the llm feature. paged_kv_gather and paged_kv_append address a block-table paged key-value cache through the attention layout base, so a paged read is the same index map as every other layout move and a paged append is its scatter. logit_adjust applies a CTRL-style repetition penalty and the temperature divide in one pass over the vocabulary, nucleus_select walks the kept-mass prefix of a top-k candidate list, and sample_token fuses the three arms with softmax_top_k into one registered program whose intermediates are demoted after fusion. Program attribution moves to one owner in plumbing::program::attribution, which names the composition that selected a built Program and wraps an invocation-gated arm so fusion does not run it under the widest geometry; math::scan::prefix_sum builds on that owner and its IR is unchanged."
