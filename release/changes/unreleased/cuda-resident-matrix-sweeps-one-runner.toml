category = "Changed"
text = "The generated CUDA resident reference matrices share one sweep runner and one program builder. Five contract files each carried their own runner loop over the resident dispatch path, and `program_builders.rs` carried thirteen near-identical guarded-store program builders that differed only in the declared buffer types. The parent now owns `ResidentMatrixCase`, `assert_resident_u32_sweep` and `assert_resident_f32_sweep`, and the builders delegate to `resident_lane_program`. The in-place atomic reduction builder is deliberately left standalone: it binds its accumulator read-write, performs no guarded store, and is checked against a different reference, so folding it into an output sweep would assert something else. The lane-coverage totals are now asserted per table rather than combined, which stops one table's shortfall from being hidden by another's surplus."
