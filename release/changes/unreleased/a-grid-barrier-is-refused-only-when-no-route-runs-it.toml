category = "Fixed"
text = "A program needing a whole-grid barrier is now answered during capability negotiation, before a target is chosen, instead of reaching an emitter that has no lowering for it. The advertised set behind that answer stopped being eight positional booleans and became a named BackendSupport struct with one owner mapping a backend onto it, replacing five hand-written copies that each had to get eight same-typed values in the right order. The capability asks whether any route runs the barrier, not which: a backend that lowers a cooperative launch and one that accepts the host split into sequential dispatches are both admitted, and only a backend offering neither is refused. CUDA answers from the device rather than asserting cooperative launch unconditionally, and keeps its own named refusal ahead of the generic one so a device below compute capability 6.0 still reports the capability and the three ways out."
