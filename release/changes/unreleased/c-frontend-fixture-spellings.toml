category = "Changed"
text = "The C-frontend test corpus spells its token streams once. A fixture that listed one `FixtureToken::new(\"lexeme\", TOK_KIND)` per line now reads `c_tokens(\"lexeme lexeme ...\")` against `tests/support/c_frontend/spelling.rs`, which derives each raw kind the way the lexer does and promotes keywords through `reference_c_keyword_types`, so a stream that used to occupy fifteen lines in two crates occupies one line in one place. The build-annotate-classify triple every CPU reference case opened with is `c_frontend::token_fixture::annotate_and_classify`, and the PG row assertion that spelled out `&fix.tok_starts` and `&fix.tok_lens` is `assert_pg_preserves_fixture_row`. Every assertion the corpus made is still made and still executed; 136 fixture streams across 34 files became one-line spellings."
