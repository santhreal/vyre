category = "Fixed"
text = "The radix prefix table, digit-value decode, type-suffix set and digit accumulator of a C integer literal are owned by `parsing::c::preprocess::c_int_literal_grammar`. The standalone scanner and the inline scan in the `#if` evaluator each carried a copy and the copies had drifted: the evaluator accumulated with wrapping `u32` arithmetic, so a literal above `u32::MAX` could carry to zero and flip a conditional, and it consumed a type suffix after a radix prefix with no digits after it. The scanner and the CPU `consume_integer` saturate and reject, and that is now the only spelling."
