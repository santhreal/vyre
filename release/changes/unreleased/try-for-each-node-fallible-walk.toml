category = "Added"
text = "`vyre_foundation::transform::visit::try_for_each_node` walks every node in a body and every nested body, stopping at the first `Break`, and `for_each_node` now delegates to it. A short-circuiting scan outside the crate previously had to implement the abstract-by-default `NodeVisitor` and write a no-op body for every variant it did not care about, which is the cost that made one scan hand-roll its own descent with a catch-all arm instead. `node_buffer_refs`, `expr_buffer_ref` and their result types are public for the same reason: a lowering crate answering \"what does this statement do to a buffer\" now reads the exhaustive owner rather than restating it."
