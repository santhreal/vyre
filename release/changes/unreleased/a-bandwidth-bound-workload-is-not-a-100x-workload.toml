category = "Changed"
text = "The ten release workloads that must beat their CPU-SOTA baseline by 100x no longer include the string bitmap scatter, because that workload cannot reach it on any device. It moves 8.65 MB, the scalar CPU reference streams that at 30 GB/s and the release device peaks at 1792 GB/s, so the ratio is capped near 60x before a kernel is written; measured, it is 30.0x. Its 100x entry was calibrated against a program that declared sixteen output sets, stored one ballot word into each and let the case divide the launch by sixteen. The scatter keeps a CPU-SOTA contract at 25x and the tenth 100x slot goes to the egraph saturation workload, which already carried the same contract and measures 357x."
