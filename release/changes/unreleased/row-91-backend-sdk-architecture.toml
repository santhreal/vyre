category = "Changed"
text = "Concrete backend drivers no longer depend on semantic libraries (`vyre-libs`), schedule search (`vyre-pass-engine`), application policy (`vyre-runtime`), or peer concrete drivers. `vyre-driver` owns neutral driver capability negotiation, physical-IR consumption, typed resource ABIs, module creation, submission, and production support certificates joined from validation, emission, native compilation, materialization, hostile bindings, device execution, and oracle agreement. Every physical-IR `KernelOpKind` variant has exhaustive per-target emitter decisions with no catch-all downgrade, and `vyre-driver-metal` exposes its descriptor and target compiler across all host platforms."
