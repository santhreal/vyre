category = "Fixed"
text = "Chained shift fusion has one owner and one answer. Constant folding and strength reduction each carried the rule, and they disagreed: folding declined a pair whose counts reach the word width and left the double shift for the backend, reduction folded it to zero. Both were also wrong about a count above 31, which the target text masks with `& 31`, so `(x << 40) << 1` shifts by nine and not off the end. `algebra::shift_fusion::reduce_shift` masks each count, folds to zero once the sum reaches the width, and fuses otherwise, checked against an evaluation of the chain it replaces for every count pair up to 40."
