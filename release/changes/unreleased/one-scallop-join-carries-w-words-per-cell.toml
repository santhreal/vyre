category = "Changed"
text = "scallop_join takes the words-per-cell width. It is now scallop_join(state, next, join_rules, changed, n, w, max_iterations), and w = 1 emits the single-word bodies the old signature emitted. The separate scallop_join_wide op, its dispatch grid and its CPU oracle are removed: they were the same Lineage-semiring Datalog fixpoint with a second registration, a second parity oracle and a second set of trap messages, and the width was already a parameter of the shared bodies in scallop_persistent. semiring_gemm_wide moves to its owning domain as vyre_primitives::math::semiring_gemm::semiring_gemm_wide. The dispatch grid is documented as one lane per relation cell, with the lane walking the w contiguous words of its cell, so it does not scale with w."
