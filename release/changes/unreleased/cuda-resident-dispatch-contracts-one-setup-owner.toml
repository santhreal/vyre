category = "Changed"
text = "The CUDA resident dispatch contract family states its setup once. Five files asserted against a four-lane u32 resident buffer seeded [1, 2, 3, 4], an elementwise add or multiply over one wrapped workgroup, and a readback expectation that depends on whether the borrowed host-buffer fallback is opted in, and each file carried its own copy of all three: the lane width, the seed, the program shapes, the sequence-step and read-range literals, the borrowed-fallback predicate, and the native compact-readback telemetry block. `vyre-driver-cuda/tests/resident_dispatch_contracts/resident_lane_fixture.rs` now owns them. A copy that had already drifted is what the split cost: `repeated_sequence_contracts.rs` carried a second test with the same name as the parent's release-path contract, asserting the same borrowed-fallback counter over a multiply program but never checking the output lanes, so a run where the multiply lowering wrote wrong values reported green. The surviving contract now sweeps both the add and the multiply program and asserts the lanes for each."
