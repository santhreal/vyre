category = "Fixed"
text = "The layering gate treats the private function pointer that keeps an optional backend's `registered_backend_id` in the linked image as a compiler interface rather than domain vocabulary, but it recognised the shape one physical line at a time. rustfmt breaks that statement after the `=` as soon as the static's name is long enough, and the continuation holds nothing but the dependency path, so the two anchors in the `vyre` facade were reported as backend vocabulary and the only fix on offer was a shorter name. The statement is rejoined before its shape is judged and every line it spans gets the same answer; a multi-line `static` that is not the anchor shape stays vocabulary on every line."
