category = "Added"
text = "Two suites close the classes above from the tree at run time. The Naga scanner's gate plants an atomic and a store in every body slot of every body-carrying `Node` variant and asserts the walk reaches both, and separately asserts that every buffer `node_buffer_refs` calls a write is reported as one; the variant set comes from `NODE_VARIANT_NAMES`, so a new variant is red before either question is asked. `vyre_backend_forwarding_closure` parses the trait declaration and the forwarding macros and fails when a method belongs to neither, when the grid-sync wrapper reaches a `Program`-carrying entry point without deciding the split, and when the wrapper hand-writes a forward the owner already emits."
