category = "Fixed"
text = "A contraction candidate states only what its site states. The analysis returned the same three candidates for every contraction: a 16x16x16 workgroup tile, an `m16n8k16` F16 matrix instruction, and a constant ranking multiplier, none of which was read from the descriptor. A site declaring other extents, binding only integer element types, or dispatching a single-invocation workgroup received that same answer, so a matrix candidate could name a fragment packing no program expressed. Tile extents and fragment element types now come from the `MatrixMma` the body declares, the workgroup tile from the declared dispatch geometry, the supported element types from the bindings the kernel reads, and the ranking input is `operand_loads_per_fma`, a counted operand-load ratio carrying the derivation it was computed from. A site that declares no matrix operation receives no matrix candidate. Detection is the sum-of-products dataflow itself rather than a binding-size proxy."
