category = "Fixed"
text = "The tensor-train step built its Gram matrix from a multiply feeding an add, which left the number of roundings per row to the backend: the reference took two and a device was free to take one. A Gram entry of two cancelling columns amplifies that choice, and composing attention into the decomposition put the Gram buffer 503 ULP from the reference evaluated on the device's own intermediate, four times the operation's budget. The accumulation now states a fused multiply-add, which the reference, the naga emitter and the PTX emitter each answer with a single rounding."
