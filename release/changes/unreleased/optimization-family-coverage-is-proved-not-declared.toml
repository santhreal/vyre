category = "Fixed"
text = "The pass-family benchmark manifest records a family as covered only when the case proving it passed. It used to push each specification's declared families whether or not the artifact behind them could be read, and the specification list is the same list as `required_pass_families`, so `uncovered_pass_families` was structurally always empty and the release gate demanding it be empty could not fail on the one thing it exists to catch: a missing or blocked artifact. A test asserts that state, so the unconditional form turns the suite red."
