category = "Changed"
text = "Every entry of the production backend registry carries a recorded execution domain, and a registration whose id has no decision fails the closure suite. The rules that claimed to close this route rejected an id whose text contained `ref` or `cpu`, so a host evaluator registered under any other name passed, and the copy in `vyre-driver-reference` ran against an empty registry in a binary that links no driver crate. `vyre-driver-reference` now links the declared drivers in its test graph and decides each registry entry through an exhaustive match with no catch-all arm, so a new backend registration is red until a decision is recorded for it."
