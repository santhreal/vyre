category = "Changed"
text = "`vyre-libs` feature `full` is every dialect the crate ships, meaning every domain that submits an operation registration: it gains `logical`, `visual`, `security`, `parsing` and `matching-nfa`. It stops short of the compiler's own self-use composition domains, which submit nothing. Before this, `full` was a subset and two consumers each carried the same ten-name list to reach the rest."
