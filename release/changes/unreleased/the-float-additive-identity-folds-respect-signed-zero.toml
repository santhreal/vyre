category = "Fixed"
text = "Float algebraic rewrites now preserve IEEE-754 signed zero: addition eliminates only negative zero, subtraction only a positive-zero right operand, and FMA zero-product elimination requires a negative-zero product. Type-blind `x - x` expressions no longer become an unsigned zero when the operand may be a float, signed integer, NaN, or infinity. The shipped proof obligations now encode the same sound identities, and one of them was refuted by the solver before the fix."
