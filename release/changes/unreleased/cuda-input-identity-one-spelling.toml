category = "Changed"
text = "The CUDA backend names `vyre_driver::input_identity::exact_input_key` and `ExactInputKey` directly. `vyre_driver_cuda::input_identity` was a module whose entire body was a re-export of those two items, and `vyre_driver_cuda::pipeline::materialized_cache` re-exported them again under second names, `materialized_input_key` and `MaterializedInputKey`, so one hash envelope and one key type were reachable under four spellings and the materialized cache read as if it owned a key format of its own. Both re-export layers are deleted and every use site names the owner. `vyre_driver_cuda::pipeline::tests::input_key_owner_contracts` replaces a test file that restated the envelope's own tuple-boundary and single-byte-sensitivity properties over 8192 generated cases under the alias name, proving nothing about CUDA while the question that mattered went unasked: it now asserts that a stored entry's key equals the shared envelope's answer for the same inputs, and that a resident-cache domain-separated key cannot reach materialized replay outputs for inputs that still hit under the plain envelope."
