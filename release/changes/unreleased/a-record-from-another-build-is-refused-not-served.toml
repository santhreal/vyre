category = "Fixed"
text = "`BoundedDecoder::decode_json` refuses a payload whose declared `schema_version` falls outside the range the descriptor reads, instead of decoding it. The decoder checked only the payload's size, so every persisted, cached, signed and transmitted schema in the authority was readable across a version boundary and `SchemaAuthorityError::IncompatibleVersion` was never returned, even though the exported JSON Schema declares `schema_version` required and pinned. A payload that states no version, or one that is not a `Major.Minor.Patch` triple, is refused rather than assumed current. `SchemaDescriptor::admits` states the admission decision and `SchemaId::ALL` enumerates the schemas it applies to."
