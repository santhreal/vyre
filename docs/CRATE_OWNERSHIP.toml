# The consumer facade roster.
#
# `vyre-libs` is the one curated consumer facade over the domain packages of
# the `libraries` layer. Its `[features]` table is generated from the rows
# below by `cargo xtask configuration-model --write`, so a domain feature is
# recorded once, beside the `[[crate]]` record of the package that owns its
# semantics, instead of twice in two manifests that can disagree.
#
# A `[[facade.feature]]` row states which package owns the capability. The
# generated manifest row forwards to that package and to nothing else, so the
# facade is never a second declaring package for the name. `requires` names
# the facade features the row also selects, which is the facade's own curation
# of what a selection exposes and is not derivable from the domain manifest.
# `activates` names third-party optional dependencies the capability needs.

[facade]
package = "vyre-libs"
default = [
    "math-linalg",
    "math-scan",
    "math-broadcast",
    "nn-activation",
    "nn-linear",
    "nn-norm",
    "pattern-substring",
    "pattern-dfa",
    "hash",
    "decode",
]
local = ["test-fixtures"]

# A named bundle of facade features. An aggregate forwards to no package of
# its own, so it declares nothing and owns nothing.

[[facade.aggregate]]
name = "math"
selects = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]

[[facade.aggregate]]
name = "nn"
selects = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]

[[facade.aggregate]]
name = "pattern"
selects = ["pattern-substring", "pattern-dfa"]

[[facade.aggregate]]
name = "crypto"
selects = ["crypto-blake3"]

# One row per domain package the facade forwards to. `optional` states
# whether the facade declares the dependency optional, which decides whether a
# generated row activates it with `dep:` and forwards weakly.

[[facade.domain]]
package = "vyre-libs-builder"
optional = false

[[facade.domain]]
package = "vyre-libs-bitset"
optional = true

[[facade.domain]]
package = "vyre-libs-reduce"
optional = true

[[facade.domain]]
package = "vyre-libs-fixpoint"
optional = true

[[facade.domain]]
package = "vyre-libs-math"
optional = true

[[facade.domain]]
package = "vyre-libs-nn"
optional = true

[[facade.domain]]
package = "vyre-libs-graph"
optional = true

[[facade.domain]]
package = "vyre-libs-pattern"
optional = true

[[facade.domain]]
package = "vyre-libs-hash"
optional = true

[[facade.domain]]
package = "vyre-libs-text"
optional = true

[[facade.domain]]
package = "vyre-libs-decode"
optional = true

[[facade.domain]]
package = "vyre-libs-parsing"
optional = true

[[facade.domain]]
package = "vyre-libs-security"
optional = true

[[facade.domain]]
package = "vyre-libs-visual"
optional = true

[[facade.domain]]
package = "vyre-libs-rule"
optional = true

[[facade.domain]]
