# Declared configuration constraints. `configuration-model` proves these over
# every cell a build can ask for, and reports a constraint that names a feature
# no package declares, because such a constraint can never bind while reading
# as one.

# A feature name every package spells the same way on purpose. The
# one-owning-package rule does not apply, because the capability is a
# per-package convention rather than one capability many packages expose.

[[configuration.shared_capability]]
name = "cpu-parity"
reason = "each crate enables its own comparison against vyre-reference, so the switch is per-crate by construction"

[[configuration.shared_capability]]
name = "device-tests"
reason = "each crate enables its own tests that require a real device, and the sets do not overlap"

[[configuration.shared_capability]]
name = "subgroup-ops"
reason = "each crate declares the subgroup capability its own emitters or lowering paths need"

[[configuration.shared_capability]]
name = "test-fixtures"
reason = "each crate publishes its own fixture module for downstream test code"

[[configuration.shared_capability]]
name = "cuda"
reason = "vyre, vyre-registry-link and vyre-driver-cuda each gate their own linkage of the CUDA driver, so the switch is per-crate"

[[configuration.shared_capability]]
name = "wgpu"
reason = "vyre, vyre-registry-link and vyre-driver-wgpu each gate their own linkage of the wgpu driver, so the switch is per-crate"

[[configuration.shared_capability]]
name = "gpu"
reason = "vyre-conform and vyre-primitives each gate their own requirement for a real device, and the sets do not overlap"

[[configuration.shared_capability]]
name = "libs-compositions"
reason = "vyre-driver and vyre-runtime each select the vyre-libs domains their own compositions need, and neither set is the other"
