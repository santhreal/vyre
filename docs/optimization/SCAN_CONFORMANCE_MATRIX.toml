schema_version = 2
dialect_lattice = "docs/optimization/REGEX_DIALECT_LATTICE.toml"

# The code a row carries when its semantics has no refusal path at all. Declared
# once so no row invents a spelling for "not applicable", and checked against the
# codes the regex compiler actually emits: the sentinel may not collide with one.
no_refusal_code = "VYRE_SCAN_NO_REFUSAL_PATH"

# engine_support states which engines the semantics is claimed for. It is a
# declaration, not a measurement: nothing in this workspace can run hyperscan,
# vectorscan or a Metal device. unsupported_diagnostic_code is the measured part,
# because the regex compiler owns the construct->code mapping and the release
# conformance gate reads that mapping rather than trusting this file.

[[row]]
semantics = "leftmost_semantics"
engine_support = { cpu_ref = "supported", cuda = "supported", wgpu = "supported", metal = "experimental", rust_regex = "supported", hyperscan = "supported", vectorscan = "supported" }
evidence_path = "xtask-registry/src/release/conformance_matrix/scan_matrix.rs"
unsupported_diagnostic_code = "VYRE_SCAN_NO_REFUSAL_PATH"

