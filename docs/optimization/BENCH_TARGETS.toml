# Canonical benchmark targets.
# Benchmark files may expose metadata, but target thresholds and baseline
# classes belong here.
#
# Every target names its comparison rather than assuming a host one:
# `baseline_class` states which class was timed, `baseline` names the
# implementation, and `min_speedup_over_baseline` is the floor over it. A
# target naming a `bench_case_id` must declare the class that case's
# performance contract declares.

schema = 2

# The set `vyre_bench::api::case::BaselineClass` defines, by its registry key.
baseline_class_values = [
  "cpu_sota",
  "gpu_sota",
  "self_unoptimized",
]

[release_workload_identity]
dataset_id_source = "bench_case_id"
metric_schema = "bench-target-release-workload:v1"
threshold_source = "docs/optimization/BENCH_TARGETS.toml"
hardware_digest_source = "release/evidence/benchmarks/cuda-release-suite.json#hardware_digest"

[[target]]
id = "foundation.elementwise.add.1m"
primitive = "f32 elementwise add"
suite = "smoke"
backend_focus = "cuda"
metric = "dispatch_ns_p50"
baseline_class = "cpu_sota"
min_speedup_over_baseline = 100.0
baseline = "wide/rayon-class SIMD CPU vector baseline"
gpu_competitor = "none_recorded"
notes = "Use active backend time when available; wall_ns remains recorded separately."


[[target]]
id = "foundation.reduce.sum.crossover"
primitive = "u32 scalar sum with measured atomic/tree crossover"
suite = "smoke"
backend_focus = "cuda"
metric = "dispatch_ns_p50"
timing_quality = "device_timestamps"
baseline_class = "cpu_sota"
min_speedup_over_baseline = 1.1
baseline = "Rayon parallel u32 wrapping sum"
gpu_competitor = "same-device atomic scalar and workgroup-memory tree routes"
notes = "Measures both routes at 32 and 1,048,576 elements, verifies both outputs exactly, selects the faster route independently for each size, and records global contention updates plus tree barrier rounds."
