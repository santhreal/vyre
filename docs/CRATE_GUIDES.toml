owner = 'foundation-ir'
layer = 'foundation'
owned = 'Own the typed IR, validation, optimizer, serialization, and foundational program contracts.'
non_owned = 'Concrete backends, runtime protocol, product compositions, CLI/tooling.'
allowed_dependencies = ['vyre-macros', 'vyre-spec']
profile = 'foundation'

[package.vyre-driver]
