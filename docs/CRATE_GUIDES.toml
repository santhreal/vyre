schema_version = 1
last_verified = "2026-08-04"

[profile.facade]
error_behavior = "Facade artifact workflows preserve structured compiler, admission, submission, and completion errors. Unavailable targets fail closed without backend fallback."

[profile.foundation]
error_behavior = "Malformed programs, incompatible schemas, and invalid transformations fail closed through validation or parsing errors before execution."

[profile.backend-neutral]
error_behavior = "Backend acquisition, capability, artifact, dispatch, and lifecycle failures retain actionable context. Shared contracts never substitute a concrete backend silently."

[profile.concrete-backend]
error_behavior = "Device acquisition, lowering, allocation, and dispatch failures are explicit backend errors. A requested device path never falls back to another backend."

[profile.semantics]
error_behavior = "Unsupported operations, malformed bindings, and invalid memory access return reference-execution errors rather than partial output."

[profile.primitives]
error_behavior = "Invalid dimensions, overflow, unsupported contracts, and malformed program inputs are rejected while the program is built or validated."

[profile.scheduler]
error_behavior = "Invalid scheduler state, graph shape, and capacity arithmetic fail before a partial schedule or artifact is accepted."

[profile.conformance]
error_behavior = "Malformed cases, missing selected backends, semantic mismatches, and incomplete certificates return a failing result with the affected case or backend."

[profile.runtime]
error_behavior = "Invalid plans, stale artifacts, unavailable selected backends, IO failures, and illegal state transitions are operator-visible errors."

[profile.libraries]
error_behavior = "Invalid shapes, unsupported compositions, arithmetic overflow, and malformed evidence are rejected by the builder or validator before dispatch."

[profile.intrinsics]
error_behavior = "An unsupported intrinsic, invalid operand contract, or missing selected lowering path is an explicit error. Intrinsics do not acquire a host substitute."

[profile.packaging]
error_behavior = "Invalid plans, incompatible metadata, unsupported targets, and serialization failures prevent an artifact from being emitted or accepted."

[profile.frontend]
error_behavior = "Invalid source, unsupported language constructs, and lowering failures carry source context and do not produce a successful partial program."

[profile.lowering]
error_behavior = "Invalid IR, unsupported target operations, and failed lowering invariants stop emission with contextual diagnostics."

[profile.emitter]
error_behavior = "Unsupported operations, invalid layouts, and target encoding failures return an emitter error instead of incomplete target text or binary."

[profile.tooling]
error_behavior = "Invalid arguments, stale evidence, violated repository contracts, and failed commands return a nonzero status with a concrete correction."

[profile.test-tooling]
error_behavior = "Fixture construction, execution, comparison, and certificate failures propagate to the calling test with exact mismatch context."

[profile.compiler-boundary]
error_behavior = "Invalid program shape, unsupported whole-graph lowering, and artifact construction failures stop before a partial Artifact is emitted."

[landing]
default_published_status = "active"
default_internal_status = "repository-internal"

[package.vyre-megakernel]
path = 'vyre-megakernel'
owner = 'megakernel-compiler'
layer = 'compiler-boundary'
owned = 'Compile validated typed Program graphs into canonical static and persistent megakernel artifacts without owning admission, execution, or lifecycle policy.'
non_owned = 'Admission, execution, lifecycle policy, concrete backends, runtime protocol.'
allowed_dependencies = ['vyre-foundation']
profile = 'compiler-boundary'

[package.vyre]
path = 'vyre'
owner = 'public-facade'
layer = 'facade'
owned = 'Expose canonical frontend IR, compiler artifact, runtime submission, and scan product entry points.'
non_owned = 'Backend implementation traits and configuration, concrete target lowering, optimizer internals, and conformance machinery.'
allowed_dependencies = ['vyre-driver', 'vyre-driver-cuda', 'vyre-driver-wgpu', 'vyre-foundation', 'vyre-megakernel', 'vyre-runtime', 'vyre-spec']
profile = 'facade'

