[package]
name = "vyre-registry-link"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sole owner of inventory registry link anchors and the per-source floor every registry read is judged against."
# Linkage owner for internal binaries, never published.
publish = false

[lints]
workspace = true

# Every dependency here submits into a global inventory registry. This crate
# exists to reference a symbol in each one, because that reference is what keeps
# its registrations in a linked binary. A consumer enables the features naming
# the registries it reads and the drivers it legitimately links.
[dependencies]
vyre-driver = { workspace = true }
vyre-foundation = { workspace = true }
vyre-driver-cuda = { workspace = true, optional = true }
vyre-driver-metal = { workspace = true, optional = true }
vyre-driver-reference = { workspace = true, optional = true }
vyre-driver-spirv = { workspace = true, optional = true }
vyre-driver-wgpu = { workspace = true, optional = true }
# `full` is what vyre-libs calls every domain that submits an
# `OperationRegistration`, and a linkage owner links all of them. Default
# features carry math, nn, matching, hash and decode only, so the geometry,
# optimization, topology, graph, bitset, reduce, label, predicate, fixpoint,
# visual, security, parsing, text and nfa registrations were absent from the
# registry this crate publishes, and the per-source floor could not see it
# because a source that contributes part of itself still contributes more than
# nothing. A source that contributes part of itself is the state this crate's
# floor exists to reject.
vyre-libs = { workspace = true, optional = true, features = ["full"] }
# `hardware` is what this crate needs from vyre-primitives and what the
# intrinsic registrations are gated on. The domain features that used to be
# named here left for vyre-libs.
vyre-primitives = { workspace = true, optional = true, features = ["hardware"] }

[dev-dependencies]
# The rules read the workspace member list to find registration-submitting
# crates, instead of carrying a list that goes stale in silence.
toml = { workspace = true }
# Resolves the checkout root from the working directory. A compiled-in manifest
# path names whichever checkout built the binary, and every checkout here shares
# one target directory.
structure-gate = { path = "../structure-gate" }

[features]
# The default is every registry and every declared driver, so this crate's own
# rules judge the whole tree. A consumer that links a subset opts out of the
# default and names what it links.
default = ["operations", "cuda", "metal", "reference", "spirv", "wgpu"]
# The two operation-owning crates. `docs/ARCHITECTURE.md` gives the workspace
# exactly two, and the rules fail when the tree grows a third.
operations = ["dep:vyre-libs", "dep:vyre-primitives"]
cuda = ["dep:vyre-driver-cuda"]
metal = ["dep:vyre-driver-metal"]
reference = ["dep:vyre-driver-reference"]
spirv = ["dep:vyre-driver-spirv"]
wgpu = ["dep:vyre-driver-wgpu"]

# The rules read the operation registry as well as the backend one, so they
# cannot build when the operation sources are not linked. Declared rather than
# wrapped in a file-level `cfg`: cargo then skips the suite for a selection that
# lacks the feature instead of failing on it, and a consumer reads the
# prerequisite from the manifest.
[[test]]
name = "registry_link_rules"
path = "tests/registry_link_rules.rs"
required-features = ["operations"]
