[package]
name = "vyre-reference"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust CPU reference interpreter for vyre IR; byte-identical oracle for backend conformance"
readme = "README.md"
keywords = ["gpu", "ir", "reference", "interpreter", "vyre"]
categories = ["algorithms", "api-bindings"]
documentation = "https://docs.rs/vyre-reference"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[dependencies]
rayon = { workspace = true }
inventory.workspace = true
vyre-foundation.workspace = true
vyre-primitives.workspace = true
# `hash::fnv1a::fnv1a32` and `matching::CompiledDfa` are the scalar and wire
# halves of two primitive markers' reference semantics. Both domains moved out
# of vyre-primitives into the composition library, so the oracle names them at
# their owner. `default-features = false`: the oracle needs one hash function
# and one DFA wire decoder, not the ML dialect surface.
vyre-libs = { version = "0.7.2", path = "../vyre-libs", default-features = false, features = ["matching-dfa"] }

vyre-spec.workspace = true
blake3.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
imbl.workspace = true
libm.workspace = true

[dev-dependencies]
vyre-test-support.workspace = true
# Byte-stability golden harness (`artifact_golden`) shared with the emitter
# crates, so the reference-output corpus is pinned the same way emitted
# artifacts are instead of growing a second comparison spelling.
vyre-lower = { workspace = true, features = ["test-fixtures"] }
proptest.workspace = true
regex-automata.workspace = true
hex.workspace = true
fnv.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["subgroup-ops"]
subgroup-ops = []

[lints]
workspace = true

[[test]]
name = "test_fnv1a32_zero"
path = "tests/fnv1a32_zero.rs"

[[test]]
name = "sweep_dual_arith_oracle_matrix"
path = "tests/sweep_dual_arith_oracle_matrix.rs"
[[test]]
name = "sweep_dual_bitwise_xor_volume_oracle_matrix"
path = "tests/sweep_dual_bitwise_xor_volume_oracle_matrix.rs"
