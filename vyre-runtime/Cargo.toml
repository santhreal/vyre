[package]
name = "vyre-runtime"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Persistent megakernel + io_uring zero-copy streaming runtime for vyre typed programs"
readme = "README.md"
keywords = ["gpu", "io-uring", "megakernel", "nvme", "vyre"]
categories = ["asynchronous", "hardware-support", "api-bindings"]
documentation = "https://docs.rs/vyre-runtime"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
megakernel-batch = []
subgroup-ops = []
self-substrate-adapters = [
    "dep:vyre-pass-engine",
    "dep:vyre-libs",
    "vyre-libs/analysis",
    "vyre-libs/encoding",
    "vyre-libs/solvers",
]
# `dep:` and not a bare name: a bare optional dependency also publishes a
# feature of its own, so `remote-cache = ["ureq"]` made `--features ureq` a
# second, undeclared way to turn the same code on.
remote-cache = ["dep:ureq"]
# Opt-in NVMe passthrough via `IORING_OP_URING_CMD` (Linux kernel 6.0+).
uring-cmd-nvme = []

[dependencies]
vyre-driver.workspace = true
vyre-pass-engine = { workspace = true, optional = true }
vyre-libs = { workspace = true, optional = true }
vyre-foundation.workspace = true
vyre-megakernel.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
bytemuck.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
arc-swap = { workspace = true }
ureq = { workspace = true, optional = true }
dashmap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }
vyre-driver-reference = { path = "../vyre-driver-reference" }
tempfile.workspace = true
serde_json.workspace = true
criterion.workspace = true
proptest.workspace = true







[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true

[[test]]
name = "sweep_tenant_policy_oracle_matrix"
path = "tests/sweep_tenant_policy_oracle_matrix.rs"

[[test]]
name = "sweep_ring_buffer_oracle_matrix"
path = "tests/sweep_ring_buffer_oracle_matrix.rs"
