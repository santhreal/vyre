lane = "gpu-parity-driver-contracts"
workflow = ".github/workflows/gpu-parity.yml"
job = "driver-contracts"
state = "live"
required_status = "GPU Parity + Determinism / WGPU backend contracts"
triggers = ["pull_request", "push", "workflow_dispatch"]
steps = [
  { command = "./cargo_full run -p vyre-driver-wgpu --bin vyre-wgpu -- demo" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test capability_contract --test async_dispatch_contract -- --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test float_to_int_cast_parity --test narrowing_cast_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test widening_cast_64_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test same_width_store_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test signed_modulo_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test signed_int_op_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test div_zero_shift_mask_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test blake3_compress_gpu_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test fnv1a32_gpu_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test fnv1a64_gpu_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test crc32_gpu_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test adler32_gpu_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test synthetic_binop_parity -- --test-threads=1 --nocapture" },
  { command = "./cargo_full test -p vyre-driver-wgpu --test unary_int_parity -- --test-threads=1 --nocapture" },
]
