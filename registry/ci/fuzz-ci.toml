lane = "fuzz-ci"
workflow = ".github/workflows/fuzz.yml"
job = "ci"
state = "live"
required_status = "Fuzz / ci"
triggers = ["pull_request", "push", "schedule", "workflow_dispatch"]
steps = [
  { command = "cargo +stable install --locked cargo-fuzz" },
  { command = '''cd vyre-foundation/fuzz
../../cargo_full fuzz run ${{ matrix.target }} --release -- -max_total_time=600''' },
]
