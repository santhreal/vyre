lane = "release-evidence-measured-evidence"
workflow = ".github/workflows/release-evidence.yml"
job = "measured-evidence"
state = "live"
required_status = "release-evidence / Generate measured evidence"
triggers = ["workflow_dispatch", "push"]
steps = [
  { gate = "release-conformance", args = ["--write"] },
  { gate = "release-benchmarks", args = ["--backend", "cuda", "--measured-samples", "30", "--write"] },
  { gate = "release-benchmarks", args = ["--backend", "wgpu", "--measured-samples", "30", "--write"] },
  { gate = "bench-release", args = [] },
]
