lane = "gpu-parity-gpu-adapter-probe"
workflow = ".github/workflows/gpu-parity.yml"
job = "gpu-adapter-probe"
state = "live"
required_status = "GPU Parity + Determinism / Probe real GPU adapter"
triggers = ["pull_request", "push", "workflow_dispatch"]
steps = [
  { command = '''if ! command -v nvidia-smi >/dev/null 2>&1; then
  echo "::error::nvidia-smi is missing on a GPU-required runner."
  exit 1
fi
nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader''' },
]
