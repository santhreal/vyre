lane = "conform-conform-release-gate"
workflow = ".github/workflows/conform.yml"
job = "conform-release-gate"
state = "live"
required_status = "Conformance / Conform release gate"
triggers = ["push", "pull_request"]
steps = [
  { command = '''if [ "${{ needs.operation-registry.result }}" != "success" ] \
  || [ "${{ needs.conform-gpu.result }}" != "success" ]; then
  echo "::error::A required conformance job failed or did not run."
  exit 1
fi
echo "Conform release gate passed."''' },
]
