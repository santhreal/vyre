[package]
name = "vyre-libs-bitset"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Packed u32 bitset operations, word utilities, and logical bitwise compositions"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-bitset"

[package.metadata.vyre]
publication_class = "extension-sdk"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["bitset", "logical"]
bitset = []
test-fixtures = []
logical = ["bitset"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
inventory.workspace = true
vyre-libs-reduce = { workspace = true }
vyre-libs-builder = { workspace = true }

[dev-dependencies]
proptest.workspace = true
vyre-test-support = { workspace = true, features = ["semantic-parity"] }
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
