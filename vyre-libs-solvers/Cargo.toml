[package]
name = "vyre-libs-solvers"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiler-internal numerical solvers, autotuning, and spectral schedule analysis"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-solvers"

[package.metadata.vyre]
publication_class = "internal-engine"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["solvers"]
solvers = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
vyre-libs-builder = { workspace = true }
vyre-libs-math = { workspace = true, features = ["math-kernels"] }
vyre-libs-graph = { workspace = true }

vyre-libs-bitset = { workspace = true, features = ["bitset"] }
vyre-libs-fixpoint = { workspace = true, features = ["fixpoint"] }
[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-test-support = { workspace = true, features = ["semantic-parity"] }
vyre-reference = { workspace = true }
vyre-driver-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
