[package]
name = "vyre-libs"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "GPU composition library for vyre IR: graph, pattern, parsing, text, math, neural, hash, decode, bitset, reduction, fixpoint, and visual operations"
readme = "README.md"
keywords = ["gpu", "ml", "linear-algebra", "cryptography", "vyre"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/vyre-libs"
exclude = ["**/proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[lib]
path = "src/lib.rs"

[features]
default = [
    "math-linalg",
    "math-scan",
    "math-broadcast",
    "nn-activation",
    "nn-linear",
    "nn-norm",
    "pattern-substring",
    "pattern-dfa",
    "hash",
    "decode",
]

full = [
    "builder",
    "builder-ops",
    "cat-a-builder-options",
    "telemetry",
    "bitset",
    "logical",
    "reduce",
    "fixpoint",
    "math-dialect",
    "math-kernels",
    "math-linalg",
    "math-scan",
    "math-broadcast",
    "math-algebra",
    "math-succinct",
    "geom",
    "opt",
    "representation",
    "nn-kernels",
    "nn-activation",
    "nn-linear",
    "nn-linear-4bit",
    "nn-norm",
    "nn-attention",
    "nn-moe",
    "nn-inference",
    "llm",
    "safetensors",
    "graph",
    "topology",
    "graph-dispatch",
    "dense-reachability",
    "impact-mask",
    "interactive-graphics",
    "pattern-kernels",
    "pattern-substring",
    "pattern-dfa",
    "pattern-nfa",
    "pattern-regex",
    "nfa",
    "hash",
    "crypto-blake3",
    "text",
    "decode",
    "parsing",
    "parsing-kernels",
    "go-parser",
    "python-parser",
    "visual",
    "vfs",
    "device",
    "solvers",
    "encoding",
    "analysis",
    "reasoning",
    "scheduling",
    "math",
    "nn",
    "pattern",
    "crypto",
]

math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "safetensors"]
pattern = ["pattern-substring", "pattern-dfa"]
crypto = ["crypto-blake3"]

test-fixtures = []

builder = []
builder-ops = ["builder"]
cat-a-builder-options = ["builder"]
telemetry = []

bitset = ["reduce"]
logical = ["bitset"]

reduce = ["builder"]

fixpoint = ["bitset"]

math-dialect = ["builder-ops", "reduce"]
math-kernels = ["reduce", "fixpoint"]
math-linalg = ["builder-ops", "cat-a-builder-options", "math-dialect", "math-kernels"]
math-scan = ["math-dialect", "math-kernels"]
math-broadcast = ["math-dialect", "math-kernels"]
math-algebra = ["math-dialect", "math-kernels"]
math-succinct = ["math-dialect", "math-kernels", "graph"]
geom = ["math-kernels"]
opt = ["math-kernels"]
representation = ["builder"]

nn-kernels = ["math-kernels", "dep:libm"]
nn-activation = ["builder-ops", "nn-kernels"]
nn-linear = ["cat-a-builder-options", "math-linalg", "nn-activation", "nn-kernels"]
nn-linear-4bit = ["nn-linear"]
nn-norm = ["builder-ops", "cat-a-builder-options", "math-broadcast", "nn-kernels"]
nn-attention = ["builder-ops", "cat-a-builder-options", "nn-norm", "math-linalg", "nn-kernels"]
nn-moe = ["nn-attention"]
nn-inference = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe"]
llm = ["builder-ops", "nn-moe"]
safetensors = ["dep:serde", "dep:serde_json"]

graph = ["bitset", "reduce", "hash", "fixpoint", "math-kernels", "telemetry"]
topology = ["math-kernels", "graph"]
graph-dispatch = ["device", "telemetry", "math-kernels", "graph"]
dense-reachability = ["graph"]
impact-mask = ["graph"]
interactive-graphics = ["graph", "visual"]

pattern-kernels = ["builder", "hash"]
pattern-substring = ["pattern-dfa", "pattern-kernels"]
pattern-dfa = ["pattern-kernels", "text"]
pattern-nfa = ["pattern-dfa", "nfa"]
pattern-regex = ["pattern-nfa", "dep:regex-syntax"]
nfa = ["bitset", "pattern-kernels"]

hash = ["builder"]
crypto-blake3 = ["hash"]

text = ["reduce"]

decode = ["pattern-kernels", "text"]

parsing = ["go-parser", "python-parser", "dep:rayon", "dep:rustc-hash"]
parsing-kernels = ["text", "pattern-kernels", "dep:rayon", "dep:rustc-hash"]
go-parser = ["reduce", "dep:rayon", "dep:rustc-hash"]
python-parser = ["parsing-kernels", "dep:rayon", "dep:rustc-hash"]

visual = ["math-kernels"]

vfs = []
device = []

solvers = ["device", "telemetry", "math-kernels", "topology", "bitset", "fixpoint"]

encoding = ["device", "telemetry", "pattern-kernels", "math-kernels", "nn-kernels", "parsing-kernels", "bitset", "graph", "fixpoint"]

analysis = ["device", "telemetry", "math-kernels", "graph", "dense-reachability", "fixpoint", "dep:tracing"]

reasoning = ["analysis", "graph", "impact-mask"]

scheduling = ["device", "telemetry", "math-kernels", "parsing-kernels", "graph"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-compiler.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
blake3.workspace = true
inventory.workspace = true
libm = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
vyre = { workspace = true }
vyre-primitives = { workspace = true, features = ["hardware"], default-features = false }
vyre-emit = { workspace = true, features = ["naga"] }
vyre-compiler = { workspace = true }
vyre-runtime = { workspace = true }
vyre-driver-reference = { workspace = true }
vyre-reference = { workspace = true }
naga.workspace = true
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true
tree-sitter = { workspace = true }
tree-sitter-go = { workspace = true }
vyre-test-support = { workspace = true, features = [
    "dense-matvec-cases",
    "golden-corpus",
    "ir-fixtures",
    "parity-oracles",
    "semantic-parity",
    "semantic-requests",
] }

[package.metadata.vyre]
publication_class = "stable-consumer-sdk"
publication_contract = "consumer-seam:vyre-graphics-app"

[lints]
workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[[example]]
name = "select1_optimizer_parity"
required-features = ["bitset"]
