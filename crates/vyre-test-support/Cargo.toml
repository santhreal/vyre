[package]
name = "vyre-test-support"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared test-only harness helpers, allocation probe, and conformance engine for the vyre workspace."
readme = "README.md"
keywords = ["vyre", "testing", "harness", "conformance", "registry"]
categories = ["development-tools::testing"]
publish = false

[package.metadata.cargo-machete]
ignored = ["vyre-driver-spirv"]

[features]
default = []
ir-fixtures = ["dep:vyre-foundation", "dep:smallvec", "dep:blake3"]
parity-oracles = ["ir-fixtures", "dep:vyre-reference"]
semantic-requests = ["ir-fixtures", "dep:vyre-compiler"]
golden-corpus = ["ir-fixtures", "dep:vyre-compiler", "vyre-compiler/test-fixtures"]
semantic-parity = ["semantic-requests", "parity-oracles", "dep:vyre-primitives"]
driver-contracts = ["dep:vyre-runtime", "dep:vyre-foundation"]
driver-artifact-contracts = ["driver-contracts", "semantic-requests"]
host-input-abi = ["driver-contracts", "parity-oracles"]
spec-strategies = ["dep:proptest"]
dense-matvec-cases = ["parity-oracles", "dep:vyre-primitives"]
conform-spec = ["dep:blake3"]
conform = [
    "conform-spec",
    "ir-fixtures",
    "semantic-requests",
    "driver-contracts",
    "parity-oracles",
    "dep:hex",
    "dep:thiserror",
    "dep:vyre",
    "dep:vyre-driver-reference",
    "dep:vyre-libs",
    "dep:vyre-compiler",
    "dep:vyre-primitives",
    "vyre-primitives/hardware",
    "dep:vyre-registry-link",
    "dep:vyre-runtime",
]
conform-gpu = [
    "conform",
    "dep:vyre-driver-cuda",
    "dep:vyre-driver-spirv",
    "dep:vyre-driver-wgpu",
    "vyre-registry-link/cuda",
    "vyre-registry-link/metal",
    "vyre-registry-link/spirv",
    "vyre-registry-link/wgpu",
]
conform-device-tests = ["conform-gpu"]

[dependencies]
blake3 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
inventory = { workspace = true }
proptest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true }
vyre = { workspace = true, optional = true }
vyre-runtime = { workspace = true, optional = true }
vyre-driver-cuda = { workspace = true, optional = true }
vyre-driver-reference = { workspace = true, optional = true }
vyre-driver-spirv = { workspace = true, optional = true }
vyre-driver-wgpu = { workspace = true, optional = true }
vyre-foundation = { workspace = true, optional = true }
vyre-libs = { workspace = true, features = ["full"], optional = true }
vyre-compiler = { workspace = true, optional = true }
vyre-primitives = { workspace = true, optional = true }
vyre-reference = { workspace = true, optional = true }
vyre-registry-link = { workspace = true, default-features = false, features = ["operations"], optional = true }
vyre-spec = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.vyre]
publication_class = "private-test-support"

[lints]
workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[[test]]
name = "alloc_probe"
path = "tests/alloc_probe.rs"

[[test]]
name = "all_tests_ir_fixtures"
path = "tests/all_tests_ir_fixtures.rs"
required-features = ["ir-fixtures", "parity-oracles"]

[[test]]
name = "conform_spec_tests"
path = "tests/conform_spec_tests.rs"
required-features = ["conform-spec", "ir-fixtures"]

[[test]]
name = "conform_tests"
path = "tests/conform_tests.rs"
required-features = ["conform"]

[[test]]
name = "conform_device_tests"
path = "tests/conform_device_tests.rs"
required-features = ["conform-device-tests"]

[[test]]
name = "operation_disposition_closure"
path = "tests/operation_disposition_closure.rs"
required-features = ["conform"]
