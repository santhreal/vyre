[package]
name = "vyre-compiler"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
description = "Verified lowering and megakernel compilation from vyre Program IR to canonical artifacts"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre-compiler"
keywords = ["vyre", "compiler", "megakernel", "gpu", "lowering"]
categories = ["compilers", "hardware-support"]

[features]
default = []
# Fixture builders for kernel descriptors, used only by emitter tests. Off by
# default so a published build does not carry test scaffolding.
test-fixtures = []

[dependencies]
vyre-foundation.workspace = true
vyre-spec.workspace = true
# The physical-kernel and target-payload level stages register themselves into
# the level registry vyre-foundation owns.
inventory.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
imbl.workspace = true

[package.metadata.vyre]
publication_class = "internal-engine"
publication_contract = "closure:vyre"

[lints]
workspace = true

[dev-dependencies]
# Integration tests reach `descriptor_builder`, `artifact_golden` and
# `program_stability_corpus`, which are gated behind `test-fixtures`. A
# `cfg(test)` gate covers unit tests only, so the feature is turned on for this
# crate's test targets here.
vyre-compiler = { workspace = true, features = ["test-fixtures"] }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
serde_json.workspace = true
toml.workspace = true
# The descriptor literal contract judges the compact encoding the descriptor
# dump and the metal descriptor hash use.
bincode.workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

# Isolated: the body calls `set_current_dir`, and a process has one working
# directory. The contract is that the variant space answers for the compiled
# source rather than for the directory the process stands in, which can only be
# observed by changing that directory, so any test sharing the binary would
# resolve its own paths against whichever directory this one had set.
[[test]]
name = "variant_space_is_independent_of_the_working_directory"
path = "tests/lower/variant_space_is_independent_of_the_working_directory.rs"
