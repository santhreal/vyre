[package]
name = "vyre-grammar-gen"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Host-side C11 grammar table generator for the vyre GPU C parser. Emits DFA lexer + LR(1) action/goto tables as binary blobs that vyre-libs::parsing loads as ReadOnly buffers."
readme = "README.md"
keywords = ["gpu", "parser", "c11", "vyre"]
categories = ["compilers", "parsing"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap = { version = "=4.6.4", features = ["derive"] }
blake3.workspace = true
regex.workspace = true
regex-automata.workspace = true
vyre-spec.workspace = true

[[bin]]
name = "vyre-grammar-gen"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.santh]
status = "alpha"
