[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable, and not ours to fix. Both are transitive
    # and neither has an upstream successor we can pull without waiting on the
    # crates that depend on them.
    #
    # bincode 2.0.1: the team ceased development permanently and considers the
    # crate complete, so there is no later version to move to.
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained by its authors' decision, reached transitively; no fixed version exists." },
    # paste 1.0.15: archived by its author. `pastey` is a drop-in fork, but the
    # dependency is transitive, so the switch belongs to the crates that pull
    # it rather than to this workspace.
    { id = "RUSTSEC-2024-0436", reason = "paste is archived upstream, reached transitively; the replacement is the dependents' to make." },
    # bitmaps 3.2.1: reached only through imbl, the maintained fork of im that
    # this workspace moved to in order to clear im's own unmaintained advisory
    # and RUSTSEC-2023-0126, the OrdSet aliasing violation. The persistent
    # collections are load-bearing: the DCE live set is cloned at every branch
    # arm and the lowering scope snapshots its binding map per scope, so a std
    # map would deep-copy every identifier instead of sharing structure.
    # Nothing depends on bitmaps directly and there is no advisory of substance
    # against it, only lack of maintenance.
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained, reached transitively through imbl; no vulnerability and no successor to move to." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    # webpki-roots ships the Mozilla CA root store, which is data rather than
    # code, under the Community Data License Agreement. Permissive terms, no
    # copyleft reach into anything that links it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# An unpublished helper crate is depended on by path with no version, which
# reads as a wildcard. That is correct for `vyre-test-support`: it is not
# published, so there is no registry version to pin. Wildcards on registry
# dependencies stay denied.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # The ban is about TLS: nothing we ship may link system openssl. It is not
    # about cryptography as a subject. `vyre-bench` uses openssl's AES-CTR as
    # the CPU reference the GPU crypto benchmark is measured against, which is
    # the point of the comparison and never reaches a published crate, so it is
    # listed as an allowed wrapper rather than the ban being weakened.
    { crate = "openssl", wrappers = ["vyre-bench"], reason = "Fix: use rustls instead  -  avoid linking system openssl. Benchmark baselines are the sole exception." },
    { crate = "openssl-sys", wrappers = ["openssl"], reason = "Fix: use rustls  -  no C dependency bleed." },
]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
