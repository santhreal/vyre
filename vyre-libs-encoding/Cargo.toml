[package]
name = "vyre-libs-encoding"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiler-internal bitset, provenance, matroid, and fingerprint encoding compositions"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-encoding"

[package.metadata.vyre]
publication_class = "internal-engine"

[lints]
workspace = true

[features]
default = ["encoding"]
encoding = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-device = { workspace = true }
vyre-libs-bitset = { workspace = true }
vyre-libs-reduce = { workspace = true }
vyre-libs-fixpoint = { workspace = true }
vyre-libs-math = { workspace = true }
vyre-libs-nn = { workspace = true }
vyre-libs-graph = { workspace = true }
vyre-libs-pattern = { workspace = true }
vyre-libs-parsing = { workspace = true }
vyre-libs-hash = { workspace = true }

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
