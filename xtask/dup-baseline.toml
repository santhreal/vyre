# Duplicated source lines per crate.
#
# A line counts as duplicated when an 8-line normalized shingle covering it
# also appears in another file. More than the pin fails; less is reported so
# the owning dedup PR can lower it here as part of its own diff.
#
# A pin is never raised. `--write-baseline` adds a row for a crate that has none
# and touches nothing else, so it cannot erase the intentional-red state of a
# pin whose closing work another checkout owns. Lowering is
# `--lower-pin CRATE`, one row, in the diff that removed the duplication; it
# refuses to move a pin up. A crate with duplication and no row fails, so a new
# crate cannot arrive unmeasured.
#
# vyre-libs is pinned at its current measurement, not at a floor. Quantized
# batched matmul dispatch owns validation, input materialization, dispatch, and
# exact output decoding in `solvers::quantized_dispatch::shapes`. Bounded
# Aho-Corasick construction owns shared input bindings in
# `pattern::classic_ac::bounded_ranges::AcInputBindings`. CSR dispatch tests
# obtain canonical graph and mutation fixtures from one sibling module.
#
# `graph::program_graph` owns the CSR frontier buffer layout,
# `graph::frontier_bits` owns packed-bitset word and mask addressing,
# `graph::lane_grid` owns the one-dimensional dispatch grid, and
# `reduce::workgroup_tree::hillis_steele_inclusive_sum_nodes` owns the
# double-buffered workgroup scan sweep.
#
# The eleven vyre-primitives lines that were pinned as deliberate are gone.
# `vyre_primitives::types::linear_check::LinearDiscipline` restated
# `vyre_foundation::ir::LinearType`, including `forbids_drop` and
# `forbids_reuse`, and the pair was recorded here as unownable because the
# primitive layer builds with no IR dependency. It had no callers, so the copy
# was deleted rather than pinned, and `vyre_foundation::ir` is the one owner.

