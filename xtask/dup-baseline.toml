# Duplicated source lines per crate, written by `xtask dup-scan --write-baseline`.
#
# A line counts as duplicated when an 8-line normalized shingle covering it
# also appears in another file. More than the pin fails; less is reported so
# the owning dedup PR can lower it here as part of its own diff.
#
# A pin is never raised. Four rows are currently below what the crate measures,
# and each is failing on purpose until the work that closes it lands:
#
#   tests            8      the C-frontend fixture streams under
#                           tests/support/c_frontend/fixtures are still spelled
#                           one FixtureToken per line.
#   vyre-libs        11805  the migrated c_ast_sema_scope_* and
#                           c_parser_hostile_* suites still repeat their row
#                           assertions per case.
#   vyre-primitives  8454   the CRC and graph oracle matrices still restate
#                           src/hash/crc32.rs and src/graph/motif.rs.
#   vyre-driver-metal 282   ninety of metal's lines are duplicated only because
#                           cuda, spirv and wgpu hold copies of the Submission
#                           and Completion materializer body. The single owner is
#                           vyre-driver/src/materialize.rs and the collector is
#                           not written yet; metal alone plus spirv can reach 351.

