# Duplicated source lines per crate.
#
# A line counts as duplicated when an 8-line normalized shingle covering it
# also appears in another file. More than the pin fails; less is reported so
# the owning dedup PR can lower it here as part of its own diff.
#
# A pin is never raised. `--write-baseline` rewrites every row from the current
# tree and drops this block, so it must not be used to record one crate's
# progress; edit that crate's row by hand. A crate with duplication and no row
# fails, so a new crate cannot arrive unmeasured.
#
# vyre-primitives and vyre-libs sit at their measured values but not at a floor:
# the iterative-solver builders in vyre-primitives duplicate against their
# vyre-libs dispatch partners, and neither side owns the shape yet. The CSR
# frontier buffer layout is no longer part of that: `graph::program_graph` owns
# `word_buffer`, `frontier_buffer` and `push_frontier_changed_buffers`, and every
# graph primitive declares its own buffers through them. Nor is the kernel-body
# skeleton below those buffers: `graph::frontier_bits` owns packed-bitset word
# and mask addressing, `graph::lane_grid` owns the one-dimensional dispatch grid,
# and `reduce::workgroup_tree::hillis_steele_inclusive_sum_nodes` owns the
# double-buffered workgroup scan sweep.
#
# Eleven of vyre-primitives' lines are deliberate and cannot be collapsed.
# `vyre_primitives::types::linear_check::LinearDiscipline` and
# `vyre_foundation::ir::LinearType` declare the same four substructural
# disciplines and the same `forbids_drop` / `forbids_reuse` predicates. The
# primitive layer builds with no IR dependency at all, since the
# `vyre-foundation` edge is optional and absent under `--no-default-features`,
# and a foundation-layer crate cannot import from the primitives layer, so
# neither direction has a legal owner. The pair is pinned, not fixed.

