# Duplicated source lines per crate.
#
# A line counts as duplicated when an 8-line normalized shingle covering it
# also appears in another file. More than the pin fails; less is reported so
# the owning dedup PR can lower it here as part of its own diff.
#
# A pin is never raised. Every row now meets what its crate measures, so a red
# dup-scan means a change added a copy rather than an older debt coming due.
# `--write-baseline` rewrites every row from the current tree and drops this
# block, so it must not be used to record one crate's progress; edit that
# crate's row by hand.
#
# vyre-primitives sits at its measured floor: the remaining rows are the CSR
# traversal and iterative-solver program builders, which duplicate against their
# vyre-libs dispatch partners rather than against each other.

