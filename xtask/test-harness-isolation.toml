# Which integration-test files may not share a harness binary.
#
# Cargo links one binary per test target, so this workspace declares one target
# per crate and required-feature set and compiles each test file as a module of
# it. A test that mutates process-global state cannot be grouped that way:
# every other test in the same binary observes the mutation. Each row below
# names a file the scan matched, `isolated` for one that keeps a target of its
# own and `grouped` for one whose match is benign. A test that merely names a
# process-global API can be grouped, and most matches are that.
#
# The candidate set is re-derived from source by the `test-harness-isolation`
# gate rather than listed here, so a new test that touches process-global state
# fails the sweep until a row below records the decision for it. A row naming a
# file that no longer matches, or no longer exists, fails too: a decision record
# that outlives its subject overstates what was reviewed.
# `test-target-membership` enforces the other half: an `isolated` row must have
# a target of its own, and every other test file must be a module of exactly one
# harness. A target rooted in a subdirectory of `tests/` counts as that target,
# because it compiles that subdirectory and nothing else.
#
# The scan covers every depth under a package's `tests/` directory, not the
# target roots alone. A module two directories down runs in the same process as
# every other test in the binary that includes it, which is where the fixture
# registration behind the `cert_regression_pin` row was hiding.

schema_version = 1

