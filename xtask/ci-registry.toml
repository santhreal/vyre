# Every check CI runs, declared once, written by
# `xtask gates --write-baseline`.
#
# A `[[gate]]` row carries the subsets that hold the gate and the
# workflows that run it. An `[[external]]` row is a check CI runs that
# is not an xtask gate. The finding count each gate is pinned at lives
# in `xtask/gate-baselines.toml`.
#
# The `ci-registry` gate compares this file against the registry, the
# subsets and the workflow steps, in both directions, so a gate no
# workflow runs and a row naming no gate are both failures.

schema_version = 1

