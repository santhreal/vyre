reason = "a full clean release build twice per run exceeds the runner time budget for a nightly schedule"
returns_when = "the second pass reuses a warm cache, or a hosted runner with a larger time budget is available"

[[paused]]
workflow = "test-random-order.yml"
reason = "the nightly toolchain it needs for randomized test order fails to install on the hosted runner"
returns_when = "randomized order lands on the stable toolchain, or the nightly install is fixed"
