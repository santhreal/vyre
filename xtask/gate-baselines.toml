# Pinned finding count of every registered gate, written by
# `xtask gates --write-baseline`.
#
# One row per registered gate, and the sweep fails on a gate with no row
# or a row with no gate. More findings than the pin fails; fewer is
# reported so the pin can be lowered here, and the pin only ever moves
# down. A gate that cannot run at all fails outright: no row makes a
# failing gate legal, and the writer refuses to record one.
#
# Every pin below is 0 because the registry was rebuilt against the gate
# contract and no gate had run under it yet. Zero is the only pin that
# cannot excuse a finding, so a gate that reports one fails until the
# number here is recorded from a real run. Record them all at once with
# `xtask gates --write-baseline`, which refuses to write while any gate
# cannot run.

