# Pinned result of every registered gate, written by `xtask gates --write-baseline`.
#
# `status` is the exit result and `output_lines` is the combined stdout and
# stderr line count, used as the finding count. More lines than the pin
# fails; fewer is reported so the pin can be lowered here. A red gate that
# starts passing fails until its status is flipped, and must name the PR
# that clears it while it is still red.

