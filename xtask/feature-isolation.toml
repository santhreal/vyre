# Recorded compile outcome of every feature selection this workspace judges.
#
# The axis is derived from the tracked manifests at run time, never from this
# file. The `feature` column spells the selection: `(none)` is the per-member
# `--no-default-features` probe, `(default)` is the plain `cargo check -p`
# build, a bare name is that one feature enabled alone, and a comma-joined
# list is a selection a workspace edge asks of a sibling, with defaults kept
# when the list opens with `(default)`. A selection with no row here, a row
# naming a selection no manifest declares, and a row whose outcome disagrees
# with the sweep are each a failure.
#
# `outcome = "blocked"` needs a one-line technical constraint in `reason`.
# A feature that merely needs another feature is not blocked: give it the
# missing edge in its own [features] table so `--features x` enables what x
# needs, which fixes the crate for a downstream consumer and not only for
# this sweep.
#
# Regenerate: `cargo run -p xtask --bin xtask -- feature-isolation --sweep --write`.
# Record only what has no row yet: add `--only-unrecorded`.
# Check agreement: `cargo run -p xtask --bin xtask -- feature-isolation`.

