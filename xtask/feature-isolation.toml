# Every feature selection this workspace judges.
#
# The axis is derived from the tracked manifests at run time, never from this
# file. The `feature` column spells the selection: `(none)` is the per-member
# `--no-default-features` probe, `(default)` is the plain `cargo check -p`
# build, a bare name is that one feature enabled alone, and a comma-joined
# list is a selection a workspace edge asks of a sibling, with defaults kept
# when the list opens with `(default)`. A selection with no row here, and a row
# naming a selection no manifest declares, are each a failure.
#
# A row states no compile outcome. Whether a selection compiles is measured by
# the run that compiles it and is never stored here, because a stored
# measurement is stale the moment a feature edge moves. A sweep that leaves
# part of the axis uncompiled reports the rest as unmeasured and fails, so a
# bare row claims nothing and exempts nothing.
#
# `outcome = "blocked"` exempts a selection that cannot compile, and needs a
# one-line technical constraint in `reason`. A feature that merely needs
# another feature is not blocked: give it the missing edge in its own
# [features] table so `--features x` enables what x needs, which fixes the
# crate for a downstream consumer and not only for this sweep.
#
# Declare the axis: `cargo run -p xtask --bin xtask -- feature-isolation --write`.
# Measure it: `cargo run -p xtask --bin xtask -- feature-isolation --sweep`.

