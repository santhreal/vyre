[package]
name = "xtask"
version = "0.1.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build task runner for the vyre workspace."
# Internal build-task runner, not a published crate. `cargo publish` on the
# workspace must skip it.
publish = false
# `src/bin/` holds two maintainer tools beside the runner, which makes
# `cargo run -p xtask` ambiguous. Every workflow step, script and doc invokes
# the runner, so name it here once instead of spelling `--bin xtask` at each
# call site.
default-run = "xtask"
[lib]
name = "xtask"
path = "src/lib.rs"

[package.metadata.vyre]
publication_class = "conformance-tooling"

[lints]
workspace = true

# `public_api_snapshot_inventory` drives `cargo public-api` under the pinned
# nightly whose item paths the committed snapshots record. `public-api.yml`
# installs both and turns this on. The general test matrix carries neither, and
# there those tests report the absent tool instead of a public-surface defect.
[features]
default = []
public-api-tool = []

# No vyre crate appears here, and none may be added. A subcommand that needs to
# observe the live operation registry or a measured benchmark probe belongs in
# `xtask-registry` or `xtask-evidence`, which this crate builds on demand. Every
# dependency below reads source text, a manifest, or a JSON artifact.
[dependencies]
sha2.workspace = true
blake3.workspace = true

toml.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
quote = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
walkdir.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# The checkout-root walk has one owner, and it is the crate that depends on no
# vyre crate so it still resolves a root while the workspace does not compile.
structure-gate = { path = "../structure-gate" }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
# A `tests/<name>/main.rs` target is already one binary for its whole module
# tree, so it stays a target of its own. `autotests = false` stops cargo from
# discovering it, and without this row the workspace architecture suite links
# nothing and reports success.
[[test]]
name = "tree_contracts"
path = "tests/tree_contracts/main.rs"
