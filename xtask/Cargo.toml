[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build task runner for the vyre workspace."
# This package also ships two rule-authoring binaries, so a bare
# `cargo run -p xtask` cannot decide which to build without this. Every
# workflow step and script invokes the runner that way.
default-run = "xtask"
# Internal build-task runner, not a published crate. `cargo publish` on the
# workspace must skip it.
publish = false

[lints]
workspace = true

# No vyre crate appears here, and none may be added. A subcommand that needs to
# observe the live operation registry or a measured benchmark probe belongs in
# `xtask-registry` or `xtask-evidence`, which this crate builds on demand. Every
# dependency below reads source text, a manifest, or a JSON artifact.
[dependencies]
sha2.workspace = true
blake3.workspace = true

toml.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
quote = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
walkdir.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# The checkout-root walk has one owner, and it is the crate that depends on no
# vyre crate so it still resolves a root while the workspace does not compile.
structure-gate = { path = "../structure-gate" }

[dev-dependencies]
tempfile = { workspace = true }
