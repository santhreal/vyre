[package]
name = "vyre-libs-nn"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Neural network activations, linear, normalization, attention, MoE, and LLM inference"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-nn"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[package.metadata.vyre]
publication_class = "extension-sdk"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["nn", "nn-inference", "llm"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]
"nn-kernels" = []
"nn-activation" = ["nn-kernels"]
"nn-linear" = ["nn-activation", "nn-kernels"]
"nn-linear-4bit" = ["nn-linear"]
"nn-norm" = ["nn-kernels"]
"nn-attention" = ["nn-norm", "nn-kernels"]
"nn-moe" = ["nn-attention"]
"nn-inference" = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe"]
llm = ["nn-moe"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
inventory.workspace = true
thiserror.workspace = true
libm.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-reduce = { workspace = true }
vyre-libs-math = { workspace = true }

[dev-dependencies]
proptest.workspace = true
vyre-lower = { workspace = true }
vyre-test-support = { workspace = true, features = ["semantic-parity"] }
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }
[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
