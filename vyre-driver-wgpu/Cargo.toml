[package]
name = "vyre-driver-wgpu"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "wgpu backend for vyre IR  -  implements VyreBackend, owns GPU runtime, buffer pool, pipeline cache"
readme = "README.md"
keywords = ["gpu", "wgpu", "ir", "backend", "vyre"]
categories = ["graphics", "rendering::graphics-api", "hardware-support"]
documentation = "https://docs.rs/vyre-wgpu"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[features]
default = []
wgpu = []
parity-testing = []
math-linalg = ["vyre-libs/math-linalg"]
math-scan = ["vyre-libs/math-scan"]
nn-attention = ["vyre-libs/nn-attention"]
matching-substring = ["vyre-libs/matching-substring"]
matching-dfa = ["vyre-libs/matching-dfa"]
matching-nfa = ["vyre-libs/matching-nfa"]

[dependencies]
vyre-spec = { workspace = true }
vyre-driver = { workspace = true, features = ["libs-compositions"] }
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-pass-engine = { workspace = true }
vyre-libs = { workspace = true, features = ["reasoning"] }
vyre-lower.workspace = true
vyre-emit-naga.workspace = true
naga = { workspace = true, features = ["wgsl-out", "spv-out"] }
wgpu.workspace = true
bytemuck.workspace = true
crossbeam-queue = { workspace = true }
crossbeam-channel.workspace = true
arc-swap = { workspace = true }
tracing.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
inventory.workspace = true
dashmap = { workspace = true }
smallvec.workspace = true
fs2.workspace = true
bincode = { workspace = true }

[dev-dependencies]
# `artifact_golden` (the emitted-WGSL byte-stability harness) is test-only and
# lives behind this feature, like `descriptor_builder`.
vyre-lower = { workspace = true, features = ["test-fixtures"] }
vyre-runtime.workspace = true
# `ir-fixtures` carries the shared u32 binop parity tables the live-GPU
# parity suites read their operands and pinned oracle answers from.
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }
# The canonical self-hosted optimizer scaling bench lives behind this feature,
# so both concrete driver crates report the same fixtures and table.
vyre-driver = { workspace = true, features = ["test-fixtures"] }
criterion.workspace = true
stats_alloc.workspace = true
tempfile.workspace = true
proptest.workspace = true
vyre-libs = { path = "../vyre-libs", features = ["matching", "parsing", "nn-attention", "crypto-blake3", "hash"] }
# The integration tests under tests/ exercise the public `vyre` umbrella facade
# (vyre::ir, vyre::{DispatchConfig, VyreBackend, validate, ...}), the ergonomic
# surface a real consumer uses. The 0.6.2 refactor dropped this dev-dep, which
# silently RED-ed ~90 test files (use of unlinked crate `vyre`). `default-features
# = false` keeps the `wgpu` feature OFF, so vyre does NOT pull vyre-driver-wgpu back
# in: no dependency cycle.
# PATH-ONLY (no version): the `vyre` facade is published AFTER this crate in the publish
# order, so a versioned/workspace dev-dep would be unsatisfiable at publish time.
# cargo strips path-only dev-deps from the published manifest; the local test build
# still links it through the path.
vyre = { path = "../vyre", default-features = false }
# A handful of tests reach `vyre_primitives::wire::pack_u32_iter` directly (the
# facade doesn't re-export the wire POD helpers). Also dropped in the 0.6.2 refactor.
vyre-primitives = { path = "../vyre-primitives", features = ["inventory-registry"], default-features = false }
# Cross-OS shader-VALIDITY coverage for the combined segmented megakernel: the
# winning Vulkan/DX12 runs implicitly prove SPIR-V/HLSL validity, but macOS/Metal
# is hardware-blocked, so the megakernel descriptor is lowered to MSL here (naga's
# MSL backend runs the validator, so a successful emit IS a Metal-validity proof)
# and to SPIR-V (explicit, not run-implied). PATH-ONLY (no version), like the `vyre`
# dev-dep above: cargo strips path-only dev-deps at publish, so this never creates a
# publish-ordering constraint, and `--edges=normal` keeps it out of the layering lint.
# CPU-reference parity tests compare against vyre-reference.
vyre-reference = { path = "../vyre-reference" }
# GPU parity tests consume the canonical conformance library without enabling
# its optional concrete-backend dependencies. PATH-ONLY keeps this unpublished
# harness out of the packaged dependency graph.
vyre-conform = { path = "../conform/vyre-conform", default-features = false }
tracing-subscriber.workspace = true
libc.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# build.rs reads this to stamp VYRE_NAGA_VERSION into the binary so the
# pipeline-cache key invalidates when the shader frontend changes. Bump in
# lockstep with the workspace `naga` dep.
[package.metadata.vyre]
naga_version = "25.0.0"

[lints]
workspace = true



[[bin]]
name = "vyre-wgpu"
path = "src/bin/vyre.rs"


[[test]]
name = "op_pairwise"
path = "tests/op_pairwise/mod.rs"

[[test]]
name = "resident_buffer_contracts"
path = "tests/resident_buffer_contracts/mod.rs"

[[test]]
name = "buf_len_array_length"
path = "tests/buf_len_array_length/mod.rs"
