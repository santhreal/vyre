[package]
name = "vyre-driver-metal"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre-driver-metal"
description = "Native Metal backend for vyre IR through Metal.framework."
readme = "README.md"
keywords = ["gpu", "compute", "metal", "msl", "vyre"]
categories = ["hardware-support"]

[lib]
name = "vyre_driver_metal"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
vyre-driver = { workspace = true }
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-lower = { workspace = true }
inventory.workspace = true
tracing.workspace = true
serde_json.workspace = true

# Every module that names the Metal artifact types is gated on an Apple target,
# so the emitter is a dependency only where those modules compile.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
vyre-emit-metal = { workspace = true }
metal.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
vyre-driver-wgpu = { path = "../vyre-driver-wgpu" }
