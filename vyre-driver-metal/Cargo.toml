[package]
name = "vyre-driver-metal"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre-driver-metal"
description = "Native Metal backend for vyre IR through Metal.framework."
readme = "README.md"
keywords = ["gpu", "compute", "metal", "msl", "vyre"]
categories = ["hardware-support"]

[lib]
name = "vyre_driver_metal"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.vyre]
publication_class = "concrete-backend"
publication_contract = "target-support:metal"

[lints]
workspace = true

[features]
default = []
# A test that acquires a real device is compiled only where the device is.
# The lanes that own hardware turn this on; a hosted runner leaves it off and
# never links a test whose first line would abort inside the driver.
device-tests = []

[dependencies]
vyre-driver = { workspace = true }
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-lower = { workspace = true }
vyre-emit-metal = { workspace = true }
tracing.workspace = true
serde_json.workspace = true

# The registry contract tests read committed TOML and acquire no device, so this
# dependency is not target-gated.
[dev-dependencies]
toml = { workspace = true }
# The shared external-import contract harness lives behind this feature, so the
# Metal answer to it states its handles and the combination it refuses and
# nothing else.
vyre-driver = { workspace = true, features = ["test-fixtures"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
