[package]
name = "vyre-spec"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
description = "Frozen data contracts for vyre  -  OpDef, AlgebraicLaw, Category, IntrinsicTable"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gpu", "ir", "specification", "wgsl", "vyre"]
categories = ["algorithms", "api-bindings"]
documentation = "https://docs.rs/vyre-spec"
exclude = ["**/SKILL.md"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true

[dev-dependencies]
vyre-test-support = { workspace = true, features = ["ir-fixtures", "spec-strategies"] }
proptest.workspace = true
vyre-foundation = { path = "../vyre-foundation" }
vyre-primitives = { path = "../vyre-primitives" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
