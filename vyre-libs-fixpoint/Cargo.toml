[package]
name = "vyre-libs-fixpoint"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic fixpoint iteration kernels and grid synchronization barriers"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-fixpoint"

[package.metadata.vyre]
publication_class = "extension-sdk"

[lints]
workspace = true

[features]
default = ["fixpoint"]
fixpoint = []
# The routing contract and the program-width query are test material that a
# dependent crate's suite reads, so they compile only when a caller opts in.
test-fixtures = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-bitset = { workspace = true }

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }
# The grid-contract suite asserts the emitted wave structure through the
# neutral grid-sync split the driver states.
vyre-driver = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
