[package]
name = "vyre-self-substrate"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vyre self-substrate: vyre using its own primitives on its own scheduler problems. The recursion-thesis layer between vyre-primitives and vyre-driver."
readme = "README.md"
keywords = ["gpu", "compiler", "scheduler", "vyre"]
categories = ["compilers", "algorithms"]
documentation = "https://docs.rs/vyre-self-substrate"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["optimizer"]
optimizer = ["vyre-primitives/graph"]
analysis = [
    "optimizer",
    "vyre-libs/telemetry",
    "vyre-primitives/effects",
    "vyre-primitives/math",
    "vyre-primitives/types",
]
data = [
    "optimizer",
    "vyre-libs/telemetry",
    "vyre-primitives/matching",
    "vyre-primitives/math",
    "vyre-primitives/nn",
    "vyre-primitives/parsing",
]
graph-solvers = ["optimizer", "vyre-libs/telemetry", "vyre-primitives/math"]
logic = [
    "analysis",
    "vyre-primitives/cat",
    "vyre-primitives/dnnf",
    "vyre-primitives/zx",
]
math-solvers = [
    "optimizer",
    "vyre-libs/telemetry",
    "vyre-primitives/math",
    "vyre-primitives/topology",
]
scheduling = [
    "optimizer",
    "vyre-libs/telemetry",
    "vyre-primitives/math",
    "vyre-primitives/parsing",
]
all-solvers = [
    "analysis",
    "data",
    "graph-solvers",
    "logic",
    "math-solvers",
    "scheduling",
    "vyre-libs/telemetry",
]
cpu-parity = ["all-solvers", "vyre-primitives/cpu-parity"]

[dependencies]
vyre-foundation.workspace = true
# Host-side dispatch byte marshalling (`vyre_libs::dispatch_buffers`). The
# target DAG puts the composition library below the pass engine.
vyre-libs.workspace = true
vyre-primitives = { workspace = true }
tracing.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
vyre-test-support.workspace = true
# Parity tests import the vyre-primitives CPU reference oracles (quantized *_cpu),
# gated behind `cpu-parity`. Enable it for this crate's own test/bench builds only
# (resolver 2 keeps it out of production builds of dependents).
vyre-primitives = { path = "../vyre-primitives", features = ["cpu-parity"], default-features = false }
vyre-reference = { path = "../vyre-reference" }
# `vyre_libs::test_support` program-sequence helper, gated the same way as the
# primitives oracles above: dev builds only.
vyre-libs = { workspace = true, features = ["test-fixtures"] }
proptest.workspace = true

[[test]]
name = "sweep_graph_cpu_oracle_matrix"
path = "tests/sweep_graph_cpu_oracle_matrix.rs"
required-features = ["cpu-parity"]

