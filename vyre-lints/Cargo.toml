[package]
name = "vyre-lints"
version = "0.7.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Lego-block enforcement lints for vyre. Forbids raw IR construction in dialect crates."
repository = "https://github.com/santhreal/vyre"
homepage = "https://santh.dev/vyre/"
documentation = "https://docs.rs/vyre-lints"
readme = "README.md"
categories = ["development-tools", "compilers"]
keywords = ["vyre", "lint", "ir", "compiler"]

[lints]
workspace = true

[[bin]]
name = "vyre-lints"
path = "src/main.rs"

[lib]
name = "vyre_lints"
path = "src/lib.rs"

[dependencies]
syn = { workspace = true, features = ["full", "visit", "extra-traits"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
walkdir = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
vyre-test-support.workspace = true
# `vyre` appears only inside the fixture source text these tests feed to the
# linter, never as a compiled call, so it is not a dependency of this crate.
vyre-foundation = { path = "../vyre-foundation" }
tempfile = { workspace = true }
