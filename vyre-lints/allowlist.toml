# Default configuration for the `raw_ir_in_libs` lint this crate ships.
#
# The lint forbids `Node::*` and `Expr::*` construction under a measured root.
# `measured_roots` names those trees and each `exempt_files` entry exempts one
# workspace-relative path.
#
# No workspace gate reads this file. The vyre composition policy defines a
# Category A operation as a composition built over existing `Expr` and `Node`
# variants and places every one of them in `vyre-libs`, so the rule forbids what
# that crate exists to do; reinvention of a registered shape is judged by the
# composition audit instead. The lint stays because a consumer whose library
# layer composes and never constructs can hold itself to it.
#
# Regenerate the exemption set from a tree by running:
#   cargo run -p vyre-lints --release -- --workspace-root . --format json
# and capturing every currently-violating file.
#
# A row is keyed on a path, so a row whose file was renamed or split exempts
# nothing. Point it at the new path or delete it; a test in `src/allowlist.rs`
# fails on a row that names no file.

measured_roots = [
  "vyre-libs/src",
]

