[package]
name = "xtask"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Workspace structural verifier, duplication scanner, coverage pruner, and IR debugger."
publish = false
default-run = "xtask"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "prune_coverage_objects"
path = "src/bin/prune_coverage_objects.rs"

[[bin]]
name = "vyre-dbg"
path = "src/bin/vyre_dbg.rs"
required-features = ["debug"]

[package.metadata.vyre]
publication_class = "conformance-tooling"

[lints]
workspace = true

[features]
default = []
debug = [
    "dep:vyre",
    "dep:vyre-foundation",
    "dep:vyre-compiler",
    "dep:vyre-emit",
    "dep:vyre-libs",
    "dep:vyre-test-support",
    "dep:naga",
    "dep:bincode",
    "dep:clap",
    "dep:assert_cmd",
    "dep:predicates",
]

[dependencies]
blake3.workspace = true
sha2.workspace = true
toml.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
walkdir.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Optional compiler-linking diagnostics (`--features debug`, `vyre-dbg`, `debug_tests`).
vyre = { workspace = true, optional = true }
vyre-foundation = { workspace = true, optional = true }
vyre-compiler = { workspace = true, features = ["test-fixtures"], optional = true }
vyre-emit = { workspace = true, features = ["naga"], optional = true }
vyre-libs = { workspace = true, features = ["python-parser"], optional = true }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"], optional = true }
naga = { workspace = true, features = ["wgsl-out"], optional = true }
bincode = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
assert_cmd = { workspace = true, optional = true }
predicates = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[[test]]
name = "workspace_root_follows_the_working_directory"
path = "tests/workspace_root_follows_the_working_directory.rs"

[[test]]
name = "debug_tests"
path = "tests/debug_tests.rs"
required-features = ["debug"]
