[package]
name = "vyre"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
description = "GPU compute intermediate representation with a standard operation library"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre"
readme = "README.md"
keywords = ["gpu", "gpgpu", "cuda", "wgsl", "spir-v"]
categories = ["algorithms", "compilers", "hardware-support"]
exclude = ["**/SKILL.md"]

[dependencies]
vyre-driver.workspace = true
vyre-foundation.workspace = true
vyre-megakernel.workspace = true
vyre-runtime.workspace = true
vyre-libs = { workspace = true, features = ["full", "c-parser", "matching-regex"] }
vyre-primitives.workspace = true
vyre-driver-cuda = { workspace = true, optional = true }
vyre-driver-wgpu = { workspace = true, optional = true }
bytemuck.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
vyre-test-support.workspace = true
proptest.workspace = true

[build-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
cuda = ["dep:vyre-driver-cuda"]
wgpu = ["dep:vyre-driver-wgpu"]
cpu-parity = []

[lints]
workspace = true
