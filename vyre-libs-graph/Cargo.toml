[package]
name = "vyre-libs-graph"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Graph algorithms, CSR traversal, AST walks, dominator trees, and topological sort"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-graph"

[package.metadata.vyre]
publication_class = "extension-sdk"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["graph"]
graph = []
topology = ["graph"]
graph-dispatch = ["graph"]
dense-reachability = ["graph"]
impact-mask = ["graph"]
interactive-graphics = ["graph", "dep:vyre-libs-visual", "vyre-libs-visual?/visual"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-bitset = { workspace = true }
vyre-libs-reduce = { workspace = true }
vyre-libs-fixpoint = { workspace = true }
vyre-libs-math = { workspace = true }
vyre-libs-hash = { workspace = true }
vyre-libs-visual = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
vyre-driver-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
