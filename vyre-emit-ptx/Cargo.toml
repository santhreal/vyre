[package]
name = "vyre-emit-ptx"
version = "0.8.0"
autotests = false
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PTX text emitter for vyre KernelDescriptor. Produces NVRTC-compatible CUDA assembly."
readme = "README.md"
repository = "https://github.com/santhreal/vyre"
homepage = "https://santh.dev/vyre/"
documentation = "https://docs.rs/vyre-emit-ptx"
categories = ["compilers", "hardware-support"]
keywords = ["vyre", "ptx", "cuda", "shader"]

[package.metadata.cargo-machete]
ignored = ["vyre-spec"]

[lints]
workspace = true

[lib]
name = "vyre_emit_ptx"
path = "src/lib.rs"

[dependencies]
vyre-foundation = { workspace = true }
vyre-lower = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }

# build.rs stamps a digest of this package's own source; the walk, the hash, and
# the rerun triggers live in vyre-foundation so the two emitter build scripts
# read one implementation.
[build-dependencies]
vyre-foundation.workspace = true

[features]
default = []
nvrtc = []

[dev-dependencies]
vyre-lower = { workspace = true, features = ["test-fixtures"] }
vyre-test-support.workspace = true
# `vyre_test_support::spec_variant_tables`, shared by every suite that needs the
# frozen operator variant space, names `vyre_spec` directly.
vyre-spec.workspace = true
vyre-emit-naga = { path = "../vyre-emit-naga" }
naga = { workspace = true }
cudarc = { workspace = true }
proptest.workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
