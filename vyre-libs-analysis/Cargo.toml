[package]
name = "vyre-libs-analysis"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiler-internal static analysis, cost models, dataflow fixpoint, and diagnostics"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-analysis"

[package.metadata.vyre]
publication_class = "internal-engine"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["analysis"]
analysis = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-device = { workspace = true }
vyre-libs-math = { workspace = true }
vyre-libs-graph = { workspace = true, features = ["analysis"] }
vyre-libs-fixpoint = { workspace = true }

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
vyre-reference = { workspace = true }
# The routed convergence wrapper here is checked against the one shared routing
# contract, which the crate that owns the routing exposes as test material.
vyre-libs-fixpoint = { workspace = true, features = ["test-fixtures"] }
# The provenance parity suite compares this crate's dataflow against the
# encoding compositions it is derived from.
vyre-libs-encoding = { workspace = true }
# The cost-model and semiring suites score against the reference executor.
vyre-driver-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
