[package]
name = "vyre"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
description = "GPU compute intermediate representation with a standard operation library"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre"
readme = "README.md"
keywords = ["gpu", "gpgpu", "cuda", "wgsl", "spir-v"]
categories = ["algorithms", "compilers", "hardware-support"]
exclude = ["**/SKILL.md"]

[dependencies]
vyre-driver.workspace = true
vyre-foundation.workspace = true
vyre-spec.workspace = true
vyre-megakernel.workspace = true
vyre-runtime.workspace = true
vyre-driver-cuda = { workspace = true, optional = true }
vyre-driver-wgpu = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true
vyre-libs = { workspace = true }
# The run-time checkout-root resolver the facade contracts locate their sources
# with. Default features are empty, so this joins no compiler crate to the dev
# graph that is not already a dependency.
vyre-test-support = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.vyre]
publication_class = "stable-consumer-sdk"
publication_contract = "consumer-seam:vyre-graphics-app"
[features]
default = []
cuda = ["dep:vyre-driver-cuda"]
wgpu = ["dep:vyre-driver-wgpu"]
cpu-parity = []

[lints]
workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
