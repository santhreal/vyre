# A consumer package is deliberately outside the compiler workspace, so cargo
# must stop looking for one here. Without this table it walks up past the
# checkout and adopts whatever workspace contains the directory the tree was
# placed in, which fails the build in any nested checkout.
[workspace]

[package]
name = "vyre-model-compiler"
version = "0.1.0"
edition = "2021"
description = "Downstream model-compiler package consuming neutral Vyre IR compositions"
publish = false

[dependencies]
vyre = { path = "../../vyre", default-features = false }
vyre-libs = { path = "../../vyre-libs", default-features = false, features = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe", "nn-inference", "math-scan", "reduce", "graph"] }
vyre-safetensors = { path = "../../vyre-safetensors" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
blake3 = { version = "=1.8.5", features = ["pure"] }
vyre-driver-reference = { path = "../../vyre-driver-reference" }
