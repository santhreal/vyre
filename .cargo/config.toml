[build]
jobs = 16

[env]
PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1"

# No checkout-identifying variable is declared here on purpose. Cargo hashes a
# workspace member by its path relative to the workspace root and checks
# freshness by mtime, so two checkouts sharing one target directory compute the
# same unit hash and hand each other compiled binaries. A `VYRE_CHECKOUT_ROOT`
# with `relative = true` was supposed to break that tie through `env!` and each
# crate's dep-info, and it did not: cargo does not export such a variable to the
# process it runs, so every gate fell through to its compiled-in value and the
# shared `xtask` binary reported a worktree's numbers as this tree's. The gates
# resolve the root from the working directory at run time instead, which is
# correct whichever binary cargo reuses.

[alias]
xtask = "run -p xtask --bin xtask --"
check-vyre = "run -p xtask --bin xtask -- abstraction-gate"
