[build]
jobs = 16

[env]
PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1"
# Absolute path of this checkout, and the one cache-key input that tells two
# checkouts apart.
#
# Cargo hashes a workspace member by its path *relative* to the workspace root
# and checks freshness by mtime, so two checkouts of this repository that share
# one target directory compute the same unit hash, address the same artifacts,
# and hand each other compiled logic whenever the reader's files are older than
# the last build. A gate crate reads the working tree and reports a number, so
# a reused gate binary reports another checkout's tree with no sign that it did.
#
# `relative = true` resolves the value against the directory holding this file,
# giving a different absolute path per checkout. Every crate whose output
# describes the tree reads it with `env!`, which records the value in that
# crate's dep-info: cargo then rebuilds instead of reusing across checkouts.
# `force = true` keeps a value inherited from a cargo running in a different
# checkout from winning over this one.
VYRE_CHECKOUT_ROOT = { value = "", relative = true, force = true }

[alias]
xtask = "run -p xtask --bin xtask --"
check-vyre = "run -p xtask --bin xtask -- abstraction-gate"
