[package]
name = "vyre-driver"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Driver layer: registry, runtime, pipeline, routing, diagnostics. Substrate-agnostic backend machinery. Part of the vyre GPU compiler."
readme = "README.md"
keywords = ["gpu", "compiler", "runtime", "registry", "vyre"]
categories = ["compilers", "hardware-support", "api-bindings"]
documentation = "https://docs.rs/vyre-driver"
exclude = ["**/SKILL.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Cache invalidation and substrate telemetry, implemented as vyre-libs
# compositions. Without it those two entry points fail closed rather than fall
# back to a reference path. Named `self-substrate-adapters` until the crate it
# was named for, vyre-self-substrate, became vyre-pass-engine; the feature
# never depended on that crate, so the name described nothing.
libs-compositions = [
    "dep:vyre-libs",
    "vyre-libs/encoding",
    "vyre-libs/reasoning",
    "vyre-libs/telemetry",
    "vyre-libs/analysis",
]

# Elementwise parity-gate scaffolding, used only by the concrete driver crates'
# tests. Off by default so a published build does not carry test scaffolding.
test-fixtures = []

[dependencies]
vyre-foundation = { workspace = true }
vyre-megakernel = { workspace = true }
vyre-libs = { workspace = true, optional = true }
vyre-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
blake3.workspace = true
bytemuck.workspace = true
inventory.workspace = true
toml.workspace = true
dashmap.workspace = true
fs2.workspace = true

[package.metadata.vyre]
publication_class = "extension-sdk"

[lints]
workspace = true

[dev-dependencies]
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
# integration tests/benches assert against these crates' public APIs
vyre = { path = "../vyre", default-features = false }
vyre-driver-reference = { path = "../vyre-driver-reference" }
vyre-reference = { path = "../vyre-reference" }
vyre-primitives = { path = "../vyre-primitives", features = ["hardware"] }
tempfile.workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[[test]]
name = "backend_registry_duplicate_provider"
path = "tests/backend_registry_duplicate_provider.rs"

[[test]]
name = "gap_duplicate_op_id"
path = "tests/gap_duplicate_op_id.rs"

[[test]]
name = "backend_registry"
path = "tests/backend_registry.rs"

[[test]]
name = "reference_oracle_is_never_implicit"
path = "tests/reference_oracle_is_never_implicit.rs"

[[test]]
name = "all_tests_libs_compositions"
path = "tests/all_tests_libs_compositions.rs"
required-features = ["libs-compositions"]
