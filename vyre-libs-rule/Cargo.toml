[package]
name = "vyre-libs-rule"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Detection rule engine conditions, formulas, and program evaluation builders"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-rule"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[package.metadata.vyre]
publication_class = "extension-sdk"
publication_contract = "closure:vyre-libs"

[lints]
workspace = true

[features]
default = ["rule"]
rule = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
thiserror.workspace = true
vyre-libs-builder = { workspace = true }

[dev-dependencies]
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-reference = { workspace = true }
vyre-test-support = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
