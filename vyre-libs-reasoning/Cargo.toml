[package]
name = "vyre-libs-reasoning"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiler-internal logic, causal reasoning, categorical rewrites, and knowledge compilation"
readme = "README.md"
documentation = "https://docs.rs/vyre-libs-reasoning"

[package.metadata.vyre]
publication_class = "internal-engine"

[lints]
workspace = true

[features]
default = ["reasoning"]
reasoning = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
vyre-libs-builder = { workspace = true }
vyre-libs-graph = { workspace = true, features = ["reasoning"] }
vyre-libs-analysis = { workspace = true }

[dev-dependencies]
proptest.workspace = true
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
vyre-reference = { workspace = true }
vyre-driver-reference = { workspace = true }

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
