# Workspace members are listed explicitly. New crates must be added
# below by name. Globs (e.g. "vyre-*") are not used so that each
# addition is a reviewable change.
[workspace]
resolver = "2"
members = [
    "vyre",
    "vyre-foundation",
    "vyre-megakernel",
    "vyre-driver",
    "vyre-driver-metal",
    "vyre-driver-wgpu",
    "vyre-driver-spirv",
    "vyre-driver-cuda",
    "vyre-driver-reference",
    # Sole owner of the inventory registry link anchors and the per-source floor
    # every registry read is judged against. It is the one crate that names the
    # registration-submitting crates, so a consumer reads a registry through it
    # instead of naming those crates with imports that reference nothing.
    "vyre-registry-link",
    "vyre-reference",
    "vyre-spec",
    "vyre-macros",
    # Tier 2.5 LEGO substrate lives under vyre-primitives/src/<domain>/
    # feature-gated per domain. See docs/lego-block-rule.md.
    "vyre-primitives",
    "vyre-test-support",
    # Executes the optimizer's own passes as Vyre Programs. Sits between
    # vyre-primitives and vyre-driver.
    "vyre-pass-engine",
    "conform/vyre-conform-spec",
    "conform/vyre-conform",
    "xtask",
    # The two xtask crates that link vyre. `xtask` builds and runs one of these
    # on demand for the subcommands that must observe the live operation
    # registry or a measured benchmark probe, so a source edit no longer
    # rebuilds the compiler before a text-reading gate can run.
    "xtask-registry",
    "xtask-evidence",
    # Workspace structural gate. Depends on no vyre crate on purpose: it reads
    # source text so it still runs while the workspace does not compile.
    "structure-gate",
    "vyre-runtime",
    "vyre-safetensors",
    "vyre-libs",
    "vyre-aot",
    "vyre-bench",
    "vyre-lints",
    "vyre-lower",
    "vyre-emit-naga",
    "vyre-emit-ptx",
    "vyre-emit-spirv",
    "vyre-emit-metal",
    "vyre-debug",
]

exclude = [
    "examples/external_backend_extension",
    "examples/external_ir_extension",
    "examples/libs-template",
    "vyre-foundation/fuzz",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/vyre"
homepage = "https://santh.dev"

[workspace.lints.clippy]
cast_lossless = "allow"
cast_possible_truncation = "allow"
# BackendError intentionally carries context strings for actionable `Fix:`
# messages. Boxing the error would hide the message from callers.
result_large_err = "allow"
# QuantizationScale's public PerTensor/PerAxis/PerGroup variants encode the
# scaling scope and cannot be renamed without breaking the published API.
enum_variant_names = "allow"
# Chained closures in adapter pipelines (e.g. `.map(|e| e.to_string())`)
# are clearer than the turbofished method-reference alternative.
redundant_closure = "allow"
# `&Option<T>` in internal APIs matches the storage layout and avoids
# gratuitous re-wrapping at every call site.
ref_option = "allow"
# Explicit match arms are preferred over matches!() for readability when
# the match body documents the pattern contract.
match_like_matches_macro = "allow"
# `x >= lo && x <= hi` reads naturally in bound-check contexts.
manual_range_contains = "allow"
# Nested matches are clearer than flattened alternatives when the outer
# match documents a type-level dispatch and the inner match documents a
# value-level refinement.
collapsible_match = "allow"
# `&*x` / `&expr` style borrows are preferred when they clarify ownership
# transfer intent at the call site.
needless_borrow = "allow"
# `bool::then(|| expr)` vs `if b { Some(expr) } else { None }`  -  both are
# fine; suppressing noise on existing code.
unnecessary_lazy_evaluations = "allow"
# Enum variants intentionally carry rich context for diagnostics.
large_enum_variant = "allow"
# Numeric kernel code uses explicit index-variable loops for symmetry with
# the GPU shader version; iterator-based rewrites break the 1:1 correspondence.
needless_range_loop = "allow"
# `(n + d - 1) / d` is the standard GPU rounding idiom and reads better
# than `n.div_ceil(d)` in kernel dimension calculations.
manual_div_ceil = "allow"
# Collapsible if-else chains are kept expanded when they document separate
# semantic conditions at different abstraction levels.
collapsible_if = "allow"
# Doc-comment continuation lines are formatted for readability, not
# mechanical indentation rules.
doc_lazy_continuation = "allow"
# `#[must_use]` on functions returning `#[must_use]` types is intentional
# documentation that callers must not discard the value.
double_must_use = "allow"
# GPU kernel dispatch functions naturally pass buffer, config, device,
# queue, pipeline, layout, etc.  -  8-9 args is normal for the domain.
too_many_arguments = "allow"
# Boolean expressions in condition-check code are written for domain clarity,
# not mechanical minimality.
nonminimal_bool = "allow"
# Default impls with domain-meaningful values are more readable inline.
derivable_impls = "allow"
# Documentation list indentation is controlled by the doc system, not
# mechanical clippy rules.
doc_overindented_list_items = "allow"
# Closures in option/result chains are kept explicit for readability.
option_map_or_none = "allow"
unnecessary_map_on_constructor = "allow"
map_identity = "allow"
manual_map = "allow"
# Explicit if-chains are preferred over match in condition-heavy control flow.
if_same_then_else = "allow"
comparison_chain = "allow"
# `vec![0; n]` vs `vec![0_u8; n]`  -  both fine, existing code uses the short form.
slow_vector_initialization = "allow"
# `.entry()` API is not always clearer than contains_key + insert.
map_entry = "allow"
# Explicit lifetimes kept for clarity in trait impls.
needless_lifetimes = "allow"
# `Vec::with_capacity` + push is preferred for readability in some paths.
vec_init_then_push = "allow"
# Field-level assignment after Default::default() is used for partial init.
field_reassign_with_default = "allow"
# Matrix-style `[r * cols + c]` indexing in tests intentionally writes the
# zero-row term as `0 * cols + c` for visual symmetry with the non-zero rows;
# erasing/identity_op flag those as bugs even though the convention matches
# the rest of the row enumeration. Allowing both at the workspace level keeps
# the math substrate tests readable without per-module suppressions.
# `and_then(|x| Some(...))` kept explicit in chained option transforms.
bind_instead_of_map = "allow"
# Borrowed expression can be elided but is kept for type clarity.
needless_borrows_for_generic_args = "allow"
# Match-to-let rewrites lose readability in pattern-matching-heavy code.
match_single_binding = "allow"
# Explicit `size_of::<T>() * n` is clearer than `size_of_val` in GPU buffer sizing.
manual_slice_size_calculation = "allow"
# `CStr::from_bytes_with_nul(b"...\0")` is the established pattern in Vulkan FFI code.
manual_c_str_literals = "allow"
erasing_op = "allow"
identity_op = "allow"
# Entries below arrived from crate-root `#![allow(...)]` blankets, one per
# crate, that this table now owns. Only lints that warn by default were
# promoted: the pedantic and restriction names those blankets also listed were
# inert, because no member enables those groups, and a suppression of a lint
# nothing raises reads as a rule.
# A module reached from two parents is how a shared contract-case body is
# compiled by two targets.
duplicate_mod = "allow"
# Generated operation wrappers replay the derive attributes of what they wrap.
duplicated_attributes = "allow"
# `mod x` inside `x.rs` is the module layout every dialect and sub-dialect uses.
module_inception = "allow"
# GPU buffer layout types (bind-group slot tuples) are inherently complex.
type_complexity = "allow"
# Internal helpers with stdlib-adjacent names read better than a trait impl
# nobody calls through the trait.
should_implement_trait = "allow"
# Explicit clones on Copy values document ownership intent in serial layers.
clone_on_copy = "allow"
# A recursion parameter carried for the recursive call only is the shape of
# every IR walk in the tree.
only_used_in_recursion = "allow"
# `Result<T, ()>` keeps a fallible internal API forward-compatible with the
# error type it will carry.
result_unit_err = "allow"
# `&Vec<T>` in an internal signature matches the storage the caller holds.
ptr_arg = "allow"
# A contract-case module sits at the end of the file it tests, after the items
# it drives.
items_after_test_module = "allow"
# Asserting a constant is how a shape contract is pinned beside the constant.
assertions_on_constants = "allow"
# Predicate-heavy admission checks are written for domain clarity.
overly_complex_bool_expr = "allow"
filter_map_bool_then = "allow"
# `push_str` with a one-character literal keeps emitters symmetric with their
# multi-character neighbours.
single_char_add_str = "allow"
# `for x in it { if let Some(y) = x }` documents the two conditions separately.
manual_flatten = "allow"
explicit_counter_loop = "allow"
# `x.max(lo).min(hi)` keeps the bound order visible in dimension math.
manual_clamp = "allow"
# A blank line between a doc comment and its item separates prose from code.
empty_line_after_doc_comments = "allow"
# A named binding before the tail expression documents what is returned.
let_and_return = "allow"
# An FFI wrapper's safety contract is stated at the call site, beside the
# invariant, rather than in a section on the wrapper.
missing_safety_doc = "allow"

[workspace.lints.rust]
# `drop(perf_scope.finish())` documents measurement lifecycle intent. This is
# a rustc lint, not a Clippy lint, on the supported toolchain.
dropping_copy_types = "allow"
# Unknown feature cfgs delete code silently. Deny them instead of accepting
# warning-only builds whose source and compiled feature surfaces disagree.
unexpected_cfgs = "deny"
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
# WIP modules have staged variables/methods for upcoming passes.
unused_variables = "allow"
dead_code = "allow"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

# Workspace-level dependency declarations. Internal members use path +
# version (the `version` is required so a published crate can resolve its
# workspace siblings from crates.io after publication).
[workspace.dependencies]
vyre = { version = "0.8.0", path = "vyre", default-features = false }
vyre-foundation = { version = "0.8.0", path = "vyre-foundation" }
vyre-megakernel = { version = "0.8.0", path = "vyre-megakernel" }
vyre-driver = { version = "0.8.0", path = "vyre-driver" }
vyre-driver-metal = { version = "0.8.0", path = "vyre-driver-metal" }
vyre-driver-wgpu = { version = "0.8.0", path = "vyre-driver-wgpu" }
vyre-driver-cuda = { version = "0.8.0", path = "vyre-driver-cuda" }
vyre-driver-reference = { version = "0.8.0", path = "vyre-driver-reference" }
vyre-driver-spirv = { version = "0.8.0", path = "vyre-driver-spirv" }
# publish = false, so no version.
vyre-registry-link = { path = "vyre-registry-link", default-features = false }
vyre-reference = { version = "0.8.0", path = "vyre-reference" }
vyre-spec = { version = "0.8.0", path = "vyre-spec" }
vyre-macros = { version = "0.8.0", path = "vyre-macros" }
vyre-primitives = { version = "0.8.0", path = "vyre-primitives", default-features = false }
# Dev-only shared harness (publish = false). PATH-ONLY (no version): cargo strips
# path-only dev-deps at publish, so this never joins/blocks the publish train.
vyre-test-support = { path = "vyre-test-support" }
vyre-runtime = { version = "0.8.0", path = "vyre-runtime" }
vyre-safetensors = { version = "0.8.0", path = "vyre-safetensors" }
vyre-libs = { version = "0.8.0", path = "vyre-libs" }
vyre-pass-engine = { version = "0.8.0", path = "vyre-pass-engine" }
vyre-aot = { version = "0.8.0", path = "vyre-aot" }
# publish = false, so no version: a version requirement here is one a registry
# can never satisfy, and any member writing `workspace = true` inherits it.
vyre-bench = { path = "vyre-bench" }
vyre-conform = { path = "conform/vyre-conform", default-features = false }
vyre-lower = { version = "0.8.0", path = "vyre-lower" }
vyre-emit-naga = { version = "0.8.0", path = "vyre-emit-naga" }
vyre-emit-ptx = { version = "0.8.0", path = "vyre-emit-ptx" }
vyre-emit-spirv = { version = "0.8.0", path = "vyre-emit-spirv" }
vyre-emit-metal = { version = "0.8.0", path = "vyre-emit-metal" }
vyre-lints = { version = "0.8.0", path = "vyre-lints" }
vyre-debug = { version = "0.8.0", path = "vyre-debug" }
vyre-conform-spec = { path = "conform/vyre-conform-spec" }

# Shared third-party pins; every member agrees on versions.
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "=2.0.19"
tracing = "=0.1.44"
tempfile = "=3.27.0"
proptest = "=1.11.0"
rand = { version = "=0.10.2", features = ["std", "std_rng"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
tokio = { version = "=1.53.1", features = ["rt", "fs", "time"] }
wgpu = { version = "=25.0.2", features = ["wgsl", "naga-ir"] }
metal = "=0.31.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
naga = { version = ">=25.0.0, <26.0.0", features = ["wgsl-in", "wgsl-out", "spv-out", "msl-out"] }
object = { version = "=0.39.1", default-features = false }
ash = "=0.38.0"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.117", features = ["full", "visit", "visit-mut"] }
walkdir = "=2.5.0"
toml = "=1.1.3"
aho-corasick = "=1.1.4"
faer = { version = "=0.24.4", default-features = false, features = ["std", "rayon"] }
memchr = "=2.8.3"
regex-syntax = "=0.8.11"
# `pure` keeps blake3's C and assembly out of the build entirely. Its build
# script picks a native path off the target triple - `c/blake3_neon.c` on
# aarch64, `c/blake3_*_x86-64_unix.S` on x86_64 - and compiles it with the host
# `cc`, so cross-compiling to any Apple or Windows target from Linux needed that
# target's C toolchain. `no_neon` alone silenced only the aarch64 arm, which made
# aarch64-apple-darwin and aarch64-apple-ios compile while x86_64-apple-darwin
# and x86_64-pc-windows-msvc still failed on the identical mechanism, and hid
# that they were failing. Every blake3 call here hashes program identity, cache
# keys, and label/value fields - kilobytes of already canonical bytes on the host
# compile path, never a device path and never bulk data - so the portable Rust
# backend is not on any measured hot path, and a product graph that needs no C
# compiler is what makes every declared target actually buildable.
blake3 = { version = "=1.8.5", features = ["pure"] }
sha2 = "=0.11.0"
percent-encoding = "=2.3.2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
rustc-hash = "=2.1.3"
# imbl is the maintained fork of im. im 15.1.0 carries RUSTSEC-2026-0248
# (unmaintained) and pulls bitmaps 2.1.0 with RUSTSEC-2026-0247, and im's OrdSet
# has an aliasing-violation advisory, RUSTSEC-2023-0126. The persistent HashSet
# is what the DCE live set needs, so the fork replaces it rather than a std set
# that would clone the whole set at every branch.
imbl = "=7.0.1"
rayon = "=1.12.0"
wide = "=0.7.33"
hex = "=0.4.3"
clap = { version = "=4.6.4", features = ["derive"] }
fs2 = "=0.4.3"
stats_alloc = "=0.1.10"
loom = "=0.7.2"
regex = "=1.13.1"
regex-automata = "=0.4.16"
hashbrown = "=0.17.1"
pcre2 = "=0.2.11"
openssl = "=0.10.81"
fnv = "=1.0.7"
rustc_lexer = "=0.1.0"
criterion = { version = "=0.8.2", features = ["html_reports"] }
bumpalo = "=3.20.3"
inventory = "=0.3.24"
quote = "=1.0.47"
smallvec = { version = "^1.15.1", features = ["serde"] }
crossbeam-channel = "=0.5.16"
libm = "=0.2.16"
dashmap = "=6.2.1"
tracing-subscriber = "=0.3.23"
arc-swap = "=1.9.1"
crossbeam-queue = "=0.3.12"
crc32fast = "=1.5.0"
bincode = { version = "=2.0.1", features = ["serde"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
cudarc = { version = "=0.19.0", default-features = false, features = ["driver", "runtime", "std", "nvrtc", "dynamic-loading", "cuda-12000"] }
ureq = "=3.3.0"
libc = { version = "=0.2.186", default-features = false }
brotli = "=8.0.2"
lzma-rs = "=0.3.0"
lasso = { version = "=0.7.3", features = ["multi-threaded"] }
itoa = "=1.0.18"
ryu = "=1.0.23"
arrayvec = "=0.7.6"
anyhow = "=1.0.104"
tree-sitter = "=0.26.9"
tree-sitter-c = "=0.24.2"
tree-sitter-go = "=0.25.0"
trybuild = "=1.0.116"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
env_logger = "=0.11.10"
core_affinity = "=0.8.3"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
# Incremental is OFF deliberately. Worktrees and agents build the same crates
# under different absolute paths and different feature permutations, so
# incremental state is never re-read: it grew debug/deps to 1.1T and produced a
# measured 0.00% hit rate on 1310 cached compile requests. It is also what
# makes any shared compilation cache impossible, because rustc refuses to
# emit a cacheable artifact under -C incremental.
incremental = false
# Backtraces need line tables, not full DWARF. Cuts rlib bytes and link time.
debug = "line-tables-only"
split-debuginfo = "unpacked"
