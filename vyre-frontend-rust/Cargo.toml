[package]
name = "vyre-frontend-rust"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

description = "Rust source-to-typed-IR frontend for Vyre."
keywords = ["rust", "compiler", "ir", "vyre", "parser"]
categories = ["compilers", "development-tools"]

[dependencies]
vyre-foundation = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
vyre-reference = { path = "../vyre-reference" }
# CPU oracle: the official rustc lexer. Test-only differential against the
# reusable Rust lexer substrate; not a runtime dependency of the frontend.
rustc_lexer = { workspace = true }
vyre-test-support = { workspace = true }

[lints]
workspace = true
