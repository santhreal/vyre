[package]
name = "vyre-aot"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vyre-aot"
description = "Ahead-of-time compilation for vyre Programs: emits target-native bytes plus a self-contained launcher bundle suitable for embedded and competition-style code-budget-constrained submissions."
readme = "README.md"
keywords = ["vyre", "gpu", "aot", "compiler"]
categories = ["compilers", "hardware-support"]

[lints]
workspace = true

[dependencies]
vyre-foundation.workspace = true
vyre-driver.workspace = true
vyre-megakernel.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
blake3.workspace = true
brotli.workspace = true
lzma-rs.workspace = true

[features]
default = []
ptx = []

[dev-dependencies]
vyre-lower.workspace = true
tempfile.workspace = true
inventory.workspace = true
# Used through the shared `tests/support/artifact_fixtures.rs` include, which
# the unused-dependency audit cannot follow out of this directory.
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }

[package.metadata.cargo-machete]
ignored = ["vyre-test-support"]
