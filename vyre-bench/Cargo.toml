[package]
name = "vyre-bench"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal vyre benchmark + parity harness across the CUDA, wgpu, SPIR-V, and reference substrates. Not published to crates.io."
publish = false

[dependencies]
vyre = { workspace = true }
vyre-foundation = { workspace = true }
vyre-driver = { workspace = true }
vyre-driver-wgpu = { workspace = true }
# Every driver crate is linked through this owner, which asserts that each one
# reached the backend registry. Benchmarks report the linked dispatch set, so a
# driver dropped at link time would understate the matrix instead of failing.
vyre-registry-link = { workspace = true, features = [
    "cuda",
    "metal",
    "reference",
    "spirv",
    "wgpu",
] }
vyre-driver-reference = { workspace = true }
vyre-reference = { workspace = true }
vyre-runtime = { workspace = true }
# vyre-libs provides domain Program builders for benchmarks and verification.
vyre-libs = { workspace = true, features = [
    "bitset",
    "graph",
    "nn-linear-4bit",
    "predicate",
] }
vyre-primitives = { workspace = true, features = ["hardware"] }
vyre-lower = { workspace = true }
vyre-emit-ptx = { workspace = true }
vyre-spec = { workspace = true }
# The source fingerprint every recorded artifact names its tree with has one
# producer, and it is the crate that links no vyre crate so it still identifies a
# checkout while the workspace does not compile.
xtask = { path = "../xtask" }
blake3 = { workspace = true }

aho-corasick = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }
toml = { workspace = true }
inventory = { workspace = true }
hashbrown = { workspace = true }
pcre2 = { workspace = true }
faer = { workspace = true }
memchr = { workspace = true }
rayon = { workspace = true }
wide = { workspace = true }
anyhow = { workspace = true }
rand.workspace = true
env_logger = { workspace = true, optional = true }
rusqlite = { workspace = true }
core_affinity = { workspace = true }
# The AES-CTR CPU baseline names openssl as its comparison crate, so the
# measured library must be the same build on every host that records a result.
# Vendoring pins the C library with the crate instead of resolving whatever the
# host installed, which also removes the system probe that has no answer on
# windows-msvc.
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
vyre-driver-cuda = { workspace = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger"]

[dev-dependencies]
vyre-test-support.workspace = true
criterion = { workspace = true }
proptest = { workspace = true }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-emit-spirv = { path = "../vyre-emit-spirv" }
syn.workspace = true
tempfile.workspace = true

[[bin]]
name = "vyre-bench"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "release"
harness = false

[lints]
workspace = true

[[test]]
name = "release_matrix_contracts"
path = "tests/release_matrix_contracts/mod.rs"
