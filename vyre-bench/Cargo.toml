[package]
name = "vyre-bench"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal vyre benchmark + parity harness across the CUDA, wgpu, SPIR-V, and reference substrates. Not published to crates.io."
publish = false

[dependencies]
vyre = { workspace = true }
vyre-foundation = { workspace = true }
vyre-driver = { workspace = true }
vyre-driver-wgpu = { workspace = true }
# Every driver crate is linked through this owner, which asserts that each one
# reached the backend registry. Benchmarks report the linked dispatch set, so a
# driver dropped at link time would understate the matrix instead of failing.
vyre-registry-link = { workspace = true, features = [
    "cuda",
    "metal",
    "reference",
    "spirv",
    "wgpu",
] }
vyre-driver-reference = { workspace = true }
vyre-reference = { workspace = true }
vyre-runtime = { workspace = true }
vyre-libs = { workspace = true, features = ["nn-linear-4bit", "c-parser"] }
vyre-primitives = { workspace = true, features = ["bitset", "graph", "cpu-parity", "hardware"] }
vyre-lower = { workspace = true }
vyre-emit-ptx = { workspace = true }
vyre-spec = { workspace = true }
vyre-frontend-rust = { workspace = true }
blake3 = { workspace = true }

aho-corasick = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, optional = true }
toml = { workspace = true }
inventory = { workspace = true }
regex = { workspace = true }
hashbrown = { workspace = true }
pcre2 = { workspace = true }
openssl = { workspace = true }
faer = { workspace = true }
memchr = { workspace = true }
rayon = { workspace = true }
wide = { workspace = true }
anyhow = { workspace = true }
rand.workspace = true
env_logger = { workspace = true, optional = true }
rusqlite = { workspace = true }
core_affinity = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
vyre-driver-cuda = { workspace = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger"]

[dev-dependencies]
vyre-test-support.workspace = true
criterion = { workspace = true }
proptest = { workspace = true }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-emit-spirv = { path = "../vyre-emit-spirv" }
syn.workspace = true
tempfile.workspace = true

[[bin]]
name = "vyre-bench"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "release"
harness = false

[lints]
workspace = true
