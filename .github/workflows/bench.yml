name: Bench

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-bench-setup

      - name: Save baseline from main
        run: |
          set -euo pipefail
          git fetch origin main
          baseline_root="$RUNNER_TEMP/vyre-main"
          mkdir -p "$baseline_root"
          git archive origin/main | tar -x -C "$baseline_root"
          mkdir -p "$baseline_root/vyre-foundation/benches"
          cp -a vyre-foundation/benches/. "$baseline_root/vyre-foundation/benches/"
          if ! grep -q 'name = "optimizer_pipeline"' "$baseline_root/vyre-foundation/Cargo.toml"; then
            printf '\n[[bench]]\nname = "optimizer_pipeline"\nharness = false\n' >> "$baseline_root/vyre-foundation/Cargo.toml"
          fi
          (
            cd "$baseline_root"
            ./cargo_full bench -p vyre-foundation --bench optimizer_pipeline -- --save-baseline main
          )
          mkdir -p target/criterion
          cp -a "$baseline_root/target/criterion/." target/criterion/

      - name: Compare PR against baseline
        run: |
          ./cargo_full bench -p vyre-foundation --bench optimizer_pipeline -- --baseline main 2>&1 | tee bench.log
      - name: Check for regressions > 5%
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'change: \[' bench.log; then
            echo "FAIL: no Criterion comparison lines found; benchmark target is not exercising Criterion"
            exit 1
          fi
          # Criterion prints `change: [lower median upper]`. The gate reads the
          # upper bound of the confidence interval, not the point estimate, so a
          # noisy run has to clear the threshold at its worst credible value.
          changes="$(grep -oE 'change: \[[^]]+\]' bench.log)"
          worst_median="$(printf '%s\n' "$changes" | awk -F'[][% ]+' '{print $3}' | sort -g | tail -1)"
          worst="$(printf '%s\n' "$changes" | awk -F'[][% ]+' '{print $4}' | sort -g | tail -1)"
          echo "Worst median change: ${worst_median}%"
          echo "Worst upper-bound change: ${worst}%"
          awk -v w="$worst" 'BEGIN { if (w+0 > 5) { print "FAIL: criterion regression > 5% at the upper confidence bound (worst " w "%)"; exit 1 } print "PASS: no criterion regressions > 5%" }'
