name: strict-warnings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `check` runs the full rustc analysis phase, which is where every
      # warning is produced, and stops before codegen. Linking is proved by the
      # test lanes; this lane owns warnings.
      - name: Check every crate and target with -D warnings
        run: |
          ./cargo_full check --workspace --all-targets --all-features --locked
      - name: Abstraction gate
        run: |
          ./cargo_full run -p xtask -- abstraction-gate
      - name: Configuration model gate
        run: |
          ./cargo_full run -p xtask -- configuration-model
      - name: Clippy (advisory, never gating)
        continue-on-error: true
        run: |
          ./cargo_full clippy --workspace --all-targets --all-features
      - name: Rustdoc with -D warnings
        run: |
          ./cargo_full doc --workspace --all-features --no-deps
