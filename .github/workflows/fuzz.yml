name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: vyre-foundation/fuzz
            target: decoder
          - crate: vyre-foundation/fuzz
            target: program_wire
          - crate: vyre-foundation/fuzz
            target: registry_toml
          - crate: fuzz
            target: dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz
      - name: Run smoke fuzz
        run: |
          cd ${{ matrix.crate }}
          "${GITHUB_WORKSPACE}/cargo_full" +nightly fuzz run ${{ matrix.target }} --release -- -max_total_time=60
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-smoke-${{ matrix.target }}
          path: ${{ matrix.crate }}/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  ci:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: vyre-foundation/fuzz
            target: decoder
          - crate: vyre-foundation/fuzz
            target: program_wire
          - crate: vyre-foundation/fuzz
            target: registry_toml
          - crate: fuzz
            target: dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz
      - name: Run CI fuzz
        run: |
          cd ${{ matrix.crate }}
          "${GITHUB_WORKSPACE}/cargo_full" +nightly fuzz run ${{ matrix.target }} --release -- -max_total_time=600
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-ci-${{ matrix.target }}
          path: ${{ matrix.crate }}/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
