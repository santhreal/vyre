name: Doc CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Docs
        run: ./scripts/docs.sh
      - name: Validate CLI documentation
        run: ./cargo_full run -p xtask --bin xtask -- cli-docs
