name: Coverage

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COVERAGE_FLOOR_LINES: "85"

jobs:
  llvm-cov:
    name: Workspace Line Coverage (>= 85%)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, gpu, axiomexec]
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
      VYRE_FUSED_CASES: "100"
      VYRE_PRESENCE_CASES: "500"
      VYRE_PRESENCE_GROUND_TRUTH_CASES: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: taiki-e/install-action@nextest

      - name: Measure workspace coverage and enforce 85% line floor
        shell: bash
        run: |
          set -euo pipefail
          ./cargo_full llvm-cov clean --workspace --profraw-only
          gpu_expr="$(./cargo_full metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; pkgs=["package(" + p["name"] + ")" for p in json.load(sys.stdin)["packages"] if p["name"] in {"vyre","vyre-runtime"} or p["name"].startswith("vyre-driver-")]; print(" | ".join(pkgs) if pkgs else "none()")')"
          ./cargo_full llvm-cov nextest --no-report --locked --workspace --all-features \
            --exclude vyre-bench --no-tests=pass --test-threads 16 -E "not ($gpu_expr)"
          ./cargo_full llvm-cov nextest --no-report --locked --workspace --all-features \
            --exclude vyre-bench --no-tests=pass --test-threads 1 -E "$gpu_expr"
          ./cargo_full run -q --locked -p xtask -- prune-coverage-objects
          ./cargo_full llvm-cov report --lcov --output-path lcov.info \
            --fail-under-lines "$COVERAGE_FLOOR_LINES"

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
