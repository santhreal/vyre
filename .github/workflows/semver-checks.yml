name: semver-checks

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          package: vyre-grammar-gen,vyre-macros,vyre-spec,vyre-lints,vyre-foundation,vyre-megakernel,vyre-lower,vyre-emit-ptx,vyre-primitives,vyre-reference,vyre-pass-engine,vyre-driver,vyre-runtime,vyre-emit-naga,vyre-emit-spirv,vyre-emit-metal,vyre-driver-cuda,vyre-driver-wgpu,vyre-driver-metal,vyre-driver-spirv,vyre-driver-reference,vyre-libs,vyre-scan,vyre,vyre-debug,vyre-aot
