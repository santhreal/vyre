name: semver-checks

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: packages
        name: Read the publishable package list from the workspace manifests
        run: |
          packages="$(python3 scripts/public_api_snapshot_inventory.py "$PWD" | cut -d: -f2 | paste -sd,)"
          test -n "$packages" || { echo "Fix: no publishable workspace members found." >&2; exit 2; }
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          package: ${{ steps.packages.outputs.packages }}
