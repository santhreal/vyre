name: architectural-invariants

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-release-gate:
    name: Architecture release gate
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify neutral dependency ownership
        run: bash scripts/check_architectural_invariants.sh

      - name: Verify architecture and documentation authority
        run: python3 scripts/architecture_docs.py . --check

      - name: Verify architecture behavior contracts
        run: ./cargo_full test -p xtask --test tree_contracts

      - name: Verify semantic operation coverage
        run: ./cargo_full run -p xtask -- op-matrix --check
