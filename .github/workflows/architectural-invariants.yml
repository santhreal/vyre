name: architectural-invariants

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-release-gate:
    name: Architecture release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `tree_contracts` drives the public-API snapshot gate, which renders item
      # paths with the rustdoc RUSTDOC_TOOLCHAIN names in
      # xtask/src/gates/public_api.rs. Any job that runs the extraction installs
      # that toolchain and the pinned extractor, or the contract reads a
      # different compiler's rendering as tree drift.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-07
      - name: Install cargo-public-api
        run: cargo +nightly-2026-08-07 install --locked cargo-public-api --version 0.51.0

      # Two rules, one gate module. `neutral-crates` reads the manifests of the
      # named neutral crates directly; `layering` resolves the whole graph and
      # holds every member inside its declared closure.
      - name: Verify neutral dependency ownership
        run: ./cargo_full run -p xtask -- neutral-crates

      - name: Verify the transitive layer closure
        run: ./cargo_full run -p xtask -- layering

      - name: Verify architecture and documentation authority
        run: ./cargo_full run -q -p xtask --bin xtask -- architecture-contract

      - name: Verify every published document reference resolves
        run: ./cargo_full run -q -p xtask --bin xtask -- docs-references

      - name: Verify architecture behavior contracts
        run: ./cargo_full test -p xtask --test tree_contracts

      - name: Verify semantic operation coverage
        run: ./cargo_full run -p xtask -- op-matrix --check
