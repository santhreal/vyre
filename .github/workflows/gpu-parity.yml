name: GPU Parity and Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gpu-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WGPU_BACKEND: vulkan
  VYRE_CONFORM_REQUIRE_GPU: "1"

jobs:
  gpu-parity:
    name: GPU Backend Parity and Megakernel Suite
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, gpu, axiomexec]
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GPU availability
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader

      - name: Run GPU backend device parity and conformance suites
        shell: bash
        run: |
          set -euo pipefail
          meta="$(./cargo_full metadata --format-version 1 --no-deps)"
          device_pkgs="$(printf '%s' "$meta" | python3 -c '
          import json, sys
          for pkg in json.load(sys.stdin)["packages"]:
              if "device-tests" in pkg.get("features", {}) and pkg["name"] != "vyre-bench":
                  print(pkg["name"])
          ')"
          for pkg in $device_pkgs; do
            echo "::group::device-tests $pkg"
            ./cargo_full test --release -p "$pkg" --features device-tests -- --test-threads=1
            echo "::endgroup::"
          done

      - name: Run megakernel benchmark suite smoke verification
        shell: bash
        run: |
          ./cargo_full test --release -p vyre-bench --lib
