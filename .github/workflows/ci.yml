name: CI

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Check, Docs, Structural Rules, Deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - name: Check formatting
        run: ./cargo_full fmt --check

      - name: Run workspace structural checks
        run: ./cargo_full run --locked -p xtask -- check

      - name: Check workspace targets and features with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: ./cargo_full check --workspace --all-targets --all-features --locked

      - name: Build workspace documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: ./cargo_full doc --workspace --all-features --no-deps --locked

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          manifest-path: Cargo.toml

  test:
    name: Workspace Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VYRE_FUSED_CASES: "100"
      VYRE_PRESENCE_CASES: "500"
      VYRE_PRESENCE_GROUND_TRUTH_CASES: "200"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim unused runner SDK disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - name: Run workspace test shard
        run: ./cargo_full nextest run --workspace --exclude vyre-bench --no-fail-fast --no-tests=pass --partition hash:${{ matrix.shard }}/4

  platform:
    name: Cross-Platform Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Configure MSVC developer environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Remove Git coreutils link.exe shadow and select Perl for OpenSSL
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          rm -f "/c/Program Files/Git/usr/bin/link.exe"
          for candidate in \
            /c/Strawberry/perl/bin/perl.exe \
            /c/hostedtoolcache/windows/strawberry-perl/*/x64/perl/bin/perl.exe \
            "$(command -v perl || true)"; do
            [ -x "$candidate" ] || continue
            "$candidate" -MLocale::Maketext::Simple -e 1 >/dev/null 2>&1 || continue
            echo "OPENSSL_SRC_PERL=$(cygpath -w "$candidate")" >> "$GITHUB_ENV"
            echo "CC=cl" >> "$GITHUB_ENV"
            exit 0
          done
          echo "No Perl installation provides Locale::Maketext::Simple" >&2
          exit 1

      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.os }}

      - name: Check workspace targets
        shell: bash
        run: ./cargo_full check --workspace --all-targets --locked

      - name: Run core IR and reference oracle tests
        shell: bash
        run: |
          packages="$(./cargo_full metadata --format-version 1 --no-deps | jq -r '.packages[].name' | tr -d '\r')"
          for candidate in vyre-ir vyre-spec vyre-reference; do
            if printf '%s\n' "$packages" | grep -qx "$candidate"; then
              ./cargo_full test -p "$candidate" --lib
            fi
          done
