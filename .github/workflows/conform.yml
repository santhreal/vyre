name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operation-registry:
    name: Operation registry contract
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify dependency-light conformance schema
        run: ./cargo_full test -p vyre-conform-spec

      - name: Verify semantic operation coverage
        run: ./cargo_full run -p xtask -- op-matrix --check

  conform-cpu:
    name: Vyre conformance CPU
    needs: operation-registry
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify consolidated conformance engine
        run: ./cargo_full test -p vyre-conform

      - name: Verify registered primitive safety contracts
        run: >-
          ./cargo_full test -p vyre-primitives
          --features all-lego,cpu-parity,inventory-registry
          --test registry_oob_clean
          --test generated_graph_oracle_matrix
          --test graph_fixpoint_adversarial_generated
          --test csr_backward_or_changed_ir_fixpoint
          --test graph_builders_emit_valid_ir

      - name: Generate conformance matrix evidence
        run: >-
          ./cargo_full run --bin xtask -- conformance-matrix
          --output release/evidence/conformance/conformance-matrix.json

  conform-release-gate:
    name: Conform release gate
    needs:
      - operation-registry
      - conform-cpu
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required conformance jobs
        shell: bash
        run: |
          if [ "${{ needs.operation-registry.result }}" != "success" ] \
            || [ "${{ needs.conform-cpu.result }}" != "success" ]; then
            echo "::error::A required conformance job failed or did not run."
            exit 1
          fi
          echo "Conform release gate passed."
