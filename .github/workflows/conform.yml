name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operation-registry:
    name: Operation registry contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify dependency-light conformance schema
        run: ./cargo_full test -p vyre-conform-spec

      - name: Verify semantic operation coverage
        run: ./cargo_full run -p xtask -- op-matrix --check

  conform-gpu:
    name: Vyre conformance GPU
    # A public repository never executes fork code on the persistent GPU host.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: operation-registry
    runs-on: [self-hosted, axiomexec, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify consolidated conformance engine
        run: ./cargo_full test -p vyre-conform

      - name: Verify registered primitive safety contracts
        run: >-
          ./cargo_full test -p vyre-primitives
          --features hardware,inventory-registry
          --test registry_oob_clean

      # The graph and fixpoint oracle sweeps moved to vyre-libs with their
      # domains. `graph` is what those targets declare as required-features,
      # and a target whose required feature is absent is skipped without a word,
      # so the selection is named rather than left to the default set.
      - name: Verify graph and fixpoint oracle sweeps
        run: >-
          ./cargo_full test -p vyre-libs
          --features graph
          --test sweep_graph_motif_oracle_matrix
          --test sweep_graph_path_reconstruct_oracle_matrix
          --test sweep_graph_csr_bidirectional_oracle_matrix
          --test sweep_graph_csr_forward_traverse_volume_oracle_matrix
          --test sweep_graph_csr_backward_traverse_volume_oracle_matrix
          --test sweep_graph_reachable_volume_oracle_matrix
          --test sweep_graph_csr_forward_or_changed_volume_oracle_matrix
          --test sweep_graph_persistent_bfs_volume_oracle_matrix
          --test sweep_graph_scc_decompose_volume_oracle_matrix
          --test graph_fixpoint_adversarial_generated
          --test csr_backward_or_changed_ir_fixpoint
          --test graph_builders_emit_valid_ir

      - name: Generate conformance matrix evidence
        run: >-
          ./cargo_full run --bin xtask -- conformance-matrix --write

      - name: Verify conformance matrix evidence is current
        run: git diff --exit-code -- release/evidence/conformance/conformance-matrix.json

  conform-release-gate:
    name: Conform release gate
    needs:
      - operation-registry
      - conform-gpu
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required conformance jobs
        shell: bash
        run: |
          if [ "${{ needs.operation-registry.result }}" != "success" ] \
            || [ "${{ needs.conform-gpu.result }}" != "success" ]; then
            echo "::error::A required conformance job failed or did not run."
            exit 1
          fi
          echo "Conform release gate passed."
