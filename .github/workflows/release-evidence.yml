name: release-evidence

# The evidence generators and the composite pre-publish runners. They either
# write release artifacts or drive full cargo builds, so they are not part of
# the per-change gate sweep. They are still registered, and `xtask gates` fails
# when any of them is not named by a workflow, which is why they are all here.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  evidence:
    name: Generate release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Crate metadata evidence
        run: |
          ./cargo_full run -p xtask -- metadata-matrix --write
          ./cargo_full run -p xtask -- version-matrix --write
          ./cargo_full run -p xtask -- feature-matrix --write
          ./cargo_full run -p xtask -- package-readiness --write

      - name: Backend and workload evidence
        run: |
          ./cargo_full run -p xtask -- backend-matrix --write
          ./cargo_full run -p xtask -- release-workload-matrix --write
          ./cargo_full run -p xtask -- op-matrix --write

      - name: Optimization evidence
        run: |
          ./cargo_full run -p xtask -- optimization-matrix --write
          ./cargo_full run -p xtask -- optimization-corpus --write

      - name: Launch state
        run: ./cargo_full run -p xtask -- launch-state --write

      - name: Structural release evidence
        run: ./cargo_full run -p xtask -- release-evidence --write

  measured-evidence:
    name: Generate measured evidence
    runs-on: [self-hosted, gpu-5090]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Backend conformance artifacts
        run: ./cargo_full run -p xtask -- release-conformance --write

      - name: Release benchmark artifacts
        run: |
          ./cargo_full run -p xtask -- release-benchmarks --backend cuda --measured-samples 30 --write
          ./cargo_full run -p xtask -- release-benchmarks --backend wgpu --measured-samples 30 --write
          ./cargo_full run -p xtask -- bench-release

  prepublish:
    name: Composite pre-publish runners
    runs-on: ubuntu-latest
    needs: [evidence, measured-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Both are descriptor-derived subsets. Each member is held to its pinned
      # finding count exactly as it is in the whole-registry sweep.
      - name: Pre-publish subset
        run: ./cargo_full run -p xtask -- gates --subset prepublish

      - name: Release evidence subset
        run: ./cargo_full run -p xtask -- gates --subset release-evidence
