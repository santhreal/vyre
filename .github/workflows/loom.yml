name: loom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: loom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loom:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run loom tests
        run: |
          # Only run tests named loom_* under cfg loom. The member set is the
          # workspace, not a list: a crate with no loom_ test is a no-op, and a
          # crate that gains one is covered without editing this job.
          ./cargo_full test --workspace --release -- --test-threads=1 loom_
