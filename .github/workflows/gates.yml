name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registered-gates:
    name: Every registered gate
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Runs every subcommand registered as a gate and holds each to the
      # result pinned in xtask/gate-baselines.toml. 41 subcommands were
      # registered here and 9 were ever invoked; this step is what makes the
      # other 32 count for anything.
      - name: Run the registered gate sweep
        run: ./cargo_full run -p xtask -- gates

      # Structural rules that must hold while the workspace does not compile,
      # so they live in a crate that depends on no vyre crate.
      - name: Workspace structure
        run: ./cargo_full run -p structure-gate

      # The external-IR extension demo is the only proof that a third party can
      # extend the IR from outside this workspace. Presence proves nothing, so
      # this builds it as its own isolated crate against the committed lockfile.
      - name: External IR extension demo builds standalone
        run: bash scripts/check_external_ir_extension_ci.sh

  tree-rules:
    name: Rules that need no build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every Cargo.toml on disk is a [workspace.members] entry or declares its
      # own [workspace]. structure-gate checks the roster against the members
      # list in both directions but never walks the filesystem, so a crate
      # directory that no manifest lists is only visible here.
      - name: No orphan crate directories
        run: bash scripts/check_workspace_filesystem.sh

      # `missing_docs = "deny"` in [workspace.lints.rust] is the floor every
      # member inherits. A crate-root #![allow(missing_docs)] silently removes
      # it for that whole crate; a module-scoped allow stays permitted.
      - name: No crate-root missing_docs override
        run: bash scripts/check_no_missing_docs_override.sh

      # ci.yml must keep the three-OS by two-toolchain matrix, must not carry a
      # no-GPU escape hatch, and gpu-parity.yml must still exist to own the
      # parity lane.
      - name: CI matrix is intact
        run: bash scripts/check_ci_matrix.sh

      # docs_manifest.py is the documentation authority validator that
      # `xtask docs-check` runs. These are its own behavior contracts, so a
      # change that weakens the validator fails here rather than passing
      # docs-check vacuously. Bytecode stays off so the run leaves no
      # __pycache__ for scripts/check_repo_hygiene.sh to report.
      - name: Documentation manifest validator contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_docs_manifest.py

      # A lower bound, not an equality. The earlier version of this script
      # failed when coverage GREW, demanding a manual floor bump, which is why
      # it sat unwired: it punished the improvement it exists to encourage.
      - name: Property-test coverage does not shrink
        run: bash scripts/check_proptest_coverage.sh

      # The execution queue is a gitignored local file, so its absence is not a
      # violation and this gate measures tracked files only. The earlier version
      # asserted the file exists, which no clean checkout can satisfy.
      - name: One execution queue, no committed parallel plans
        run: bash scripts/check_single_backlog.sh

      # Each row pins a cross-crate unification that has already landed. A
      # declared search path that no longer exists fails as UNMEASURABLE rather
      # than scoring 0 and passing, which is how three of these rows spent
      # months reporting success while scanning deleted trees.
      - name: Unification baselines hold
        run: bash scripts/check_unification_baselines.sh

      # unsafe_code = "deny" is inherited workspace-wide, so the set of files
      # carrying an allow(unsafe_code) override IS the complete unsafe surface,
      # enforced by rustc rather than approximated by grep. This pins that set.
      - name: Unsafe surface matches the reviewed budget
        run: bash scripts/check_unsafe_budget.sh

      # Source-scanning rules, all on scripts/lib/source_scan.sh. They were
      # written against ripgrep with `2>/dev/null || true`, which reports a clean
      # tree whenever ripgrep is missing or lacks a feature, so none of them could
      # be trusted until they stopped depending on an optional binary.
      - name: No registry walk on the dispatch hot path
        run: bash scripts/check_no_hot_path_inventory.sh
      - name: Nested byte rows held at their ceiling
        run: bash scripts/check_no_hot_path_vec_vec.sh
      - name: Unbounded container construction held at its ceiling
        run: bash scripts/check_no_unbounded_cache.sh
      - name: Read-all confined to reviewed cache modules
        run: bash scripts/check_no_unbounded_external_read.sh
      - name: Production dispatch stays borrowed
        run: bash scripts/check_no_owned_dispatch_hot_paths.sh
      - name: Blocking waits held at their ceiling
        run: bash scripts/check_no_hot_path_blocking_wait.sh
      - name: Ordinary outputs stage through readback rings
        run: bash scripts/check_direct_readback_ring_default.sh
      - name: Adding a backend stays one crate plus inventory
        run: bash scripts/check_backend_extension_contract.sh
      - name: Status-managed audits tag every finding
        run: bash scripts/check_audit_status_tags.sh

      # Program's fields are extracted from source and each must be classified as
      # serialized or explicitly transient, so a new field turns this red until
      # someone decides whether it belongs on the wire.
      - name: Every Program field is serialized or declared transient
        run: bash scripts/check_ir_wire_field_sync.sh

      # Every load-bearing claim in a doc names the test that proves it. A claim
      # whose phrase left the doc, or whose test file is gone, fails here.
      - name: Every doc claim has a proving test
        run: bash scripts/check_doc_claim_to_test.sh

      # `try_reserve(additional)` guarantees `len() + additional`, so deriving
      # `additional` from `capacity()` under-reserves any warm buffer whose
      # capacity sits between `target / 2` and `target`: the call succeeds, the
      # capacity stays short, and the following fill reallocates. It compiles,
      # it returns Ok, and every result is correct, so no build, test, clippy,
      # or unsafe-budget gate can see it. Only a source scan can.
      - name: Reserve calls size from len, not capacity
        run: bash scripts/check_no_under_reserve.sh

      # A manifest naming a member that does not exist makes every cargo command
      # fail from a clean checkout, which is why this gate runs no cargo at all:
      # the defect it detects is precisely a workspace cargo cannot load. It
      # reads tracked manifests with git and tomllib, and also rejects a path
      # that resolves outside the repository.
      - name: Every manifest path edge resolves to a tracked member
        run: bash scripts/check_path_deps_resolve.sh

      # A file no target compiles is not code, it is a claim. glyph_grid shipped
      # an op registration and eight contracts that no `mod` declaration ever
      # named, while three generated docs listed the op as supported, and four
      # CUDA contract chunks outlived the test file that declared them. A green
      # build is exactly what an orphan produces, so only this scan sees them.
      - name: Every tracked source file is reachable from a cargo target
        run: bash scripts/check_every_source_file_is_reachable.sh

      # The other half: whatever a tracked .rs file is declared to be, it must
      # parse. rustfmt is the only single-file Rust parser in the toolchain, so
      # this step installs the component instead of assuming the runner image
      # carries it; the gate itself treats a missing rustfmt as a failure rather
      # than as a clean tree. Formatting differences are ignored: the tree is
      # never formatted here and nothing is written.
      - name: Every tracked source file parses
        run: |
          rustup component add rustfmt
          bash scripts/check_every_source_file_parses.sh
