name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registered-gates:
    name: Every registered gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Runs every registered gate and holds each to the number pinned in
      # xtask/gate-baselines.toml. Registering a gate without a pin fails, and a
      # pin naming no gate fails, so neither list is maintained by hand and no
      # rule can be registered and left unrun. The source-scanning rules, the
      # frozen contracts, the size ratchet, the unification rows, the release
      # evidence path oracle and the doc claim manifest are all in here; they
      # used to be twenty separate steps below, each able to go red without
      # anyone noticing which.
      - name: Run the registered gate sweep
        run: ./cargo_full run -p xtask -- gates

      # Structural rules that must hold while the workspace does not compile,
      # so they live in a crate that depends on no vyre crate.
      - name: Workspace structure
        run: ./cargo_full run -p structure-gate

      # The external-IR extension demo is the only proof that a third party can
      # extend the IR from outside this workspace. Presence proves nothing, so
      # this builds it as its own isolated crate against the committed lockfile.
      - name: External IR extension demo builds standalone
        run: bash scripts/check_external_ir_extension_ci.sh

      # Manifest text gives direct edges only, which is all that
      # check_architectural_invariants.sh and `xtask check-tier-deps` read. A
      # forbidden edge three crates below a member is invisible to both and
      # exists only in the resolved graph, so this runs `cargo tree` per member
      # and holds every transitive internal edge to the closure
      # docs/CRATE_OWNERSHIP.toml declares. It used to send cargo's stderr to
      # /dev/null, so a cargo that could not resolve the workspace printed "All
      # layer invariants green." and exited 0.
      - name: Transitive layer closure per member
        run: bash scripts/check_layering.sh

      # bench-regression.yml times one case, which proves the runner works, not
      # that the registry still covers the dimensions the audit rows claim. This
      # holds each dimension to a named case and resolves every `--case`
      # reference in a tracked file against the live registry, so a renamed case
      # fails here instead of at the next release benchmark.
      - name: Benchmark registry covers every claimed dimension
        run: bash scripts/check_deep_bench_coverage.sh

  tree-rules:
    name: Rules the sweep does not own yet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every Cargo.toml on disk is a [workspace.members] entry or declares its
      # own [workspace]. structure-gate checks the roster against the members
      # list in both directions but never walks the filesystem, so a crate
      # directory that no manifest lists is only visible here.
      - name: No orphan crate directories
        run: bash scripts/check_workspace_filesystem.sh

      # A published crate depending on a published member must carry a version,
      # or `cargo publish` has nothing to resolve outside this workspace; a
      # dependency on a `publish = false` member must not carry one, because that
      # version can never exist on the registry. Both crate sets are derived from
      # tracked manifests through each member's own `publish` key, including
      # renames via `package =` and versions inherited through
      # `workspace = true`, so a new member is classified without editing a list.
      # Nothing else sees this: cargo resolves path edges locally and is happy,
      # and the failure appears only during a publish nobody can rehearse.
      - name: Internal dependency versions match publishability
        run: bash scripts/check_internal_deps_have_versions.sh

      # ci.yml must keep the three-OS by two-toolchain matrix, must not carry a
      # no-GPU escape hatch, and gpu-parity.yml must still exist to own the
      # parity lane.
      - name: CI matrix is intact
        run: bash scripts/check_ci_matrix.sh

      # docs_manifest.py is the documentation authority validator that
      # `xtask docs-check` runs. These are its own behavior contracts, so a
      # change that weakens the validator fails here rather than passing
      # docs-check vacuously. Bytecode stays off so the run leaves no
      # __pycache__ for scripts/check_repo_hygiene.sh to report.
      - name: Documentation manifest validator contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_docs_manifest.py

      # A manifest naming a member that does not exist makes every cargo command
      # fail from a clean checkout, which is why this gate runs no cargo at all:
      # the defect it detects is precisely a workspace cargo cannot load. It
      # reads tracked manifests with git and tomllib, and also rejects a path
      # that resolves outside the repository.
      - name: Every manifest path edge resolves to a tracked member
        run: bash scripts/check_path_deps_resolve.sh

      # A file no target compiles is not code, it is a claim. glyph_grid shipped
      # an op registration and eight contracts that no `mod` declaration ever
      # named, while three generated docs listed the op as supported, and four
      # CUDA contract chunks outlived the test file that declared them. A green
      # build is exactly what an orphan produces, so only this scan sees them.
      - name: Every tracked source file is reachable from a cargo target
        run: bash scripts/check_every_source_file_is_reachable.sh

      # The other half: whatever a tracked .rs file is declared to be, it must
      # parse. rustfmt is the only single-file Rust parser in the toolchain, so
      # this step installs the component instead of assuming the runner image
      # carries it; the gate itself treats a missing rustfmt as a failure rather
      # than as a clean tree. Formatting differences are ignored: the tree is
      # never formatted here and nothing is written.
      - name: Every tracked source file parses
        run: |
          rustup component add rustfmt
          bash scripts/check_every_source_file_parses.sh

  feature-msrv:
    name: Every feature compiles alone on the MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # [workspace.package].rust-version is the single owner of the MSRV, so the
      # toolchain is installed from that value instead of pinned a second time
      # here, where a bump would leave the two disagreeing.
      - name: Install the advertised MSRV toolchain
        run: |
          rustup toolchain install --profile minimal \
            "$(python3 scripts/lib/read_toml_values.py Cargo.toml MSRV workspace.package.rust-version)"

      # Two classes, neither reachable from another workflow. Feature isolation:
      # strict.yml builds --all-features, a union in which a feature whose
      # prerequisites some other feature happens to enable compiles anyway, and
      # ci.yml builds default features only, so a granular feature is never
      # built alone. MSRV: ci.yml's toolchain matrix is stable and nightly, so
      # nothing compiled this workspace on the version it publishes. The matrix
      # is derived from tracked manifests, so a new feature or member joins it
      # and fails here until it compiles.
      - name: Feature-isolated MSRV sweep
        run: bash scripts/check_feature_msrv.sh

  feature-isolation:
    name: Every feature compiles alone or records why it cannot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The class `feature-msrv` above cannot close: it compiles the derived
      # matrix and reports pass or fail, so a pair that cannot stand alone has
      # nowhere to be recorded and the whole job is red until someone deletes a
      # feature. This holds each (member, feature) pair to the outcome recorded
      # in xtask/feature-isolation.toml. The pair set is re-derived from the
      # tracked manifests inside the gate, so a new feature or member fails here
      # until a decision is recorded for it, and a row naming a pair that no
      # longer exists fails as stale. The declaration half also runs inside
      # `xtask gates`; this job is the compile half. `--bin xtask` is explicit
      # because the package also carries two rule-authoring binaries, so a bare
      # `cargo run -p xtask` cannot decide which one to build.
      - name: Feature-isolation compile sweep
        run: ./cargo_full run -p xtask --bin xtask -- feature-isolation --sweep

  feature-gated-sweeps:
    name: Oracle-matrix sweeps ci.yml cannot reach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ci.yml runs `./cargo_full test --workspace` with default features, so a
      # sweep whose [[test]] required-features name a non-default feature is
      # skipped there, and strict.yml builds --all-targets without running
      # anything. These are the oracle-parity matrices, so a skipped one is
      # unproven parity. Roster and per-crate features come from
      # scripts/lib/sweep_targets.py, which reads tracked sources and each
      # crate's own [[test]] entries, so a new sweep runs without an edit here
      # and a stale [[test]] entry fails instead of reserving features for a
      # target that cannot build.
      - name: Sweep oracle matrices
        run: bash scripts/run_sweep_oracle_matrix.sh

      # The volume waves are the same rule at 16k cases per target. Run as a
      # single shard of one: sharding exists so a developer can split the wall
      # time locally, and four hosted runners would each rebuild the workspace
      # to divide well under a minute of test time.
      - name: Volume oracle matrix waves
        run: bash scripts/run_volume_sweep_shard.sh 0 1

  spirv-validation:
    name: Emitted SPIR-V is validated, not just shaped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # spirv-val is the only thing that can tell a valid module from a blob with
      # a correct magic word. The suite used to accept the second when the
      # validator was absent, so every emission passed here and the gate was
      # decoration. Installing it is what makes the assertion mean anything.
      - name: Install spirv-val
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      # The target is registered behind `spirv-val`, so ci.yml's default
      # --workspace run skips it and this job is the only thing that runs it. The
      # gate fails closed when the validator is missing rather than falling back
      # to a header check. No GPU: SPIR-V emission is pure computation.
      - name: Validated SPIR-V emission
        run: bash scripts/check_spirv_parity_perf_gate.sh
