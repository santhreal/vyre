name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registered-gates:
    name: Every registered gate
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Runs every subcommand registered as a gate and holds each to the
      # result pinned in xtask/gate-baselines.toml. 41 subcommands were
      # registered here and 9 were ever invoked; this step is what makes the
      # other 32 count for anything.
      - name: Run the registered gate sweep
        run: ./cargo_full run -p xtask -- gates

      # Structural rules that must hold while the workspace does not compile,
      # so they live in a crate that depends on no vyre crate.
      - name: Workspace structure
        run: ./cargo_full run -p structure-gate
