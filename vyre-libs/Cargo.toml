[package]
name = "vyre-libs"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Category A program compositions over foundation IR and primitive-owned kernels"
readme = "README.md"
keywords = ["gpu", "ml", "linear-algebra", "cryptography", "vyre"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/vyre-libs"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[lib]
path = "src/lib.rs"

[features]
# Default: ML / linear-algebra / matching / decode core. Crypto + the
# heavy nn-attention surface ride opt-in. Keeps `cargo add vyre-libs`
# from compiling blake3/fnv for consumers that only need matmul +
# substring scanning. Audit item #63  -  reduced default blast radius.
default = [
    "math-linalg", "math-scan", "math-broadcast",
    "nn-activation", "nn-linear", "nn-norm",
    "matching-substring", "matching-dfa",
    "hash",
    "decode",
]
# `full` is every dialect this crate ships: every domain that submits an
# `OperationRegistration`. It is the selection a consumer names to get the whole
# composition surface, and the selection the registry walker names to see every
# registration. It stops short of the compiler's own self-use composition
# domains (`solvers`, `encoding`, `analysis`, `scheduling`, `graph-dispatch`,
# `reasoning`), which submit nothing and exist for this workspace rather than
# for a library consumer.
full = [
    "math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct",
    "nn-activation", "nn-linear", "nn-linear-4bit", "nn-norm", "nn-attention", "nn-moe", "nn-inference",
    "matching-substring", "matching-dfa", "matching-nfa",
    "hash",
    "decode",
    "crypto-blake3",
    "logical",
    "visual",
    "security",
    "parsing",
]
bench = []
cpu-parity = ["vyre-primitives/cpu-parity"]
hash = ["vyre-primitives/hash"]
math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]
matching = ["matching-substring", "matching-dfa"]
crypto = ["crypto-blake3"]
decode = ["vyre-primitives/cpu-parity", "vyre-primitives/decode", "vyre-primitives/matching"]
text = []
logical = ["math-broadcast", "vyre-primitives/bitset"]
rule = ["dep:regex"]

# Compiler self-use composition domains, migrated out of the GPU pass engine
# crate. Each gates one module tree; `all-solvers` turns on the set.
telemetry = []
device = []
graph-dispatch = ["device", "telemetry", "vyre-primitives/math", "vyre-primitives/graph"]
solvers = ["device", "telemetry", "vyre-primitives/math", "vyre-primitives/topology"]
encoding = ["device", "telemetry", "vyre-primitives/matching", "vyre-primitives/math", "vyre-primitives/nn", "vyre-primitives/parsing"]
reasoning = ["analysis", "vyre-primitives/cat", "vyre-primitives/dnnf", "vyre-primitives/zx"]
analysis = ["device", "telemetry", "vyre-primitives/effects", "vyre-primitives/math", "vyre-primitives/types"]
scheduling = ["device", "telemetry", "vyre-primitives/math", "vyre-primitives/parsing"]

# Every dialect feature whose module invokes `impl_cat_a_builder_options!`
# declares that it needs the macro. The macro's own gate then names one
# feature instead of restating this set, which is what let the set rot into a
# dead-code warning on a build that enabled none of them.
"cat-a-builder-options" = []
"math-linalg" = ["cat-a-builder-options", "vyre-primitives/math"]
"math-scan" = ["vyre-primitives/math"]
"math-broadcast" = ["vyre-primitives/math"]
"math-algebra" = ["vyre-primitives/math"]
"math-succinct" = ["vyre-primitives/math"]
"nn-activation" = ["vyre-primitives/nn"]
"nn-linear" = ["cat-a-builder-options", "math-linalg", "nn-activation", "vyre-primitives/nn"]
"nn-linear-4bit" = ["nn-linear"]
"nn-norm" = ["cat-a-builder-options", "math-broadcast", "vyre-primitives/nn"]
"nn-attention" = ["cat-a-builder-options", "nn-norm", "math-linalg", "vyre-primitives/nn"]
"nn-moe" = ["nn-attention"]
"nn-inference" = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe"]
"matching-substring" = ["cpu-parity", "matching-dfa", "vyre-primitives/matching"]
"matching-dfa" = ["cpu-parity", "vyre-primitives/matching"]
"matching-nfa" = ["matching-dfa", "vyre-primitives/nfa"]
"matching-regex" = ["matching-nfa", "dep:regex-syntax"]
"intern" = ["vyre-primitives/hash"]
"crypto-blake3" = ["hash"]
"visual" = ["vyre-primitives/visual", "vyre-primitives/math"]
"parsing" = ["c-parser", "go-parser", "python-parser"]
"c-parser" = ["matching-substring", "matching-dfa", "matching-nfa", "vyre-primitives/parsing", "vyre-primitives/predicate"]
"go-parser" = []
"python-parser" = ["vyre-primitives/parsing"]
"test-fixtures" = ["dep:vyre-reference"]
security = ["vyre-primitives/label", "vyre-primitives/predicate"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-spec.workspace = true
# Only the primitive domains the ungated module trees need: `graph` for
# `src/graph/ast_walk.rs`, `text` for `src/text/char_class.rs`, and
# `inventory-registry` so primitive op registrations populate the catalog.
# Every other domain rides the vyre-libs feature that gates its consumer, so a
# consumer enabling one composition feature does not resolve the whole substrate.
vyre-primitives = { workspace = true, features = ["graph", "text", "inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex-syntax = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
# `test_support::ReferenceEvalDispatcher` executes programs through the CPU
# reference interpreter. Optional so only `test-fixtures` builds link it.
vyre-reference = { workspace = true, optional = true }
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
bytemuck.workspace = true

[dev-dependencies]
vyre = { path = "../vyre" }
# Parity tests import the vyre-primitives CPU reference oracles, which are gated
# behind `cpu-parity`. Enabling it here (dev-dep only) turns it on for vyre-libs'
# own test/bench builds without leaking the oracles into production (resolver 2).
vyre-primitives = { path = "../vyre-primitives", features = ["cpu-parity", "hardware"], default-features = false }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
# integration tests/benches assert against these crates' public APIs
vyre-driver-wgpu = { path = "../vyre-driver-wgpu" }
vyre-lower = { path = "../vyre-lower" }
vyre-emit-ptx = { path = "../vyre-emit-ptx" }
vyre-driver = { path = "../vyre-driver" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
naga.workspace = true
# PATH-ONLY (package = vyre-grammar-gen): see vyre-driver-wgpu. cargo strips path-only
# dev-deps from the published manifest, so this creates no publish-ordering constraint
# and cannot demand a registry version; local test builds link it through the path.
c-grammar-gen = { package = "vyre-grammar-gen", path = "../vyre-grammar-gen" }
tree-sitter = { workspace = true }
tree-sitter-go = { workspace = true }
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }
# The device-residency ownership gate derives its crate roster from the root
# manifest. Path-only, and dev-only: cargo strips it from the published
# manifest, so it adds no publish-ordering constraint.
structure-gate = { path = "../structure-gate" }


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

