[package]
name = "vyre-libs"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Category A program compositions over foundation IR and primitive-owned kernels"
readme = "README.md"
keywords = ["gpu", "ml", "linear-algebra", "cryptography", "vyre"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/vyre-libs"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[lib]
path = "src/lib.rs"

[features]
# Default: ML / linear-algebra / pattern / decode core. Crypto and the heavy
# nn-attention surface ride opt-in. Keeps `cargo add vyre-libs` from compiling
# blake3/fnv for consumers that only need matmul plus substring scanning.
default = [
    "math-linalg", "math-scan", "math-broadcast",
    "nn-activation", "nn-linear", "nn-norm",
    "pattern-substring", "pattern-dfa",
    "hash",
    "decode",
]
# `full` is every dialect this crate ships: every domain that submits an
# `OperationRegistration`. It is the selection a consumer names to get the whole
# composition surface, and the selection the registry walker names to see every
# registration. It stops short of the compiler's own self-use composition
# domains (`solvers`, `encoding`, `analysis`, `scheduling`, `graph-dispatch`,
# `reasoning`), which submit nothing and exist for this workspace rather than
# for a library consumer.
full = [
    "math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct",
    "math-kernels",
    "nn-activation", "nn-linear", "nn-linear-4bit", "nn-norm", "nn-attention", "nn-moe", "nn-inference",
    "nn-kernels",
    "llm",
    "pattern-substring", "pattern-dfa", "pattern-nfa",
    "pattern-kernels", "nfa",
    "hash",
    "decode",
    "crypto-blake3",
    "logical",
    "visual",
    "security",
    "parsing",
    "parsing-kernels",
    "text",
    "bitset", "reduce", "label", "predicate", "fixpoint", "graph",
    "representation",
    "builder-ops",
    "geom", "opt", "topology",
    "vfs",
]
test-fixtures = []
# Kernel domains. Each one is a directory under `src/` holding reusable GPU
# kernels with stable op ids, moved here from vyre-primitives. A domain names
# only the domains its own source reaches, so enabling one never compiles a
# sibling it does not call.
# `bitset` names `reduce` because `bitset/relation.rs` builds `equal` and
# `subset_of` on `reduce::atomic_scalar::atomic_grid_stride_u32`.
bitset = ["reduce"]
reduce = []
vfs = []
fixpoint = ["bitset"]
label = ["bitset"]
# `graph` names `math-kernels` because seven graph kernels reach
# `math::fixed`, `math::fixed_u32_matmul` and `math::chebyshev_recurrence`.
# The reverse edge does not exist: `math-kernels` compiles no graph module.
graph = ["bitset", "reduce", "hash", "fixpoint", "math-kernels"]
predicate = ["graph", "bitset", "label"]
# `math-kernels` names `reduce` because `math/prefix_scan.rs` sweeps
# `reduce::workgroup_tree::blelloch_inclusive_sum_nodes`.
math-kernels = ["reduce"]
nn-kernels = ["math-kernels"]
# `pattern-kernels` names `hash` because `pattern/nfa_to_dfa.rs` imports
# `hash::fnv1a` unconditionally.
pattern-kernels = ["hash"]
parsing-kernels = ["text", "pattern-kernels"]
nfa = ["bitset", "pattern-kernels"]
geom = ["math-kernels"]
opt = ["math-kernels"]
topology = ["math-kernels", "graph"]

# Dialect surfaces over the kernels.
hash = []
# `math-dialect` gates the dialect-level math surface (atomics, clamp, conv,
# fft, the f32 reductions). Each `math-*` sub-feature names it so the surface
# is not compiled by a consumer that only wants `math::fixed`.
# `math-dialect` names `reduce` because `math/reduce_mean.rs` folds through
# `reduce::workgroup_tree`.
# It also names `builder-ops` because `math/reduce_mean.rs` composes
# `strided_accumulate_child` and `math/square.rs` is a `build_indexed_map`
# skeleton.
math-dialect = ["builder-ops", "reduce"]
math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]
pattern = ["pattern-substring", "pattern-dfa"]
crypto = ["crypto-blake3"]
# `decode` names `text` because `decode/encodex.rs` builds its classifier from
# `text::byte_histogram_256_child` and `text::encoding_classify_child`.
#
# It does not name `cpu-parity`. That edge put host reference oracles into
# every default build of this crate and hid the domain edges the sweep exists
# to find, because the oracle modules re-enabled whatever a domain forgot.
decode = ["pattern-kernels", "text"]
text = ["reduce"]
# `representation` gates `src/representation`, which reaches nothing else in
# the crate: the unpack kernel is built from bare IR.
representation = []
# `builder-ops` gates the two shared child regions the builder registers as
# catalog entries of their own. Every dialect whose source composes
# `build_indexed_map` or `strided_accumulate_child` names it, because the
# skeletons emit child regions carrying those ids and a build that emits an id
# its catalog does not contain hands consumers unresolvable programs.
"builder-ops" = []
logical = ["bitset"]
rule = ["dep:regex"]

# Compiler self-use composition domains, migrated out of the GPU pass engine
# crate. Each gates one module tree; `all-solvers` turns on the set.
telemetry = []
device = []
graph-dispatch = ["device", "telemetry", "math-kernels", "graph", "encoding"]
solvers = ["device", "telemetry", "math-kernels", "topology"]
# `encoding` names `bitset` because `encoding/bitset_mask_algebra.rs` composes
# eight `bitset::` builders, and `graph` plus `fixpoint` because
# `matroid_exact_megakernel.rs` and `scallop_provenance.rs` reach
# `math::matroid_intersection_full` and `math::scallop_join`, which are gated
# on those two.
encoding = ["device", "telemetry", "pattern-kernels", "math-kernels", "nn-kernels", "parsing-kernels", "bitset", "graph", "fixpoint"]
reasoning = ["analysis", "graph"]
# `analysis` names `graph` because `analysis/cost_model.rs` dispatches
# `graph::level_wave` and `graph::sum_product_circuit`.
analysis = ["device", "telemetry", "math-kernels", "graph"]
# `scheduling` names `graph` because `scheduling/spectral_schedule.rs` builds on
# `graph::chebyshev_filter`.
scheduling = ["device", "telemetry", "math-kernels", "parsing-kernels", "graph"]

# Every dialect feature whose module invokes `impl_cat_a_builder_options!`
# declares that it needs the macro. The macro's own gate then names one
# feature instead of restating this set, which is what let the set rot into a
# dead-code warning on a build that enabled none of them.
"cat-a-builder-options" = []
# `math-linalg` names `builder-ops` because `math/linalg/dot.rs` composes
# `strided_accumulate_child`.
"math-linalg" = ["builder-ops", "cat-a-builder-options", "math-dialect", "math-kernels"]
"math-scan" = ["math-dialect", "math-kernels"]
"math-broadcast" = ["math-dialect", "math-kernels"]
"math-algebra" = ["math-dialect", "math-kernels"]
# `math-succinct` names `graph` because `math/succinct.rs` parents its rank
# superblock region on `graph::path_reconstruct::OP_ID`.
"math-succinct" = ["math-dialect", "math-kernels", "graph"]
# `nn-activation` names `builder-ops` because embedding, skip_gate,
# parallel_residual_block, the optimizer apply steps and the quant pack and
# unpack kernels are all `build_indexed_map` skeletons.
"nn-activation" = ["builder-ops", "nn-kernels"]
"nn-linear" = ["cat-a-builder-options", "math-linalg", "nn-activation", "nn-kernels"]
"nn-linear-4bit" = ["nn-linear"]
# `nn-norm` names `builder-ops` because `nn/norm/rms_norm.rs` and the layer-norm
# reduce phases compose `strided_accumulate_child`.
"nn-norm" = ["builder-ops", "cat-a-builder-options", "math-broadcast", "nn-kernels"]
# `nn-attention` names `builder-ops` because `nn/attention/softmax.rs` composes
# `strided_accumulate_child` in both reduce passes.
"nn-attention" = [
    "builder-ops",
    "cat-a-builder-options",
    "nn-norm",
    "math-linalg",
    "nn-kernels",
]
"nn-moe" = ["nn-attention"]
"nn-inference" = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe"]
# `llm` names `nn-moe` because `llm/sampling.rs` composes
# `nn::moe::softmax_top_k` and `llm/paged_kv.rs` builds on
# `nn::attention::layout`, which `nn-moe` already names.
# It also names `builder-ops` because `llm/sampling.rs` builds `logit_adjust`
# as a `build_indexed_map` skeleton.
"llm" = ["builder-ops", "nn-moe"]
# Neither pattern domain names `cpu-parity`, for the same reason `decode` does
# not: it compiled the host oracles into every default build and masked the
# edges the sweep is for.
"pattern-substring" = ["pattern-dfa", "pattern-kernels"]
# `pattern-dfa` names `text` because `pattern/post_process.rs` folds
# `text::reference_byte_histogram` into `shannon_entropy_bits_per_byte`.
"pattern-dfa" = ["pattern-kernels", "text"]
"pattern-nfa" = ["pattern-dfa", "nfa"]
"pattern-regex" = ["pattern-nfa", "dep:regex-syntax"]
"intern" = ["hash"]
"crypto-blake3" = ["hash"]
"visual" = ["math-kernels"]
"parsing" = ["go-parser", "python-parser"]
# `go-parser` names `reduce` because `parsing/go/lex.rs` scans quote flags with
# `reduce::multi_block_prefix_scan`.
"go-parser" = ["reduce"]
"python-parser" = ["parsing-kernels"]
security = ["label", "predicate"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-spec.workspace = true
# Every composition domain moved into this crate, so the only thing left to ask
# vyre-primitives for is the substrate: the wire format, guarded IR
# construction, the launch-geometry helper, the marker types, and
# `inventory-registry` so intrinsic registrations populate the catalog.
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex-syntax = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
bytemuck.workspace = true

[dev-dependencies]
vyre = { path = "../vyre" }
# Parity tests import the vyre-primitives hardware intrinsics.
# Enabling it here (dev-dep only) turns it on for vyre-libs'
# own test/bench builds without leaking the intrinsics into production (resolver 2).
vyre-primitives = { path = "../vyre-primitives", features = ["hardware"], default-features = false }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
# integration tests/benches assert against these crates' public APIs
vyre-driver-wgpu = { path = "../vyre-driver-wgpu" }
# The live-device parity modules in `bitset::any` and `label::resolve_family`
# dispatch through the CUDA backend. Dev-dep only, so the composition library
# names no concrete backend in a production table.
vyre-driver-cuda = { path = "../vyre-driver-cuda" }
vyre-lower = { path = "../vyre-lower" }
vyre-emit-ptx = { path = "../vyre-emit-ptx" }
vyre-driver = { path = "../vyre-driver" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
naga.workspace = true
tree-sitter = { workspace = true }
tree-sitter-go = { workspace = true }
# The shipped-build oracle gate resolves the dependency graph a consumer
# compiles out of the manifests themselves, so it parses TOML rather than
# restating any part of that graph in Rust.
toml.workspace = true
vyre-test-support = { workspace = true, features = ["ir-fixtures"] }
# The device-residency ownership gate derives its crate roster from the root
# manifest. Path-only, and dev-only: cargo strips it from the published
# manifest, so it adds no publish-ordering constraint.
structure-gate = { path = "../structure-gate" }
# The advertised minimal example compiles a libs composition into a megakernel
# artifact. Path-only and dev-only: cargo strips it from the published manifest,
# and the megakernel depends only on vyre-foundation and vyre-lower, so this adds
# no cycle and no publish-ordering constraint.
vyre-megakernel = { path = "../vyre-megakernel" }

# The example the generated crate contract advertises. Named explicitly so the
# contract picks this one rather than whichever filename sorts first.
[[example]]
name = "prefix_sum_megakernel"
path = "examples/prefix_sum_megakernel.rs"
required-features = ["math-scan"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Reads source text only, so it needs no domain feature: gating it on one would
# narrow the walk to the modules that feature happens to enable, and a class is
