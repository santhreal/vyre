[package]
name = "vyre-libs"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "vyre Category A library ecosystem  -  pure-IR compositions over foundation IR and primitive-owned kernels"
readme = "README.md"
keywords = ["gpu", "ml", "linear-algebra", "cryptography", "vyre"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/vyre-libs"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[lib]
path = "src/lib.rs"

[features]
# Default: ML / linear-algebra / matching / decode core. Crypto + the
# heavy nn-attention surface ride opt-in. Keeps `cargo add vyre-libs`
# from compiling blake3/fnv for consumers that only need matmul +
# substring scanning. Audit item #63  -  reduced default blast radius.
default = [
    "math-linalg", "math-scan", "math-broadcast",
    "nn-activation", "nn-linear", "nn-norm",
    "matching-substring", "matching-dfa",
    "hash",
    "decode",
]
# `full` aggregates everything that used to be in default + crypto +
# the algebra/succinct/attention extras. Consumers that previously
# relied on the wide default flip to `full` (no behavior change).
full = [
    "math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct",
    "nn-activation", "nn-linear", "nn-linear-4bit", "nn-norm", "nn-attention", "nn-moe", "nn-inference",
    "matching-substring", "matching-dfa",
    "hash",
    "decode",
    "crypto-fnv", "crypto-blake3",
]
bench = []
cpu-parity = ["vyre-primitives/cpu-parity"]
hash = []
math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]
matching = ["matching-substring", "matching-dfa"]
crypto = ["crypto-fnv", "crypto-blake3"]
decode = ["vyre-primitives/cpu-parity"]
text = []
logical = ["math-broadcast"]
rule = ["dep:regex"]

"math-linalg" = []
"math-scan" = []
"math-broadcast" = []
"math-algebra" = []
"math-succinct" = []
"nn-activation" = []
"nn-linear" = ["math-linalg", "nn-activation"]
"nn-linear-4bit" = ["nn-linear"]
"nn-norm" = ["math-broadcast"]
"nn-attention" = ["nn-norm", "math-linalg"]
"nn-moe" = ["nn-attention"]
"nn-inference" = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe"]
"matching-substring" = ["cpu-parity", "matching-dfa"]
"matching-dfa" = ["cpu-parity"]
"matching-nfa" = ["matching-dfa"]
"matching-regex" = ["matching-nfa", "dep:regex-syntax"]
"intern" = []
"crypto-fnv" = ["hash"]
"crypto-blake3" = ["hash"]
"visual" = []
"parsing" = ["c-parser", "go-parser", "python-parser"]
"c-parser" = ["matching-substring", "matching-dfa", "matching-nfa"]
"go-parser" = []
"python-parser" = []
"test-fixtures" = []
security = []

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["text", "matching", "decode", "math", "nn", "hash", "parsing", "graph", "bitset", "reduce", "label", "predicate", "fixpoint", "nfa", "inventory-registry", "geom", "opt", "topology", "visual"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex-syntax = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true
bytemuck.workspace = true

[dev-dependencies]
vyre.workspace = true
# Parity tests import the vyre-primitives CPU reference oracles, which are gated
# behind `cpu-parity`. Enabling it here (dev-dep only) turns it on for vyre-libs'
# own test/bench builds without leaking the oracles into production (resolver 2).
vyre-primitives = { path = "../vyre-primitives", features = ["cpu-parity"], default-features = false }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-intrinsics = { path = "../vyre-intrinsics" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
# integration tests/benches assert against these crates' public APIs
vyre-driver-wgpu = { path = "../vyre-driver-wgpu" }
vyre-lower = { path = "../vyre-lower" }
vyre-emit-ptx = { path = "../vyre-emit-ptx" }
vyre-driver = { path = "../vyre-driver" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
tempfile.workspace = true
sha2.workspace = true
criterion.workspace = true
naga.workspace = true
# PATH-ONLY (package = vyre-grammar-gen): see vyre-driver-wgpu. cargo strips path-only
# dev-deps from the published manifest, so this creates no publish-ordering constraint
# and cannot demand a registry version; local test builds link it through the path.
c-grammar-gen = { package = "vyre-grammar-gen", path = "../vyre-grammar-gen" }
tree-sitter = { workspace = true }
tree-sitter-go = { workspace = true }
vyre-test-support.workspace = true


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[test]]
name = "sweep_text_utf8_oracle_matrix"
path = "tests/sweep_text_utf8_oracle_matrix.rs"
required-features = ["text"]

[[test]]
name = "sweep_decode_hex_oracle_matrix"
path = "tests/sweep_decode_hex_oracle_matrix.rs"
required-features = ["decode"]

[[test]]
name = "sweep_logical_reference_matrix"
path = "tests/sweep_logical_reference_matrix.rs"
required-features = ["logical"]

[[test]]
name = "sweep_hash_crc32_reference_matrix"
path = "tests/sweep_hash_crc32_reference_matrix.rs"
required-features = ["hash"]


# C-frontend oracle tests import `vyre_libs::parsing::c`, gated behind
# `c-parser`. Same remedy as the rust oracles above: register each with
# `required-features` so a package-scoped `cargo test -p vyre-libs` cleanly
# SKIPS them instead of compiling the `#![cfg]`-emptied file to a vacuous
# `0 tests ... ok` (which silently hid whether the C frontend was covered).
# They build+run under `cargo test -p vyre-libs --features c-parser` (or `parsing`).
[[test]]
name = "gpu_pipeline_lex_classify_roundtrip"
path = "tests/gpu_pipeline_lex_classify_roundtrip.rs"
required-features = ["c-parser"]

