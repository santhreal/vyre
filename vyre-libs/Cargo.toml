[package]
name = "vyre-libs"
version = "0.8.0"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Curated consumer facade for the vyre-libs composition family"
readme = "README.md"
keywords = ["gpu", "ml", "linear-algebra", "cryptography", "vyre"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/vyre-libs"
exclude = ["**/.proptest-regressions/**", "**/*.proptest-regressions", "**/SKILL.md"]

[lib]
path = "src/lib.rs"

# Generated by `cargo xtask configuration-model --write` from the [facade]
# roster in docs/CRATE_OWNERSHIP.toml. Edit that record, not this table.
[features]
default = [
    "math-linalg",
    "math-scan",
    "math-broadcast",
    "nn-activation",
    "nn-linear",
    "nn-norm",
    "pattern-substring",
    "pattern-dfa",
    "hash",
    "decode",
]

full = [
    "builder",
    "builder-ops",
    "cat-a-builder-options",
    "telemetry",
    "bitset",
    "logical",
    "reduce",
    "fixpoint",
    "math-dialect",
    "math-kernels",
    "math-linalg",
    "math-scan",
    "math-broadcast",
    "math-algebra",
    "math-succinct",
    "geom",
    "opt",
    "representation",
    "nn-kernels",
    "nn-activation",
    "nn-linear",
    "nn-linear-4bit",
    "nn-norm",
    "nn-attention",
    "nn-moe",
    "nn-inference",
    "llm",
    "graph",
    "topology",
    "graph-dispatch",
    "interactive-graphics",
    "pattern-kernels",
    "pattern-substring",
    "pattern-dfa",
    "pattern-nfa",
    "pattern-regex",
    "nfa",
    "hash",
    "crypto-blake3",
    "text",
    "decode",
    "parsing",
    "parsing-kernels",
    "go-parser",
    "python-parser",
    "security",
    "predicate",
    "label",
    "visual",
    "rule",
    "vfs",
    "device",
    "solvers",
    "encoding",
    "analysis",
    "reasoning",
    "scheduling",
    "math",
    "nn",
    "pattern",
    "crypto",
]

math = ["math-linalg", "math-scan", "math-broadcast", "math-algebra", "math-succinct"]
nn = ["nn-activation", "nn-linear", "nn-norm", "nn-attention"]
pattern = ["pattern-substring", "pattern-dfa"]
crypto = ["crypto-blake3"]

test-fixtures = []

builder = ["vyre-libs-builder/builder"]
builder-ops = ["builder", "vyre-libs-builder/builder-ops"]
cat-a-builder-options = ["builder", "vyre-libs-builder/cat-a-builder-options"]
telemetry = ["vyre-libs-builder/telemetry"]

bitset = ["reduce", "dep:vyre-libs-bitset", "vyre-libs-bitset?/bitset"]
logical = ["bitset", "dep:vyre-libs-bitset", "vyre-libs-bitset?/logical"]

reduce = ["builder", "dep:vyre-libs-reduce", "vyre-libs-reduce?/reduce"]

fixpoint = ["bitset", "dep:vyre-libs-fixpoint", "vyre-libs-fixpoint?/fixpoint"]

math-dialect = ["builder-ops", "reduce", "dep:vyre-libs-math", "vyre-libs-math?/math-dialect"]
math-kernels = ["reduce", "dep:vyre-libs-math", "vyre-libs-math?/math-kernels"]
math-linalg = ["builder-ops", "cat-a-builder-options", "math-dialect", "math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/math-linalg"]
math-scan = ["math-dialect", "math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/math-scan"]
math-broadcast = ["math-dialect", "math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/math-broadcast"]
math-algebra = ["math-dialect", "math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/math-algebra"]
math-succinct = ["math-dialect", "math-kernels", "graph", "dep:vyre-libs-math", "vyre-libs-math?/math-succinct"]
geom = ["math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/geom"]
opt = ["math-kernels", "dep:vyre-libs-math", "vyre-libs-math?/opt"]
representation = ["builder", "dep:vyre-libs-math", "vyre-libs-math?/representation"]

nn-kernels = ["math-kernels", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-kernels"]
nn-activation = ["builder-ops", "nn-kernels", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-activation"]
nn-linear = ["cat-a-builder-options", "math-linalg", "nn-activation", "nn-kernels", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-linear"]
nn-linear-4bit = ["nn-linear", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-linear-4bit"]
nn-norm = ["builder-ops", "cat-a-builder-options", "math-broadcast", "nn-kernels", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-norm"]
nn-attention = ["builder-ops", "cat-a-builder-options", "nn-norm", "math-linalg", "nn-kernels", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-attention"]
nn-moe = ["nn-attention", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-moe"]
nn-inference = ["nn-activation", "nn-linear", "nn-norm", "nn-attention", "nn-moe", "dep:vyre-libs-nn", "vyre-libs-nn?/nn-inference"]
llm = ["builder-ops", "nn-moe", "dep:vyre-libs-nn", "vyre-libs-nn?/llm"]

graph = ["bitset", "reduce", "hash", "fixpoint", "math-kernels", "telemetry", "dep:vyre-libs-graph", "vyre-libs-graph?/graph"]
topology = ["math-kernels", "graph", "dep:vyre-libs-graph", "vyre-libs-graph?/topology"]
graph-dispatch = ["device", "telemetry", "math-kernels", "graph", "dep:vyre-libs-graph", "vyre-libs-graph?/graph-dispatch"]
interactive-graphics = ["graph", "visual", "dep:vyre-libs-graph", "vyre-libs-graph?/interactive-graphics"]

pattern-kernels = ["hash", "dep:vyre-libs-pattern", "vyre-libs-pattern?/pattern-kernels"]
pattern-substring = ["pattern-dfa", "pattern-kernels", "dep:vyre-libs-pattern", "vyre-libs-pattern?/pattern-substring"]
pattern-dfa = ["pattern-kernels", "text", "dep:vyre-libs-pattern", "vyre-libs-pattern?/pattern-dfa"]
pattern-nfa = ["pattern-dfa", "nfa", "dep:vyre-libs-pattern", "vyre-libs-pattern?/pattern-nfa"]
pattern-regex = ["pattern-nfa", "dep:regex-syntax", "dep:vyre-libs-pattern", "vyre-libs-pattern?/pattern-regex"]
nfa = ["bitset", "pattern-kernels", "dep:vyre-libs-pattern", "vyre-libs-pattern?/nfa"]

hash = ["builder", "dep:vyre-libs-hash", "vyre-libs-hash?/hash"]
crypto-blake3 = ["hash", "dep:vyre-libs-hash", "vyre-libs-hash?/crypto-blake3"]

text = ["reduce", "dep:vyre-libs-text", "vyre-libs-text?/text"]

decode = ["pattern-kernels", "text", "dep:vyre-libs-decode", "vyre-libs-decode?/decode"]

parsing = ["go-parser", "python-parser", "dep:vyre-libs-parsing", "vyre-libs-parsing?/parsing"]
parsing-kernels = ["text", "pattern-kernels", "dep:vyre-libs-parsing", "vyre-libs-parsing?/parsing-kernels"]
go-parser = ["reduce", "dep:vyre-libs-parsing", "vyre-libs-parsing?/go-parser"]
python-parser = ["parsing-kernels", "dep:vyre-libs-parsing", "vyre-libs-parsing?/python-parser"]

security = ["label", "predicate", "dep:vyre-libs-security", "vyre-libs-security?/security"]
predicate = ["graph", "bitset", "label", "dep:vyre-libs-security", "vyre-libs-security?/predicate"]
label = ["bitset", "dep:vyre-libs-security", "vyre-libs-security?/label"]

visual = ["math-kernels", "dep:vyre-libs-visual", "vyre-libs-visual?/visual"]

rule = ["builder", "dep:vyre-libs-rule", "vyre-libs-rule?/rule"]

vfs = ["dep:vyre-libs-vfs", "vyre-libs-vfs?/vfs"]

device = ["dep:vyre-libs-device", "vyre-libs-device?/device"]

solvers = ["device", "telemetry", "math-kernels", "topology", "dep:vyre-libs-solvers", "vyre-libs-solvers?/solvers"]

encoding = ["device", "telemetry", "pattern-kernels", "math-kernels", "nn-kernels", "parsing-kernels", "bitset", "graph", "fixpoint", "dep:vyre-libs-encoding", "vyre-libs-encoding?/encoding"]

analysis = ["device", "telemetry", "math-kernels", "graph", "dep:vyre-libs-analysis", "vyre-libs-analysis?/analysis"]

reasoning = ["analysis", "graph", "dep:vyre-libs-reasoning", "vyre-libs-reasoning?/reasoning"]

scheduling = ["device", "telemetry", "math-kernels", "parsing-kernels", "graph", "dep:vyre-libs-scheduling", "vyre-libs-scheduling?/scheduling"]

[dependencies]
vyre-foundation = { workspace = true, features = ["serde"] }
vyre-megakernel.workspace = true
vyre-spec.workspace = true
vyre-primitives = { workspace = true, features = ["inventory-registry"] }
smallvec.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex-syntax = { workspace = true, optional = true }
libm.workspace = true
rustc-hash.workspace = true
blake3.workspace = true
rayon.workspace = true

vyre-libs-builder = { workspace = true }
vyre-libs-bitset = { workspace = true, optional = true }
vyre-libs-reduce = { workspace = true, optional = true }
vyre-libs-fixpoint = { workspace = true, optional = true }
vyre-libs-math = { workspace = true, optional = true }
vyre-libs-nn = { workspace = true, optional = true }
vyre-libs-graph = { workspace = true, optional = true }
vyre-libs-pattern = { workspace = true, optional = true }
vyre-libs-hash = { workspace = true, optional = true }
vyre-libs-text = { workspace = true, optional = true }
vyre-libs-decode = { workspace = true, optional = true }
vyre-libs-parsing = { workspace = true, optional = true }
vyre-libs-security = { workspace = true, optional = true }
vyre-libs-visual = { workspace = true, optional = true }
vyre-libs-rule = { workspace = true, optional = true }
vyre-libs-vfs = { workspace = true, optional = true }
vyre-libs-device = { workspace = true, optional = true }
vyre-libs-solvers = { workspace = true, optional = true }
vyre-libs-encoding = { workspace = true, optional = true }
vyre-libs-analysis = { workspace = true, optional = true }
vyre-libs-reasoning = { workspace = true, optional = true }
vyre-libs-scheduling = { workspace = true, optional = true }

[dev-dependencies]
vyre = { path = "../vyre" }
vyre-primitives = { path = "../vyre-primitives", features = ["hardware"], default-features = false }
vyre-emit-naga = { path = "../vyre-emit-naga" }
vyre-driver-reference = { path = "../vyre-driver-reference" }
vyre-lower = { path = "../vyre-lower" }
vyre-driver = { path = "../vyre-driver" }
vyre-reference = { path = "../vyre-reference" }
proptest.workspace = true
naga.workspace = true
tree-sitter = { workspace = true }
tree-sitter-go = { workspace = true }
toml.workspace = true
vyre-test-support = { workspace = true, features = ["ir-fixtures", "semantic-requests"] }
structure-gate = { path = "../structure-gate" }

[package.metadata.vyre]
publication_class = "stable-consumer-sdk"

[lints]
workspace = true

