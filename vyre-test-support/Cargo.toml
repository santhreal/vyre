[package]
name = "vyre-test-support"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared test-only harness helpers for the vyre workspace: the ONE canonical registry/coverage CLOSURE gate (source-enumerates `pub fn -> Program` builders and asserts each is registered, tested, or explicitly waived). Dev-dependency only; never a runtime dependency."
readme = "README.md"
keywords = ["vyre", "testing", "harness", "coverage", "registry"]
categories = ["development-tools::testing"]
publish = false

# Path-only, publish = false on both sides. `structure_gate::workspace_root` is
# the one owner of "which checkout am I reporting on", so `monorepo` delegates
# to it rather than resolving a second time.
[dependencies]
structure-gate = { path = "../structure-gate" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
